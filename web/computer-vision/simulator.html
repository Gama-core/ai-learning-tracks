asset.","tags":["engine-portability","hardware-specific","tensorrt","build-process"],"ref":"https://docs.nvidia.com/deeplearning/tensorrt/","domain":"deployment-edge"},{"id":"DP-005","type":"single","difficulty":"hard","stem":"What does INT8 post-training quantisation require that FP16 conversion does not?","choices":["A different model architecture","A calibration pass over representative data to determine activation ranges, because integer quantisation needs a scale per tensor","More GPU memory","Retraining from scratch"],"answer":[1],"explanation":"FP16 keeps a floating exponent and needs no range estimation. INT8 maps a float range onto 256 levels, so the range must be measured — from a few hundred representative images. Calibrating on unrepresentative data produces clipping or wasted resolution and is a common cause of accuracy loss.","tags":["int8","calibration","quantisation","activation-range"],"ref":"https://docs.nvidia.com/deeplearning/tensorrt/","domain":"deployment-edge"},{"id":"DP-006","type":"single","difficulty":"hard","stem":"After INT8 quantisation, classification accuracy holds but detection mAP drops sharply. Why is that plausible?","choices":["Detection models cannot be quantised","Box regression needs finer numerical precision than class scores, and quantisation error in coordinates directly degrades IoU, which mAP measures strictly","INT8 does not support convolution","The calibration set was too large"],"answer":[1],"explanation":"A class decision survives small perturbations because only the argmax matters. Coordinates are consumed at full precision by the IoU computation, so a small numerical shift moves boxes and costs mAP at stricter thresholds. Keeping sensitive layers in higher precision — mixed-precision quantisation — is the usual remedy.","tags":["quantisation-sensitivity","detection","mixed-precision","mAP"],"ref":"https://docs.nvidia.com/deeplearning/tensorrt/","domain":"deployment-edge"},{"id":"DP-007","type":"multi","difficulty":"medium","stem":"Which TWO reduce model size and latency without changing the architecture family?","choices":["Quantisation to lower precision","Pruning redundant channels or weights, followed by fine-tuning to recover accuracy","Increasing input resolution","Adding more augmentation"],"answer":[0,1],"explanation":"Both shrink the deployed model from an existing trained one. Quantisation reduces the bits per value; structured pruning removes whole channels so the speedup is realisable on real hardware. Resolution and augmentation change cost and training but not the model's size.","tags":["quantisation","pruning","compression","latency"],"ref":"https://docs.nvidia.com/deeplearning/tensorrt/","domain":"deployment-edge"},{"id":"DP-008","type":"single","difficulty":"medium","stem":"What is knowledge distillation in a deployment context?","choices":["Compressing the dataset","Training a small student model to match a large teacher's outputs, transferring much of its behaviour into a cheaper architecture","Removing layers at inference","Quantising the weights"],"answer":[1],"explanation":"The teacher's soft output distribution carries more information than a hard label — it expresses which classes are plausible — and a student trained against it typically beats one trained on labels alone. It is architecture-agnostic and composes with quantisation and pruning.","tags":["distillation","student-teacher","soft-targets","compression"],"ref":"https://arxiv.org/abs/1503.02531","domain":"deployment-edge"},{"id":"DP-009","type":"single","difficulty":"medium","stem":"A model must process one frame at a time from a live camera. Why does increasing batch size not help?","choices":["Batching always helps","There is only one frame available at a time; batching would require waiting for more frames, adding latency to reduce per-frame cost — a trade a real-time path usually cannot make","Batch size does not affect GPUs","The model does not support batching"],"answer":[1],"explanation":"Batching amortises fixed overhead across samples, raising throughput. To fill a batch from a single stream you must wait, so latency rises by the collection window. Batching pays when several cameras can be combined, or in offline processing — not for a single low-latency stream.","tags":["batching","latency-vs-throughput","real-time","streaming"],"ref":"https://docs.nvidia.com/deeplearning/tensorrt/","domain":"deployment-edge"},{"id":"DP-010","type":"single","difficulty":"hard","stem":"A model is accurate in a notebook and poor in the C++ production service, with identical weights. What should you check first?","choices":["The GPU driver","Preprocessing parity: resize interpolation, channel order, normalisation constants and letterbox padding must match training exactly","The batch size","The model file format"],"answer":[1],"explanation":"The most common cause is preprocessing divergence, and BGR versus RGB is the classic. A different interpolation method, a missing normalisation, or a different padding convention all shift the input away from what the model was trained on. Comparing intermediate tensors between the two paths localises it quickly.","tags":["preprocessing-parity","train-serve-skew","bgr-rgb","debugging"],"ref":"https://pytorch.org/vision/stable/transforms.html","domain":"deployment-edge"},{"id":"DP-011","type":"multi","difficulty":"hard","stem":"Which TWO steps genuinely reduce end-to-end latency in a camera-to-result pipeline?","choices":["Decode video on the GPU so frames never make a round trip through host memory","Run preprocessing on the GPU, keeping the frame on the device from decode through inference","Increase the model's input resolution","Add test-time augmentation"],"answer":[0,1],"explanation":"In real pipelines, memory transfers and CPU-side decode and resize often exceed inference itself. Keeping the frame resident on the device from decode to output removes those copies. Higher resolution and TTA both increase work, which is the opposite of the goal.","tags":["gpu-decode","zero-copy","pipeline-latency","memory-transfer"],"ref":"https://developer.nvidia.com/deepstream-sdk","domain":"deployment-edge"},{"id":"DP-012","type":"single","difficulty":"medium","stem":"What is the practical difference between latency and throughput for a vision service?","choices":["They are the same measured differently","Latency is the time for one frame to produce a result; throughput is frames processed per second in aggregate — batching raises throughput while raising latency","Latency applies to training, throughput to inference","Throughput is latency divided by batch size"],"answer":[1],"explanation":"A system can have excellent throughput and unacceptable latency, which is exactly what heavy batching produces. Which one is the requirement determines the design: an interactive or safety-critical path is latency-bound, offline archive processing is throughput-bound.","tags":["latency","throughput","batching","requirements"],"ref":"https://docs.nvidia.com/deeplearning/tensorrt/","domain":"deployment-edge"},{"id":"DP-013","type":"single","difficulty":"hard","stem":"An edge device runs a model at 28 FPS in isolation but 9 FPS in the full application. What is the most likely explanation?","choices":["The model degraded","Other stages — decode, preprocessing, post-processing, NMS, drawing, encoding — contend for the same compute, so the model's isolated speed was never the system's speed","The device is overheating only","The camera is too slow"],"answer":[1],"explanation":"Benchmarking a model alone measures one stage. NMS on CPU, colour conversion, annotation drawing and re-encoding all consume the same limited resources, and on edge devices thermal throttling compounds it. Profiling the whole pipeline is the only way to find the real bottleneck.","tags":["end-to-end-profiling","contention","edge","bottleneck"],"ref":"https://developer.nvidia.com/deepstream-sdk","domain":"deployment-edge"},{"id":"DP-014","type":"single","difficulty":"medium","stem":"What should be monitored for a deployed vision model beyond uptime and latency?","choices":["Only the error rate","Input distribution statistics and prediction distribution over time, since silent drift — a dirty lens, a moved camera, a seasonal change — degrades accuracy with no errors raised","The number of model parameters","The size of the container image"],"answer":[1],"explanation":"A vision model fails quietly: it returns confident predictions on inputs it no longer understands. Tracking brightness, sharpness, detection counts and score distributions gives an early signal without needing labels. Sampling frames for periodic human review closes the loop.","tags":["monitoring","silent-drift","input-statistics","production"],"ref":"https://arxiv.org/abs/1902.07208","domain":"deployment-edge"},{"id":"DP-015","type":"single","difficulty":"hard","stem":"Why should the exported model be validated against the original on a fixed set of inputs after every export or engine build?","choices":["To measure speed","Because export, quantisation and engine building can each silently change numerical behaviour; comparing outputs on fixed inputs catches a regression before it ships","To check the file size","Because the framework requires it"],"answer":[1],"explanation":"Each conversion step is an opportunity for a silent change — a fused operation behaving differently, a dynamic axis lost, quantisation shifting a decision. A small fixed input set with stored reference outputs turns that risk into a build-time check, which is far cheaper than discovering it in the field.","tags":["export-validation","numerical-parity","regression","build-check"],"ref":"https://pytorch.org/docs/stable/onnx.html","domain":"deployment-edge"},{"id":"DP-016","type":"single","difficulty":"hard","stem":"Unstructured pruning removes 60% of weights but inference is no faster. Why?","choices":["The model was not retrained","Scattered zero weights still occupy dense tensors and standard kernels do no less work; structured pruning that removes whole channels or filters is what shrinks the actual computation","Pruning only reduces memory","The GPU does not support pruning"],"answer":[1],"explanation":"Sparsity yields a speedup only if the hardware and kernels can exploit it. Removing individual weights leaves the tensor shapes unchanged, so dense matrix multiplication proceeds as before. Removing entire channels changes the shapes and therefore the work, which is why structured pruning is preferred for deployment.","tags":["pruning","structured-pruning","sparsity","compression"],"ref":"https://arxiv.org/abs/1608.08710","domain":"deployment-edge"},{"id":"DP-017","type":"multi","difficulty":"medium","stem":"You must fit an accurate model onto a constrained device. Which TWO combine well?","choices":["Distil the large model into a smaller architecture, then quantise the student","Prune structurally and fine-tune to recover the accuracy the pruning cost","Train the small model from scratch and skip the large one","Increase input resolution to compensate for the smaller model"],"answer":[0,1],"explanation":"These compress along different axes and compose: distillation transfers behaviour into a cheaper architecture, quantisation then reduces the bits, and structured pruning plus fine-tuning removes redundant capacity. Training small from scratch forgoes the teacher's guidance, and raising resolution increases the cost you are trying to reduce.","tags":["distillation","compression","pruning","quantisation"],"ref":"https://arxiv.org/abs/1503.02531","domain":"deployment-edge"},{"id":"DE-001","type":"single","difficulty":"medium","stem":"What is the architectural difference between one-stage and two-stage detectors?","choices":["One-stage uses CNNs, two-stage uses transformers","Two-stage first proposes candidate regions then classifies and refines them; one-stage predicts boxes and classes directly from feature maps in a single pass","One-stage handles only one class","Two-stage requires two GPUs"],"answer":[1],"explanation":"Two-stage detectors such as Faster R-CNN generate region proposals and then run a second head on each. One-stage detectors such as YOLO and RetinaNet skip the proposal step and predict everything densely in one pass. The trade has historically been accuracy against speed, though the gap has narrowed considerably.","tags":["one-stage","two-stage","architecture","faster-rcnn"],"ref":"https://arxiv.org/abs/1506.01497","domain":"detection"},{"id":"DE-002","type":"single","difficulty":"medium","stem":"What is an anchor box?","choices":["The ground-truth box","A predefined box of set scale and aspect ratio placed at each feature-map location, which the network refines rather than predicting coordinates from nothing","The largest box in the image","A box drawn by the annotator"],"answer":[1],"explanation":"Anchors turn box regression into a correction problem: predict an offset from a sensible prior instead of absolute coordinates. Their scales and ratios encode expectations about object shape, which is why anchor configuration matters and why mismatched anchors hurt recall.","tags":["anchors","priors","box-regression","detection"],"ref":"https://arxiv.org/abs/1506.01497","domain":"detection"},{"id":"DE-003","type":"single","difficulty":"hard","stem":"Your dataset consists of very elongated objects such as pipes, and recall is poor with default anchors. What is the fix?","choices":["Increase the confidence threshold","Re-cluster anchor scales and aspect ratios on your own training boxes, or use an anchor-free detector","Train for more epochs","Switch to grayscale"],"answer":[1],"explanation":"Default anchors are tuned for COCO's shape distribution. If your objects are far more elongated, no anchor overlaps them well enough to be assigned as positive during training, so they are never learned. Clustering anchors on your data, or removing the prior entirely with an anchor-free head, addresses the cause.","tags":["anchors","aspect-ratio","recall","dataset-specific"],"ref":"https://arxiv.org/abs/1804.02767","domain":"detection"},{"id":"DE-004","type":"single","difficulty":"easy","stem":"What does Intersection over Union measure?","choices":["The ratio of correct to incorrect predictions","The overlap between two boxes: their intersection area divided by their union area","The confidence of a detection","The number of objects in an image"],"answer":[1],"explanation":"IoU is a scale-invariant overlap measure between 0 and 1. It is used in three distinct places — assigning anchors to ground truth during training, suppressing duplicates in NMS, and deciding whether a detection counts as correct during evaluation — which is why the same threshold value means different things in different contexts.","tags":["iou","overlap","metric","fundamentals"],"ref":"https://cocodataset.org/#detection-eval","domain":"detection"},{"id":"DE-005","type":"single","difficulty":"medium","stem":"What does non-maximum suppression do in a detector's post-processing?","choices":["Removes low-confidence classes","Keeps the highest-scoring box in each cluster of overlapping detections and discards others above an IoU threshold, removing duplicates of the same object","Thins edges to one pixel","Balances the class distribution"],"answer":[1],"explanation":"Dense detectors fire many times around each object. NMS sorts by confidence and greedily suppresses remaining boxes overlapping the winner beyond a threshold. Setting that threshold too low deletes genuinely adjacent objects; too high leaves duplicates.","tags":["nms","duplicates","post-processing","iou-threshold"],"ref":"https://docs.ultralytics.com/modes/predict/","domain":"detection"},{"id":"DE-006","type":"single","difficulty":"hard","stem":"In a dense crowd, overlapping people are being deleted by NMS. What addresses this without simply raising the IoU threshold everywhere?","choices":["Lower the confidence threshold","Soft-NMS, which decays the scores of overlapping boxes instead of removing them outright, so a strongly-supported neighbour survives","Reduce the input resolution","Disable anchors"],"answer":[1],"explanation":"Hard NMS makes a binary decision on overlap alone, so genuinely distinct but overlapping objects are lost. Soft-NMS reduces a neighbour's score in proportion to its overlap, letting a confident detection of a second person survive while true duplicates fall below threshold.","tags":["soft-nms","crowded-scenes","occlusion","post-processing"],"ref":"https://arxiv.org/abs/1704.04503","domain":"detection"},{"id":"DE-007","type":"single","difficulty":"medium","stem":"What does mean Average Precision summarise?","choices":["The mean confidence of all detections","The area under the precision-recall curve for each class, averaged over classes — and in COCO, also averaged over IoU thresholds","The proportion of images with at least one correct detection","The mean IoU of all predictions"],"answer":[1],"explanation":"AP integrates precision over recall for one class, capturing the whole operating curve rather than one threshold. mAP averages that across classes. COCO additionally averages over IoU thresholds from 0.5 to 0.95, which is why COCO mAP numbers look much lower than Pascal VOC's single 0.5 threshold.","tags":["map","average-precision","precision-recall","coco"],"ref":"https://cocodataset.org/#detection-eval","domain":"detection"},{"id":"DE-008","type":"multi","difficulty":"hard","stem":"Which TWO facts about mAP are important when comparing published numbers?","choices":["COCO mAP averages over IoU 0.5:0.95, so it is systematically lower than VOC mAP at IoU 0.5","mAP is computed over the whole dataset at all confidence thresholds, so it does not tell you performance at the single threshold you will deploy at","mAP accounts for inference latency","A higher mAP always means better performance on your data"],"answer":[0,1],"explanation":"Comparing a COCO number against a VOC number is comparing different measures. And mAP summarises an entire curve, whereas deployment picks one operating point — a model with higher mAP can be worse at the precision you actually need. Neither latency nor your domain is reflected in the figure.","tags":["map-pitfalls","benchmark-comparison","operating-point","evaluation"],"ref":"https://cocodataset.org/#detection-eval","domain":"detection"},{"id":"DE-009","type":"single","difficulty":"medium","stem":"How does the YOLO family frame detection?","choices":["As a two-stage proposal and refinement problem","As a single regression from image to a grid of box coordinates, objectness and class scores, predicted in one forward pass","As pixel-wise classification","As a sequence generation problem"],"answer":[1],"explanation":"YOLO divides the image into a grid and predicts boxes, objectness and classes for every cell simultaneously. Seeing the whole image in one pass gives global context and high speed, which is why the family dominates real-time applications.","tags":["yolo","single-pass","grid","real-time"],"ref":"https://arxiv.org/abs/1506.02640","domain":"detection"},{"id":"DE-010","type":"single","difficulty":"medium","stem":"What is the objectness score in a YOLO-style detector?","choices":["The class probability","A per-box estimate of whether any object is present, separate from which class it is","The IoU with the ground truth","The confidence threshold"],"answer":[1],"explanation":"Separating presence from identity lets the network suppress the overwhelming majority of background boxes cheaply before class scores matter. Final confidence typically multiplies objectness by class probability, which is why a box can have a strong class score yet low final confidence.","tags":["objectness","confidence","yolo","background"],"ref":"https://arxiv.org/abs/1612.08242","domain":"detection"},{"id":"DE-011","type":"single","difficulty":"hard","stem":"Small objects are missed while large ones are detected well. Which change is most likely to help?","choices":["Increase the confidence threshold","Increase input resolution and ensure detection heads operate on high-resolution feature levels — small objects vanish after repeated downsampling","Reduce the number of anchors","Train for fewer epochs"],"answer":[1],"explanation":"A 16-pixel object occupies a fraction of a pixel after 32x downsampling, leaving nothing to detect. Higher input resolution preserves it, and a feature pyramid ensures a shallow, fine-grained level is responsible for small scales. Tiling large images at inference is the other standard remedy.","tags":["small-objects","resolution","feature-pyramid","downsampling"],"ref":"https://arxiv.org/abs/1612.03144","domain":"detection"},{"id":"DE-012","type":"single","difficulty":"medium","stem":"What does a feature pyramid network contribute to detection?","choices":["It compresses the model","It combines semantically strong deep features with spatially precise shallow ones via a top-down pathway, so every scale has both context and resolution","It removes the need for anchors","It replaces NMS"],"answer":[1],"explanation":"Shallow maps localise well but lack semantics; deep maps know what things are but not precisely where. FPN's top-down path with lateral connections pushes semantics back down, giving each pyramid level both properties. It is one of the highest-impact ideas in modern detection.","tags":["fpn","multi-scale","top-down","lateral-connections"],"ref":"https://arxiv.org/abs/1612.03144","domain":"detection"},{"id":"DE-013","type":"single","difficulty":"hard","stem":"How do anchor-free detectors such as FCOS or CenterNet predict boxes?","choices":["By enumerating every possible box","By predicting, per location, the distances to the object's boundaries or a centre heatmap plus size, removing anchor hyperparameters entirely","By using a fixed grid of boxes","By segmenting first then fitting boxes"],"answer":[1],"explanation":"Rather than refining preset priors, anchor-free heads regress geometry directly from each position — four boundary distances in FCOS, a centre peak plus width and height in CenterNet. This removes anchor scale, ratio and matching-threshold tuning, one of the fiddliest parts of anchor-based training.","tags":["anchor-free","fcos","centernet","box-parameterisation"],"ref":"https://arxiv.org/abs/1904.01355","domain":"detection"},{"id":"DE-014","type":"single","difficulty":"medium","stem":"Why is IoU loss often preferred to L1 loss on box coordinates?","choices":["It trains faster","L1 treats each coordinate independently and its magnitude depends on object size, whereas IoU loss directly optimises the overlap that evaluation measures and is scale-invariant","IoU loss has no gradient issues","L1 cannot be computed on boxes"],"answer":[1],"explanation":"Coordinate regression optimises a proxy: the same pixel error is trivial on a large box and severe on a small one, and four independent errors can combine into a poor overlap. IoU-family losses align training with the metric. Variants like GIoU and DIoU add gradient signal when boxes do not overlap at all.","tags":["iou-loss","box-regression","scale-invariance","metric-alignment"],"ref":"https://arxiv.org/abs/1902.09630","domain":"detection"},{"id":"DE-015","type":"multi","difficulty":"medium","stem":"Which TWO choices control the precision-recall trade-off at inference without retraining?","choices":["The confidence threshold on detections","The NMS IoU threshold","The learning rate","The augmentation policy"],"answer":[0,1],"explanation":"Both are post-processing knobs. Raising confidence increases precision and loses recall. The NMS threshold governs how aggressively overlapping boxes are merged, trading duplicates against missed neighbours. Learning rate and augmentation only affect training.","tags":["confidence-threshold","nms-threshold","precision-recall","inference-tuning"],"ref":"https://docs.ultralytics.com/modes/predict/","domain":"detection"},{"id":"DE-016","type":"single","difficulty":"hard","stem":"A safety system must not miss defects, and a human reviews every alert. How should the operating point be set?","choices":["Maximise mAP","Set a low confidence threshold to maximise recall, accepting more false positives because review capacity absorbs them and a missed defect is the costly error","Set a high threshold for precision","Use the default threshold"],"answer":[1],"explanation":"The operating point follows the asymmetry of costs, not the benchmark. When a miss is expensive and a false alarm is merely reviewed, you buy recall with precision. mAP averages over all thresholds and so says nothing about which one to deploy.","tags":["operating-point","recall-priority","cost-asymmetry","deployment"],"ref":"https://cocodataset.org/#detection-eval","domain":"detection"},{"id":"DE-017","type":"single","difficulty":"medium","stem":"What is hard negative mining?","choices":["Collecting more positive examples","Focusing training on background regions the model wrongly scores as objects, rather than on the abundant easy background","Removing difficult images","Mining the dataset for duplicates"],"answer":[1],"explanation":"Most background is trivially rejected and teaches nothing. Selecting the negatives the model currently gets wrong concentrates the gradient where learning remains. Focal loss achieves a similar effect continuously by down-weighting easy examples rather than selecting a subset.","tags":["hard-negative-mining","background","training-efficiency","focal-loss"],"ref":"https://arxiv.org/abs/1708.02002","domain":"detection"},{"id":"DE-018","type":"single","difficulty":"hard","stem":"Your detector performs well on the validation split but poorly on a new camera installed at a different angle and height. What is happening?","choices":["The model is overfitting the training set","Domain shift: the new viewpoint, scale distribution and lighting differ from training, so learned appearance priors no longer hold","The NMS threshold is wrong","The model needs more classes"],"answer":[1],"explanation":"Validation drawn from the same cameras cannot reveal sensitivity to a new one. The fix is data from the new conditions, augmentation spanning viewpoint and scale, or fine-tuning on the new site. This is why per-site evaluation matters in multi-camera deployments.","tags":["domain-shift","viewpoint","generalisation","deployment"],"ref":"https://arxiv.org/abs/1904.01355","domain":"detection"},{"id":"DE-019","type":"single","difficulty":"medium","stem":"Why does a detector trained on 640x640 often degrade when run at 1280x1280 without retraining?","choices":["Larger images always score worse","Object sizes in pixels double relative to the learned scale priors and anchor assignments, so the scale distribution no longer matches training","The model runs out of memory","NMS fails at higher resolution"],"answer":[1],"explanation":"A detector learns what objects look like at particular pixel scales relative to its feature strides. Changing inference resolution shifts every object's apparent size. Multi-scale training makes a model robust to this; otherwise inference resolution should match training.","tags":["inference-resolution","scale-priors","train-test-mismatch","multi-scale"],"ref":"https://docs.ultralytics.com/modes/predict/","domain":"detection"},{"id":"DE-020","type":"single","difficulty":"medium","stem":"What is test-time augmentation in detection, and what does it cost?","choices":["Augmenting the training set more heavily; it costs training time","Running inference on several transformed versions of the image and merging the detections; it improves accuracy at a multiple of the inference cost","Augmenting the labels; it costs annotation effort","Applying NMS twice; it costs nothing"],"answer":[1],"explanation":"TTA typically runs flips and scales and fuses the results, recovering detections a single view misses. It multiplies latency by the number of views, so it suits offline batch processing and rarely suits a real-time pipeline.","tags":["test-time-augmentation","latency-tradeoff","inference","accuracy"],"ref":"https://docs.ultralytics.com/modes/predict/","domain":"detection"},{"id":"DE-021","type":"single","difficulty":"hard","stem":"How does DETR differ fundamentally from anchor-based detectors?","choices":["It uses larger images","It treats detection as set prediction with a transformer and bipartite matching loss, removing anchors and NMS entirely","It detects only one class","It requires segmentation masks"],"answer":[1],"explanation":"DETR predicts a fixed set of queries and uses Hungarian matching to assign each to at most one ground-truth object, so duplicates are penalised during training rather than removed afterwards. That eliminates both anchor tuning and NMS, at the cost of slow convergence in the original formulation.","tags":["detr","set-prediction","bipartite-matching","nms-free"],"ref":"https://arxiv.org/abs/2005.12872","domain":"detection"},{"id":"DE-022","type":"single","difficulty":"medium","stem":"What does mosaic augmentation do for detection training?","choices":["Blends two images and their labels","Tiles four images into one, exposing the model to many scales and contexts per sample and placing objects at unusual positions","Converts images to a mosaic pattern","Splits one image into four training samples"],"answer":[1],"explanation":"Mosaic composes four images spatially, so a single training sample contains varied scales, backgrounds and object placements including near the borders. Unlike Mixup it preserves coherent geometry, which is why it suits detection where Mixup does not.","tags":["mosaic","augmentation","scale-variation","yolo"],"ref":"https://arxiv.org/abs/2004.10934","domain":"detection"},{"id":"DE-023","type":"multi","difficulty":"hard","stem":"Precision is high but recall is low on a new dataset. Which TWO are plausible causes?","choices":["The confidence threshold is set too high for this data's score distribution","Anchor or scale priors do not match the object sizes present, so many objects are never assigned as positives during training","NMS IoU threshold is too high","The model has too many classes"],"answer":[0,1],"explanation":"High precision with low recall means the model is confident when it fires but rarely fires. Either the threshold is filtering valid detections, or training never taught it these shapes because no prior matched them. A high NMS threshold keeps more boxes, so it would not reduce recall.","tags":["recall-diagnosis","threshold","anchors","scale-mismatch"],"ref":"https://cocodataset.org/#detection-eval","domain":"detection"},{"id":"DE-024","type":"single","difficulty":"medium","stem":"When mapping detections back to the original image after letterbox preprocessing, what must be undone?","choices":["Only the resize","Both the scale factor and the padding offset, or every box will be systematically displaced","Only the padding","The colour conversion"],"answer":[1],"explanation":"Letterboxing applies a uniform scale then pads to square. Reversing only the scale leaves every box shifted by the pad amount, producing boxes that look plausible but sit consistently off-target — a bug that is easy to miss on square images and obvious on very wide or tall ones.","tags":["letterbox","coordinate-transform","padding","post-processing"],"ref":"https://docs.ultralytics.com/modes/predict/","domain":"detection"},{"id":"DE-025","type":"single","difficulty":"hard","stem":"Annotators disagree about whether partially occluded objects should be labelled. What is the consequence and the remedy?","choices":["No consequence; the model averages it out","The model receives contradictory supervision for similar appearances, capping achievable performance; the remedy is an explicit annotation guideline and relabelling to it","The model will learn both behaviours correctly","Only recall is affected"],"answer":[1],"explanation":"Inconsistent labelling means the same visual evidence is sometimes positive and sometimes negative, which is irreducible noise from the model's point of view. No architecture or training trick recovers it. Defining the rule — a visibility threshold, say — and enforcing it is the only fix.","tags":["annotation-consistency","label-noise","guidelines","occlusion"],"ref":"https://cocodataset.org/#format-data","domain":"detection"},{"id":"IF-001","type":"single","difficulty":"easy","stem":"OpenCV's imread returns an array whose channels are ordered differently from most other libraries. What is the ordering and why does it matter?","choices":["RGB; it matters only for display","BGR; passing it directly to a model or library expecting RGB silently degrades accuracy because the colour channels are swapped","Grayscale always; colour must be requested explicitly","RGBA; the alpha channel must be stripped"],"answer":[1],"explanation":"OpenCV uses BGR for historical reasons while PIL, matplotlib, torchvision and nearly every trained model expect RGB. Nothing errors when you mix them — the image just looks and scores subtly wrong, which makes it one of the most common and longest-lived bugs in a vision pipeline.","tags":["bgr-rgb","opencv","channel-order","pipeline-bugs"],"ref":"https://docs.opencv.org/4.x/d4/da8/group__imgcodecs.html","domain":"image-fundamentals"},{"id":"IF-002","type":"single","difficulty":"medium","stem":"Why convert to HSV before thresholding for a coloured object under changing illumination?","choices":["HSV uses less memory","HSV separates hue from intensity, so a colour range stays valid as brightness changes, whereas in RGB all three channels shift together","HSV is required by OpenCV","HSV removes noise"],"answer":[1],"explanation":"In RGB, making an object brighter changes every channel, so a fixed threshold box stops matching. HSV isolates the chromatic content in hue and pushes illumination into value, so a hue range survives lighting change. That decoupling is the whole reason the conversion exists in colour segmentation work.","tags":["hsv","colour-spaces","thresholding","illumination"],"ref":"https://docs.opencv.org/4.x/df/d9d/tutorial_py_colorspaces.html","domain":"image-fundamentals"},{"id":"IF-003","type":"single","difficulty":"medium","stem":"You add two uint8 images and bright regions come out dark. What happened?","choices":["The images had different sizes","Integer overflow: values above 255 wrapped around. Use a saturating add or convert to a wider type first","The colour space was wrong","The images were not normalised"],"answer":[1],"explanation":"Plain NumPy addition on uint8 wraps modulo 256, so 200 + 100 becomes 44. OpenCV's cv2.add saturates at 255 instead, which is almost always what you want. Mixing the two conventions in one pipeline produces exactly this class of bug.","tags":["uint8","overflow","saturation","arithmetic"],"ref":"https://docs.opencv.org/4.x/d0/d86/tutorial_py_image_arithmetics.html","domain":"image-fundamentals"},{"id":"IF-004","type":"single","difficulty":"medium","stem":"Which filter removes salt-and-pepper noise best while keeping edges sharp?","choices":["Gaussian blur","Median filter","Box filter","Sobel filter"],"answer":[1],"explanation":"Salt-and-pepper noise is extreme outlier pixels. A median takes the middle value of the neighbourhood, so isolated outliers are discarded entirely and edges survive because the median is not dragged by them. Averaging filters smear the outlier across the neighbourhood and blur the edge; Sobel computes derivatives rather than denoising.","tags":["median-filter","noise","edge-preserving","filtering"],"ref":"https://docs.opencv.org/4.x/d4/d13/tutorial_py_filtering.html","domain":"image-fundamentals"},{"id":"IF-005","type":"multi","difficulty":"medium","stem":"Which TWO statements about Gaussian blur are correct?","choices":["Larger sigma removes more detail and more noise together","It is separable, so a 2D blur can be computed as two 1D passes, which is much cheaper for large kernels","It preserves edges better than a median filter","It is a non-linear operation"],"answer":[0,1],"explanation":"Gaussian blur is a linear low-pass filter: sigma controls the cutoff, and because the 2D kernel is the outer product of two 1D kernels it decomposes into a horizontal and a vertical pass, turning O(k squared) into O(k) per pixel. It blurs edges along with noise, which is precisely what edge-preserving filters like the median or bilateral exist to avoid.","tags":["gaussian-blur","separability","linear-filter","complexity"],"ref":"https://docs.opencv.org/4.x/d4/d13/tutorial_py_filtering.html","domain":"image-fundamentals"},{"id":"IF-006","type":"single","difficulty":"medium","stem":"What does morphological opening do?","choices":["Erosion followed by dilation, which removes small bright specks while leaving larger shapes roughly their original size","Dilation followed by erosion, which fills small holes","Thresholds the image at its mean","Computes the image gradient"],"answer":[0],"explanation":"Opening erodes then dilates: the erosion deletes structures smaller than the kernel and the dilation restores what survived to roughly its original extent. Closing is the reverse pair and fills small dark gaps. Remembering which order does which is a standard exam distinction.","tags":["morphology","opening","closing","binary-images"],"ref":"https://docs.opencv.org/4.x/d9/d61/tutorial_py_morphological_ops.html","domain":"image-fundamentals"},{"id":"IF-007","type":"single","difficulty":"hard","stem":"You downscale images by 4x with nearest-neighbour interpolation and thin structures develop jagged, flickering artefacts. What is the cause and fix?","choices":["The images were compressed; use PNG","Aliasing: downsampling without low-pass filtering first folds high frequencies into the result. Use area interpolation, or blur before resizing","The colour space is wrong","The interpolation must be bilinear for upsampling only"],"answer":[1],"explanation":"Nearest-neighbour simply samples every fourth pixel, so detail finer than the new sampling rate aliases into false patterns. Area interpolation averages the source block, which acts as the required low-pass step. The same reasoning is why cv2.INTER_AREA is recommended for shrinking and bilinear or cubic for enlarging.","tags":["aliasing","interpolation","downsampling","inter-area"],"ref":"https://docs.opencv.org/4.x/da/d54/group__imgproc__transform.html","domain":"image-fundamentals"},{"id":"IF-008","type":"single","difficulty":"medium","stem":"What does histogram equalisation do, and when is CLAHE preferable?","choices":["Spreads intensity values to use the full range; CLAHE applies it in tiles with contrast limiting, which avoids over-amplifying noise in locally flat regions","Removes colour; CLAHE keeps it","Sharpens edges; CLAHE blurs them","Normalises to zero mean; CLAHE normalises to unit variance"],"answer":[0],"explanation":"Global equalisation redistributes intensities across the whole image, which can blow out noise wherever the local histogram is narrow. CLAHE equalises per tile and clips the histogram before redistributing, giving local contrast without amplifying flat-region noise. It is the standard choice for medical and low-light imagery.","tags":["histogram-equalisation","clahe","contrast","preprocessing"],"ref":"https://docs.opencv.org/4.x/d5/daf/tutorial_py_histogram_equalization.html","domain":"image-fundamentals"},{"id":"IF-009","type":"single","difficulty":"medium","stem":"An affine transform and a perspective (homography) transform differ in what way?","choices":["Affine has 6 degrees of freedom and preserves parallel lines; perspective has 8 and can map a rectangle to an arbitrary quadrilateral","Affine works only on grayscale","Perspective cannot rotate","Affine requires four point pairs, perspective three"],"answer":[0],"explanation":"An affine map keeps parallelism and needs three point correspondences to solve its six parameters. A homography has eight degrees of freedom, needs four correspondences, and introduces the foreshortening that lets you rectify a photographed document or map a ground plane.","tags":["affine","homography","geometric-transforms","degrees-of-freedom"],"ref":"https://docs.opencv.org/4.x/da/d6e/tutorial_py_geometric_transformations.html","domain":"image-fundamentals"},{"id":"IF-010","type":"single","difficulty":"hard","stem":"Why is it usually wrong to resize an image and then apply a fixed-pixel Gaussian kernel to match a training pipeline that blurred before resizing?","choices":["The kernel must be odd-sized","Blur radius is relative to image scale, so the same pixel kernel represents a different physical amount of smoothing at a different resolution","Gaussian kernels cannot be applied after resizing","Resizing already applies a blur"],"answer":[1],"explanation":"A 5-pixel kernel on a 1024-wide image and on a 256-wide image smooth quite different amounts of real-world structure. If training blurred first, inference must blur first too, or scale the kernel accordingly. Preprocessing parity between training and serving is a recurring source of silent accuracy loss.","tags":["preprocessing-parity","scale","gaussian-blur","train-serve-skew"],"ref":"https://docs.opencv.org/4.x/d4/d13/tutorial_py_filtering.html","domain":"image-fundamentals"},{"id":"IF-011","type":"single","difficulty":"medium","stem":"What does Otsu's method compute?","choices":["An optimal edge map","A global threshold chosen to maximise between-class variance of the intensity histogram, assuming a bimodal distribution","The mean intensity","A per-pixel adaptive threshold"],"answer":[1],"explanation":"Otsu searches all thresholds for the one that best separates the histogram into two classes by variance. It works well when foreground and background form two clear modes and poorly under uneven illumination, which is where adaptive thresholding over local windows takes over.","tags":["otsu","thresholding","histogram","bimodal"],"ref":"https://docs.opencv.org/4.x/d7/d4d/tutorial_py_thresholding.html","domain":"image-fundamentals"},{"id":"IF-012","type":"single","difficulty":"medium","stem":"Why is a model trained on images normalised with ImageNet mean and standard deviation likely to underperform if you feed it raw 0-255 arrays?","choices":["The model expects a different file format","The network's learned weights assume inputs roughly zero-centred with unit scale; unnormalised inputs are two orders of magnitude larger and push activations far outside the trained range","The image size is wrong","Normalisation only matters during training"],"answer":[1],"explanation":"Normalisation is part of the model's input contract, not an optional nicety. Feeding values around 0-255 into a network trained on values around -2 to 2 saturates activations and produces meaningless output. It is the single most common transfer-learning mistake.","tags":["normalisation","imagenet-stats","input-contract","transfer-learning"],"ref":"https://pytorch.org/vision/stable/models.html","domain":"image-fundamentals"},{"id":"IF-013","type":"multi","difficulty":"hard","stem":"An image arrives rotated in a viewer but appears upright when loaded in code. Which TWO explain this?","choices":["The file carries an EXIF orientation tag that the viewer honours and the loader ignores","Some loaders apply EXIF rotation automatically and others return raw pixel order, so behaviour differs by library","The image is corrupted","The colour space is YUV"],"answer":[0,1],"explanation":"Cameras often store sensor-order pixels plus an EXIF orientation flag. PIL can apply it, cv2.imread does not, so the same file can differ between libraries and between your training and serving paths. Normalising orientation explicitly at ingestion avoids a whole class of silent data inconsistency.","tags":["exif","orientation","loader-differences","ingestion"],"ref":"https://docs.opencv.org/4.x/d4/da8/group__imgcodecs.html","domain":"image-fundamentals"},{"id":"IF-014","type":"single","difficulty":"medium","stem":"When converting colour to grayscale, why is a weighted sum used rather than a plain average of R, G and B?","choices":["To save computation","Because human luminance perception weights green most and blue least, so a weighted sum preserves perceived brightness relationships","Because averaging overflows uint8","Because OpenCV requires it"],"answer":[1],"explanation":"The standard luma coefficients, roughly 0.299 R, 0.587 G and 0.114 B, reflect the eye's sensitivity. A flat average makes blues look too bright and greens too dark relative to how they appear, which distorts contrast in any downstream thresholding or feature detection.","tags":["grayscale","luminance","colour-weights","perception"],"ref":"https://docs.opencv.org/4.x/de/d25/imgproc_color_conversions.html","domain":"image-fundamentals"},{"id":"IF-015","type":"single","difficulty":"hard","stem":"A pipeline resizes to 224x224 by squashing the aspect ratio. Detection accuracy on tall objects is poor. What is the principled fix?","choices":["Increase the input size to 512x512 with the same squash","Preserve aspect ratio by letterboxing — resize the long side and pad the short one — so object shapes are not distorted relative to training","Convert to grayscale first","Use nearest-neighbour interpolation"],"answer":[1],"explanation":"Non-uniform scaling changes every object's aspect ratio, so a model that learned what a person or a bottle looks like now sees a stretched version. Letterboxing keeps geometry intact and pads the remainder, which is why detection frameworks default to it. Padding must be accounted for when mapping predictions back to original coordinates.","tags":["aspect-ratio","letterbox","resize","geometry"],"ref":"https://docs.ultralytics.com/modes/predict/","domain":"image-fundamentals"},{"id":"IF-016","type":"single","difficulty":"medium","stem":"A document photographed under a desk lamp is bright on one side and dark on the other. Global Otsu thresholding fails. What works?","choices":["Increase the image resolution","Adaptive thresholding, which computes a threshold per local window so each region is judged against its own neighbourhood","Convert to HSV first","Apply a median filter"],"answer":[1],"explanation":"Otsu picks one value for the whole image, which cannot be right for both the lit and shadowed halves. Adaptive thresholding computes a local threshold from each pixel's surroundings, so uneven illumination stops mattering. It is the standard choice for document and whiteboard capture.","tags":["adaptive-threshold","thresholding","illumination","otsu"],"ref":"https://docs.opencv.org/4.x/d7/d4d/tutorial_py_thresholding.html","domain":"image-fundamentals"},{"id":"SG-001","type":"single","difficulty":"easy","stem":"What distinguishes semantic, instance and panoptic segmentation?","choices":["They differ only in output resolution","Semantic labels every pixel by class without separating objects; instance separates individual objects; panoptic does both, assigning every pixel a class and, for countable things, an instance","Semantic is for video, instance for images","Panoptic is semantic segmentation at higher resolution"],"answer":[1],"explanation":"Semantic segmentation cannot tell two adjacent cars apart — both are simply 'car' pixels. Instance segmentation separates them but traditionally ignores amorphous regions like sky or road. Panoptic unifies the two, covering both countable things and uncountable stuff.","tags":["semantic","instance","panoptic","definitions"],"ref":"https://arxiv.org/abs/1801.00868","domain":"segmentation"},{"id":"SG-002","type":"single","difficulty":"medium","stem":"Why does a segmentation network use an encoder-decoder structure?","choices":["To reduce the parameter count","The encoder downsamples to build semantic context, and the decoder upsamples back to input resolution so a label can be assigned per pixel","Encoders handle colour, decoders handle shape","To allow two GPUs to be used"],"answer":[1],"explanation":"Dense prediction needs both meaning and resolution. Downsampling grows the receptive field enough to recognise what something is, but destroys the spatial precision needed to say exactly where. The decoder recovers resolution, which is why the shape is universal in segmentation.","tags":["encoder-decoder","dense-prediction","resolution","context"],"ref":"https://arxiv.org/abs/1505.04597","domain":"segmentation"},{"id":"SG-003","type":"single","difficulty":"medium","stem":"What do U-Net's skip connections carry, and why do they matter?","choices":["Gradients only","High-resolution spatial detail from encoder layers directly to the matching decoder stage, recovering boundary precision that downsampling destroyed","The class labels","The loss values"],"answer":[1],"explanation":"Without skips, the decoder must hallucinate fine boundaries from a coarse bottleneck, and edges come out blurred. Concatenating the encoder's high-resolution features restores the detail while the bottleneck supplies semantics. It is why U-Net remains strong on boundary-critical tasks like biomedical imaging.","tags":["u-net","skip-connections","boundary-precision","architecture"],"ref":"https://arxiv.org/abs/1505.04597","domain":"segmentation"},{"id":"SG-004","type":"single","difficulty":"hard","stem":"Segmentation outputs show a regular checkerboard pattern. What is the cause and the usual fix?","choices":["The input images are compressed; use PNG","Transposed convolution with a stride that does not divide the kernel size produces uneven output overlap; use bilinear upsampling followed by a regular convolution instead","The learning rate is too high; reduce it","Batch normalisation is missing"],"answer":[1],"explanation":"When kernel size is not divisible by stride, some output positions receive contributions from more input positions than their neighbours, producing periodic intensity variation. Resize-then-convolve avoids the uneven overlap entirely, which is why most modern decoders use it.","tags":["checkerboard-artefacts","transposed-convolution","upsampling","diagnosis"],"ref":"https://distill.pub/2016/deconv-checkerboard/","domain":"segmentation"},{"id":"SG-005","type":"single","difficulty":"medium","stem":"Why is Dice loss often used instead of, or alongside, pixel-wise cross-entropy?","choices":["Dice trains faster","Cross-entropy averages over pixels, so a tiny foreground is swamped by background; Dice measures region overlap and stays sensitive when the positive class is rare","Dice works only on binary masks","Cross-entropy cannot be used for segmentation"],"answer":[1],"explanation":"In a scan where a lesion is 0.5% of pixels, a model predicting all background reaches 99.5% pixel accuracy and a low cross-entropy. Dice is a ratio of overlap to total area, so predicting nothing scores zero. The two are often summed to get stable gradients and imbalance robustness together.","tags":["dice-loss","class-imbalance","cross-entropy","medical-imaging"],"ref":"https://arxiv.org/abs/1606.04797","domain":"segmentation"},{"id":"SG-006","type":"single","difficulty":"medium","stem":"How is mean IoU computed for semantic segmentation?","choices":["The average IoU of all predicted boxes","Per class, intersection over union of predicted and true pixel sets, averaged across classes","The fraction of correctly classified pixels","The Dice coefficient divided by two"],"answer":[1],"explanation":"Because it averages per class rather than per pixel, mIoU refuses to let abundant classes hide failure on rare ones. A model perfect on road and sky but useless on pedestrians scores poorly, which is exactly the behaviour you want from a segmentation metric.","tags":["miou","evaluation","per-class-averaging","metrics"],"ref":"https://arxiv.org/abs/1801.00868","domain":"segmentation"},{"id":"SG-007","type":"single","difficulty":"hard","stem":"Pixel accuracy is 97% but mean IoU is 0.41. What does this tell you?","choices":["The model is excellent","A few large classes dominate the pixel count and are predicted well, while smaller or rarer classes are being missed — the mismatch is the point of using mIoU","The metric is computed wrongly","The images are too small"],"answer":[1],"explanation":"Road, sky and building can be 90% of pixels in a street scene. Getting them right yields high pixel accuracy regardless of performance on poles, signs or pedestrians. The per-class IoU table is where you find which classes are failing.","tags":["pixel-accuracy","miou","class-imbalance","metric-interpretation"],"ref":"https://arxiv.org/abs/1801.00868","domain":"segmentation"},{"id":"SG-008","type":"single","difficulty":"medium","stem":"How does Mask R-CNN extend Faster R-CNN?","choices":["It replaces the backbone with a transformer","It adds a parallel branch predicting a binary mask for each detected region, alongside the existing class and box heads","It removes the region proposal network","It segments before detecting"],"answer":[1],"explanation":"Mask R-CNN keeps detection intact and adds a small fully convolutional mask head per region of interest. Because masks are predicted per instance within a detected box, instances are separated by construction — the detection stage does that work.","tags":["mask-rcnn","instance-segmentation","multi-task","architecture"],"ref":"https://arxiv.org/abs/1703.06870","domain":"segmentation"},{"id":"SG-009","type":"single","difficulty":"hard","stem":"What problem does RoIAlign solve that RoIPool does not?","choices":["It runs faster","RoIPool quantises region boundaries to the feature grid, introducing misalignment of up to a stride; RoIAlign samples with bilinear interpolation, preserving sub-pixel correspondence","It handles more classes","It removes the need for anchors"],"answer":[1],"explanation":"Rounding a region's coordinates to integer feature cells shifts the sampled region by up to half a stride — tolerable for a coarse class label, damaging for a pixel-accurate mask. RoIAlign avoids quantisation entirely and was the single change that made accurate instance masks work.","tags":["roialign","roipool","quantisation","alignment"],"ref":"https://arxiv.org/abs/1703.06870","domain":"segmentation"},{"id":"SG-010","type":"single","difficulty":"medium","stem":"What does atrous spatial pyramid pooling contribute in DeepLab?","choices":["It reduces parameters","It applies parallel dilated convolutions at several rates, capturing context at multiple scales without losing resolution","It replaces the decoder","It normalises the features"],"answer":[1],"explanation":"Objects appear at many scales, and a single receptive field suits only one. ASPP probes the same feature map at several dilation rates simultaneously and fuses the results, gathering multi-scale context while keeping the spatial resolution that dense prediction needs.","tags":["aspp","deeplab","dilated-convolution","multi-scale"],"ref":"https://arxiv.org/abs/1706.05587","domain":"segmentation"},{"id":"SG-011","type":"single","difficulty":"medium","stem":"What is promptable segmentation, as in the Segment Anything model?","choices":["Segmenting based on a text description only","Producing a mask from a user-supplied prompt such as a point, box or rough mask, without the class being fixed in advance","Segmenting every image in a folder automatically","Asking a language model to describe the mask"],"answer":[1],"explanation":"SAM separates 'what region does the user mean' from 'what class is it'. Trained on enormous mask data, it generalises to unseen object types because it never needed a fixed class vocabulary. That makes it powerful for annotation tooling and as a component in larger systems.","tags":["sam","promptable","class-agnostic","zero-shot"],"ref":"https://arxiv.org/abs/2304.02643","domain":"segmentation"},{"id":"SG-012","type":"multi","difficulty":"hard","stem":"Masks are broadly correct but boundaries are ragged. Which TWO would help?","choices":["Train or predict at higher resolution so fine boundary structure survives downsampling","Add a boundary-aware loss term, or refine with a post-processing step that snaps masks to image edges","Increase the batch size","Lower the confidence threshold"],"answer":[0,1],"explanation":"Boundary error concentrates in a thin band of pixels that contributes little to region-overlap losses, so the model is barely penalised for it. Higher resolution preserves the evidence and a boundary-weighted loss makes those pixels matter. Batch size and thresholds do not address boundary quality.","tags":["boundary-quality","resolution","boundary-loss","refinement"],"ref":"https://arxiv.org/abs/1505.04597","domain":"segmentation"},{"id":"SG-013","type":"single","difficulty":"medium","stem":"Why can semantic segmentation not count objects?","choices":["Its output resolution is too low","It labels pixels by class without distinguishing instances, so two touching objects form one connected region","Counting requires a separate classifier","It only handles one class at a time"],"answer":[1],"explanation":"A semantic mask of three adjacent cars is one contiguous blob of car pixels. Connected-component analysis can approximate counting when objects are separated, but fails exactly where it matters — when they touch. Counting needs instance or panoptic segmentation, or detection.","tags":["counting","instance-separation","semantic-limits","task-selection"],"ref":"https://arxiv.org/abs/1801.00868","domain":"segmentation"},{"id":"SG-014","type":"single","difficulty":"hard","stem":"For a 4000x3000 image that will not fit in memory at full resolution, what is the standard segmentation approach?","choices":["Downscale to 512x512 and accept the loss","Tile the image into overlapping patches, segment each, and stitch the results — blending the overlap regions to avoid seams","Segment only the centre crop","Convert to grayscale to save memory"],"answer":[1],"explanation":"Tiling preserves native resolution, which matters when the targets are small relative to the frame. The overlap exists because tile-edge predictions lack context; blending or discarding the border region of each tile prevents visible seams in the stitched mask.","tags":["tiling","large-images","stitching","memory"],"ref":"https://arxiv.org/abs/1505.04597","domain":"segmentation"},{"id":"SG-015","type":"single","difficulty":"medium","stem":"When augmenting segmentation data, what must be true of the mask?","choices":["It should be left unchanged","Every geometric transform applied to the image must be applied identically to the mask, using nearest-neighbour interpolation so class indices are not blended","It should be blurred to match","Only the image needs augmenting"],"answer":[1],"explanation":"Masks carry discrete class indices, not intensities. Bilinear interpolation of a mask can produce value 1.5 between class 1 and class 2 — a class that does not exist. Nearest-neighbour preserves valid labels, and any spatial transform must be mirrored exactly or image and mask desynchronise.","tags":["augmentation","mask-interpolation","nearest-neighbour","label-integrity"],"ref":"https://albumentations.ai/docs/","domain":"segmentation"},{"id":"SG-016","type":"single","difficulty":"medium","stem":"What is the practical difference between Dice and IoU as metrics?","choices":["They measure different things entirely","They are monotonically related and rank models the same way, but Dice gives a higher number for the same overlap, so they must not be compared across papers","IoU is for boxes, Dice for masks only","Dice ignores false positives"],"answer":[1],"explanation":"Dice equals 2·IoU/(1+IoU), so one determines the other and model rankings agree. The numbers differ though — 0.8 Dice corresponds to about 0.67 IoU — which makes cross-paper comparison meaningless unless you check which was reported.","tags":["dice","iou","metric-relationship","comparison"],"ref":"https://arxiv.org/abs/1606.04797","domain":"segmentation"},{"id":"SG-017","type":"single","difficulty":"hard","stem":"A medical segmentation model has excellent Dice on the training hospital's scans and poor Dice on another hospital's. What is the most likely cause?","choices":["The model is too small","Acquisition domain shift: different scanners, protocols and intensity distributions change the input statistics the model learned","The masks are wrong","Dice is the wrong metric"],"answer":[1],"explanation":"Scanner vendor, field strength, reconstruction kernel and protocol all shift intensity distributions substantially. Intensity normalisation, augmentation spanning those variations, and multi-site training data are the standard mitigations — and evaluating per site is what exposes the problem at all.","tags":["domain-shift","multi-site","medical-imaging","generalisation"],"ref":"https://arxiv.org/abs/1902.07208","domain":"segmentation"},{"id":"SG-018","type":"single","difficulty":"medium","stem":"Why does instance segmentation typically cost more compute than semantic segmentation?","choices":["Masks are stored at higher precision","It must additionally detect and separate each object, then predict a mask per instance, so cost grows with the number of objects","It requires more classes","It cannot use a backbone"],"answer":[1],"explanation":"Semantic segmentation is one dense forward pass regardless of how many objects are present. Instance methods add detection and per-instance mask prediction, so a crowded frame costs substantially more than an empty one — which matters for real-time budgets.","tags":["compute-cost","instance-vs-semantic","scaling","latency"],"ref":"https://arxiv.org/abs/1703.06870","domain":"segmentation"},{"id":"SG-019","type":"multi","difficulty":"medium","stem":"Which TWO indicate that segmentation, rather than detection, is the right task?","choices":["The application needs precise object area or shape, such as measuring coverage or defect extent","Objects are amorphous or non-rectangular, so a bounding box is a poor description","The objects need to be counted","Real-time speed is the primary constraint"],"answer":[0,1],"explanation":"Boxes give position and rough extent; masks give shape and exact area. Choose segmentation when the measurement is area or outline, or when a box is a bad fit for the geometry. Counting is served well by detection, and detection is usually the cheaper option when speed dominates.","tags":["task-selection","segmentation-vs-detection","area-measurement","shape"],"ref":"https://arxiv.org/abs/1801.00868","domain":"segmentation"},{"id":"SG-020","type":"single","difficulty":"hard","stem":"A binary segmentation model outputs probabilities. How should the threshold be chosen?","choices":["Always 0.5","On a validation set, by picking the threshold that optimises the metric that matters for the application — which is rarely exactly 0.5 under class imbalance","By taking the mean probability","It cannot be changed after training"],"answer":[1],"explanation":"The default 0.5 assumes balanced classes and symmetric error costs. With a rare foreground, or where a false negative costs far more than a false positive, the optimal threshold moves. Sweeping it on validation and choosing against the real objective is a cheap and frequently skipped gain.","tags":["threshold-selection","operating-point","class-imbalance","calibration"],"ref":"https://arxiv.org/abs/1606.04797","domain":"segmentation"},{"id":"TV-001","type":"single","difficulty":"medium","stem":"What is the right way to think about choosing data augmentations?","choices":["Apply as many as possible","Each augmentation should simulate a variation the model will genuinely encounter at inference; augmentations that create impossible inputs waste capacity","Only geometric augmentations are valid","Augmentation should match the validation set exactly"],"answer":[1],"explanation":"Augmentation encodes your assumptions about the deployment distribution. Horizontal flip is right for pedestrians and wrong for reading digits; heavy colour jitter is right for outdoor cameras and wrong for a calibrated microscope. Piling on transforms the model will never see spends capacity on nothing.","tags":["augmentation","invariance-assumptions","deployment-distribution"],"ref":"https://pytorch.org/vision/stable/transforms.html","domain":"training-vision"},{"id":"TV-002","type":"single","difficulty":"hard","stem":"Why is vertical flip usually wrong for street-scene detection but fine for satellite imagery?","choices":["Vertical flips are computationally expensive","Street scenes have a consistent gravity direction so upside-down cars never occur, whereas overhead imagery has no canonical up","Satellite images are grayscale","Vertical flip breaks bounding boxes"],"answer":[1],"explanation":"An augmentation is valid when the label is preserved and the result is plausible. Gravity fixes orientation in ground-level scenes, so vertical flipping manufactures inputs the model will never meet. Nadir imagery has no preferred rotation, so flips and rotations are free additional data.","tags":["augmentation","orientation-prior","domain-knowledge","flips"],"ref":"https://pytorch.org/vision/stable/transforms.html","domain":"training-vision"},{"id":"TV-003","type":"single","difficulty":"medium","stem":"When applying augmentation to a detection dataset, what must be done that classification does not require?","choices":["Nothing extra","The bounding boxes must be transformed with the image, and boxes that fall outside or become degenerate after cropping must be handled","Augmentation must be disabled","The labels must be one-hot encoded"],"answer":[1],"explanation":"Geometric augmentation changes the geometry the labels refer to. A flip mirrors box coordinates, a crop can cut a box in half or remove it entirely, and rotation makes axis-aligned boxes inexact. Libraries that handle images and targets jointly exist precisely because doing this by hand is error-prone.","tags":["augmentation","bounding-boxes","label-transformation","detection"],"ref":"https://albumentations.ai/docs/","domain":"training-vision"},{"id":"TV-004","type":"single","difficulty":"medium","stem":"What does cross-entropy loss measure for a classifier?","choices":["The distance between predicted and true bounding boxes","The negative log probability the model assigned to the correct class, so confident wrong predictions are penalised heavily","The variance of the predictions","The number of misclassified samples"],"answer":[1],"explanation":"Cross-entropy is minus the log of the probability given to the true class. Being confidently wrong drives the loss toward infinity, which is what pushes the model to be calibrated as well as correct. Counting errors gives no gradient, which is why accuracy is a metric and not a loss.","tags":["cross-entropy","loss-function","confidence","classification"],"ref":"https://pytorch.org/docs/stable/generated/torch.nn.CrossEntropyLoss.html","domain":"training-vision"},{"id":"TV-005","type":"single","difficulty":"hard","stem":"In a detection dataset the background vastly outnumbers objects. What does focal loss do about it?","choices":["It removes background samples","It down-weights easy, well-classified examples so the abundant easy negatives stop dominating the gradient and hard examples drive learning","It increases the learning rate for rare classes","It balances the batch composition"],"answer":[1],"explanation":"With tens of thousands of easy background anchors per image, their individually small losses sum to overwhelm the few object losses. Focal loss multiplies each term by a factor that shrinks as confidence rises, so easy negatives contribute almost nothing and the rare hard cases dominate instead.","tags":["focal-loss","class-imbalance","hard-examples","detection"],"ref":"https://arxiv.org/abs/1708.02002","domain":"training-vision"},{"id":"TV-006","type":"multi","difficulty":"medium","stem":"Which TWO approaches address a long-tailed class distribution?","choices":["Re-weight the loss so rare classes contribute proportionally more","Resample the data, oversampling rare classes or undersampling common ones","Reduce the learning rate","Increase the input resolution"],"answer":[0,1],"explanation":"Both rebalance the effective contribution of each class — one at the loss, one at the sampler. Each has a cost: re-weighting can destabilise training, oversampling risks overfitting the few rare examples. Learning rate and resolution do not touch the imbalance.","tags":["long-tail","class-imbalance","resampling","loss-weighting"],"ref":"https://arxiv.org/abs/1708.02002","domain":"training-vision"},{"id":"TV-007","type":"single","difficulty":"medium","stem":"What does a learning-rate warmup period do?","choices":["Pre-trains the first layer","Ramps the learning rate up from near zero over the first iterations, avoiding large destabilising updates while the optimiser state and normalisation statistics are still poor","Warms up the GPU","Increases batch size gradually"],"answer":[1],"explanation":"At step zero the weights are random or freshly transferred, the gradient estimates are noisy and the adaptive optimiser has no history. A full learning rate at that moment can throw the model somewhere it never recovers from. Warmup is especially important for large batches and for transformers.","tags":["warmup","learning-rate","training-stability","optimisation"],"ref":"https://arxiv.org/abs/1706.02677","domain":"training-vision"},{"id":"TV-008","type":"single","difficulty":"medium","stem":"Why is a cosine or step decay schedule used rather than a constant learning rate?","choices":["Constant rates are not supported by optimisers","Large steps early explore broadly, and decaying later allows fine convergence into a minimum that a large step would keep overshooting","Decaying reduces memory","It makes training deterministic"],"answer":[1],"explanation":"The two phases want different step sizes: coarse movement first, precise settling after. A constant rate either converges slowly or oscillates around the minimum forever. Decay resolves the tension, and the particular schedule matters much less than having one.","tags":["lr-schedule","cosine-decay","convergence","optimisation"],"ref":"https://pytorch.org/docs/stable/optim.html","domain":"training-vision"},{"id":"TV-009","type":"multi","difficulty":"medium","stem":"Which TWO are genuine regularisation techniques for vision models?","choices":["Weight decay, penalising large parameter magnitudes","Dropout or stochastic depth, randomly removing units or blocks during training","Increasing the number of epochs","Raising the learning rate"],"answer":[0,1],"explanation":"Both constrain effective capacity so the model cannot simply memorise. Weight decay biases toward smaller weights; dropout and stochastic depth prevent co-adaptation by making any individual path unreliable. Longer training and larger steps are not regularisers — more epochs typically increases overfitting.","tags":["regularisation","weight-decay","dropout","stochastic-depth"],"ref":"https://pytorch.org/docs/stable/optim.html","domain":"training-vision"},{"id":"TV-010","type":"single","difficulty":"hard","stem":"What does mixed-precision training do, and why does it need a loss scaler?","choices":["It trains two models; the scaler averages them","It computes in half precision for speed and memory while keeping master weights in float32; small gradients would underflow to zero in FP16, so the loss is scaled up before backward and unscaled after","It mixes datasets; the scaler balances them","It alternates precision by layer; the scaler chooses which"],"answer":[1],"explanation":"FP16 has a narrow exponent range and many gradients fall below its smallest representable value, silently becoming zero. Multiplying the loss by a large factor shifts them into range, and dividing the gradients back before the optimiser step restores the correct magnitude.","tags":["mixed-precision","loss-scaling","fp16","underflow"],"ref":"https://pytorch.org/docs/stable/amp.html","domain":"training-vision"},{"id":"TV-011","type":"single","difficulty":"medium","stem":"Training loss keeps falling while validation loss has risen for several epochs. What does this indicate?","choices":["The learning rate is too low","Overfitting: the model is memorising the training set. Stop at the validation minimum, and add data, augmentation or regularisation","The batch size is too small","The data is not normalised"],"answer":[1],"explanation":"Diverging curves are the textbook signature. Early stopping keeps the best generalising checkpoint; more data, stronger augmentation or heavier regularisation pushes the divergence point later. Both curves rising together would instead mean a training problem.","tags":["overfitting","early-stopping","validation-curve","diagnosis"],"ref":"https://pytorch.org/tutorials/","domain":"training-vision"},{"id":"TV-012","type":"single","difficulty":"hard","stem":"Both training and validation loss plateau at a high value from the start. What should you check first?","choices":["Add more regularisation","Underfitting or a pipeline bug: verify labels align with images, the learning rate is not absurdly low or high, and the model has enough capacity","Reduce the dataset size","Increase dropout"],"answer":[1],"explanation":"Failure to fit even the training data means the model is not learning at all. Before touching capacity, confirm the data pipeline: mismatched labels, an incorrect normalisation, or a learning rate off by orders of magnitude all produce this. Adding regularisation makes underfitting worse.","tags":["underfitting","pipeline-bugs","diagnosis","capacity"],"ref":"https://pytorch.org/tutorials/","domain":"training-vision"},{"id":"TV-013","type":"single","difficulty":"hard","stem":"A model reaches 99% training accuracy in two epochs on a 500-image dataset, and 55% on validation. Beyond regularisation, what is worth checking?","choices":["Whether the GPU is faulty","Whether near-duplicate images span the train and validation split, and whether the split is random rather than grouped by patient, site or session","Whether the loss function is correct","Whether the images are RGB"],"answer":[1],"explanation":"Fast memorisation of a tiny set is expected, but a suspicious split can also inflate or deflate the gap. Frames from one video, several images of one patient, or repeated product photos must stay on the same side of the split, or the validation score measures recall of near-copies rather than generalisation.","tags":["data-leakage","grouped-splits","near-duplicates","validation"],"ref":"https://scikit-learn.org/stable/modules/cross_validation.html","domain":"training-vision"},{"id":"TV-014","type":"single","difficulty":"medium","stem":"Why should augmentation be applied to the training set but not the validation set?","choices":["Augmentation is too slow for validation","Validation must measure performance on the real distribution; augmenting it changes what is being measured and makes runs incomparable","Validation images are already augmented","Augmentation breaks the loss computation"],"answer":[1],"explanation":"Validation is a measurement instrument and must stay fixed. Random augmentation makes the number fluctuate for reasons unrelated to the model and destroys comparability between epochs and experiments. Test-time augmentation is a deliberate inference technique, not part of validation measurement.","tags":["augmentation","validation","measurement","methodology"],"ref":"https://pytorch.org/vision/stable/transforms.html","domain":"training-vision"},{"id":"TV-015","type":"single","difficulty":"medium","stem":"What does label smoothing do?","choices":["Removes noisy labels","Replaces hard 0/1 targets with slightly softened values, discouraging over-confident predictions and improving calibration","Smooths the loss curve","Averages labels across the batch"],"answer":[1],"explanation":"Training toward a target of exactly 1 pushes the model to drive logits arbitrarily high, which overfits and produces badly calibrated confidence. Distributing a little probability mass to other classes caps that pressure and usually improves both calibration and generalisation slightly.","tags":["label-smoothing","calibration","overconfidence","regularisation"],"ref":"https://arxiv.org/abs/1512.00567","domain":"training-vision"},{"id":"TV-016","type":"multi","difficulty":"hard","stem":"Which TWO steps make a training run reproducible enough to compare experiments?","choices":["Fix the random seeds for the framework, NumPy and the data sampler, and record them","Pin the data split and the exact library and dataset versions alongside the result","Train on a faster GPU","Disable augmentation"],"answer":[0,1],"explanation":"Comparisons are meaningless if the only difference you can identify is the change you made. Seeds control initialisation and sampling order; pinned splits and versions control the data and code. Note that full bitwise determinism on GPU additionally requires deterministic kernels, which cost speed.","tags":["reproducibility","seeds","versioning","experiment-comparison"],"ref":"https://pytorch.org/docs/stable/notes/randomness.html","domain":"training-vision"},{"id":"TV-017","type":"single","difficulty":"medium","stem":"Why is it wrong to select a model checkpoint using the test set?","choices":["The test set is too small","Every selection decision made against a set leaks information into the model, so the test score becomes optimistic; selection belongs to validation, with the test set touched once","Test sets cannot be loaded during training","It slows training"],"answer":[1],"explanation":"Choosing among checkpoints by test score is a form of fitting to the test set, however indirect. The reported number then overstates true performance. Validation exists to absorb those decisions, leaving an untouched estimate at the end.","tags":["test-set","selection-bias","leakage","methodology"],"ref":"https://scikit-learn.org/stable/modules/cross_validation.html","domain":"training-vision"},{"id":"TV-018","type":"single","difficulty":"hard","stem":"Training is GPU-starved: utilisation oscillates between 100% and near zero. What is the usual cause?","choices":["The learning rate is too high","The data pipeline cannot keep up — decoding and augmentation on too few workers — so the GPU waits between batches","The model is too small","Mixed precision is disabled"],"answer":[1],"explanation":"Sawtooth utilisation means the accelerator is idle waiting for input. More DataLoader workers, prefetching, pinned memory, cheaper decoding or pre-resized data all help. Chasing model-side optimisations while the bottleneck is CPU-side decoding wastes effort.","tags":["data-pipeline","gpu-utilisation","dataloader","bottleneck"],"ref":"https://pytorch.org/docs/stable/data.html","domain":"training-vision"},{"id":"TV-019","type":"single","difficulty":"medium","stem":"What is the practical effect of increasing batch size without changing the learning rate?","choices":["Training always improves","Gradient estimates become less noisy but each epoch takes fewer, larger steps, so the effective learning rate is lower and the model may underfit within the same epoch count","Memory use falls","The loss function changes"],"answer":[1],"explanation":"A larger batch averages more samples, reducing gradient noise and the number of updates per epoch. The common heuristic is to scale the learning rate with batch size, often with warmup, to keep the effective step size comparable. Some of that gradient noise is also mildly regularising.","tags":["batch-size","learning-rate-scaling","gradient-noise","optimisation"],"ref":"https://arxiv.org/abs/1706.02677","domain":"training-vision"},{"id":"TV-020","type":"single","difficulty":"medium","stem":"When is training from scratch prefera
