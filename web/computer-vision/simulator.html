ble to fine-tuning an ImageNet backbone?","choices":["Always, since pretrained weights are biased","When the domain is far from natural images — medical volumes, radar, spectrograms — and you have enough data that pretrained low-level features offer little","When the dataset is small","When you need faster convergence"],"answer":[1],"explanation":"Transfer works because low-level natural-image statistics generalise. For inputs with genuinely different statistics, the benefit shrinks, and with sufficient in-domain data scratch training can match or beat it. With small data, transfer almost always wins regardless of domain distance.","tags":["scratch-vs-transfer","domain-distance","pretrained-weights","decision-criteria"],"ref":"https://arxiv.org/abs/1902.07208","domain":"training-vision"},{"id":"TV-021","type":"single","difficulty":"hard","stem":"You add Mixup to a detection training pipeline and results get worse. Why might that be?","choices":["Mixup requires grayscale images","Blending two images and their labels suits classification, where labels are a distribution over classes, but produces incoherent geometry and ambiguous boxes for localisation","Mixup is only for transformers","Mixup needs a larger batch"],"answer":[1],"explanation":"Mixup interpolates images and their one-hot targets, which is meaningful when the target is a class distribution. Detection targets are boxes tied to positions, and a blended image contains two overlapping scenes with no coherent geometry. Detection uses mosaic-style augmentations instead, which compose images spatially rather than blending them.","tags":["mixup","augmentation-transfer","detection","label-semantics"],"ref":"https://arxiv.org/abs/1710.09412","domain":"training-vision"},{"id":"TV-022","type":"single","difficulty":"medium","stem":"What is gradient clipping for?","choices":["Removing small gradients to save computation","Capping the gradient norm so a rare huge gradient cannot take a destructive optimiser step","Clipping the input images","Limiting the number of parameters updated"],"answer":[1],"explanation":"Occasional pathological batches or numerical spikes produce gradients orders of magnitude above typical, and a single such step can undo hours of training. Rescaling the gradient when its norm exceeds a threshold preserves direction while bounding step size.","tags":["gradient-clipping","stability","exploding-gradients","optimisation"],"ref":"https://pytorch.org/docs/stable/generated/torch.nn.utils.clip_grad_norm_.html","domain":"training-vision"},{"id":"TV-023","type":"multi","difficulty":"medium","stem":"GPU utilisation averages 35% during training. Which TWO changes are most likely to raise it?","choices":["Increase DataLoader worker count and enable prefetching so batches are ready before the GPU asks","Pre-resize and cache the dataset, or decode on the GPU, so per-sample CPU work stops dominating","Add more layers to the model","Reduce the learning rate"],"answer":[0,1],"explanation":"Low utilisation means the accelerator is waiting. More workers overlap decoding and augmentation with compute, and removing expensive per-sample CPU work attacks the cause directly. Enlarging the model raises utilisation only by making the GPU slower, which is not the same as training faster.","tags":["gpu-utilisation","dataloader","data-pipeline","bottleneck"],"ref":"https://pytorch.org/docs/stable/data.html","domain":"training-vision"},{"id":"VD-001","type":"single","difficulty":"medium","stem":"Why is running a per-frame detector on every frame of a 30 FPS stream often wasteful?","choices":["Detectors cannot process video","Consecutive frames are highly redundant; detecting on a subset and tracking between detections gives similar results at a fraction of the compute","Video frames are lower quality","Detectors require batching"],"answer":[1],"explanation":"At 30 FPS a scene barely changes between adjacent frames. Detect-and-track runs the expensive detector periodically and propagates identities cheaply in between, which is the standard architecture for real-time video analytics on constrained hardware.","tags":["temporal-redundancy","detect-and-track","compute-budget","streaming"],"ref":"https://arxiv.org/abs/1602.00763","domain":"video-tracking"},{"id":"VD-002","type":"single","difficulty":"medium","stem":"What does optical flow estimate?","choices":["The 3D motion of objects in world coordinates","The apparent per-pixel motion between two frames, as a 2D displacement field","The depth of each pixel","The camera's exposure"],"answer":[1],"explanation":"Optical flow is apparent motion in the image plane, which conflates object motion, camera motion and even lighting change. Recovering true 3D motion needs additional geometry. The distinction matters because flow can be large where nothing physically moved.","tags":["optical-flow","apparent-motion","displacement-field","definitions"],"ref":"https://docs.opencv.org/4.x/d4/dee/tutorial_optical_flow.html","domain":"video-tracking"},{"id":"VD-003","type":"single","difficulty":"hard","stem":"What is the brightness constancy assumption in classical optical flow, and when does it break?","choices":["That the image is grayscale; it breaks for colour","That a physical point keeps the same intensity between frames; it breaks under lighting change, specular highlights and occlusion","That motion is always horizontal; it breaks for vertical motion","That frames are equally spaced; it breaks at variable frame rate"],"answer":[1],"explanation":"Classical methods match pixels by assuming their brightness is preserved. Changing illumination, a moving specular highlight, or a point becoming occluded all violate it, producing confidently wrong flow. Learned flow models are more robust but inherit the limitation where the evidence genuinely disappears.","tags":["brightness-constancy","optical-flow","assumptions","occlusion"],"ref":"https://docs.opencv.org/4.x/d4/dee/tutorial_optical_flow.html","domain":"video-tracking"},{"id":"VD-004","type":"single","difficulty":"medium","stem":"What is the difference between sparse and dense optical flow?","choices":["Sparse is faster but less accurate at every pixel","Sparse tracks a selected set of feature points between frames; dense estimates a displacement for every pixel","Sparse works on grayscale only","Dense requires two cameras"],"answer":[1],"explanation":"Lucas-Kanade tracks chosen keypoints and is cheap, which suits tracking a few objects or estimating camera motion. Farneback or learned dense flow produce a full field, needed for motion segmentation or frame interpolation, at much higher cost.","tags":["sparse-flow","dense-flow","lucas-kanade","cost"],"ref":"https://docs.opencv.org/4.x/d4/dee/tutorial_optical_flow.html","domain":"video-tracking"},{"id":"VD-005","type":"single","difficulty":"medium","stem":"In multi-object tracking, what does the association step do?","choices":["Classifies each detection","Decides which detection in the current frame corresponds to which existing track, so identities persist over time","Removes duplicate detections","Estimates the camera pose"],"answer":[1],"explanation":"Detection answers what is present in this frame; association answers which of these is the same object as before. It is usually posed as a bipartite assignment between predicted track positions and new detections, solved by the Hungarian algorithm over a cost matrix.","tags":["association","mot","hungarian","identity"],"ref":"https://arxiv.org/abs/1602.00763","domain":"video-tracking"},{"id":"VD-006","type":"single","difficulty":"medium","stem":"What role does a Kalman filter play in SORT-style tracking?","choices":["It detects objects","It predicts each track's next position from a motion model and fuses that prediction with the new measurement, smoothing noise and bridging brief gaps","It computes appearance features","It performs non-maximum suppression"],"answer":[1],"explanation":"The filter maintains a state — position and velocity — and predicts forward, giving association a expected location to match against. Fusing prediction with measurement also smooths jitter and lets a track survive a frame or two of missed detection.","tags":["kalman-filter","motion-model","prediction","sort"],"ref":"https://arxiv.org/abs/1602.00763","domain":"video-tracking"},{"id":"VD-007","type":"single","difficulty":"hard","stem":"Two people cross paths and their track IDs swap. What is this failure and what mitigates it?","choices":["A detection failure; retrain the detector","An identity switch; add appearance-based re-identification features so association uses visual similarity rather than position alone","A calibration error; recalibrate the camera","An NMS failure; raise the threshold"],"answer":[1],"explanation":"When two tracks occupy nearly the same position, a motion-only cost cannot separate them. DeepSORT-style methods add an appearance embedding so the association cost includes visual similarity, which survives the crossing. Identity switches are a standard MOT metric for exactly this reason.","tags":["identity-switch","re-identification","deepsort","appearance"],"ref":"https://arxiv.org/abs/1703.07402","domain":"video-tracking"},{"id":"VD-008","type":"single","difficulty":"medium","stem":"What does a re-identification embedding provide?","choices":["The object's class","A compact appearance descriptor such that views of the same individual are close together and different individuals far apart, even across cameras","The object's 3D position","The object's velocity"],"answer":[1],"explanation":"Re-ID is trained so identity, not category, determines distance — two different people are far apart even though both are 'person'. That is what allows a track to be recovered after a long occlusion or matched across non-overlapping cameras.","tags":["re-identification","embedding","cross-camera","appearance"],"ref":"https://arxiv.org/abs/1703.07402","domain":"video-tracking"},{"id":"VD-009","type":"multi","difficulty":"medium","stem":"Which TWO metrics are standard for evaluating multi-object tracking?","choices":["MOTA, combining false positives, false negatives and identity switches into one score","IDF1, measuring how consistently the correct identity is assigned over a track's lifetime","mAP at IoU 0.5","Mean squared error of the bounding boxes"],"answer":[0,1],"explanation":"MOTA aggregates detection errors and identity switches; IDF1 focuses specifically on identity consistency, which MOTA under-weights. Reporting both is normal because a tracker can detect well while switching identities constantly. mAP evaluates per-frame detection and ignores identity entirely.","tags":["mota","idf1","tracking-metrics","evaluation"],"ref":"https://arxiv.org/abs/1603.00831","domain":"video-tracking"},{"id":"VD-010","type":"single","difficulty":"hard","stem":"A tracker performs well on benchmark footage but poorly on your 5 FPS camera. Why?","choices":["The resolution is too low","Objects move much further between frames, so motion-model predictions and IoU-based association break down at that displacement","The colour space differs","The detector needs retraining"],"answer":[1],"explanation":"Association costs built on IoU or a constant-velocity prediction assume small inter-frame displacement. At 5 FPS a walking person may not overlap their previous box at all. Widening the search, relying more on appearance, or raising the capture rate are the available fixes.","tags":["frame-rate","displacement","association-failure","deployment"],"ref":"https://arxiv.org/abs/1602.00763","domain":"video-tracking"},{"id":"VD-011","type":"single","difficulty":"medium","stem":"Why does action recognition need a temporal model rather than a per-frame classifier?","choices":["Single frames are too noisy","Many actions are defined by how appearance changes over time — sitting down and standing up look identical in a single frame","Per-frame classifiers are too slow","Frames lack colour information"],"answer":[1],"explanation":"Appearance at one instant is often ambiguous about the action; the discriminating information is the direction of change. Temporal modelling — 3D convolution, two-stream networks with flow, or temporal attention — is what supplies it.","tags":["action-recognition","temporal-modelling","ambiguity","3d-convolution"],"ref":"https://arxiv.org/abs/1705.07750","domain":"video-tracking"},{"id":"VD-012","type":"single","difficulty":"medium","stem":"What does a two-stream network use as its second stream?","choices":["A second colour space","Stacked optical flow, so one stream models appearance and the other models motion explicitly","A depth map","Audio"],"answer":[1],"explanation":"Feeding precomputed flow gives the network motion information directly rather than requiring it to learn temporal derivatives from raw frames. It was a strong early approach; the cost is computing flow, which is why later work moved toward 3D convolutions and temporal attention that learn motion implicitly.","tags":["two-stream","optical-flow","action-recognition","motion"],"ref":"https://arxiv.org/abs/1406.2199","domain":"video-tracking"},{"id":"VD-013","type":"multi","difficulty":"hard","stem":"Which TWO design choices matter most for a 24/7 multi-camera analytics pipeline?","choices":["Decoding on the GPU and batching frames across cameras, since video decode is often the real bottleneck","Dropping frames under load in a controlled way rather than letting queues grow unboundedly","Maximising model accuracy regardless of latency","Storing every frame indefinitely"],"answer":[0,1],"explanation":"At scale the constraint is throughput, and H.264 decode on CPU frequently costs more than inference. Hardware decode plus cross-camera batching addresses it. A deliberate shedding policy is what keeps latency bounded when demand exceeds capacity — unbounded queues turn overload into unbounded delay.","tags":["video-pipeline","hardware-decode","batching","backpressure"],"ref":"https://developer.nvidia.com/deepstream-sdk","domain":"video-tracking"},{"id":"VD-014","type":"single","difficulty":"medium","stem":"What is a tracking-by-detection pipeline?","choices":["Tracking without any detector","Running a detector each processed frame and linking detections across frames into tracks, rather than tracking appearance templates independently","Detecting only the first frame then tracking","Using optical flow alone"],"answer":[1],"explanation":"Tracking-by-detection dominates modern MOT because detector quality has improved so much: it recovers naturally from drift and handles objects entering and leaving. Its weakness is dependence on detection quality — a missed detection creates a gap the association step must bridge.","tags":["tracking-by-detection","mot","architecture","drift"],"ref":"https://arxiv.org/abs/1602.00763","domain":"video-tracking"},{"id":"VD-015","type":"single","difficulty":"hard","stem":"A counting application double-counts people who pause at the boundary line. What design fixes this?","choices":["Increase the detection threshold","Count on track identity crossing the line with direction and hysteresis, rather than counting detections present in a region","Reduce the frame rate","Use a larger model"],"answer":[1],"explanation":"Counting per-frame presence means any jitter around the boundary re-triggers. Attaching the count to a persistent track identity, requiring a directional crossing, and adding a small hysteresis band makes the event fire once per person. It is a state-machine problem, not a model-accuracy problem.","tags":["line-crossing","counting","hysteresis","track-identity"],"ref":"https://arxiv.org/abs/1703.07402","domain":"video-tracking"},{"id":"VD-016","type":"single","difficulty":"medium","stem":"Why does a 3D convolution suit video where a 2D convolution does not?","choices":["It processes colour better","Its kernel extends across time as well as space, so it can learn motion patterns directly from stacked frames","It uses less memory","It requires fewer frames"],"answer":[1],"explanation":"A 2D kernel sees one frame and can only describe appearance. Extending the kernel along the temporal axis lets a single operation respond to how a region changes, which is what distinguishes actions that look identical in any single frame.","tags":["3d-convolution","temporal-modelling","action-recognition","motion"],"ref":"https://arxiv.org/abs/1705.07750","domain":"video-tracking"},{"id":"VD-017","type":"single","difficulty":"hard","stem":"An action recogniser trained on trimmed clips performs poorly on continuous untrimmed video. Why?","choices":["The resolution differs","Trimmed clips contain the action throughout, so the model never learned to locate it in time or to reject background segments","Untrimmed video is compressed differently","The frame rate is higher"],"answer":[1],"explanation":"Classification on trimmed clips assumes the action is already isolated. Continuous footage requires temporal localisation — deciding when the action starts and ends, and recognising that most segments contain nothing of interest, which is a different task the training never posed.","tags":["temporal-modelling","action-recognition","ambiguity","localisation"],"ref":"https://arxiv.org/abs/1705.07750","domain":"video-tracking"},{"id":"VD-018","type":"single","difficulty":"medium","stem":"A tracker reports MOTA of 0.78 and IDF1 of 0.41. What does the gap indicate?","choices":["The metrics disagree because one is computed wrongly","Detection is good but identities are unstable — many switches and fragmented tracks, which MOTA under-penalises and IDF1 exposes","The dataset is too small","The tracker is missing most objects"],"answer":[1],"explanation":"MOTA is dominated by detection errors and counts each identity switch once, so a tracker that detects well but reassigns identities constantly still scores respectably. IDF1 measures how consistently the right identity is held over a track's lifetime, which is exactly what has failed here.","tags":["mota","idf1","tracking-metrics","evaluation"],"ref":"https://arxiv.org/abs/1609.01775","domain":"video-tracking"},{"id":"VT-001","type":"single","difficulty":"medium","stem":"How does a Vision Transformer turn an image into a sequence?","choices":["It flattens the image into one long vector of pixels","It splits the image into fixed-size non-overlapping patches, flattens each, and linearly projects it into a token embedding","It uses a CNN to produce tokens","It converts the image to text"],"answer":[1],"explanation":"Patchifying is what makes attention tractable: a 224x224 image at 16x16 patches becomes 196 tokens rather than 50,176 pixels, since attention cost grows with the square of sequence length. Each patch is linearly projected to the model dimension, exactly as a word embedding would be.","tags":["vit","patch-embedding","tokenisation","sequence-length"],"ref":"https://arxiv.org/abs/2010.11929","domain":"vision-transformers"},{"id":"VT-002","type":"single","difficulty":"medium","stem":"Why does a ViT need positional embeddings when a CNN does not?","choices":["Because images are larger than text","Self-attention is permutation-invariant, so without position information the model would treat the patches as an unordered set","Because patches overlap","Because transformers cannot process colour"],"answer":[1],"explanation":"Convolution encodes spatial arrangement structurally — a kernel sees a specific neighbourhood. Attention treats tokens as a set, so shuffling patches would leave the representation unchanged. Positional embeddings restore the geometry that patchifying discarded.","tags":["positional-embedding","permutation-invariance","vit","spatial-structure"],"ref":"https://arxiv.org/abs/2010.11929","domain":"vision-transformers"},{"id":"VT-003","type":"single","difficulty":"hard","stem":"ViTs underperform CNNs when trained from scratch on small datasets. Why?","choices":["They have fewer parameters","CNNs build in locality and translation equivariance as inductive biases; a ViT must learn those from data, which takes far more of it","ViTs cannot use augmentation","Attention is numerically unstable at small scale"],"answer":[1],"explanation":"A convolution assumes nearby pixels are related and that a feature means the same thing anywhere — assumptions that are correct for images and free. A ViT starts with no such prior, so it needs either large-scale pretraining or heavy augmentation and regularisation to discover them.","tags":["inductive-bias","data-efficiency","vit-vs-cnn","scratch-training"],"ref":"https://arxiv.org/abs/2010.11929","domain":"vision-transformers"},{"id":"VT-004","type":"single","difficulty":"medium","stem":"What is the class token in a ViT for?","choices":["It stores the ground-truth label","A learnable token prepended to the patch sequence whose final representation is used as the whole-image embedding for classification","It marks the end of the sequence","It encodes the patch size"],"answer":[1],"explanation":"Borrowed from BERT's [CLS], it gives a position that belongs to no particular patch and can therefore aggregate across all of them through attention. Some later architectures drop it and use global average pooling over patch tokens instead, which works comparably.","tags":["class-token","cls","pooling","classification"],"ref":"https://arxiv.org/abs/2010.11929","domain":"vision-transformers"},{"id":"VT-005","type":"single","difficulty":"hard","stem":"What does Swin Transformer change to make ViTs practical for dense prediction?","choices":["It removes attention entirely","It computes attention within local windows and shifts those windows between layers, giving linear cost in image size plus a hierarchical multi-scale feature map","It uses larger patches","It replaces the decoder"],"answer":[1],"explanation":"Global attention over high-resolution feature maps is quadratic and unaffordable for detection or segmentation. Windowed attention makes cost linear, and shifting the window partition between consecutive blocks lets information cross window boundaries. The hierarchy then plugs into FPN-style heads like a CNN backbone.","tags":["swin","windowed-attention","hierarchical","dense-prediction"],"ref":"https://arxiv.org/abs/2103.14030","domain":"vision-transformers"},{"id":"VT-006","type":"single","difficulty":"medium","stem":"How is CLIP trained?","choices":["By classifying images into 1,000 ImageNet categories","Contrastively on image-text pairs: matching pairs are pulled together in a shared embedding space and mismatched pairs pushed apart","By predicting the next word of an image caption","By reconstructing masked image patches"],"answer":[1],"explanation":"Two encoders, one for images and one for text, are trained so that a photo and its caption land near each other. No fixed label set is ever defined, which is precisely what makes the resulting model able to recognise categories it was never explicitly trained on.","tags":["clip","contrastive-learning","image-text","shared-embedding"],"ref":"https://arxiv.org/abs/2103.00020","domain":"vision-transformers"},{"id":"VT-007","type":"single","difficulty":"medium","stem":"How does CLIP perform zero-shot classification?","choices":["It is fine-tuned on each new class","Candidate class names are embedded as text prompts and the image embedding is matched against them, so new classes need only a name","It generates a caption then parses it","It requires one labelled example per class"],"answer":[1],"explanation":"Because images and text share an embedding space, classification becomes nearest-neighbour retrieval against text embeddings of the candidate labels. Adding a class costs a string. Prompt wording measurably affects accuracy, which is why prompt ensembling is common.","tags":["zero-shot","clip","prompt","open-vocabulary"],"ref":"https://arxiv.org/abs/2103.00020","domain":"vision-transformers"},{"id":"VT-008","type":"multi","difficulty":"hard","stem":"Which TWO are genuine limitations of CLIP-style zero-shot recognition?","choices":["Performance depends heavily on how class names are phrased in the prompt","It reflects the biases and coverage gaps of its web-scraped training data, so fine-grained or specialist categories are often weak","It cannot process colour images","It requires the class list at training time"],"answer":[0,1],"explanation":"Prompt sensitivity and training-distribution coverage are the two practical failure modes. A specialist category absent from web text — a specific industrial defect, a rare species — has no useful text embedding to match against. The class list being needed only at inference is the whole point, not a limitation.","tags":["clip-limits","prompt-sensitivity","distribution-coverage","fine-grained"],"ref":"https://arxiv.org/abs/2103.00020","domain":"vision-transformers"},{"id":"VT-009","type":"single","difficulty":"medium","stem":"What is open-vocabulary detection?","choices":["Detecting an unlimited number of objects per image","Detecting object categories specified at inference by text rather than fixed at training by a closed label set","Detecting text in images","Detecting objects without any training"],"answer":[1],"explanation":"A conventional detector has a fixed head sized to its class list; adding a category means retraining. Open-vocabulary detectors align region features with text embeddings, so a new category is a new phrase at inference — enormously valuable when the taxonomy is fluid.","tags":["open-vocabulary","detection","text-conditioned","flexibility"],"ref":"https://arxiv.org/abs/2103.00020","domain":"vision-transformers"},{"id":"VT-010","type":"single","difficulty":"hard","stem":"What does self-supervised pretraining such as DINO or masked autoencoding give you?","choices":["Labels for free","Strong visual representations learned from unlabelled images, which then need far fewer labels to fine-tune for a downstream task","A complete classifier","Faster inference"],"answer":[1],"explanation":"The pretext task — matching views of the same image, or reconstructing masked patches — needs no annotation, so it can consume vastly more data than any labelled set. The learned features transfer, so the expensive labelled data is spent only on adaptation. That economics is why self-supervision matters in practice.","tags":["self-supervised","dino","masked-autoencoder","label-efficiency"],"ref":"https://arxiv.org/abs/2104.14294","domain":"vision-transformers"},{"id":"VT-011","type":"single","difficulty":"medium","stem":"In a masked autoencoder for images, what is the model trained to do?","choices":["Classify the masked patches","Reconstruct the pixel content of patches that were hidden from the encoder, forcing it to learn structure and context","Predict the next image in a sequence","Match the image to its caption"],"answer":[1],"explanation":"Masking a large fraction of patches — often 75% — and reconstructing them makes the task hard enough to require genuine understanding of object structure rather than local texture copying. The decoder is discarded after pretraining; only the encoder's representation is kept.","tags":["masked-autoencoder","reconstruction","pretext-task","self-supervised"],"ref":"https://arxiv.org/abs/2111.06377","domain":"vision-transformers"},{"id":"VT-012","type":"single","difficulty":"medium","stem":"How does a latent diffusion model reduce the cost of image generation?","choices":["By generating smaller images","By running the diffusion process in a compressed latent space produced by an autoencoder, rather than directly on high-resolution pixels","By using fewer denoising steps only","By generating in grayscale first"],"answer":[1],"explanation":"Diffusion needs many sequential denoising passes, and doing them at full pixel resolution is prohibitive. Compressing to a latent roughly 8x smaller per side cuts the work by more than an order of magnitude, with a decoder restoring pixels at the end. That is the key idea behind Stable Diffusion.","tags":["latent-diffusion","autoencoder","efficiency","image-generation"],"ref":"https://arxiv.org/abs/2112.10752","domain":"vision-transformers"},{"id":"VT-013","type":"single","difficulty":"hard","stem":"What does classifier-free guidance control in a conditional diffusion model?","choices":["The number of denoising steps","How strongly generation adheres to the conditioning prompt, by extrapolating between the conditional and unconditional predictions","The image resolution","The random seed"],"answer":[1],"explanation":"The model is trained both with and without conditioning, and at sampling the two predictions are combined with a scale factor. Higher guidance follows the prompt more literally at the cost of diversity and, past a point, visual artefacts — the classic quality-versus-fidelity dial.","tags":["classifier-free-guidance","diffusion","conditioning","sampling"],"ref":"https://arxiv.org/abs/2207.12598","domain":"vision-transformers"},{"id":"VT-014","type":"single","difficulty":"medium","stem":"Why is attention cost a bigger problem for images than for typical text?","choices":["Images use more colours","Token count scales with the square of image resolution while attention scales with the square of token count, so resolution enters at the fourth power","Images cannot be batched","Text tokens are smaller"],"answer":[1],"explanation":"Doubling image resolution quadruples patches, and quadrupling tokens raises attention cost sixteenfold. That compounding is why plain global attention is impractical for high-resolution vision and why windowed, hierarchical or linear-attention designs dominate dense prediction.","tags":["quadratic-attention","resolution-scaling","cost","efficiency"],"ref":"https://arxiv.org/abs/2103.14030","domain":"vision-transformers"},{"id":"VT-015","type":"multi","difficulty":"hard","stem":"You have 5,000 labelled images of an industrial part. Which TWO transformer-based approaches are sensible?","choices":["Fine-tune a self-supervised or ImageNet-pretrained ViT backbone rather than training one from scratch","Use a CLIP or DINO backbone as a frozen feature extractor and train a small head on top","Train a ViT from random initialisation on the 5,000 images","Use classifier-free guidance to generate labels"],"answer":[0,1],"explanation":"Five thousand images is far too few to teach a transformer the inductive biases a CNN gets for free, so the pretrained representation is the asset. Fine-tuning adapts it; freezing it and training a head is cheaper still and often competitive at this data scale. Guidance is a generation control, not a labelling method.","tags":["transfer-learning","frozen-features","small-data","vit"],"ref":"https://arxiv.org/abs/2104.14294","domain":"vision-transformers"},{"id":"VT-016","type":"single","difficulty":"medium","stem":"What practical advantage does a hybrid CNN-transformer backbone offer?","choices":["It removes the need for pretraining","Early convolutions supply locality and efficient downsampling while later attention layers model long-range relationships, combining the strengths of both","It uses less memory than either alone","It eliminates positional embeddings"],"answer":[1],"explanation":"Convolutions are efficient and carry useful priors at high resolution where attention is most expensive; attention excels once the sequence is short and global context is what remains to be modelled. Putting each where it is strongest is why hybrid designs are common in production backbones.","tags":["hybrid-architecture","cnn-transformer","locality","long-range"],"ref":"https://arxiv.org/abs/2103.14030","domain":"vision-transformers"},{"id":"VT-017","type":"single","difficulty":"hard","stem":"A ViT pretrained at 224x224 is fine-tuned at 384x384. What must be handled?","choices":["The patch size must change","The positional embeddings were learned for a fixed grid of patches and must be interpolated to the new grid size","The class token must be removed","The optimiser must be changed"],"answer":[1],"explanation":"A larger input at the same patch size yields more patches, so the learned position table no longer matches the grid. Bicubic interpolation of the positional embeddings to the new layout is the standard fix and is built into most implementations. Skipping it silently scrambles spatial information.","tags":["positional-interpolation","resolution-change","fine-tuning","vit"],"ref":"https://arxiv.org/abs/2010.11929","domain":"vision-transformers"},{"id":"VT-018","type":"single","difficulty":"medium","stem":"What makes attention maps attractive but unreliable as explanations?","choices":["They are too small to read","They show where the model attended, which is suggestive but not a faithful account of what caused the prediction — attention weight is not causal attribution","They are only available during training","They require a separate model"],"answer":[1],"explanation":"Attention is one component in a deep stack with residuals and MLPs, and high weight on a region does not establish that the region determined the output. Attention maps are a useful debugging signal; causal claims need intervention-based attribution methods.","tags":["attention-maps","interpretability","attribution","limitations"],"ref":"https://arxiv.org/abs/2010.11929","domain":"vision-transformers"},{"id":"VT-019","type":"single","difficulty":"medium","stem":"Why does a diffusion model need many sampling steps while a GAN generates in one forward pass?","choices":["Diffusion models are larger","Diffusion generates by iteratively reversing a noising process, so each step removes a little noise; a GAN's generator maps noise to an image in a single mapping","GANs use more memory","Diffusion requires text conditioning"],"answer":[1],"explanation":"The iterative structure is what gives diffusion its stability and sample quality — each step is a small, well-conditioned problem — and it is also why inference is slow. Step-distillation and improved solvers exist precisely to cut the step count.","tags":["diffusion","sampling","image-generation","iterative"],"ref":"https://arxiv.org/abs/2112.10752","domain":"vision-transformers"},{"id":"VT-020","type":"single","difficulty":"hard","stem":"Raising classifier-free guidance from 3 to 15 makes images match the prompt more literally but look oversaturated and strange. Why?","choices":["The model is broken at high values","Guidance extrapolates away from the unconditional prediction; pushed far enough the result leaves the region the model was trained to produce, trading diversity and realism for prompt adherence","The latent space is too small","The random seed changed"],"answer":[1],"explanation":"Guidance is an extrapolation, not an interpolation, so large scales move the prediction outside the learned distribution. The artefacts are the signature of over-extrapolation. Practical values sit in a narrow band, and the right one depends on the sampler and model.","tags":["classifier-free-guidance","conditioning","diffusion","sampling"],"ref":"https://arxiv.org/abs/2207.12598","domain":"vision-transformers"}],"cases":[],"cheats":{"title":"Applied Computer Vision cheat sheets","sections":[{"id":"pipeline-traps","title":"The traps that cost the most","kicker":"Every one of these has silently broken a production pipeline","blocks":[{"type":"table","head":["Trap","What happens"],"rows":[["BGR vs RGB","OpenCV loads BGR; models expect RGB. Nothing errors — accuracy just drops."],["uint8 overflow","200 + 100 = 44 in NumPy. cv2.add saturates at 255; plain + wraps."],["Aspect-ratio squash","Stretching to a square distorts every object. Letterbox instead."],["Forgetting the pad offset","Undo scale AND padding when mapping boxes back, or all boxes shift."],["Normalisation mismatch","Feeding 0-255 to a model trained on ImageNet-normalised input saturates it."],["EXIF orientation","PIL may rotate, cv2 does not. Same file, different pixels, different library."],["Mask interpolation","Bilinear on a label mask invents class 1.5. Always nearest-neighbour."],["Random split on video frames","Adjacent frames are near-duplicates. Group by video, patient or site."],["Preprocessing drift","Training and serving must resize, pad and normalise identically."]]},{"type":"note","text":"When a model is accurate in the notebook and poor in production with identical weights, it is almost always preprocessing parity. Compare intermediate tensors between the two paths before suspecting anything else."}]},{"id":"image-basics","title":"Image fundamentals","kicker":"8% of the track","blocks":[{"type":"table","head":["Operation","Use for"],"rows":[["HSV conversion","Colour thresholding under changing light — hue survives brightness change"],["Median filter","Salt-and-pepper noise; keeps edges sharp"],["Gaussian blur","General smoothing; separable, so two 1D passes; blurs edges too"],["Bilateral filter","Smoothing that preserves edges, at higher cost"],["Opening (erode then dilate)","Remove small bright specks, keep larger shapes"],["Closing (dilate then erode)","Fill small dark holes and gaps"],["CLAHE","Local contrast without amplifying noise in flat regions"],["Otsu threshold","Automatic global threshold when the histogram is bimodal"],["Adaptive threshold","Uneven illumination, where a single global value fails"]]},{"type":"table","head":["Resize direction","Interpolation"],"rows":[["Shrinking","INTER_AREA — averages the source block, avoids aliasing"],["Enlarging","INTER_LINEAR or INTER_CUBIC"],["Label masks","INTER_NEAREST — never blend class indices"]]},{"type":"bullets","items":["Affine: 6 DOF, 3 point pairs, preserves parallel lines. Homography: 8 DOF, 4 point pairs, maps a rectangle to any quadrilateral.","Grayscale uses weighted luma (~0.299R + 0.587G + 0.114B), not a flat average, because the eye weights green most.","Blur radius is relative to image scale. The same pixel kernel means different smoothing at different resolutions."]}]},{"id":"geometry","title":"Classical vision and geometry","kicker":"8% · still the right tool in controlled settings","blocks":[{"type":"table","head":["Concept","Detail"],"rows":[["Canny two thresholds","Hysteresis: high starts an edge, low extends it along connected pixels"],["NMS in Canny","Thins gradient ridges to one pixel. Different from NMS in detection."],["Aperture problem","An edge is ambiguous along its own direction; a corner pins both axes"],["RANSAC","Fits from random minimal subsets, keeps the model with most inliers. Survives gross outliers."],["Intrinsics","Focal length, principal point, skew: camera to pixel mapping"],["Extrinsics","Where the camera sits in the world"],["Radial distortion","Straight lines bow near edges. Calibrate and undistort before measuring."],["Rectification","Aligns epipolar lines with rows, turning 2D stereo search into 1D"],["Disparity","Depth = focal length x baseline / disparity. Far points have tiny disparity."],["Hough transform","Edge pixels vote in parameter space; robust to gaps and occlusion"]]},{"type":"note","text":"A homography is only valid for a planar scene or a purely rotating camera. Two viewpoints of a 3D scene produce parallax that no homography can explain — low inlier counts are the symptom."}]},{"id":"cnn","title":"Convolutional architectures","kicker":"12%","blocks":[{"type":"table","head":["Component","What it does"],"rows":[["Weight sharing","One kernel slides everywhere: few parameters, translation equivariance"],["Receptive field","Input region that can influence a unit; compounds with depth"],["Two 3x3 vs one 5x5","Same receptive field, fewer parameters, extra non-linearity"],["Stride 2","Downsample while convolving instead of pooling"],["Dilated convolution","Wider receptive field at no parameter cost, no resolution loss"],["1x1 convolution","Mixes channels at each position; cheap depth change"],["Depthwise separable","Per-channel spatial filter + 1x1 mixing. MobileNet's efficiency."],["Residual connection","Direct gradient path; makes very deep stacks trainable"],["BatchNorm","Batch stats in training, running stats at inference. eval() matters."],["GroupNorm","Normalises within an example; use when batches are tiny"],["Global average pooling","Replaces the flatten+dense head; tolerates variable input size"],["Feature pyramid (FPN)","Top-down path gives every scale both semantics and resolution"]]},{"type":"bullets","items":["Early layers learn generic edges and textures; later layers become task-specific. That is why transfer learning works and why you unfreeze from the top.","CNNs are translation-equivariant by construction, but not rotation-invariant — that must come from augmentation or the data.","EfficientNet: scale depth, width and resolution together, not one axis alone.","ReLU is the default because it does not saturate for positive inputs, so gradients survive depth."]}]},{"id":"training","title":"Training vision models","kicker":"12%","blocks":[{"type":"bullets","items":["An augmentation should simulate a variation you will actually meet. Vertical flip is wrong for street scenes (gravity fixes orientation) and fine for satellite imagery (no canonical up).","Detection augmentation must transform the boxes too, and handle boxes cropped away or made degenerate.","Mixup suits classification, where labels are class distributions. Detection uses mosaic instead — it composes spatially rather than blending.","Augment the training set only. Validation is a measurement instrument and must stay fixed.","Warmup ramps the learning rate up so early noisy gradients cannot destabilise training.","Mixed precision needs a loss scaler: small FP16 gradients would otherwise underflow to zero.","Gradient clipping caps the norm so one pathological batch cannot destroy the run.","Larger batch = less gradient noise, fewer steps per epoch. Scale the learning rate with it.","Sawtooth GPU utilisation means the data pipeline is starving the GPU, not that the model is slow."]},{"type":"table","head":["Symptom","Diagnosis"],"rows":[["Train loss falls, validation rises","Overfitting. Stop at the validation minimum; add data, augmentation or regularisation."],["Both plateau high from the start","Underfitting or a pipeline bug. Check labels, normalisation, learning rate before capacity."],["99% train / 55% val on a tiny set","Expected memorisation — but also check for leakage across the split."],["Background swamps the loss","Focal loss down-weights easy negatives so hard cases drive learning."]]}]},{"id":"detect","title":"Object detection","kicker":"14% · the heaviest topic","blocks":[{"type":"table","head":["Concept","Detail"],"rows":[["Two-stage","Propose regions, then classify and refine (Faster R-CNN)"],["One-stage","Predict boxes and classes densely in one pass (YOLO, RetinaNet)"],["Anchor","Preset box prior; the network predicts an offset from it"],["Anchor-free","Regress boundary distances or a centre heatmap; no anchor tuning (FCOS, CenterNet)"],["Objectness","Is anything here, separate from which class. Final score often multiplies the two."],["IoU","Intersection / union. Used in anchor assignment, NMS and evaluation — different thresholds, different meanings."],["NMS","Keep the top-scoring box, suppress overlaps above a threshold"],["Soft-NMS","Decay overlapping scores instead of deleting — for crowded scenes"],["mAP","Area under precision-recall per class, averaged. COCO also averages IoU 0.5:0.95."],["IoU loss","Optimises the overlap evaluation measures; scale-invariant, unlike L1 on coordinates"],["DETR","Set prediction with bipartite matching. No anchors, no NMS."],["Mosaic","Tiles four images: many scales and contexts per sample"]]},{"type":"note","text":"COCO mAP (IoU 0.5:0.95) is systematically lower than VOC mAP (IoU 0.5). Never compare the two numbers directly. And mAP averages over all thresholds, so it says nothing about the one operating point you will actually deploy at."},{"type":"table","head":["Failure","Likely cause"],"rows":[["Small objects missed","Resolution too low, or no shallow pyramid level assigned to small scales"],["High precision, low recall","Confidence threshold too high, or anchor priors do not match object shapes"],["Crowded objects deleted","NMS IoU threshold too aggressive — try Soft-NMS"],["Boxes consistently offset","Letterbox padding not undone when mapping back to original coordinates"],["Good on val, poor on a new camera","Domain shift: new viewpoint, scale distribution and lighting"]]}]},{"id":"segment","title":"Segmentation","kicker":"11%","blocks":[{"type":"table","head":["Type","What it produces"],"rows":[["Semantic","Class per pixel. Cannot separate two touching cars, so cannot count."],["Instance","Separate mask per object; traditionally ignores amorphous 'stuff'"],["Panoptic","Every pixel gets a class, and countable things also get an instance id"]]},{"type":"table","head":["Concept","Detail"],"rows":[["Encoder-decoder","Downsample for semantics, upsample to recover per-pixel resolution"],["U-Net skip connections","Carry high-resolution detail to the decoder; recover sharp boundaries"],["Checkerboard artefacts","Transposed conv with stride not dividing kernel size. Use resize-then-convolve."],["Dice loss","Region overlap; stays sensitive when foreground is tiny. Often summed with cross-entropy."],["mIoU","Per-class IoU averaged over classes — refuses to let big classes hide failures"],["Mask R-CNN","Faster R-CNN plus a per-region mask branch"],["RoIAlign","Bilinear sampling instead of quantised pooling; sub-pixel alignment for masks"],["ASPP","Parallel dilated convolutions at several rates for multi-scale context"],["SAM","Promptable, class-agnostic masks from a point, box or rough mask"]]},{"type":"note","text":"Dice = 2·IoU/(1+IoU). They rank models identically but report different numbers — 0.8 Dice is about 0.67 IoU. Check which a paper used before comparing."},{"type":"bullets","items":["97% pixel accuracy with 0.41 mIoU means a few large classes dominate the pixel count. Read the per-class table.","For images too large to fit in memory: tile with overlap, segment, blend the overlaps to avoid seams.","Binary threshold is rarely optimal at 0.5 under class imbalance. Sweep it on validation."]}]},{"id":"transformers","title":"Vision transformers and multimodal","kicker":"10%","blocks":[{"type":"table","head":["Concept","Detail"],"rows":[["Patch embedding","224x224 at 16x16 patches = 196 tokens, not 50,176 pixels"],["Positional embedding","Attention is permutation-invariant; patches need position restored"],["Class token","Prepended learnable token whose output represents the whole image"],["Inductive bias","CNNs get locality and translation equivariance free; ViTs must learn them from data"],["Swin","Windowed attention, shifted between layers: linear cost plus a hierarchy"],["CLIP","Contrastive image-text training in a shared embedding space"],["Zero-shot","Embed class names as text, match the image against them. New class = a string."],["Open-vocabulary detection","Categories specified by text at inference, not fixed at training"],["DINO / MAE","Self-supervised pretraining: strong features from unlabelled images"],["Latent diffusion","Denoise in a compressed latent space, not at pixel resolution"],["Classifier-free guidance","Dial between prompt adherence and diversity"]]},{"type":"note","text":"Attention cost scales with the square of token count, and token count scales with the square of resolution — so resolution enters at the fourth power. That single fact explains windowed, hierarchical and linear-attention designs."},{"type":"bullets","items":["Fine-tuning a ViT at a new resolution requires interpolating the positional embeddings to the new patch grid.","With a few thousand images, fine-tune or freeze a pretrained backbone. Never train a ViT from scratch at that scale.","Attention maps show where the model looked, not what caused the prediction. Suggestive, not causal."]}]},{"id":"video","title":"Video and tracking","kicker":"8%","blocks":[{"type":"table","head":["Concept","Detail"],"rows":[["Detect-and-track","Detect periodically, propagate cheaply between. Frames are highly redundant."],["Optical flow","Apparent per-pixel motion — conflates object motion, camera motion and lighting"],["Brightness constancy","Breaks under lighting change, specular highlights and occlusion"],["Sparse vs dense flow","Lucas-Kanade tracks keypoints; Farneback/learned give a full field"],["Association","Which detection is which existing track. Hungarian matching over a cost matrix."],["Kalman filter","Predicts next position, fuses with measurement, bridges brief gaps"],["Identity switch","Two tracks swap IDs when paths cross. Add appearance re-ID to fix."],["Re-ID embedding","Identity, not category, determines distance. Survives occlusion and camera changes."],["MOTA / IDF1","MOTA folds detection errors and switches together; IDF1 isolates identity consistency"]]},{"type":"bullets","items":["A tracker tuned at 30 FPS can fail at 5 FPS: objects move too far for IoU-based association or constant-velocity prediction.","Actions are defined by change over time — sitting down and standing up look identical in one frame.","Count on track identity crossing a line with direction and hysteresis, not on per-frame presence in a region.","In multi-camera pipelines, H.264 decode on CPU often costs more than inference. Decode on the GPU and batch across cameras."]}]},{"id":"data-eval","title":"Data and evaluation","kicker":"9%","blocks":[{"type":"bullets","items":["Inter-annotator agreement is a ceiling on measured performance. Where humans disagree, the ground truth is noise.","Annotation guidelines must state the occlusion rule and how to treat depictions — posters, screens, reflections.","Group splits by video, patient, site or session. Random splits leak near-duplicates.","ROC flatters imbalanced problems: FPR divides by a huge negative count. Use precision-recall.","Aggregate accuracy hides regressions in small but important slices. Report per class and per capture condition.","A confusion matrix tells you which classes are confused — often a taxonomy or guideline problem, not a model one.","0.812 vs 0.807 mAP on 400 images is noise. Check variance across seeds before declaring a winner.","Benchmark scores rank architectures; they do not predict your accuracy on your domain.","Keep a small regression suite of known-hard cases that once failed, and run it on every change.","Pseudo-labels inherit the teacher's systematic errors — and random spot-checking cannot see consistent errors."]},{"type":"table","head":["Shift","Meaning"],"rows":[["Covariate shift","Inputs change, task unchanged. New camera, lighting, season. The common one."],["Label shift","Class frequencies change between training and deployment"],["Concept drift","The relationship between input and label changes"]]}]},{"id":"deploy","title":"Deployment and edge","kicker":"8%","blocks":[{"type":"table","head":["Step","Detail"],"rows":[["ONNX","Interchange graph format: train anywhere, run on any compatible runtime"],["Tracing pitfall","Python control flow and computed shapes become constants. Declare dynamic axes and test several shapes."],["TensorRT engine","Kernel choices tuned to one GPU architecture. Not portable — rebuild per target."],["FP16","Floating exponent; no calibration needed"],["INT8","Needs a calibration pass over representative data to set per-tensor scales"],["Pruning","Remove channels, then fine-tune to recover. Structured pruning gives real speedups."],["Distillation","Small student matches a large teacher's soft outputs"]]},{"type":"note","text":"INT8 often preserves classification accuracy while hurting detection mAP: class decisions survive small perturbations because only the argmax matters, but box coordinates feed straight into IoU. Keep sensitive layers at higher precision."},{"type":"bullets","items":["Latency is one frame's time to result; throughput is frames per second in aggregate. Batching raises throughput and raises latency.","A single live camera cannot be batched without waiting for frames, which adds exactly the latency batching was meant to avoid.","Keep the frame on the GPU from decode through preprocessing to inference. Host round trips often cost more than the model.","A model benchmarked at 28 FPS alone may run at 9 FPS in the application: decode, NMS, drawing and encoding contend for the same compute.","Monitor input statistics — brightness, sharpness, detection counts — because vision models fail silently on drifted input.","Validate the exported or quantised model against the original on fixed inputs after every build."]}]},{"id":"glossary","title":"Acronyms","kicker":"Blank on one of these and you lose the question","blocks":[{"type":"table","head":["Term","Meaning"],"rows":[["ASPP","Atrous Spatial Pyramid Pooling — parallel dilated convolutions"],["CLAHE","Contrast Limited Adaptive Histogram Equalisation"],["CLIP","Contrastive Language-Image Pretraining"],["DETR","DEtection TRansformer — set prediction, no NMS"],["DOF","Degrees of freedom (affine 6, homography 8)"],["FPN","Feature Pyramid Network"],["FCOS","Fully Convolutional One-Stage detector — anchor-free"],["IoU","Intersection over Union"],["IDF1","Identity F1 — tracking identity consistency"],["MAE","Masked Autoencoder (self-supervised pretraining)"],["mAP","mean Average Precision"],["mIoU","mean Intersection over Union, averaged per class"],["MOT / MOTA","Multi-Object Tracking / MOT Accuracy"],["NMS","Non-Maximum Suppression"],["ONNX","Open Neural Network Exchange"],["RANSAC","RANdom SAmple Consensus"],["Re-ID","Re-Identification"],["RoI","Region of Interest"],["SAM","Segment Anything Model"],["SORT","Simple Online and Realtime Tracking"],["TTA","Test-Time Augmentation"],["ViT","Vision Transformer"]]}]}]},"cards":[{"id":"FC:pipeline-traps:0:0","deck":"pipeline-traps","deckName":"The traps that cost the most","column":"Trap","prompt":"BGR vs RGB","answer":"OpenCV loads BGR; models expect RGB. Nothing errors — accuracy just drops."},{"id":"FC:pipeline-traps:0:1","deck":"pipeline-traps","deckName":"The traps that cost the most","column":"Trap","prompt":"uint8 overflow","answer":"200 + 100 = 44 in NumPy. cv2.add saturates at 255; plain + wraps."},{"id":"FC:pipeline-traps:0:2","deck":"pipeline-traps","deckName":"The traps that cost the most","column":"Trap","prompt":"Aspect-ratio squash","answer":"Stretching to a square distorts every object. Letterbox instead."},{"id":"FC:pipeline-traps:0:3","deck":"pipeline-traps","deckName":"The traps that cost the most","column":"Trap","prompt":"Forgetting the pad offset","answer":"Undo scale AND padding when mapping boxes back, or all boxes shift."},{"id":"FC:pipeline-traps:0:4","deck":"pipeline-traps","deckName":"The traps that cost the most","column":"Trap","prompt":"Normalisation mismatch","answer":"Feeding 0-255 to a model trained on ImageNet-normalised input saturates it."},{"id":"FC:pipeline-traps:0:5","deck":"pipeline-traps","deckName":"The traps that cost the most","column":"Trap","prompt":"EXIF orientation","answer":"PIL may rotate, cv2 does not. Same file, different pixels, different library."},{"id":"FC:pipeline-traps:0:6","deck":"pipeline-traps","deckName":"The traps that cost the most","column":"Trap","prompt":"Mask interpolation","answer":"Bilinear on a label mask invents class 1.5. Always nearest-neighbour."},{"id":"FC:pipeline-traps:0:7","deck":"pipeline-traps","deckName":"The traps that cost the most","column":"Trap","prompt":"Random split on video frames","answer":"Adjacent frames are near-duplicates. Group by video, patient or site."},{"id":"FC:pipeline-traps:0:8","deck":"pipeline-traps","deckName":"The traps that cost the most","column":"Trap","prompt":"Preprocessing drift","answer":"Training and serving must resize, pad and normalise identically."},{"id":"FC:image-basics:0:0","deck":"image-basics","deckName":"Image fundamentals","column":"Operation","prompt":"HSV conversion","answer":"Colour thresholding under changing light — hue survives brightness change"},{"id":"FC:image-basics:0:1","deck":"image-basics","deckName":"Image fundamentals","column":"Operation","prompt":"Median filter","answer":"Salt-and-pepper noise; keeps edges sharp"},{"id":"FC:image-basics:0:2","deck":"image-basics","deckName":"Image fundamentals","column":"Operation","prompt":"Gaussian blur","answer":"General smoothing; separable, so two 1D passes; blurs edges too"},{"id":"FC:image-basics:0:3","deck":"image-basics","deckName":"Image fundamentals","column":"Operation","prompt":"Bilateral filter","answer":"Smoothing that preserves edges, at higher cost"},{"id":"FC:image-basics:0:4","deck":"image-basics","deckName":"Image fundamentals","column":"Operation","prompt":"Opening (erode then dilate)","answer":"Remove small bright specks, keep larger shapes"},{"id":"FC:image-basics:0:5","deck":"image-basics","deckName":"Image fundamentals","column":"Operation","prompt":"Closing (dilate then erode)","answer":"Fill small dark holes and gaps"},{"id":"FC:image-basics:0:6","deck":"image-basics","deckName":"Image fundamentals","column":"Operation","prompt":"CLAHE","answer":"Local contrast without amplifying noise in flat regions"},{"id":"FC:image-basics:0:7","deck":"image-basics","deckName":"Image fundamentals","column":"Operation","prompt":"Otsu threshold","answer":"Automatic global threshold when the histogram is bimodal"},{"id":"FC:image-basics:0:8","deck":"image-basics","deckName":"Image fundamentals","column":"Operation","prompt":"Adaptive threshold","answer":"Uneven illumination, where a single global value fails"},{"id":"FC:image-basics:1:0","deck":"image-basics","deckName":"Image fundamentals","column":"Resize direction","prompt":"Shrinking","answer":"INTER_AREA — averages the source block, avoids aliasing"},{"id":"FC:image-basics:1:1","deck":"image-basics","deckName":"Image fundamentals","column":"Resize direction","prompt":"Enlarging","answer":"INTER_LINEAR or INTER_CUBIC"},{"id":"FC:image-basics:1:2","deck":"image-basics","deckName":"Image fundamentals","column":"Resize direction","prompt":"Label masks","answer":"INTER_NEAREST — never blend class indices"},{"id":"FC:geometry:0:0","deck":"geometry","deckName":"Classical vision and geometry","column":"Concept","prompt":"Canny two thresholds","answer":"Hysteresis: high starts an edge, low extends it along connected pixels"},{"id":"FC:geometry:0:1","deck":"geometry","deckName":"Classical vision and geometry","column":"Concept","prompt":"NMS in Canny","answer":"Thins gradient ridges to one pixel. Different from NMS in detection."},{"id":"FC:geometry:0:2","deck":"geometry","deckName":"Classical vision and geometry","column":"Concept","prompt":"Aperture problem","answer":"An edge is ambiguous along its own direction; a corner pins both axes"},{"id":"FC:geometry:0:3","deck":"geometry","deckName":"Classical vision and geometry","column":"Concept","prompt":"RANSAC","answer":"Fits from random minimal subsets, keeps the model with most inliers. Survives gross outliers."},{"id":"FC:geometry:0:4","deck":"geometry","deckName":"Classical vision and geometry","column":"Concept","prompt":"Intrinsics","answer":"Focal length, principal point, skew: camera to pixel mapping"},{"id":"FC:geometry:0:5","deck":"geometry","deckName":"Classical vision and geometry","column":"Concept","prompt":"Extrinsics","answer":"Where the camera sits in the world"},{"id":"FC:geometry:0:6","deck":"geometry","deckName":"Classical vision and geometry","column":"Concept","prompt":"Radial distortion","answer":"Straight lines bow near edges. Calibrate and undistort before measuring."},{"id":"FC:geometry:0:7","deck":"geometry","deckName":"Classical vision and geometry","column":"Concept","prompt":"Rectification","answer":"Aligns epipolar lines with rows, turning 2D stereo search into 1D"},{"id":"FC:geometry:0:8","deck":"geometry","deckName":"Classical vision and geometry","column":"Concept","prompt":"Disparity","answer":"Depth = focal length x baseline / disparity. Far points have tiny disparity."},{"id":"FC:geometry:0:9","deck":"geometry","deckName":"Classical vision and geometry","column":"Concept","prompt":"Hough transform","answer":"Edge pixels vote in parameter space; robust to gaps and occlusion"},{"id":"FC:cnn:0:0","deck":"cnn","deckName":"Convolutional architectures","column":"Component","prompt":"Weight sharing","answer":"One kernel slides everywhere: few parameters, translation equivariance"},{"id":"FC:cnn:0:1","deck":"cnn","deckName":"Convolutional architectures","column":"Component","prompt":"Receptive field","answer":"Input region that can influence a unit; compounds with depth"},{"id":"FC:cnn:0:2","deck":"cnn","deckName":"Convolutional architectures","column":"Component","prompt":"Two 3x3 vs one 5x5","answer":"Same receptive field, fewer parameters, extra non-linearity"},{"id":"FC:cnn:0:3","deck":"cnn","deckName":"Convolutional architectures","column":"Component","prompt":"Stride 2","answer":"Downsample while convolving instead of pooling"},{"id":"FC:cnn:0:4","deck":"cnn","deckName":"Convolutional architectures","column":"Component","prompt":"Dilated convolution","answer":"Wider receptive field at no parameter cost, no resolution loss"},{"id":"FC:cnn:0:5","deck":"cnn","deckName":"Convolutional architectures","column":"Component","prompt":"1x1 convolution","answer":"Mixes channels at each position; cheap depth change"},{"id":"FC:cnn:0:6","deck":"cnn","deckName":"Convolutional architectures","column":"Component","prompt":"Depthwise separable","answer":"Per-channel spatial filter + 1x1 mixing. MobileNet's efficiency."},{"id":"FC:cnn:0:7","deck":"cnn","deckName":"Convolutional architectures","column":"Component","prompt":"Residual connection","answer":"Direct gradient path; makes very deep stacks trainable"},{"id":"FC:cnn:0:8","deck":"cnn","deckName":"Convolutional architectures","column":"Component","prompt":"BatchNorm","answer":"Batch stats in training, running stats at inference. eval() matters."},{"id":"FC:cnn:0:9","deck":"cnn","deckName":"Convolutional architectures","column":"Component","prompt":"GroupNorm","answer":"Normalises within an example; use when batches are tiny"},{"id":"FC:cnn:0:10","deck":"cnn","deckName":"Convolutional architectures","column":"Component","prompt":"Global average pooling","answer":"Replaces the flatten+dense head; tolerates variable input size"},{"id":"FC:cnn:0:11","deck":"cnn","deckName":"Convolutional architectures","column":"Component","prompt":"Feature pyramid (FPN)","answer":"Top-down path gives every scale both semantics and resolution"},{"id":"FC:training:1:0","deck":"training","deckName":"Training vision models","column":"Symptom","prompt":"Train loss falls, validation rises","answer":"Overfitting. Stop at the validation minimum; add data, augmentation or regularisation."},{"id":"FC:training:1:1","deck":"training","deckName":"Training vision models","column":"Symptom","prompt":"Both plateau high from the start","answer":"Underfitting or a pipeline bug. Check labels, normalisation, learning rate before capacity."},{"id":"FC:training:1:2","deck":"training","deckName":"Training vision models","column":"Symptom","prompt":"99% train / 55% val on a tiny set","answer":"Expected memorisation — but also check for leakage across the split."},{"id":"FC:training:1:3","deck":"training","deckName":"Training vision models","column":"Symptom","prompt":"Background swamps the loss","answer":"Focal loss down-weights easy negatives so hard cases drive learning."},{"id":"FC:detect:0:0","deck":"detect","deckName":"Object detection","column":"Concept","prompt":"Two-stage","answer":"Propose regions, then classify and refine (Faster R-CNN)"},{"id":"FC:detect:0:1","deck":"detect","deckName":"Object detection","column":"Concept","prompt":"One-stage","answer":"Predict boxes and classes densely in one pass (YOLO, RetinaNet)"},{"id":"FC:detect:0:2","deck":"detect","deckName":"Object detection","column":"Concept","prompt":"Anchor","answer":"Preset box prior; the network predicts an offset from it"},{"id":"FC:detect:0:3","deck":"detect","deckName":"Object detection","column":"Concept","prompt":"Anchor-free","answer":"Regress boundary distances or a centre heatmap; no anchor tuning (FCOS, CenterNet)"},{"id":"FC:detect:0:4","deck":"detect","deckName":"Object detection","column":"Concept","prompt":"Objectness","answer":"Is anything here, separate from which class. Final score often multiplies the two."},{"id":"FC:detect:0:5","deck":"detect","deckName":"Object detection","column":"Concept","prompt":"IoU","answer":"Intersection / union. Used in anchor assignment, NMS and evaluation — different thresholds, different meanings."},{"id":"FC:detect:0:6","deck":"detect","deckName":"Object detection","column":"Concept","prompt":"NMS","answer":"Keep the top-scoring box, suppress overlaps above a threshold"},{"id":"FC:detect:0:7","deck":"detect","deckName":"Object detection","column":"Concept","prompt":"Soft-NMS","answer":"Decay overlapping scores instead of deleting — for crowded scenes"},{"id":"FC:detect:0:8","deck":"detect","deckName":"Object detection","column":"Concept","prompt":"mAP","answer":"Area under precision-recall per class, averaged. COCO also averages IoU 0.5:0.95."},{"id":"FC:detect:0:9","deck":"detect","deckName":"Object detection","column":"Concept","prompt":"IoU loss","answer":"Optimises the overlap evaluation measures; scale-invariant, unlike L1 on coordinates"},{"id":"FC:detect:0:10","deck":"detect","deckName":"Object detection","column":"Concept","prompt":"DETR","answer":"Set prediction with bipartite matching. No anchors, no NMS."},{"id":"FC:detect:0:11","deck":"detect","deckName":"Object detection","column":"Concept","prompt":"Mosaic","answer":"Tiles four images: many scales and contexts per sample"},{"id":"FC:detect:2:0","deck":"detect","deckName":"Object detection","column":"Failure","prompt":"Small objects missed","answer":"Resolution too low, or no shallow pyramid level assigned to small scales"},{"id":"FC:detect:2:1","deck":"detect","deckName":"Object detection","column":"Failure","prompt":"High precision, low recall","answer":"Confidence threshold too high, or anchor priors do not match object shapes"},{"id":"FC:detect:2:2","deck":"detect","deckName":"Object detection","column":"Failure","prompt":"Crowded objects deleted","answer":"NMS IoU threshold too aggressive — try Soft-NMS"},{"id":"FC:detect:2:3","deck":"detect","deckName":"Object detection","column":"Failure","prompt":"Boxes consistently offset","answer":"Letterbox padding not undone when mapping back to original coordinates"},{"id":"FC:detect:2:4","deck":"detect","deckName":"Object detection","column":"Failure","prompt":"Good on val, poor on a new camera","answer":"Domain shift: new viewpoint, scale distribution and lighting"},{"id":"FC:segment:0:0","deck":"segment","deckName":"Segmentation","column":"Type","prompt":"Semantic","answer":"Class per pixel. Cannot separate two touching cars, so cannot count."},{"id":"FC:segment:0:1","deck":"segment","deckName":"Segmentation","column":"Type","prompt":"Instance","answer":"Separate mask per object; traditionally ignores amorphous 'stuff'"},{"id":"FC:segment:0:2","deck":"segment","deckName":"Segmentation","column":"Type","prompt":"Panoptic","answer":"Every pixel gets a class, and countable things also get an instance id"},{"id":"FC:segment:1:0","deck":"segment","deckName":"Segmentation","column":"Concept","prompt":"Encoder-decoder","answer":"Downsample for semantics, upsample to recover per-pixel resolution"},{"id":"FC:segment:1:1","deck":"segment","deckName":"Segmentation","column":"Concept","prompt":"U-Net skip connections","answer":"Carry high-resolution detail to the decoder; recover sharp boundaries"},{"id":"FC:segment:1:2","deck":"segment","deckName":"Segmentation","column":"Concept","prompt":"Checkerboard artefacts","answer":"Transposed conv with stride not dividing kernel size. Use resize-then-convolve."},{"id":"FC:segment:1:3","deck":"segment","deckName":"Segmentation","column":"Concept","prompt":"Dice loss","answer":"Region overlap; stays sensitive when foreground is tiny. Often summed with cross-entropy."},{"id":"FC:segment:1:4","deck":"segment","deckName":"Segmentation","column":"Concept","prompt":"mIoU","answer":"Per-class IoU averaged over classes — refuses to let big classes hide failures"},{"id":"FC:segment:1:5","deck":"segment","deckName":"Segmentation","column":"Concept","prompt":"Mask R-CNN","answer":"Faster R-CNN plus a per-region mask branch"},{"id":"FC:segment:1:6","deck":"segment","deckName":"Segmentation","column":"Concept","prompt":"RoIAlign","answer":"Bilinear sampling instead of quantised pooling; sub-pixel alignment for masks"},{"id":"FC:segment:1:7","deck":"segment","deckName":"Segmentation","column":"Concept","prompt":"ASPP","answer":"Parallel dilated convolutions at several rates for multi-scale context"},{"id":"FC:segment:1:8","deck":"segment","deckName":"Segmentation","column":"Concept","prompt":"SAM","answer":"Promptable, class-agnostic masks from a point, box or rough mask"},{"id":"FC:transformers:0:0","deck":"transformers","deckName":"Vision transformers and multimodal","column":"Concept","prompt":"Patch embedding","answer":"224x224 at 16x16 patches = 196 tokens, not 50,176 pixels"},{"id":"FC:transformers:0:1","deck":"transformers","deckName":"Vision transformers and multimodal","column":"Concept","prompt":"Positional embedding","answer":"Attention is permutation-invariant; patches need position restored"},{"id":"FC:transformers:0:2","deck":"transformers","deckName":"Vision transformers and multimodal","column":"Concept","prompt":"Class token","answer":"Prepended learnable token whose output represents the whole image"},{"id":"FC:transformers:0:3","deck":"transformers","deckName":"Vision transformers and multimodal","column":"Concept","prompt":"Inductive bias","answer":"CNNs get locality and translation equivariance free; ViTs must learn them from data"},{"id":"FC:transformers:0:4","deck":"transformers","deckName":"Vision transformers and multimodal","column":"Concept","prompt":"Swin","answer":"Windowed attention, shifted between layers: linear cost plus a hierarchy"},{"id":"FC:transformers:0:5","deck":"transformers","deckName":"Vision transformers and multimodal","column":"Concept","prompt":"CLIP","answer":"Contrastive image-text training in a shared embedding space"},{"id":"FC:transformers:0:6","deck":"transformers","deckName":"Vision transformers and multimodal","column":"Concept","prompt":"Zero-shot","answer":"Embed class names as text, match the image against them. New class = a string."},{"id":"FC:transformers:0:7","deck":"transformers","deckName":"Vision transformers and multimodal","column":"Concept","prompt":"Open-vocabulary detection","answer":"Categories specified by text at inference, not fixed at training"},{"id":"FC:transformers:0:8","deck":"transformers","deckName":"Vision transformers and multimodal","column":"Concept","prompt":"DINO / MAE","answer":"Self-supervised pretraining: strong features from unlabelled images"},{"id":"FC:transformers:0:9","deck":"transformers","deckName":"Vision transformers and multimodal","column":"Concept","prompt":"Latent diffusion","answer":"Denoise in a compressed latent space, not at pixel resolution"},{"id":"FC:transformers:0:10","deck":"transformers","deckName":"Vision transformers and multimodal","column":"Concept","prompt":"Classifier-free guidance","answer":"Dial between prompt adherence and diversity"},{"id":"FC:video:0:0","deck":"video","deckName":"Video and tracking","column":"Concept","prompt":"Detect-and-track","answer":"Detect periodically, propagate cheaply between. Frames are highly redundant."},{"id":"FC:video:0:1","deck":"video","deckName":"Video and tracking","column":"Concept","prompt":"Optical flow","answer":"Apparent per-pixel motion — conflates object motion, camera motion and lighting"},{"id":"FC:video:0:2","deck":"video","deckName":"Video and tracking","column":"Concept","prompt":"Brightness constancy","answer":"Breaks under lighting change, specular highlights and occlusion"},{"id":"FC:video:0:3","deck":"video","deckName":"Video and tracking","column":"Concept","prompt":"Sparse vs dense flow","answer":"Lucas-Kanade tracks keypoints; Farneback/learned give a full field"},{"id":"FC:video:0:4","deck":"video","deckName":"Video and tracking","column":"Concept","prompt":"Association","answer":"Which detection is which existing track. Hungarian matching over a cost matrix."},{"id":"FC:video:0:5","deck":"video","deckName":"Video and tracking","column":"Concept","prompt":"Kalman filter","answer":"Predicts next position, fuses with measurement, bridges brief gaps"},{"id":"FC:video:0:6","deck":"video","deckName":"Video and tracking","column":"Concept","prompt":"Identity switch","answer":"Two tracks swap IDs when paths cross. Add appearance re-ID to fix."},{"id":"FC:video:0:7","deck":"video","deckName":"Video and tracking","column":"Concept","prompt":"Re-ID embedding","answer":"Identity, not category, determines distance. Survives occlusion and camera changes."},{"id":"FC:video:0:8","deck":"video","deckName":"Video and tracking","column":"Concept","prompt":"MOTA / IDF1","answer":"MOTA folds detection errors and switches together; IDF1 isolates identity consistency"},{"id":"FC:data-eval:1:0","deck":"data-eval","deckName":"Data and evaluation","column":"Shift","prompt":"Covariate shift","answer":"Inputs change, task unchanged. New camera, lighting, season. The common one."},{"id":"FC:data-eval:1:1","deck":"data-eval","deckName":"Data and evaluation","column":"Shift","prompt":"Label shift","answer":"Class frequencies change between training and deployment"},{"id":"FC:data-eval:1:2","deck":"data-eval","deckName":"Data and evaluation","column":"Shift","prompt":"Concept drift","answer":"The relationship between input and label changes"},{"id":"FC:deploy:0:0","deck":"deploy","deckName":"Deployment and edge","column":"Step","prompt":"ONNX","answer":"Interchange graph format: train anywhere, run on any compatible runtime"},{"id":"FC:deploy:0:1","deck":"deploy","deckName":"Deployment and edge","column":"Step","prompt":"Tracing pitfall","answer":"Python control flow and computed shapes become constants. Declare dynamic axes and test several shapes."},{"id":"FC:deploy:0:2","deck":"deploy","deckName":"Deployment and edge","column":"Step","prompt":"TensorRT engine","answer":"Kernel choices tuned to one GPU architecture. Not portable — rebuild per target."},{"id":"FC:deploy:0:3","deck":"deploy","deckName":"Deployment and edge","column":"Step","prompt":"FP16","answer":"Floating exponent; no calibration needed"},{"id":"FC:deploy:0:4","deck":"deploy","deckName":"Deployment and edge","column":"Step","prompt":"INT8","answer":"Needs a calibration pass over representative data to set per-tensor scales"},{"id":"FC:deploy:0:5","deck":"deploy","deckName":"Deployment and edge","column":"Step","prompt":"Pruning","answer":"Remove channels, then fine-tune to recover. Structured pruning gives real speedups."},{"id":"FC:deploy:0:6","deck":"deploy","deckName":"Deployment and edge","column":"Step","prompt":"Distillation","answer":"Small student matches a large teacher's soft outputs"},{"id":"FC:glossary:0:0","deck":"glossary","deckName":"Acronyms","column":"Term","prompt":"ASPP","answer":"Atrous Spatial Pyramid Pooling — parallel dilated convolutions"},{"id":"FC:glossary:0:1","deck":"glossary","deckName":"Acronyms","column":"Term","prompt":"CLAHE","answer":"Contrast Limited Adaptive Histogram Equalisation"},{"id":"FC:glossary:0:2","deck":"glossary","deckName":"Acronyms","column":"Term","prompt":"CLIP","answer":"Contrastive Language-Image Pretraining"},{"id":"FC:glossary:0:3","deck":"glossary","deckName":"Acronyms","column":"Term","prompt":"DETR","answer":"DEtection TRansformer — set prediction, no NMS"},{"id":"FC:glossary:0:4","deck":"glossary","deckName":"Acronyms","column":"Term","prompt":"DOF","answer":"Degrees of freedom (affine 6, homography 8)"},{"id":"FC:glossary:0:5","deck":"glossary","deckName":"Acronyms","column":"Term","prompt":"FPN","answer":"Feature Pyramid Network"},{"id":"FC:glossary:0:6","deck":"glossary","deckName":"Acronyms","column":"Term","prompt":"FCOS","answer":"Fully Convolutional One-Stage detector — anchor-free"},{"id":"FC:glossary:0:7","deck":"glossary","deckName":"Acronyms","column":"Term","prompt":"IoU","answer":"Intersection over Union"},{"id":"FC:glossary:0:8","deck":"glossary","deckName":"Acronyms","column":"Term","prompt":"IDF1","answer":"Identity F1 — tracking identity consistency"},{"id":"FC:glossary:0:9","deck":"glossary","deckName":"Acronyms","column":"Term","prompt":"MAE","answer":"Masked Autoencoder (self-supervised pretraining)"},{"id":"FC:glossary:0:10","deck":"glossary","deckName":"Acronyms","column":"Term","prompt":"mAP","answer":"mean Average Precision"},{"id":"FC:glossary:0:11","deck":"glossary","deckName":"Acronyms","column":"Term","prompt":"mIoU","answer":"mean Intersection over Union, averaged per class"},{"id":"FC:glossary:0:12","deck":"glossary","deckName":"Acronyms","column":"Term","prompt":"MOT / MOTA","answer":"Multi-Object Tracking / MOT Accuracy"},{"id":"FC:glossary:0:13","deck":"glossary","deckName":"Acronyms","column":"Term","prompt":"NMS","answer":"Non-Maximum Suppression"},{"id":"FC:glossary:0:14","deck":"glossary","deckName":"Acronyms","column":"Term","prompt":"ONNX","answer":"Open Neural Network Exchange"},{"id":"FC:glossary:0:15","deck":"glossary","deckName":"Acronyms","column":"Term","prompt":"RANSAC","answer":"RANdom SAmple Consensus"},{"id":"FC:glossary:0:16","deck":"glossary","deckName":"Acronyms","column":"Term","prompt":"Re-ID","answer":"Re-Identification"},{"id":"FC:glossary:0:17","deck":"glossary","deckName":"Acronyms","column":"Term","prompt":"RoI","answer":"Region of Interest"},{"id":"FC:glossary:0:18","deck":"glossary","deckName":"Acronyms","column":"Term","prompt":" function conceptStats() {
  const out = {};
  for (const c of (DATA.concepts || [])) out[c.id] = { bank: 0, attempts: 0, correct: 0 };
  for (const q of DATA.questions) {
    const rec = progress.q[q.id];
    for (const cid of conceptsOf(q)) {
      const st = out[cid];
      st.bank += 1;
      if (rec?.seen) { st.attempts += rec.seen; st.correct += rec.correct; }
    }
  }
  for (const st of Object.values(out)) st.acc = st.attempts ? st.correct / st.attempts : null;
  return out;
}

/* Rank weak concepts by what they cost on the exam: gap x domain weight. */
function weakConcepts(limit = 6) {
  const st = conceptStats();
  const w = Object.fromEntries(DATA.domains.map(d => [d.id, d.weight]));
  return (DATA.concepts || [])
    .filter(c => st[c.id].attempts >= MIN_ATTEMPTS && st[c.id].acc < PASS)
    .map(c => ({ c, st: st[c.id], impact: (1 - st[c.id].acc) * (w[c.domain] || 5) }))
    .sort((a, b) => b.impact - a.impact)
    .slice(0, limit);
}

const WEIGHT_TOTAL = DATA.domains.reduce((s, d) => s + d.weight, 0);
