<title>Computer Vision Console</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  /* Gama Core design tokens */
  --ground:#FFFFFF; --surface:#F4F6FA; --surface-2:#EAEDF4; --raise:#FFFFFF; --sunk:#E1E6F0;
  --ink:#12172B; --ink-2:#39415C; --muted:#565F78; --faint:#8890A6;
  --line:rgba(18,23,43,0.10); --line-2:rgba(18,23,43,0.20);
  --red:#C5184B; --red-dim:#EFB8C7; --red-wash:#FBEDF1;
  --accent:#1D98D6; --accent-soft:#E2F1FA;
  --pass:#12805C; --pass-bg:#E3F3ED;
  --warn:#B9740C; --warn-bg:#FBF0DF; --ochre:#B9740C;
  --fail:#C5184B; --fail-bg:#FBEDF1;
  --glow:rgba(29,152,214,0.10);
  --shadow:0 1px 2px rgba(18,23,43,.05), 0 10px 30px -18px rgba(18,23,43,.22);
  --display:"Space Grotesk","Helvetica Neue",Arial,sans-serif;
  --sans:"Inter","Helvetica Neue",Arial,sans-serif;
  --read:"Inter","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:3px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0D1120; --surface:#151B2E; --surface-2:#1D2440; --raise:#1D2440; --sunk:#0A0E1A;
    --ink:#E9EDF8; --ink-2:#C2C9DC; --muted:#A3ABC4; --faint:#6E7895;
    --line:rgba(233,237,248,0.10); --line-2:rgba(233,237,248,0.22);
    --red:#FF2E63; --red-dim:#7C3050; --red-wash:#2A1020;
    --accent:#4FB8F0; --accent-soft:#12283C;
    --pass:#3FBF8F; --pass-bg:#0E2A22;
    --warn:#E0A33C; --warn-bg:#2C2113; --ochre:#E0A33C;
    --fail:#FF2E63; --fail-bg:#2A1020;
    --glow:rgba(79,184,240,0.12);
    --shadow:0 1px 2px rgba(0,0,0,.45), 0 12px 32px -18px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --ground:#0D1120; --surface:#151B2E; --surface-2:#1D2440; --raise:#1D2440; --sunk:#0A0E1A;
  --ink:#E9EDF8; --ink-2:#C2C9DC; --muted:#A3ABC4; --faint:#6E7895;
  --line:rgba(233,237,248,0.10); --line-2:rgba(233,237,248,0.22);
  --red:#FF2E63; --red-dim:#7C3050; --red-wash:#2A1020;
  --accent:#4FB8F0; --accent-soft:#12283C;
  --pass:#3FBF8F; --pass-bg:#0E2A22;
  --warn:#E0A33C; --warn-bg:#2C2113; --ochre:#E0A33C;
  --fail:#FF2E63; --fail-bg:#2A1020;
  --glow:rgba(79,184,240,0.12);
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 12px 32px -18px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{margin:0; font-family:var(--display); font-weight:600; letter-spacing:-.015em; text-wrap:balance}
p{margin:0}
button{font:inherit; color:inherit; cursor:pointer; border:0; background:none}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:2px}
.mono{font-family:var(--mono); font-variant-numeric:tabular-nums}
.eyebrow{
  font-family:var(--mono); font-size:10.5px; font-weight:600; letter-spacing:.16em;
  text-transform:uppercase; color:var(--red);
}

/* ---------- shell ---------- */
.topbar{
  position:sticky; top:env(safe-area-inset-top, 0px); z-index:20;
  background:var(--ground);
  background:color-mix(in srgb, var(--ground) 88%, transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.topbar-in{
  max-width:1180px; margin:0 auto; padding:12px 20px;
  display:flex; align-items:center; gap:18px; flex-wrap:wrap;
}
.brand{
  display:flex; align-items:center; gap:11px; margin-right:auto; min-width:0;
  text-decoration:none; color:inherit;
}
.brand:hover .name b{color:var(--red)}
.brand svg{width:32px; height:32px; flex:0 0 32px; display:block}
.brand .name{display:flex; flex-direction:column; line-height:1.15; min-width:0}
.brand .name b{font-family:var(--display); font-size:15px; font-weight:600; letter-spacing:-.02em; transition:color .15s}
.brand .name span{
  font-family:var(--mono); font-size:9.5px; font-weight:500; letter-spacing:.15em;
  text-transform:uppercase; color:var(--muted); white-space:nowrap;
}
.code{
  font-family:var(--mono); font-size:10.5px; font-weight:600; color:var(--red);
  border:1px solid var(--red); padding:2px 7px; border-radius:2px; letter-spacing:.06em;
}
@media (max-width:560px){ .brand .name span{display:none} }
.tabs{display:flex; gap:2px; flex-wrap:wrap}
.tab{
  font-family:var(--mono); font-size:11px; font-weight:500; letter-spacing:.09em;
  text-transform:uppercase; padding:6px 11px; border-radius:var(--r); color:var(--muted);
  transition:color .15s, background .15s; min-height:32px;
}
@media (max-width:640px){
  .tab{min-height:40px; padding:11px 12px; font-size:11.5px}
  .tabs{gap:1px; width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch}
  .btn{min-height:42px; padding:11px 16px}
  .choice{padding:14px 14px}
  .navcell{min-height:36px}
}
.tab:hover{color:var(--ink); background:var(--surface)}
.tab[aria-current="true"]{color:var(--ink); background:var(--surface); box-shadow:inset 0 0 0 1px var(--line-2)}

.wrap{max-width:1180px; margin:0 auto; padding:22px 20px 64px; overflow-x:clip}
/* align-items:start would size the rail's grid area to the panel's own height,
   leaving position:sticky with no travel. Stretch gives it the full row. */
.cols{display:grid; grid-template-columns:302px minmax(0,1fr); gap:26px; align-items:stretch}
.cols > *{min-width:0}
@media (max-width:900px){ .cols{grid-template-columns:1fr; gap:18px} }

.panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--r)}
.panel-hd{padding:13px 16px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px}
.panel-bd{padding:16px}

/* ---------- readiness rail ---------- */
.rail{position:sticky; top:calc(env(safe-area-inset-top, 0px) + 62px)}
@media (max-width:900px){ .rail{position:static} }

.gauge{padding:16px; border-bottom:1px solid var(--line)}
.gauge-val{display:flex; align-items:baseline; gap:8px; margin:6px 0 10px}
.gauge-val b{font-family:var(--mono); font-size:38px; font-weight:600; text-transform:uppercase; letter-spacing:-.03em; line-height:1}
.gauge-val span{font-family:var(--mono); font-size:11px; color:var(--muted)}
.meter{height:9px; background:var(--sunk); border-radius:1px; position:relative; overflow:hidden}
.meter i{display:block; height:100%; background:var(--accent)}
.meter::after{
  content:""; position:absolute; inset:0; pointer-events:none;
  background:repeating-linear-gradient(90deg, transparent 0 calc(10% - 1px), var(--surface) calc(10% - 1px) 10%);
}
.meter.pass i{background:var(--pass)} .meter.warn i{background:var(--warn)} .meter.fail i{background:var(--fail)}
.gauge-note{margin-top:8px; font-size:12px; color:var(--muted); line-height:1.4}

.doms{list-style:none; margin:0; padding:6px 0}
.dom{display:block; width:100%; text-align:left; padding:8px 16px; border-radius:0}
.dom:hover{background:var(--surface-2)}
.dom-top{display:flex; align-items:baseline; gap:8px}
.dom-wt{font-family:var(--mono); font-size:11px; font-weight:700; color:var(--accent); min-width:26px}
.dom-nm{font-family:var(--display); font-size:12.5px; font-weight:500; line-height:1.3; flex:1; letter-spacing:-.01em}
.dom-sc{font-family:var(--mono); font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums}
.dom .meter{height:5px; margin-top:5px; margin-left:34px}

/* ---------- home ---------- */
.hero{padding:26px 24px 24px; position:relative; overflow:hidden}
.hero::before{
  content:""; position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(60% 52% at 50% 0%, var(--glow), transparent 72%);
}
.hero > *{position:relative}
.hero h1{
  font-family:var(--display); font-weight:600;
  font-size:clamp(27px,3.6vw,40px); line-height:1.06; letter-spacing:-.015em; max-width:21ch;
}
.hero p{margin-top:14px; font-size:16px; line-height:1.6; color:var(--muted); max-width:62ch}
.facts{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(112px,1fr));
  border-top:1px solid var(--line);
}
.fact{padding:12px 16px; border-right:1px solid var(--line)}
.fact:last-child{border-right:0}
.fact b{display:block; font-family:var(--mono); font-size:19px; font-weight:600; margin-top:4px; letter-spacing:-.02em; color:var(--ink)}
.fact small{font-family:var(--mono); font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint)}

.modes{display:grid; grid-template-columns:repeat(auto-fit,minmax(224px,1fr)); gap:12px; margin-top:18px}
.mode{
  background:var(--raise); border:1px solid var(--line); border-radius:var(--r);
  padding:16px 17px; text-align:left; display:flex; flex-direction:column; gap:6px;
  transition:border-color .18s, transform .18s, box-shadow .18s;
}
.mode:hover{border-color:var(--line-2); transform:translateY(-1px); box-shadow:var(--shadow)}
.mode.primary{background:var(--red); color:#FFFFFF; border-color:var(--red)}
.mode.primary .mode-sub, .mode.primary .mode-meta{color:rgba(255,255,255,.82)}
.mode.primary:hover{box-shadow:0 10px 26px -12px var(--red)}
.mode-nm{font-family:var(--display); font-size:16px; font-weight:600; letter-spacing:-.015em}
.mode-sub{font-size:12.5px; color:var(--muted); line-height:1.4}
.mode-meta{font-family:var(--mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; opacity:.8}
.mode:disabled{opacity:.45; cursor:not-allowed; transform:none; border-color:var(--line)}

.history{margin-top:18px}
.htable{width:100%; border-collapse:collapse; font-family:var(--mono); font-size:12px}
.htable th{
  text-align:left; font-size:10px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--muted); font-weight:700; padding:0 10px 6px; border-bottom:1px solid var(--line);
}
.htable td{padding:7px 10px; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums}
.htable tr:last-child td{border-bottom:0}
.pill{
  font-family:var(--mono); font-size:10px; font-weight:700; letter-spacing:.08em;
  text-transform:uppercase; padding:2px 6px; border-radius:2px;
}
.pill.pass{background:var(--pass-bg); color:var(--pass)}
.pill.fail{background:var(--fail-bg); color:var(--fail)}

/* ---------- quiz ---------- */
.qhead{display:flex; align-items:center; gap:14px; flex-wrap:wrap}
.qhead .eyebrow{white-space:nowrap}
.clock{
  margin-left:auto; font-family:var(--mono); font-size:15px; font-weight:700;
  font-variant-numeric:tabular-nums; letter-spacing:.02em;
}
.clock.low{color:var(--fail)}
.qprog{height:2px; background:var(--sunk)}
.qprog i{display:block; height:100%; background:var(--accent); transition:width .25s}
.stem{font-family:var(--read); font-size:17.5px; line-height:1.52; margin:4px 0 4px; max-width:66ch}
.stem-multi{margin-top:10px; font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--ochre)}
.choices{display:flex; flex-direction:column; gap:8px; margin-top:16px}
.choice{
  display:flex; gap:12px; align-items:flex-start; text-align:left;
  padding:12px 14px; border:1px solid var(--line); border-radius:var(--r);
  background:var(--raise); transition:border-color .14s, background .14s;
}
.choice:hover:not(:disabled){border-color:var(--line-2); background:var(--surface-2)}
.choice-k{
  font-family:var(--mono); font-size:12px; font-weight:700; line-height:1.55;
  width:20px; height:20px; flex:0 0 20px; display:grid; place-items:center;
  border:1px solid var(--line-2); border-radius:2px; margin-top:1px; color:var(--muted);
}
.choice-t{font-family:var(--read); font-size:15.5px; line-height:1.45}
.choice[aria-pressed="true"]{border-color:var(--accent); background:var(--accent-soft)}
.choice[aria-pressed="true"] .choice-k{background:var(--accent); border-color:var(--accent); color:var(--surface)}
.choice.right{border-color:var(--pass); background:var(--pass-bg)}
.choice.right .choice-k{background:var(--pass); border-color:var(--pass); color:var(--surface)}
.choice.wrong{border-color:var(--fail); background:var(--fail-bg)}
.choice.wrong .choice-k{background:var(--fail); border-color:var(--fail); color:var(--surface)}
.choice:disabled{cursor:default}

.verdict{margin-top:18px; border-top:1px solid var(--line); padding-top:14px}
.verdict-hd{display:flex; align-items:center; gap:10px; font-weight:800; font-size:14px}
.verdict-hd.ok{color:var(--pass)} .verdict-hd.no{color:var(--fail)}
.expl{font-family:var(--read); font-size:15.5px; line-height:1.55; margin-top:9px; color:var(--ink-2); max-width:68ch}
.qmeta{margin-top:12px; display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.tagchip{font-family:var(--mono); font-size:10px; color:var(--muted); border:1px solid var(--line); padding:1px 5px; border-radius:2px}
.reflink{font-family:var(--mono); font-size:11px; color:var(--accent); text-decoration:none; border-bottom:1px solid var(--accent-soft)}
.reflink:hover{border-bottom-color:var(--accent)}

.qbar{display:flex; gap:8px; align-items:center; padding:13px 16px; border-top:1px solid var(--line); flex-wrap:wrap}
.btn{
  font-family:var(--sans); font-size:13px; font-weight:600; letter-spacing:0;
  text-transform:none; padding:9px 16px; border-radius:var(--r);
  border:1px solid var(--line-2); background:var(--raise); color:var(--ink);
  transition:all .18s ease;
}
.btn:hover:not(:disabled){border-color:var(--ink); background:var(--surface-2)}
.btn:disabled{opacity:.4; cursor:not-allowed}
.btn.go{background:var(--red); color:#FFFFFF; border-color:var(--red)}
.btn.go:hover:not(:disabled){background:var(--red); border-color:var(--red); box-shadow:0 8px 20px -10px var(--red)}
.btn.flag[aria-pressed="true"]{background:var(--warn-bg); border-color:var(--warn); color:var(--warn)}
.spacer{margin-left:auto}

/* navigator */
.navgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(31px,1fr)); gap:4px; padding:14px 16px}
.navcell{
  font-family:var(--mono); font-size:11px; font-weight:500; aspect-ratio:1;
  border:1px solid var(--line); border-radius:2px; background:var(--surface-2);
  display:grid; place-items:center; position:relative; color:var(--muted);
}
.navcell.done{background:var(--accent-soft); border-color:var(--accent); color:var(--ink)}
.navcell.flag::after{
  content:""; position:absolute; top:-1px; right:-1px; width:6px; height:6px;
  background:var(--warn); border-radius:0 2px 0 100%;
}
.navcell.here{outline:2px solid var(--ink); outline-offset:1px; color:var(--ink); font-weight:700}
.navkey{display:flex; gap:12px; flex-wrap:wrap; padding:0 16px 14px; font-family:var(--mono); font-size:10px; color:var(--muted)}
.navkey i{display:inline-block; width:9px; height:9px; border:1px solid var(--line); margin-right:4px; vertical-align:-1px}
.navkey i.d{background:var(--accent-soft); border-color:var(--accent)}
.navkey i.f{background:var(--warn)}

/* ---------- report ---------- */
.score{display:flex; align-items:flex-end; gap:20px; flex-wrap:wrap; padding:20px 22px}
.score-n{font-family:var(--mono); font-size:56px; font-weight:600; line-height:.9; letter-spacing:-.04em}
.score-side{display:flex; flex-direction:column; gap:3px; padding-bottom:4px}
.dtable{width:100%; border-collapse:collapse}
.dtable th{
  text-align:left; font-family:var(--mono); font-size:10px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--muted); font-weight:700;
  padding:0 12px 7px; border-bottom:1px solid var(--line);
}
.dtable td{padding:9px 12px; border-bottom:1px solid var(--line); vertical-align:middle}
.dtable tr:last-child td{border-bottom:0}
.dtable .nm{font-family:var(--display); font-size:13.5px; font-weight:500; letter-spacing:-.01em}
.dtable .num{font-family:var(--mono); font-size:12px; font-variant-numeric:tabular-nums; white-space:nowrap}
.dtable td.mt{width:38%; min-width:120px}
.missed{list-style:none; margin:0; padding:0; display:flex; flex-direction:column}
.missed li{border-bottom:1px solid var(--line)}
.missed li:last-child{border-bottom:0}
.missed button{display:flex; gap:12px; width:100%; text-align:left; padding:11px 16px; align-items:baseline}
.missed button:hover{background:var(--surface-2)}
.missed .id{font-family:var(--mono); font-size:11px; font-weight:700; color:var(--fail); flex:0 0 58px}
.missed .tx{font-family:var(--read); font-size:14px; line-height:1.4; color:var(--ink-2)}
.next{padding:4px 0}
.next-item{padding:12px 16px; border-bottom:1px solid var(--line)}
.next-item:last-child{border-bottom:0}
.next-hd{display:flex; align-items:baseline; gap:9px}
.next-hd b{font-size:13.5px; font-weight:700}
.next-hd .mono{font-size:11px; color:var(--muted)}
.next-sc{font-family:var(--read); font-size:13.5px; color:var(--ink-2); margin-top:4px; line-height:1.45}

/* ---------- cram ---------- */
.cram-dom{border-bottom:1px solid var(--line)}
.cram-dom:last-child{border-bottom:0}
.cram-hd{display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:13px 16px}
.cram-hd:hover{background:var(--surface-2)}
.cram-hd b{font-size:14px; font-weight:700; flex:1}
.cram-body{padding:0 16px 16px; display:flex; flex-direction:column; gap:18px}
.cram-q{border-left:2px solid var(--line); padding-left:14px}
.cram-q .id{font-family:var(--mono); font-size:10.5px; font-weight:700; color:var(--muted); letter-spacing:.06em}
.cram-q .qs{font-family:var(--read); font-size:15px; line-height:1.45; margin-top:4px}
.cram-q .ans{font-family:var(--read); font-size:14.5px; line-height:1.45; margin-top:8px; color:var(--pass); font-weight:600}
.cram-q .ex{font-family:var(--read); font-size:14px; line-height:1.5; margin-top:6px; color:var(--muted)}

/* concepts */
.cx{list-style:none; margin:0; padding:0}
.cx li{border-bottom:1px solid var(--line); padding:12px 16px}
.cx li:last-child{border-bottom:0}
.cx .hd{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
.cx .nm{font-family:var(--display); font-size:14px; font-weight:600; letter-spacing:-.01em}
.cx .sc{font-family:var(--mono); font-size:11px; font-variant-numeric:tabular-nums; color:var(--muted)}
.cx .sm{font-family:var(--read); font-size:13.5px; color:var(--ink-2); line-height:1.45; margin-top:4px; max-width:74ch}
.cx .acts{display:flex; gap:7px; margin-top:9px; flex-wrap:wrap}
.cx .meter{margin-top:8px; max-width:200px}
.btn.sm{font-size:10.5px; padding:5px 9px}
/* case scenario + flashcards */
.scenario{
  border-left:2px solid var(--accent); background:var(--accent-soft);
  padding:13px 16px; margin-bottom:16px; border-radius:0 var(--r) var(--r) 0;
}
.scenario .tag{
  font-family:var(--mono); font-size:9.5px; font-weight:600; letter-spacing:.14em;
  text-transform:uppercase; color:var(--accent); display:block; margin-bottom:6px;
}
.scenario p{font-family:var(--read); font-size:14.5px; line-height:1.5; color:var(--ink)}
.caselist{list-style:none; margin:0; padding:0}
.caselist li{border-bottom:1px solid var(--line)}
.caselist li:last-child{border-bottom:0}
.caselist button{display:block; width:100%; text-align:left; padding:13px 16px}
.caselist button:hover{background:var(--surface-2)}
.caselist .t{display:flex; align-items:baseline; gap:10px}
.caselist .t b{font-family:var(--display); font-size:14.5px; font-weight:600; letter-spacing:-.01em}
.caselist .sc{font-family:var(--read); font-size:13.5px; color:var(--muted); line-height:1.45; margin-top:4px; max-width:78ch}
.card{padding:30px 22px; text-align:center; min-height:190px; display:flex; flex-direction:column; justify-content:center; gap:14px}
.card .col{font-family:var(--mono); font-size:10px; letter-spacing:.11em; text-transform:uppercase; color:var(--muted)}
.card .pr{font-family:var(--display); font-weight:500; font-size:22px; line-height:1.3; max-width:44ch; margin:0 auto; text-wrap:balance; letter-spacing:-.01em}
.card .an{font-family:var(--read); font-size:17px; line-height:1.45; color:var(--pass); max-width:52ch; margin:0 auto; border-top:1px solid var(--line); padding-top:14px}
.due-pill{font-family:var(--mono); font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; padding:2px 6px; border-radius:2px; background:var(--accent-soft); color:var(--accent)}
/* cheat sheets */
.cheat-sec{scroll-margin-top:84px}
.cheat-hd{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap}
.cheat-hd h2{font-family:var(--display); font-weight:600; font-size:20px; letter-spacing:-.02em}
.cheat-kicker{font-family:var(--read); font-size:13.5px; color:var(--muted)}
.cheat-bd{padding:4px 0 16px; display:flex; flex-direction:column; gap:16px}
.tblwrap{overflow-x:auto; min-width:0; max-width:100%; border:1px solid var(--line); border-radius:var(--r)}
table.cs{width:100%; border-collapse:collapse; min-width:420px}
table.cs th{
  text-align:left; font-family:var(--mono); font-size:9.5px; letter-spacing:.11em;
  text-transform:uppercase; color:var(--muted); font-weight:700;
  padding:8px 12px; background:var(--surface-2); border-bottom:1px solid var(--line); white-space:nowrap;
}
table.cs td{padding:9px 12px; border-bottom:1px solid var(--line); font-size:13.5px; line-height:1.45; vertical-align:top}
table.cs tr:last-child td{border-bottom:0}
table.cs td:first-child{font-weight:600; letter-spacing:-.005em}
table.cs td:not(:first-child){font-family:var(--read); font-size:14px; color:var(--ink-2)}
table.cs.three td:nth-child(2){font-weight:600; font-family:var(--sans); font-size:13.5px; color:var(--ink); white-space:nowrap}
ul.cs{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:9px}
ul.cs li{
  font-family:var(--read); font-size:14.5px; line-height:1.5; color:var(--ink-2);
  padding-left:17px; position:relative; max-width:76ch;
}
ul.cs li::before{content:""; position:absolute; left:2px; top:.62em; width:5px; height:5px; background:var(--accent); border-radius:50%}
.cs-note{
  font-family:var(--read); font-size:14.5px; line-height:1.55; padding:12px 15px;
  border-left:2px solid var(--accent); background:var(--accent-soft); color:var(--ink);
  max-width:78ch; border-radius:0 var(--r) var(--r) 0;
}
.toc{list-style:none; margin:0; padding:6px 0}
.toc a{display:flex; gap:9px; align-items:baseline; padding:8px 16px; text-decoration:none; color:inherit; font-size:12.5px; font-weight:600; letter-spacing:-.005em; min-width:0}
.toc a > span:last-child{min-width:0; overflow-wrap:anywhere}
.toc a:hover{background:var(--surface-2); color:var(--accent)}
.toc .n{font-family:var(--mono); font-size:10px; color:var(--muted); min-width:16px}
.printbtn{margin-left:auto}
@media print{
  .topbar,#rail,.printbtn{display:none !important}
  .wrap{max-width:none; padding:0}
  .cols{display:block}
  .panel{border:0; box-shadow:none; break-inside:auto}
  .cheat-sec{break-inside:avoid-page}
  table.cs{min-width:0; font-size:10pt}
  body{background:#fff; color:#000}
}
.links{list-style:none; margin:0; padding:0}
.links li{border-bottom:1px solid var(--line)}
.links li:last-child{border-bottom:0}
.links a.row{display:flex; gap:14px; align-items:baseline; padding:12px 16px; text-decoration:none; color:inherit}
.links a.row:hover{background:var(--surface-2)}
.links a.row:hover .lk-nm{color:var(--accent)}
.lk-nm{font-family:var(--display); font-size:14px; font-weight:600; letter-spacing:-.01em; flex:0 0 auto}
.lk-sub{font-family:var(--read); font-size:13.5px; color:var(--ink-2); line-height:1.45; flex:1; min-width:0}
.lk-tag{font-family:var(--mono); font-size:9.5px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); border:1px solid var(--line); padding:1px 5px; border-radius:2px; white-space:nowrap}
.lk-note{font-family:var(--read); font-size:13.5px; color:var(--muted); line-height:1.5; padding:13px 16px 0; max-width:70ch; overflow-wrap:anywhere}
@media (max-width:560px){ .links a.row{flex-wrap:wrap; gap:6px} .lk-sub{flex:1 1 100%} }
.foot{margin-top:26px; font-family:var(--mono); font-size:11px; color:var(--muted); line-height:1.7}
.foot a{color:var(--accent); text-decoration:none; border-bottom:1px solid var(--accent-soft)}
@media (max-width:640px){ .foot a{display:inline-block; padding:6px 0} }
.sync{font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.sync b{color:var(--accent); font-weight:700}
.empty{padding:26px 16px; text-align:center; font-family:var(--read); font-size:15px; color:var(--muted)}
@media (prefers-reduced-motion:reduce){ *{transition:none !important; animation:none !important} }
@media (max-width:560px){
  .wrap{padding:16px 14px 52px}
  .stem{font-size:16.5px} .choice-t{font-size:15px}
  .score-n{font-size:44px}
  .dtable td.mt{display:none} .dtable th.mt{display:none}
}

<script>
/* eslint-disable */
const DATA = {"track":{"id":"computer-vision","name":"Computer Vision","tagline":"Image fundamentals through detection, segmentation, video and edge deployment","target_pct":80,"assessment_minutes":90,"assessment_min":50,"assessment_max":60,"weights_note":"No vendor publishes a computer vision blueprint, so these weights are Gama Core's editorial judgement of what an applied CV engineer actually spends time on. They are a claim, not a citation.","scope_note":"Vendor-neutral and framework-agnostic. Grounded in OpenCV, PyTorch/torchvision, Ultralytics and the primary papers rather than any one provider's course.","facts":[{"label":"Topic areas","value":"10"},{"label":"Target","value":"80%"},{"label":"Certification","value":"None exists"}],"ui":{"page_title":"Computer Vision Console","eyebrow":"Learning track · Computer Vision","hero_title":"The part of AI that has to survive a real camera.","hero_body":"Image fundamentals and geometry, convolutional and transformer architectures, detection, segmentation, video and tracking, and what breaks between a notebook and a production pipeline. {N} questions, each with the reasoning and a primary source.","assessment_name":"Timed assessment","readiness_label":"Weighted readiness","assessment_sub":"Weighted across the ten topic areas, no feedback until you submit. No vendor exam exists — this is the self-check instead.","footer_note":"This is a Gama Core learning track, not a certification. No vendor exam, credential or cut score exists for this material. Topic weights are our editorial judgement of where applied CV work concentrates, not a published blueprint."}},"domains":[{"id":"image-fundamentals","name":"Image Fundamentals and Processing","weight":8,"prefix":"IF","scope":"Image formation and sampling, colour spaces and when each matters, point operations and histograms, convolution and linear filtering, non-linear filters, morphology, geometric transforms and interpolation, and the arithmetic traps of 8-bit image data."},{"id":"classical-cv","name":"Classical Vision and Geometry","weight":8,"prefix":"CV","scope":"Edges and contours, corner and blob detection, local descriptors and matching, RANSAC and homography, camera models, intrinsics and distortion, calibration, stereo and depth, and where classical methods still beat learned ones."},{"id":"cnn-architectures","name":"Convolutional Architectures","weight":12,"prefix":"CN","scope":"Convolution mechanics, stride, padding and dilation, receptive fields, pooling and downsampling, batch normalisation, residual and dense connections, depthwise separable convolutions, backbone families and how to choose one, and transfer learning."},{"id":"training-vision","name":"Training Vision Models","weight":12,"prefix":"TV","scope":"Data augmentation and what it simulates, loss functions for vision tasks, class imbalance and focal loss, regularisation, learning-rate schedules and warmup, mixed precision, overfitting diagnosis, and reproducibility."},{"id":"detection","name":"Object Detection","weight":14,"prefix":"DE","scope":"One-stage versus two-stage detectors, anchors and anchor-free designs, the YOLO family, feature pyramids, IoU, non-maximum suppression, confidence thresholds, mean average precision and its pitfalls, and small-object and dense-scene failure modes."},{"id":"segmentation","name":"Segmentation","weight":11,"prefix":"SG","scope":"Semantic, instance and panoptic segmentation, encoder-decoder and U-Net, skip connections, transposed convolution versus upsampling, Mask R-CNN and RoIAlign, promptable segmentation, Dice and IoU losses, and boundary quality."},{"id":"vision-transformers","name":"Vision Transformers and Multimodal","weight":10,"prefix":"VT","scope":"Patch embedding and the class token, why ViTs need more data than CNNs, hierarchical and windowed attention, self-supervised pretraining, CLIP and contrastive image-text training, zero-shot and open-vocabulary recognition, and diffusion for image generation."},{"id":"video-tracking","name":"Video and Tracking","weight":8,"prefix":"VD","scope":"Temporal redundancy, optical flow, frame sampling, action recognition, multi-object tracking, association and Kalman filtering, re-identification, identity switches, and streaming pipeline design."},{"id":"data-evaluation","name":"Data and Evaluation","weight":9,"prefix":"EV","scope":"Annotation quality and guidelines, splitting without leakage, long-tailed distributions, precision-recall curves, choosing an operating threshold, confusion analysis, dataset bias and domain shift, and what a benchmark number does not tell you."},{"id":"deployment-edge","name":"Deployment and Edge","weight":8,"prefix":"DP","scope":"ONNX export and graph pitfalls, TensorRT and engine building, quantisation and calibration, pruning and distillation, batching and latency versus throughput, camera capture and colour-order bugs, preprocessing parity between training and serving, and monitoring in the field."}],"questions":[{"id":"CV-001","type":"single","difficulty":"medium","stem":"Canny edge detection uses two thresholds. What does the pair accomplish?","choices":["One for horizontal and one for vertical edges","Hysteresis: pixels above the high threshold start an edge, and neighbouring pixels above the low threshold extend it, which keeps weak but connected edges while rejecting isolated noise","One for colour and one for grayscale","One for the gradient and one for the Laplacian"],"answer":[1],"explanation":"A single threshold either fragments genuine edges or admits noise. Hysteresis seeds on confident pixels and grows along connected weaker ones, producing continuous contours. Canny also applies Gaussian smoothing and non-maximum suppression first, so the output is thin, connected edges.","tags":["canny","hysteresis","edge-detection","thresholds"],"ref":"https://docs.opencv.org/4.x/da/d22/tutorial_py_canny.html","domain":"classical-cv"},{"id":"CV-002","type":"single","difficulty":"medium","stem":"What does non-maximum suppression do inside the Canny detector, as distinct from its role in object detection?","choices":["It removes duplicate bounding boxes","It thins gradient ridges to single-pixel width by keeping only local maxima along the gradient direction","It suppresses low-confidence classes","It removes small contours"],"answer":[1],"explanation":"The same name covers two different operations. In Canny, NMS thins a broad gradient response into a one-pixel ridge by keeping each pixel only if it is the maximum along the gradient normal. In detection, NMS removes overlapping boxes. Confusing the two is a common trap.","tags":["non-maximum-suppression","canny","thinning","terminology"],"ref":"https://docs.opencv.org/4.x/da/d22/tutorial_py_canny.html","domain":"classical-cv"},{"id":"CV-003","type":"single","difficulty":"medium","stem":"Why is a corner a better feature point than an edge for matching between images?","choices":["Corners are brighter","An edge is ambiguous along its own direction, so its position cannot be localised in one dimension; a corner constrains both directions","Corners are more numerous","Edges cannot be detected reliably"],"answer":[1],"explanation":"Sliding a window along an edge produces little change, so the match is undetermined in that direction — the aperture problem. At a corner, intensity changes in every direction, so the location is pinned in both axes. That is exactly what the Harris response measures.","tags":["corners","aperture-problem","harris","feature-points"],"ref":"https://docs.opencv.org/4.x/dc/d0d/tutorial_py_features_harris.html","domain":"classical-cv"},{"id":"CV-004","type":"multi","difficulty":"medium","stem":"Which TWO properties should a good local descriptor have for matching across viewpoints?","choices":["Invariance to rotation and scale, so the same physical point matches despite camera motion","Distinctiveness, so different points produce clearly different descriptors","Dependence on absolute image brightness","Being as long as possible"],"answer":[0,1],"explanation":"Invariance ensures the same point is described the same way from a different viewpoint; distinctiveness ensures different points are not confused. Brightness dependence destroys invariance under lighting change, which is why descriptors normalise. Longer vectors cost memory and match time without inherently helping.","tags":["descriptors","invariance","distinctiveness","matching"],"ref":"https://docs.opencv.org/4.x/db/d27/tutorial_py_table_of_contents_feature2d.html","domain":"classical-cv"},{"id":"CV-005","type":"single","difficulty":"hard","stem":"What problem does RANSAC solve when estimating a homography from matched keypoints?","choices":["It speeds up matching","Correspondences contain gross outliers, and least squares is destroyed by them; RANSAC fits from random minimal subsets and keeps the model with most inliers","It converts the homography to affine","It removes duplicate keypoints"],"answer":[1],"explanation":"Feature matching always produces some completely wrong pairs, and a single bad correspondence can wreck a least-squares fit. RANSAC repeatedly samples the minimum number of points, scores each candidate by inlier count, and returns the consensus model. It is robust precisely because it never averages outliers in.","tags":["ransac","outliers","homography","robust-estimation"],"ref":"https://docs.opencv.org/4.x/d9/d0c/group__calib3d.html","domain":"classical-cv"},{"id":"CV-006","type":"single","difficulty":"medium","stem":"What do a camera's intrinsic parameters describe?","choices":["Its position and orientation in the world","Focal length, principal point and skew — the mapping from camera coordinates to pixel coordinates","The lighting conditions","The image file format"],"answer":[1],"explanation":"Intrinsics are properties of the camera and lens: how 3D points in the camera frame project onto the sensor grid. Extrinsics describe where the camera sits in the world. Calibration estimates intrinsics and distortion coefficients, usually from images of a known pattern.","tags":["intrinsics","extrinsics","camera-model","calibration"],"ref":"https://docs.opencv.org/4.x/dc/dbb/tutorial_py_calibration.html","domain":"classical-cv"},{"id":"CV-007","type":"single","difficulty":"medium","stem":"Straight lines in your images bow outward near the edges. What is this and how is it corrected?","choices":["Motion blur; use a faster shutter","Radial lens distortion; estimate distortion coefficients by calibration and undistort the image or the point coordinates","Chromatic aberration; convert to grayscale","Rolling shutter; stabilise the camera"],"answer":[1],"explanation":"Barrel distortion is radial: displacement grows with distance from the optical centre. Calibration with a chessboard or circle grid estimates the coefficients, after which images can be remapped or measurements corrected analytically. Any geometric measurement on a wide-angle lens is wrong until this is handled.","tags":["radial-distortion","calibration","undistortion","lens"],"ref":"https://docs.opencv.org/4.x/dc/dbb/tutorial_py_calibration.html","domain":"classical-cv"},{"id":"CV-008","type":"single","difficulty":"hard","stem":"In a calibrated stereo pair, what does the disparity of a matched point tell you?","choices":["Its colour","Its depth: disparity is inversely proportional to distance, scaled by the baseline and focal length","Its surface normal","Its reflectance"],"answer":[1],"explanation":"Depth equals focal length times baseline divided by disparity. Near points shift a lot between the two views and far points barely at all, which is also why stereo range accuracy degrades quadratically with distance and why a wider baseline improves far-field depth.","tags":["stereo","disparity","depth","triangulation"],"ref":"https://docs.opencv.org/4.x/dd/d53/tutorial_py_depthmap.html","domain":"classical-cv"},{"id":"CV-009","type":"single","difficulty":"medium","stem":"Why is rectification performed before stereo matching?","choices":["To equalise brightness","To warp both images so corresponding points lie on the same horizontal row, reducing the search for a match from two dimensions to one","To remove colour","To crop to the overlapping region"],"answer":[1],"explanation":"Epipolar geometry already constrains a match to a line; rectification aligns those lines with image rows. The search then becomes a 1D scan along a row, which is both far faster and far more robust than an unconstrained 2D search.","tags":["rectification","epipolar","stereo","search-reduction"],"ref":"https://docs.opencv.org/4.x/dd/d53/tutorial_py_depthmap.html","domain":"classical-cv"},{"id":"CV-010","type":"multi","difficulty":"medium","stem":"Which TWO situations still favour classical computer vision over a learned model?","choices":["A fixed industrial setup with controlled lighting where a geometric measurement must be exact and explainable","Very little or no labelled data, with the target defined by precise geometry or colour rather than appearance variation","Recognising thousands of object categories in unconstrained photographs","Reading handwriting in arbitrary styles"],"answer":[0,1],"explanation":"Classical methods win where the problem is geometric, the environment is controlled, and the answer must be deterministic and auditable — calibration, fiducial markers, metrology. Open-world appearance variation is where learned features are indispensable.","tags":["classical-vs-learned","industrial","controlled-environment","method-choice"],"ref":"https://docs.opencv.org/4.x/","domain":"classical-cv"},{"id":"CV-011","type":"single","difficulty":"medium","stem":"What does template matching fundamentally struggle with?","choices":["Grayscale images","Changes in scale, rotation and illumination, because it slides a fixed patch and compares pixels directly","Small images","Binary images"],"answer":[1],"explanation":"Template matching correlates a fixed patch across the image, so any transformation the template does not itself contain breaks the match. It works well for a rigid, known appearance at known scale — a UI element, a printed mark — and fails as soon as viewpoint varies.","tags":["template-matching","invariance","limitations","correlation"],"ref":"https://docs.opencv.org/4.x/d4/dc6/tutorial_py_template_matching.html","domain":"classical-cv"},{"id":"CV-012","type":"single","difficulty":"medium","stem":"What does the Hough transform do for line detection?","choices":["Thresholds the gradient magnitude","Maps each edge pixel to a curve in parameter space and finds lines as accumulator peaks, which tolerates gaps and occlusion","Fits a single line by least squares","Applies morphology to connect edges"],"answer":[1],"explanation":"Because every edge pixel votes for all lines passing through it, a line appears as a peak where many pixels agree. That voting scheme makes it robust to broken and partially occluded lines, unlike a fit that needs contiguous support.","tags":["hough-transform","line-detection","voting","occlusion"],"ref":"https://docs.opencv.org/4.x/d6/d10/tutorial_py_houghlines.html","domain":"classical-cv"},{"id":"CV-013","type":"single","difficulty":"hard","stem":"You need sub-pixel accuracy locating a calibration target's corners. What is the standard approach?","choices":["Upscale the image 4x and detect again","Detect corners at pixel level, then refine iteratively using the local gradient structure, since the true corner rarely sits at a pixel centre","Use a larger Gaussian blur","Convert to HSV first"],"answer":[1],"explanation":"Integer pixel positions cap accuracy at roughly half a pixel, which is not enough for calibration. Refinement exploits the fact that gradient vectors near a corner are orthogonal to the displacement toward it, solving for the sub-pixel location. Upscaling invents no new information.","tags":["sub-pixel","corner-refinement","calibration","accuracy"],"ref":"https://docs.opencv.org/4.x/dd/d1a/group__imgproc__feature.html","domain":"classical-cv"},{"id":"CV-014","type":"single","difficulty":"medium","stem":"Why does contour area alone poorly distinguish object classes in a binary image?","choices":["Area is always noisy","Objects of different shapes can share an area, so shape descriptors such as aspect ratio, solidity, extent or Hu moments are needed to separate them","Contours cannot be computed reliably","Area depends on colour"],"answer":[1],"explanation":"Area is a single scalar and collapses all shape information. A circle and a thin rectangle can have identical area. Combining area with ratios that capture elongation and convexity gives a descriptor that actually discriminates, which is the basis of classical blob classification.","tags":["contours","shape-descriptors","moments","classification"],"ref":"https://docs.opencv.org/4.x/dd/d49/tutorial_py_contour_features.html","domain":"classical-cv"},{"id":"CV-015","type":"single","difficulty":"hard","stem":"Feature matching between two views yields many matches but the homography is wrong. Inlier count is low. What should you check first?","choices":["The image file format","Whether the scene is actually planar or the camera only rotated — a homography is valid for a plane or for pure rotation, and fails on a general 3D scene with translation","Whether the images are the same size","Whether the descriptors are 128-dimensional"],"answer":[1],"explanation":"A homography is not a general scene model. It holds for a planar surface, or for any scene when the camera rotates about its optical centre without translating. Photographing a 3D scene from two positions produces parallax that no homography can explain, so inliers stay low however good the matches are.","tags":["homography-assumptions","planarity","parallax","diagnosis"],"ref":"https://docs.opencv.org/4.x/d9/dab/tutorial_homography.html","domain":"classical-cv"},{"id":"CN-001","type":"single","difficulty":"easy","stem":"Why does a convolutional layer use far fewer parameters than a fully connected layer on the same image?","choices":["It processes fewer pixels","Weights are shared: one small kernel slides across the whole image instead of every input pixel having its own weight to every output","It uses lower precision","It skips the bias term"],"answer":[1],"explanation":"Weight sharing is the core idea. A 3x3 kernel has nine weights per channel pair regardless of image size, whereas a dense layer needs a weight per input-output pair. Sharing also builds in translation equivariance: a pattern is detected wherever it occurs.","tags":["weight-sharing","convolution","parameters","translation-equivariance"],"ref":"https://pytorch.org/docs/stable/generated/torch.nn.Conv2d.html","domain":"cnn-architectures"},{"id":"CN-002","type":"single","difficulty":"medium","stem":"What is a neuron's receptive field, and why does it grow with depth?","choices":["The number of channels it sees; it grows because channels increase","The region of the input that can influence it; each layer aggregates a neighbourhood of the previous layer, so the reachable input area compounds with depth","The size of the output feature map","The batch dimension"],"answer":[1],"explanation":"A 3x3 convolution sees 3x3 of its input, but that input already summarised a neighbourhood, so two stacked 3x3 layers see 5x5 of the original image. Stride and pooling accelerate the growth. If the receptive field never covers the object, the network cannot represent it as a whole.","tags":["receptive-field","depth","context","architecture"],"ref":"https://pytorch.org/docs/stable/generated/torch.nn.Conv2d.html","domain":"cnn-architectures"},{"id":"CN-003","type":"single","difficulty":"medium","stem":"Two stacked 3x3 convolutions are often preferred to one 5x5. Why?","choices":["They are easier to implement","They cover the same receptive field with fewer parameters and add an extra non-linearity between them","5x5 kernels cannot be trained","They use more memory, which improves accuracy"],"answer":[1],"explanation":"Two 3x3 layers reach 5x5 of the input using 18 weights per channel pair against 25, and interpose an activation that a single large kernel cannot. That combination of cheaper and more expressive is why VGG standardised on small kernels and why the pattern persists.","tags":["kernel-size","vgg","parameter-efficiency","non-linearity"],"ref":"https://arxiv.org/abs/1409.1556","domain":"cnn-architectures"},{"id":"CN-004","type":"single","difficulty":"medium","stem":"What does stride 2 in a convolution accomplish?","choices":["It doubles the number of channels","It halves the spatial resolution, downsampling while convolving instead of using a separate pooling layer","It doubles the kernel size","It skips every second channel"],"answer":[1],"explanation":"Stride sets the step between kernel applications, so stride 2 produces an output roughly half the height and width. Many modern architectures use strided convolutions rather than pooling because the downsampling is then learned rather than fixed.","tags":["stride","downsampling","pooling-alternative","resolution"],"ref":"https://pytorch.org/docs/stable/generated/torch.nn.Conv2d.html","domain":"cnn-architectures"},{"id":"CN-005","type":"single","difficulty":"medium","stem":"What does dilated (atrous) convolution buy you?","choices":["Fewer channels","A larger receptive field without more parameters or loss of resolution, by spacing the kernel taps apart","Faster training always","Automatic padding"],"answer":[1],"explanation":"Inserting gaps between kernel taps widens the field of view at constant parameter count and without downsampling. That matters for dense prediction such as segmentation, where you need context but cannot afford to throw away spatial resolution.","tags":["dilated-convolution","receptive-field","segmentation","resolution"],"ref":"https://arxiv.org/abs/1511.07122","domain":"cnn-architectures"},{"id":"CN-006","type":"multi","difficulty":"medium","stem":"Which TWO statements about batch normalisation are correct?","choices":["It normalises activations using statistics computed over the batch during training","At inference it uses running statistics accumulated during training, which is why model.eval() matters","It normalises the input image only","It removes the need for a learning rate"],"answer":[0,1],"explanation":"BatchNorm standardises each channel using the current batch's mean and variance while training, and switches to accumulated running estimates at inference so predictions do not depend on batch composition. Forgetting eval() leaves it using batch statistics, which makes single-image inference unstable.","tags":["batch-normalisation","training-vs-inference","running-stats","eval-mode"],"ref":"https://pytorch.org/docs/stable/generated/torch.nn.BatchNorm2d.html","domain":"cnn-architectures"},{"id":"CN-007","type":"single","difficulty":"hard","stem":"Why does batch normalisation behave poorly with very small batch sizes, and what is used instead?","choices":["It cannot be computed below batch size 8","Batch statistics become noisy estimates, so normalisation is unstable; GroupNorm or LayerNorm, which normalise within an example, are used instead","It requires a GPU","Small batches overflow the running statistics"],"answer":[1],"explanation":"With two or four samples the per-batch mean and variance are poor estimates and fluctuate wildly between steps. Group normalisation splits channels into groups and normalises within a single example, removing the batch dependence entirely — which is why detection and segmentation models trained at small batch sizes often use it.","tags":["batch-norm-limits","group-norm","small-batch","normalisation"],"ref":"https://arxiv.org/abs/1803.08494","domain":"cnn-architectures"},{"id":"CN-008","type":"single","difficulty":"medium","stem":"What problem do residual connections solve?","choices":["They reduce the parameter count","They give gradients a direct path through the network, making very deep stacks trainable rather than degrading as depth increases","They remove the need for normalisation","They increase the receptive field"],"answer":[1],"explanation":"Before ResNet, adding layers past a point made training error worse, not just validation error. Skip connections let a block learn a residual on top of the identity, so gradients flow around it and depth stops being an obstacle. It is what made hundred-layer networks practical.","tags":["residual-connections","resnet","depth","degradation"],"ref":"https://arxiv.org/abs/1512.03385","domain":"cnn-architectures"},{"id":"CN-009","type":"single","difficulty":"medium","stem":"What is a depthwise separable convolution?","choices":["A convolution split across two GPUs","A depthwise convolution applying one filter per input channel, followed by a 1x1 pointwise convolution mixing channels — far cheaper than a full convolution","A convolution with no bias","Two convolutions run in parallel and summed"],"answer":[1],"explanation":"Factorising spatial filtering from channel mixing cuts the cost by roughly the kernel area compared with a standard convolution. That efficiency is what makes MobileNet-class architectures viable on phones and embedded devices.","tags":["depthwise-separable","mobilenet","efficiency","factorisation"],"ref":"https://arxiv.org/abs/1704.04861","domain":"cnn-architectures"},{"id":"CN-010","type":"single","difficulty":"medium","stem":"What does a 1x1 convolution actually do?","choices":["Nothing useful, since the kernel covers one pixel","Mixes information across channels at each spatial position, which lets it change channel depth cheaply and add non-linearity","Blurs the image","Increases spatial resolution"],"answer":[1],"explanation":"A 1x1 kernel has no spatial extent but full channel extent, so it is a per-pixel linear combination across channels. It is the standard way to expand or reduce depth — the bottleneck blocks in ResNet and the pointwise stage of separable convolutions both rely on it.","tags":["1x1-convolution","channel-mixing","bottleneck","depth"],"ref":"https://arxiv.org/abs/1512.03385","domain":"cnn-architectures"},{"id":"CN-011","type":"single","difficulty":"medium","stem":"What does global average pooling replace, and what does that change?","choices":["Batch normalisation; it stabilises training","The flatten-plus-dense head; it averages each channel to one value, removing a huge parameter block and making the network tolerant of input size","The activation function; it adds non-linearity","The loss function; it changes the objective"],"answer":[1],"explanation":"Flattening a feature map into a dense layer creates most of a classic CNN's parameters and hard-codes the input resolution. Averaging each channel yields a fixed-length vector regardless of spatial size, which both regularises and lets the same network accept different input dimensions.","tags":["global-average-pooling","classifier-head","parameters","input-size"],"ref":"https://arxiv.org/abs/1312.4400","domain":"cnn-architectures"},{"id":"CN-012","type":"multi","difficulty":"hard","stem":"You fine-tune an ImageNet backbone on 2,000 medical images. Which TWO choices are sound?","choices":["Freeze most of the backbone initially and train the head, then unfreeze the later layers with a low learning rate","Use strong augmentation appropriate to the domain, since 2,000 images is far too few to learn features from scratch","Train all layers from random initialisation","Remove batch normalisation layers"],"answer":[0,1],"explanation":"With limited data the pretrained features are the asset. Training the head first avoids destroying them with large early gradients, and gradual unfreezing at a low rate adapts them gently. Augmentation multiplies effective data. Random initialisation discards precisely what makes the transfer work.","tags":["transfer-learning","freezing","gradual-unfreezing","small-data"],"ref":"https://pytorch.org/tutorials/beginner/transfer_learning_tutorial.html","domain":"cnn-architectures"},{"id":"CN-013","type":"single","difficulty":"hard","stem":"Early layers of a pretrained CNN are often reused unchanged even across very different domains. Why?","choices":["They contain the most parameters","They learn generic low-level structure — edges, colours, textures — that is common to almost all natural images, while later layers become task-specific","They train fastest","They are the only layers without normalisation"],"answer":[1],"explanation":"Visualisations consistently show first-layer filters resembling oriented edges and colour blobs regardless of the training set, with specificity emerging deeper. That is the empirical basis of transfer learning, and why the depth at which you start unfreezing tracks how far your domain sits from the source.","tags":["feature-hierarchy","transfer-learning","generic-features","layer-specificity"],"ref":"https://arxiv.org/abs/1411.1792","domain":"cnn-architectures"},{"id":"CN-014","type":"single","difficulty":"medium","stem":"What is the practical difference between max pooling and average pooling?","choices":["Max pooling is faster","Max pooling keeps the strongest activation, preserving whether a feature was present; average pooling smooths, preserving overall magnitude","Average pooling has learnable weights","Max pooling doubles resolution"],"answer":[1],"explanation":"Max is a detector: it reports the most salient response in the window and discards the rest, which suits presence-of-feature reasoning. Averaging retains aggregate intensity, which is why it appears at the end of networks for pooling whole feature maps rather than in the middle.","tags":["max-pooling","average-pooling","downsampling","feature-selection"],"ref":"https://pytorch.org/docs/stable/generated/torch.nn.MaxPool2d.html","domain":"cnn-architectures"},{"id":"CN-015","type":"single","difficulty":"hard","stem":"Your CNN classifies well but fails when objects appear at the image edge. What is the most likely architectural cause?","choices":["Too few channels","Padding and receptive field effects: border regions are seen by fewer kernel applications and padded with zeros, so edge context differs from centre context","The learning rate is too high","Batch normalisation is disabled"],"answer":[1],"explanation":"Zero padding fabricates a border that the network learns to treat as a cue, and edge pixels participate in fewer overlapping windows. Training augmentation with translation and random cropping, or reflective padding, reduces the asymmetry. It is a real and under-appreciated source of position bias.","tags":["padding","border-effects","position-bias","diagnosis"],"ref":"https://arxiv.org/abs/2010.02178","domain":"cnn-architectures"},{"id":"CN-016","type":"single","difficulty":"medium","stem":"Why can a fully convolutional network accept variable input sizes while a CNN ending in dense layers cannot?","choices":["Convolutions have no parameters","A dense layer fixes the flattened feature length, whereas convolution and pooling scale their output with the input","Dense layers require grayscale","Convolutions are faster"],"answer":[1],"explanation":"A dense layer's weight matrix is sized to a specific flattened dimension, so any other input size produces a shape mismatch. Convolution and pooling are shape-agnostic, which is what lets fully convolutional networks handle arbitrary resolutions and produce dense spatial outputs for segmentation.","tags":["fully-convolutional","variable-input","dense-layer","shape"],"ref":"https://arxiv.org/abs/1411.4038","domain":"cnn-architectures"},{"id":"CN-017","type":"single","difficulty":"medium","stem":"What is the purpose of a feature pyramid in a backbone?","choices":["To reduce the number of layers","To provide features at several spatial resolutions, so small objects can be detected from high-resolution shallow maps and large ones from deep semantic maps","To compress the model","To replace batch normalisation"],"answer":[1],"explanation":"A single deep feature map has strong semantics but coarse resolution, which loses small objects. A pyramid combines resolutions, typically with top-down connections that push semantic information back into finer maps. Multi-scale representation is central to modern detection and segmentation.","tags":["feature-pyramid","multi-scale","small-objects","fpn"],"ref":"https://arxiv.org/abs/1612.03144","domain":"cnn-architectures"},{"id":"CN-018","type":"single","difficulty":"hard","stem":"Given a fixed compute budget, EfficientNet argues you should scale what?","choices":["Depth only","Depth, width and input resolution together in a balanced ratio, rather than any one dimension alone","Batch size only","The number of classes"],"answer":[1],"explanation":"Scaling one dimension saturates: deeper networks stop helping, wider ones stop adding information, higher resolution outgrows the receptive field. Compound scaling raises all three by a coefficient tuned once, which reaches better accuracy per FLOP than scaling any single axis.","tags":["efficientnet","compound-scaling","depth-width-resolution","efficiency"],"ref":"https://arxiv.org/abs/1905.11946","domain":"cnn-architectures"},{"id":"CN-019","type":"single","difficulty":"medium","stem":"Why is a CNN translation-equivariant but not naturally rotation-invariant?","choices":["Rotations are computationally harder","Weight sharing slides the same kernel across positions, so a shifted input shifts the response; nothing in the architecture ties together rotated versions of a filter","Pooling removes rotation information","Convolutions only work on axis-aligned features"],"answer":[1],"explanation":"The convolution structure builds in the shift symmetry and nothing else. Rotational robustness must come from augmentation, from architectures designed with rotational symmetry, or from the data itself already containing rotated examples.","tags":["equivariance","invariance","rotation","augmentation"],"ref":"https://pytorch.org/docs/stable/generated/torch.nn.Conv2d.html","domain":"cnn-architectures"},{"id":"CN-020","type":"single","difficulty":"medium","stem":"What does the channel dimension represent after several convolutional layers?","choices":["Colour channels, always three","Learned feature detectors: each channel is a map of where its particular pattern responds","Batch elements","Spatial coordinates"],"answer":[1],"explanation":"Only the input layer's channels are colours. After that each channel is the response map of one learned filter — an edge orientation early on, a texture or part detector deeper. Feature-map visualisation and channel attention both rest on this reading.","tags":["feature-maps","channels","interpretation","filters"],"ref":"https://arxiv.org/abs/1311.2901","domain":"cnn-architectures"},{"id":"CN-021","type":"multi","difficulty":"hard","stem":"A backbone must run at 30 FPS on an embedded GPU. Which TWO architectural choices are appropriate?","choices":["Depthwise separable convolutions to cut FLOPs at similar accuracy","A smaller input resolution, since cost scales with the square of the spatial dimensions","Adding more residual blocks for accuracy","Replacing all convolutions with dense layers"],"answer":[0,1],"explanation":"Separable convolutions and resolution are the two biggest levers on inference cost, and resolution is quadratic so it dominates. Adding blocks moves the wrong way, and dense layers would explode both parameters and compute while discarding spatial structure.","tags":["embedded","latency","separable-convolution","resolution"],"ref":"https://arxiv.org/abs/1704.04861","domain":"cnn-architectures"},{"id":"CN-022","type":"single","difficulty":"medium","stem":"Why is ReLU the default activation in most CNNs?","choices":["It is the only non-linear function available","It is cheap to compute and does not saturate for positive inputs, so gradients flow rather than vanishing as they do with sigmoid or tanh","It normalises the output","It guarantees convergence"],"answer":[1],"explanation":"Sigmoid and tanh flatten at both extremes, so gradients shrink toward zero and deep stacks train badly. ReLU has constant gradient on the positive side and costs a comparison. Its weakness is dead units on the negative side, which variants like LeakyReLU address.","tags":["relu","activation","vanishing-gradient","saturation"],"ref":"https://pytorch.org/docs/stable/generated/torch.nn.ReLU.html","domain":"cnn-architectures"},{"id":"EV-001","type":"single","difficulty":"medium","stem":"Two annotators label the same 200 images and agree on 72% of instances. What should you conclude?","choices":["One annotator is careless; retrain them","The task definition is ambiguous — model performance is capped near the level of annotator agreement, so the guideline needs sharpening before more labelling","The dataset is too small","The model will resolve the ambiguity"],"answer":[1],"explanation":"Inter-annotator agreement is an upper bound on achievable measured performance: where humans disagree, the ground truth itself is noise. Measuring it early and rewriting the guideline is far cheaper than discovering the ceiling after training. Blaming an annotator mistakes a specification problem for a diligence problem.","tags":["inter-annotator-agreement","label-noise","guidelines","performance-ceiling"],"ref":"https://cocodataset.org/#format-data","domain":"data-evaluation"},{"id":"EV-002","type":"multi","difficulty":"medium","stem":"Which TWO belong in an annotation guideline for a detection task?","choices":["A rule for partially occluded objects — for example, label if more than a stated fraction is visible","Whether to include or exclude ambiguous edge cases such as reflections, posters and screens showing the object","The model architecture to be used","The learning rate"],"answer":[0,1],"explanation":"Guidelines exist to make independent annotators produce the same labels. Occlusion and depiction-versus-reality are the two decisions that most often go unstated and produce silent inconsistency. Training configuration has nothing to do with what the ground truth means.","tags":["annotation-guidelines","occlusion","edge-cases","consistency"],"ref":"https://cocodataset.org/#format-data","domain":"data-evaluation"},{"id":"EV-003","type":"single","difficulty":"hard","stem":"Frames extracted from 50 videos are split randomly into train and validation. Validation accuracy is 96% but production accuracy is 71%. Why?","choices":["The model is underfitting","Near-identical frames from the same video appear on both sides of the split, so validation measures recall of almost-seen images; the split must be grouped by video","Validation set is too small","The learning rate was too high"],"answer":[1],"explanation":"Adjacent video frames are near-duplicates. A random split puts them in both partitions, so the model is evaluated on images it has effectively already seen. Grouping by video, patient, site or session is essential wherever samples share a source.","tags":["grouped-split","leakage","near-duplicates","video-frames"],"ref":"https://scikit-learn.org/stable/modules/cross_validation.html","domain":"data-evaluation"},{"id":"EV-004","type":"single","difficulty":"medium","stem":"What does a precision-recall curve show that a single F1 score does not?","choices":["The model's speed","Performance across every confidence threshold, so you can choose an operating point rather than accept one","The number of classes","The training loss"],"answer":[1],"explanation":"F1 reports one point on the curve, implicitly weighting precision and recall equally. The full curve shows the trade available — whether recall can be raised cheaply, or whether precision collapses immediately past a point — which is the information a deployment decision needs.","tags":["precision-recall-curve","operating-point","f1","threshold"],"ref":"https://scikit-learn.org/stable/modules/model_evaluation.html","domain":"data-evaluation"},{"id":"EV-005","type":"single","difficulty":"medium","stem":"Why is a ROC curve often misleading for a heavily imbalanced detection problem?","choices":["ROC cannot be computed for detection","The false-positive rate is normalised by a huge number of negatives, so even many false positives barely move it; a precision-recall curve exposes the problem","ROC requires balanced classes to compute","ROC only works for binary problems"],"answer":[1],"explanation":"With a million background regions and a hundred objects, a thousand false positives is a false-positive rate of 0.001 — a nearly perfect-looking ROC — while precision is a catastrophic 9%. Precision divides by predicted positives rather than all negatives, which is why it stays informative under imbalance.","tags":["roc-vs-pr","imbalance","false-positive-rate","metric-choice"],"ref":"https://scikit-learn.org/stable/modules/model_evaluation.html","domain":"data-evaluation"},{"id":"EV-006","type":"single","difficulty":"hard","stem":"Overall accuracy is 91% and stable across releases, but users report the model got worse. What is the most likely explanation?","choices":["Users are mistaken","Aggregate accuracy is masking a regression in a subset that matters — a class, a site, a lighting condition — that is small in the data but significant in use","The metric is computed incorrectly","The test set is too large"],"answer":[1],"explanation":"An aggregate over a fixed distribution can stay flat while an important slice degrades, especially if that slice is rare in the test set but common in a particular user's experience. Per-class and per-segment reporting is what reveals it; a single headline number structurally cannot.","tags":["aggregate-masking","per-segment","regression","reporting"],"ref":"https://scikit-learn.org/stable/modules/model_evaluation.html","domain":"data-evaluation"},{"id":"EV-007","type":"multi","difficulty":"medium","stem":"Which TWO slices should be reported separately rather than folded into an overall number?","choices":["Performance on rare but high-consequence classes","Performance by capture condition — camera, site, lighting, time of day","Performance grouped by file size","Performance by annotation date"],"answer":[0,1],"explanation":"Consequence and capture condition both correspond to real risk boundaries: a rare critical class needs its own threshold, and per-site reporting is what catches a camera that has drifted. File size and annotation date are not meaningful axes of model behaviour.","tags":["disaggregated-reporting","slices","capture-conditions","risk"],"ref":"https://scikit-learn.org/stable/modules/model_evaluation.html","domain":"data-evaluation"},{"id":"EV-008","type":"single","difficulty":"medium","stem":"What is a confusion matrix most useful for in a multi-class vision problem?","choices":["Measuring inference speed","Revealing which specific classes are being mistaken for each other, which often points at a labelling or taxonomy problem rather than a model one","Choosing the learning rate","Counting the dataset size"],"answer":[1],"explanation":"A concentrated off-diagonal block tells you far more than an accuracy figure. Two classes consistently confused usually means they are genuinely hard to distinguish, poorly separated in the guideline, or should be merged. Accuracy tells you that errors exist; the matrix tells you what they are.","tags":["confusion-matrix","error-analysis","taxonomy","diagnosis"],"ref":"https://scikit-learn.org/stable/modules/model_evaluation.html","domain":"data-evaluation"},{"id":"EV-009","type":"single","difficulty":"hard","stem":"Your model performs worse on darker skin tones in a face-related task. What is the disciplined response?","choices":["Note it as a limitation and ship","Measure performance disaggregated by the affected attribute, identify whether the cause is data coverage, labelling or capture conditions, and rebalance or recollect accordingly before deployment","Increase the model size","Adjust the threshold globally"],"answer":[1],"explanation":"Disparate performance is usually a data problem — under-representation, or imaging pipelines tuned for lighter skin — and is fixed at that level. A global threshold change trades error between groups rather than reducing it. Measuring by group is the prerequisite: an aggregate number cannot show the disparity at all.","tags":["fairness","disaggregated-evaluation","data-coverage","bias"],"ref":"https://www.nist.gov/itl/ai-risk-management-framework","domain":"data-evaluation"},{"id":"EV-010","type":"single","difficulty":"medium","stem":"What is dataset shift, and which variety is most common in deployed vision systems?","choices":["The dataset file moving location; storage shift","A change in the input distribution between training and deployment — most often covariate shift from new cameras, lighting, seasons or equipment","A change in the number of classes; label shift only","A change in image format"],"answer":[1],"explanation":"The inputs move while the underlying task stays the same: a new camera model, winter light, a repainted production line. Because the labels' meaning is unchanged, the failure is silent — the model simply becomes less accurate with no error raised. Monitoring input statistics is how it is caught.","tags":["dataset-shift","covariate-shift","deployment","monitoring"],"ref":"https://arxiv.org/abs/1902.07208","domain":"data-evaluation"},{"id":"EV-011","type":"single","difficulty":"medium","stem":"Why is a benchmark score such as COCO mAP a weak predictor of performance on your application?","choices":["Benchmarks are computed incorrectly","It reflects the benchmark's object categories, scales, image quality and scene statistics, which rarely match a specific domain","Benchmarks use different hardware","mAP is not a real metric"],"answer":[1],"explanation":"A COCO number says a model is good at internet photographs of eighty everyday categories. Overhead imagery, microscopy, thermal or industrial inspection differ in nearly every relevant respect. Benchmarks rank architectures usefully; they do not predict your accuracy.","tags":["benchmark-transfer","domain-mismatch","map","model-selection"],"ref":"https://cocodataset.org/#detection-eval","domain":"data-evaluation"},{"id":"EV-012","type":"multi","difficulty":"hard","stem":"Which TWO practices make an evaluation set genuinely useful over time?","choices":["Source it from production, weighted toward failures, escalations and edge cases","Keep a held-out slice that is never used for tuning or model selection, so one honest estimate survives","Generate it synthetically from the training distribution","Refresh it to match whatever the model currently does well"],"answer":[0,1],"explanation":"Realism and untouched-ness are what give an evaluation set value. Production sourcing keeps it representative and failure-weighted keeps it difficult; an untouched slice resists the optimism that accumulates from repeated selection. Synthetic data inherits the training distribution's blind spots, and tuning the set to the model inverts the entire purpose.","tags":["evaluation-set","production-sourcing","held-out","overfitting-to-eval"],"ref":"https://scikit-learn.org/stable/modules/cross_validation.html","domain":"data-evaluation"},{"id":"EV-013","type":"single","difficulty":"medium","stem":"You have 800 labelled images. Why prefer k-fold cross-validation to a single split?","choices":["It trains faster","A single small validation split gives a high-variance estimate; averaging across folds uses all the data for both training and evaluation and gives a more stable number with a spread","It removes the need for a test set","It prevents overfitting"],"answer":[1],"explanation":"With 160 validation images, a few unlucky examples move the score by percentage points. Cross-validation reports a mean and a standard deviation, which is what lets you judge whether a difference between two models is real. A final untouched test set is still needed.","tags":["cross-validation","variance","small-data","estimate-stability"],"ref":"https://scikit-learn.org/stable/modules/cross_validation.html","domain":"data-evaluation"},{"id":"EV-014","type":"single","difficulty":"hard","stem":"Model A scores 0.812 mAP and model B 0.807 on your 400-image test set. What is the right conclusion?","choices":["A is better; deploy it","The difference is likely within noise for a set this size; check variance across seeds or folds, and weigh latency, size and failure modes before choosing","B is better because it is simpler","Retrain both for longer"],"answer":[1],"explanation":"Half a point on 400 images is a handful of detections and comfortably inside run-to-run variation. Treating it as a real ordering is how teams ship a worse model. When scores are indistinguishable, the tiebreakers should be the practical properties: speed, memory, and how each fails.","tags":["statistical-significance","noise","model-selection","tiebreakers"],"ref":"https://scikit-learn.org/stable/modules/model_evaluation.html","domain":"data-evaluation"},{"id":"EV-015","type":"single","difficulty":"medium","stem":"What is the value of maintaining a small curated set of known-hard examples?","choices":["It replaces the test set","It acts as a regression suite: specific failures that were fixed can be checked cheaply and often, so they cannot silently return","It improves training accuracy","It reduces annotation cost"],"answer":[1],"explanation":"A handful of cases that once broke the system — the reflective surface, the occluded pose, the unusual lighting — makes a fast check that runs on every change. It complements rather than replaces a representative test set, which measures overall performance rather than specific known risks.","tags":["regression-suite","known-failures","continuous-testing","curation"],"ref":"https://scikit-learn.org/stable/modules/model_evaluation.html","domain":"data-evaluation"},{"id":"EV-016","type":"single","difficulty":"hard","stem":"An object detector's labels were auto-generated by a larger model and then spot-checked. What risk does this create?","choices":["No risk if the larger model is accurate","The student inherits the teacher's systematic errors and cannot exceed it on those cases, and spot-checking is unlikely to surface errors that are consistent rather than random","Training will be slower","The labels will be in the wrong format"],"answer":[1],"explanation":"Pseudo-labelling is useful but bounds the student by the teacher on any case the teacher gets consistently wrong — and consistent errors are exactly what random spot-checking misses, because they look like agreement. Targeted human review of the teacher's known weak cases is what makes the approach safe.","tags":["pseudo-labelling","teacher-error","systematic-bias","review-strategy"],"ref":"https://arxiv.org/abs/1902.07208","domain":"data-evaluation"},{"id":"DP-001","type":"single","difficulty":"medium","stem":"What is ONNX used for in a vision deployment?","choices":["Training models faster","An interchange format describing the model graph, so a model trained in one framework can be run by a different runtime or compiler","Compressing images","Annotating datasets"],"answer":[1],"explanation":"ONNX decouples where a model is trained from where it runs. Export once and the graph can be consumed by ONNX Runtime, TensorRT, OpenVINO or a mobile runtime, which is what makes a PyTorch model deployable on hardware PyTorch does not target well.","tags":["onnx","interchange","portability","deployment"],"ref":"https://onnx.ai/","domain":"deployment-edge"},{"id":"DP-002","type":"single","difficulty":"hard","stem":"ONNX export succeeds but the exported model produces wrong results for some input sizes. What is the most likely cause?","choices":["The opset version is too new","Python control flow or shape arithmetic was traced with a fixed example, baking in constants instead of dynamic axes; declare dynamic axes and validate at several shapes","ONNX does not support convolution","The model is too large"],"answer":[1],"explanation":"Tracing records the operations executed for one concrete input, so any branch or computed shape becomes a constant. Marking batch and spatial dimensions as dynamic, and testing the exported graph at multiple sizes against the original, catches this before it reaches production.","tags":["onnx-export","tracing","dynamic-axes","validation"],"ref":"https://pytorch.org/docs/stable/onnx.html","domain":"deployment-edge"},{"id":"DP-003","type":"single","difficulty":"medium","stem":"What does TensorRT do with a model graph?","choices":["Retrains it on new data","Optimises it for a specific GPU — fusing layers, selecting kernels, choosing precision — and compiles a serialised engine","Converts it to ONNX","Compresses the weights losslessly"],"answer":[1],"explanation":"TensorRT profiles candidate kernel implementations on the target hardware and builds a plan tuned to it. The resulting engine is fast but tied to that GPU architecture, TensorRT version and precision — which is why engines are built as part of deployment rather than shipped as portable artefacts.","tags":["tensorrt","engine","kernel-selection","optimisation"],"ref":"https://docs.nvidia.com/deeplearning/tensorrt/","domain":"deployment-edge"},{"id":"DP-004","type":"single","difficulty":"medium","stem":"Why must a TensorRT engine be rebuilt when moving to a different GPU model?","choices":["The weights change","The engine encodes hardware-specific kernel choices and tactics selected for the original architecture, so it is not portable across GPU generations","TensorRT licences are per-device","The ONNX file expires"],"answer":[1],"explanation":"Optimisation is the point: the builder picks tactics measured on that device. Those choices may be invalid or simply slow elsewhere. Build on the deployment hardware, or on an identical model, and treat the engine as a build artefact rather than a shipped
