const MAX_INTERVAL = 21;
const today = () => new Date().toISOString().slice(0, 10);
const addDays = (n) => new Date(Date.now() + n * 86400000).toISOString().slice(0, 10);

/* SM-2, adapted: binary grade, capped interval, shorter second step. */
function schedule(rec, correct) {
  const grade = correct ? 5 : 2;
  let ease = rec.ease ?? 2.5;
  ease += 0.1 - (5 - grade) * (0.08 + (5 - grade) * 0.02);
  rec.ease = Math.round(Math.max(1.3, Math.min(2.8, ease)) * 1000) / 1000;
  if (!correct) {
    rec.reps = 0;
    rec.interval = 0;
  } else {
    rec.reps = (rec.reps ?? 0) + 1;
    rec.interval = rec.reps === 1 ? 1
      : rec.reps === 2 ? 3
      : Math.min(MAX_INTERVAL, Math.max(1, Math.round((rec.interval ?? 1) * rec.ease)));
  }
  rec.due = addDays(rec.interval);
}

/* Give pre-scheduling records a due date so older progress still counts. */
function migrate() {
  for (const rec of Object.values(progress.q)) {
    if (rec.due) continue;
    rec.ease = rec.ease ?? 2.5;
    rec.reps = rec.reps ?? (rec.streak ?? 0);
    rec.interval = (rec.seen > rec.correct && (rec.streak ?? 0) < 2) ? 0 : 2;
    rec.due = addDays(rec.interval);
  }
}

function duePool() {
  const t = today();
  return DATA.questions
    .filter(q => { const r = progress.q[q.id]; return r && (r.due ?? "9999") <= t; })
    .sort((a, b) => (progress.q[a.id].due || "").localeCompare(progress.q[b.id].due || ""));
}

function dueCounts() {
  const t = today(), wk = addDays(7);
  let due = 0, week = 0, fresh = 0;
  for (const q of DATA.questions) {
    const r = progress.q[q.id];
    if (!r || !r.seen) fresh++;
    else if ((r.due ?? "9999") <= t) due++;
    else if ((r.due ?? "9999") <= wk) week++;
  }
  const cards = DATA.cards.filter(c => (progress.q[c.id]?.due ?? "0") <= t).length;
  return { due, week, fresh, cards };
}

function mergeRecord(qid, correct) {
  const r = progress.q[qid] || { seen: 0, correct: 0, streak: 0 };
  r.seen += 1;
  if (correct) { r.correct += 1; r.streak = (r.streak || 0) + 1; } else { r.streak = 0; }
  r.last = new Date().toISOString();
  schedule(r, correct);
  progress.q[qid] = r;
}

/* ------------------------------------------------------------------ stats */

function domainStats() {
  const out = {};
  for (const d of DATA.domains) out[d.id] = { bank: 0, seen: 0, attempts: 0, correct: 0 };
  for (const q of DATA.questions) {
    const s = out[q.domain];
    s.bank += 1;
    const r = progress.q[q.id];
    if (r && r.seen) { s.seen += 1; s.attempts += r.seen; s.correct += r.correct; }
  }
  for (const id in out) {
    const s = out[id];
    s.acc = s.attempts ? s.correct / s.attempts : null;
  }
  return out;
}

function readiness(stats) {
  let num = 0, den = 0;
  for (const d of DATA.domains) {
    const s = stats[d.id];
    if (s.acc !== null) { num += s.acc * d.weight; den += d.weight; }
  }
  return { value: den ? num / den : null, coverage: den / WEIGHT_TOTAL };
}

function drillPool() {
  return DATA.questions.filter(q => {
    const r = progress.q[q.id];
    return r && r.seen > r.correct && (r.streak || 0) < 2;
  });
}

function band(frac) { return frac >= PASS ? "pass" : frac >= 0.6 ? "warn" : "fail"; }

/* --------------------------------------------------------------- sampling */

function shuffled(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/** Apportion n questions across domains by blueprint weight (largest remainder). */
function weightedSample(n) {
  const pool = {};
  for (const q of DATA.questions) (pool[q.domain] = pool[q.domain] || []).push(q);
  const exact = {}, counts = {};
  for (const d of DATA.domains) {
    if (!pool[d.id]) continue;
    exact[d.id] = n * d.weight / WEIGHT_TOTAL;
    counts[d.id] = Math.floor(exact[d.id]);
  }
  let short = n - Object.values(counts).reduce((a, b) => a + b, 0);
  const byFrac = Object.keys(exact).sort((a, b) => (exact[b] % 1) - (exact[a] % 1));
  for (const id of byFrac) { if (short <= 0) break; counts[id]++; short--; }

  const picked = [];
  for (const id in counts) {
    // Prefer unseen questions, then ones previously missed.
    const ranked = shuffled(pool[id]).sort((a, b) => score(a) - score(b));
    picked.push(...ranked.slice(0, Math.min(counts[id], ranked.length)));
  }
  const chosen = new Set(picked.map(q => q.id));
  if (picked.length < n) {
    for (const q of shuffled(DATA.questions)) {
      if (picked.length >= n) break;
      if (!chosen.has(q.id)) { picked.push(q); chosen.add(q.id); }
    }
  }
  return shuffled(picked).slice(0, n);

  function score(q) {
    const r = progress.q[q.id];
    if (!r) return -100;
    return r.seen - (r.seen - r.correct) * 2;
  }
}

/** Permute a question's choices so answer position is never memorized. */
function present(q) {
  const order = shuffled(q.choices.map((_, i) => i));
  return {
    ref: q,
    stem: q.stem,
    type: q.type,
    choices: order.map(i => q.choices[i]),
    answer: q.answer.map(a => order.indexOf(a)).sort((x, y) => x - y),
  };
}

/* ------------------------------------------------------------------ views */

let view = "home";
let S = null;   // active session

function startSession(kind) {
  let items, timed = false, feedback = true, title = "Practice";
  if (kind.mode === "exam") {
    const n = Math.min(kind.count || EXAM_N, DATA.questions.length);
    items = weightedSample(n);
    timed = true; feedback = false; title = ASSESSMENT;
  } else if (kind.mode === "domain") {
    items = shuffled(DATA.questions.filter(q => q.domain === kind.domain));
    title = DOM_BY_ID[kind.domain].name;
  } else if (kind.mode === "review") {
    const w = {}; DATA.domains.forEach(d => w[d.id] = d.weight);
    items = duePool().sort((a, b) => {
      const da = (progress.q[a.id].due || ""), db = (progress.q[b.id].due || "");
      return da === db ? (w[b.domain] - w[a.domain]) : da.localeCompare(db);
    });
    title = "Review";
  } else if (kind.mode === "concept") {
    items = shuffled(DATA.questions.filter(q => conceptsOf(q).includes(kind.conceptId)));
    title = "Concept — " + CONCEPT_BY_ID[kind.conceptId].name;
  } else if (kind.mode === "case") {
    const c = DATA.cases.find(x => x.id === kind.caseId);
    items = c.questions.map(id => Q_BY_ID[id]).filter(Boolean);
    title = c.title;
  } else if (kind.mode === "drill") {
    const w = {}; DATA.domains.forEach(d => w[d.id] = d.weight);
    items = drillPool().sort((a, b) => {
      const dw = w[b.domain] - w[a.domain];
      if (dw) return dw;
      const ra = progress.q[a.id], rb = progress.q[b.id];
      return (rb.seen - rb.correct) - (ra.seen - ra.correct);
    });
    title = "Drill";
  } else {
    items = weightedSample(Math.min(15, DATA.questions.length));
  }
  if (!items.length) return;
  S = {
    kind: kind.mode, title, timed, feedback,
    items: items.map(present),
    picks: items.map(() => null),
    flags: new Set(),
    revealed: new Set(),
    peeked: new Set(),
    i: 0,
    started: Date.now(),
    deadline: timed ? Date.now() + TRACK.assessment_minutes * 60000 : null,
    report: null,
  };
  view = "quiz";
  render();
  if (timed) tick();
}

let ticker = null;
function tick() {
  clearInterval(ticker);
  ticker = setInterval(() => {
    if (!S || !S.deadline || view !== "quiz") { clearInterval(ticker); return; }
    const left = S.deadline - Date.now();
    const el = document.getElementById("clock");
    if (el) {
      el.textContent = fmtClock(Math.max(0, left));
      el.classList.toggle("low", left < 300000);
    }
    if (left <= 0) { clearInterval(ticker); finish(true); }
  }, 1000);
}

function fmtClock(ms) {
  const t = Math.round(ms / 1000);
  return String(Math.floor(t / 60)).padStart(2, "0") + ":" + String(t % 60).padStart(2, "0");
}

function choose(ci) {
  const it = S.items[S.i];
  if (S.revealed.has(S.i)) return;
  const want = it.answer.length;
  let cur = S.picks[S.i] ? S.picks[S.i].slice() : [];
  if (want === 1) {
    cur = [ci];
  } else if (cur.includes(ci)) {
    cur = cur.filter(x => x !== ci);
  } else {
    cur.push(ci);
    if (cur.length > want) cur.shift();
  }
  S.picks[S.i] = cur.sort((a, b) => a - b);
  if (S.feedback && cur.length === want) reveal();
  else render();
}

/* Show the answer mid-run without ending or advancing it. Whatever you had
   selected stands, and the question locks so a change made after seeing the key
   cannot flatter the score. The report separates aided from unaided answers. */
function peek() {
  S.peeked.add(S.i);
  S.revealed.add(S.i);
  render();
}

function reveal() {
  const it = S.items[S.i];
  const picks = S.picks[S.i] || [];
  S.revealed.add(S.i);
  mergeRecord(it.ref.id, same(picks, it.answer));
  save();
  render();
}

function same(a, b) { return a.length === b.length && a.every((x, i) => x === b[i]); }

function go(delta) {
  const next = S.i + delta;
  if (next < 0 || next >= S.items.length) return;
  S.i = next;
  render();
  window.scrollTo({ top: 0, behavior: "instant" });
}

function finish(expired) {
  clearInterval(ticker);
  if (S.report) { view = "report"; render(); window.scrollTo({ top: 0, behavior: "instant" }); return; }
  const rows = [];
  S.items.forEach((it, idx) => {
    const picks = S.picks[idx];
    if (!S.feedback && picks) mergeRecord(it.ref.id, same(picks, it.answer));
    const blindPeek = S.peeked.has(idx) && !picks;
    if (blindPeek) mergeRecord(it.ref.id, false);   // you needed the answer: schedule it
    rows.push({ it, picks: picks || [], ok: picks ? same(picks, it.answer) : false,
                answered: !!picks, peeked: S.peeked.has(idx), blindPeek });
  });
  const answered = rows.filter(r => r.answered).length;
  // A blank is a wrong answer on the real exam, so a mock counts it. In a session
  // that reveals answers as you go, an unreached question was never attempted —
  // scoring it wrong would punish you for stopping early.
  const scored = S.feedback ? rows.filter(r => r.answered) : rows;
  const got = scored.filter(r => r.ok).length;
  const frac = scored.length ? got / scored.length : 0;
  // Revealed with nothing selected means you did not know it: aided, not measured.
  const unaidedRows = scored.filter(r => !r.blindPeek);
  const unaidedGot = unaidedRows.filter(r => r.ok).length;
  if (S.kind === "exam") {
    progress.exams.unshift({
      at: new Date().toISOString(), score: +frac.toFixed(4),
      n: rows.length, answered, seconds: Math.round((Date.now() - S.started) / 1000),
    });
    progress.exams = progress.exams.slice(0, 40);
  }
  save();
  S.report = { rows: scored, all: rows, got, frac, answered,
               revealed: rows.filter(r => r.peeked).length,
               blind: rows.filter(r => r.blindPeek).length,
               unaidedGot, unaidedN: unaidedRows.length,
               stoppedEarly: S.feedback && scored.length < rows.length,
               expired: !!expired, seconds: Math.round((Date.now() - S.started) / 1000) };
  view = "report";
  render();
  window.scrollTo({ top: 0, behavior: "instant" });
}

function meter(frac, cls) {
  const pct = frac === null ? 0 : Math.round(frac * 100);

}

let FC = null;   // active flashcard session

function startCards(deck) {
  const t = today();
  let pool = DATA.cards.filter(c => (progress.q[c.id]?.due ?? "0") <= t);
  if (deck) pool = pool.filter(c => c.deck === deck);
  if (!pool.length) pool = (deck ? DATA.cards.filter(c => c.deck === deck) : DATA.cards).slice();
  pool = shuffled(pool).slice(0, 25);
  FC = { pool, i: 0, shown: false, right: 0, deck };
  view = "cards";
  render();
}

function gradeCard(ok) {
  const card = FC.pool[FC.i];
  const rec = progress.q[card.id] || { seen: 0, correct: 0, streak: 0 };
  rec.seen += 1;
  if (ok) { rec.correct += 1; rec.streak = (rec.streak || 0) + 1; FC.right += 1; }
  else { rec.streak = 0; }
  rec.last = new Date().toISOString();
  schedule(rec, ok);
  progress.q[card.id] = rec;
  save();
  FC.i += 1; FC.shown = false;
  render();
}

    }).join("")}</ul>
  </div>

  <div class="panel" style="margin-top:14px">
    <div class="panel-hd"><span class="eyebrow">Practice elsewhere</span>
      <span class="mono" style="margin-left:auto;font-size:11px;color:var(--muted)">opens in a new tab</span></div>
    <p class="lk-note">A second opinion is worth having — different authors probe different
      corners of the blueprint. These are other people's practice exams, linked rather than
      copied: every question in this simulator is original. Sites advertising
      <em>actual</em> or <em>real</em> exam questions are deliberately absent; that content is
      reconstructed from live exams, breaches the candidate agreement, and is frequently wrong.</p>
    <ul class="links" style="margin-top:10px">
      ${ELSEWHERE.map(l => `<li><a class="row" href="${esc(l.url)}" target="_blank" rel="noopener">
        <span class="lk-nm">${esc(l.name)} <span style="color:var(--muted);font-weight:400">↗</span></span>
        <span class="lk-sub">${esc(l.sub)}</span>
        <span class="lk-tag">${esc(l.tag)}</span>
      </a></li>`).join("")}
    </ul>
  </div>`;
}

function cheatHTML() {
  return `<div class="panel">
    <div class="panel-hd"><span class="eyebrow">Cheat sheets</span>
      <span class="mono" style="font-size:11px;color:var(--muted)">condensed reference, not questions</span>
      <button class="btn printbtn" data-print="1">Print</button></div>
    <div class="panel-bd" style="padding-top:14px">
      ${DATA.cheats.sections.map(sec => `<section class="cheat-sec" id="cs-${esc(sec.id)}">
        <div class="cheat-hd">
          <h2>${esc(sec.title)}</h2>
          <span class="cheat-kicker">${esc(sec.kicker)}</span>
        </div>
        <div class="cheat-bd">${sec.blocks.map(blockHTML).join("")}</div>
      </section>`).join("")}
    </div>
  </div>`;
}

function cramHTML() {
  return `<div class="panel">
    <div class="panel-hd"><span class="eyebrow">Cram sheet</span>
      <span class="mono" style="margin-left:auto;font-size:11px;color:var(--muted)">${DATA.questions.length} items · answer and reasoning, no quiz</span></div>
    ${DATA.domains.map(d => {
      const qs = DATA.questions.filter(q => q.domain === d.id);
      const open = cramOpen.has(d.id);
      return `<div class="cram-dom">
        <button class="cram-hd" data-cram="${d.id}" aria-expanded="${open}">
          <span class="mono" style="font-size:11px;font-weight:700;color:var(--accent);min-width:28px">${d.weight}%</span>
          <b>${esc(d.name)}</b>
          <span class="mono" style="font-size:11px;color:var(--muted)">${qs.length} · ${open ? "hide" : "show"}</span>
        </button>
        ${open ? `<div class="cram-body">${qs.map(q => `<div class="cram-q">
          <div class="id">${esc(q.id)} · ${esc(q.tags.join(", "))}</div>
          <div class="qs">${esc(q.stem)}</div>
          <div class="ans">→ ${q.answer.map(a => esc(q.choices[a])).join(" · ")}</div>
          <div class="ex">${esc(q.explanation)}</div>
        </div>`).join("")}</div>` : ""}
      </div>`;
    }).join("")}
  </div>`;
}

const cramOpen = new Set();

function renderFoot() {
  document.getElementById("foot").innerHTML =
    `${esc(TRACK.name)} \u00b7 ${esc(TRACK.tagline || "")}<br>
     ${esc(UI.footer_note || "")}<br>
     ${CERTIFICATION ? `Aligned with <a href="${esc(CERTIFICATION.source)}" target="_blank" rel="noopener">${esc(CERTIFICATION.name)}</a> (${esc(CERTIFICATION.code)}) \u2014 ${esc(CERTIFICATION.alignment)}<br>` : ""}
     Progress saved ${esc(syncLabel)}`;
}

/* ------------------------------------------------------------------- input */

function bind() {
  document.querySelectorAll("[data-tab]").forEach(el => el.onclick = () => {
    view = el.dataset.tab; render();
    window.scrollTo({ top: 0, behavior: "instant" });
  });
  document.querySelectorAll("[data-start]").forEach(el => el.onclick = () => startSession({ mode: el.dataset.start }));
  document.querySelectorAll("[data-domain]").forEach(el => el.onclick = () => startSession({ mode: "domain", domain: el.dataset.domain }));
  document.querySelectorAll("[data-choose]").forEach(el => el.onclick = () => choose(+el.dataset.choose));
  document.querySelectorAll("[data-nav]").forEach(el => el.onclick = () => go(+el.dataset.nav));
  document.querySelectorAll("[data-jump]").forEach(el => el.onclick = () => { S.i = +el.dataset.jump; render(); });
  document.querySelectorAll("[data-reveal]").forEach(el => el.onclick = reveal);
  document.querySelectorAll("[data-peek]").forEach(el => el.onclick = peek);
  document.querySelectorAll("[data-print]").forEach(el => el.onclick = () => window.print());
  document.querySelectorAll("[data-case]").forEach(el => el.onclick = () =>
    startSession({ mode: "case", caseId: el.dataset.case }));
  document.querySelectorAll("[data-cards]").forEach(el => el.onclick = () => startCards(null));
  document.querySelectorAll("[data-concept]").forEach(el => el.onclick = () =>
    startSession({ mode: "concept", conceptId: el.dataset.concept }));
  document.querySelectorAll("[data-cheatjump]").forEach(el => el.onclick = () => {
    view = "cheat"; render();
    document.getElementById("cs-" + el.dataset.cheatjump)?.scrollIntoView({ behavior: "smooth" });
  });
  document.querySelectorAll("[data-deck]").forEach(el => el.onclick = (ev) => {
    ev.preventDefault(); startCards(el.dataset.deck);
  });
  document.querySelectorAll("[data-reveal-card]").forEach(el => el.onclick = () => {
    FC.shown = true; render();
  });
  document.querySelectorAll("[data-grade]").forEach(el => el.onclick = () =>
    gradeCard(el.dataset.grade === "1"));
  document.querySelectorAll("[data-back-report]").forEach(el => el.onclick = () => {
    view = "report"; render(); window.scrollTo({ top: 0, behavior: "instant" });
  });
  document.querySelectorAll("[data-finish]").forEach(el => el.onclick = () => {
    const blank = S.picks.filter(p => !p).length;
    if (!S.feedback && blank && !confirm(`${blank} question${blank > 1 ? "s" : ""} still blank. Submit anyway?`)) return;
    finish(false);
  });
  document.querySelectorAll("[data-flag]").forEach(el => el.onclick = () => {
    S.flags.has(S.i) ? S.flags.delete(S.i) : S.flags.add(S.i);
    render();
  });
  document.querySelectorAll("[data-cram]").forEach(el => el.onclick = () => {
    const id = el.dataset.cram;
    cramOpen.has(id) ? cramOpen.delete(id) : cramOpen.add(id);
    render();
  });
  document.querySelectorAll("[data-review]").forEach(el => el.onclick = () => {
    S.feedback = true;
    S.items.forEach((_, i) => S.revealed.add(i));
    S.i = +el.dataset.review;
    view = "quiz"; render();
    window.scrollTo({ top: 0, behavior: "instant" });
  });
}

document.addEventListener("keydown", ev => {
  if (view === "cards" && FC && !ev.metaKey && !ev.ctrlKey && !ev.altKey) {
    if (FC.i >= FC.pool.length) return;
    const k = ev.key.toUpperCase();
    if (!FC.shown && (ev.key === " " || ev.key === "Enter")) {
      ev.preventDefault(); FC.shown = true; render();
    } else if (FC.shown && (k === "Y" || ev.key === "Enter")) {
      ev.preventDefault(); gradeCard(true);
    } else if (FC.shown && k === "N") {
      ev.preventDefault(); gradeCard(false);
    }
    return;
  }
  if (view !== "quiz" || !S || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  const k = ev.key.toUpperCase();
  if (KEYS.includes(k)) { ev.preventDefault(); choose(KEYS.indexOf(k)); }
  else if (ev.key === "ArrowRight") { ev.preventDefault(); go(1); }
  else if (ev.key === "ArrowLeft") { ev.preventDefault(); go(-1); }
  else if (k === "F") { ev.preventDefault(); S.flags.has(S.i) ? S.flags.delete(S.i) : S.flags.add(S.i); render(); }
  else if (k === "R" && !S.feedback && !S.revealed.has(S.i)) { ev.preventDefault(); peek(); }
  else if (ev.key === "Enter") {
    ev.preventDefault();
    if (S.feedback && !S.revealed.has(S.i) && (S.picks[S.i] || []).length) reveal();
    else if (S.i < S.items.length - 1) go(1);
    else if (!S.report) finish(false);
    else { view = "report"; render(); }
  }
});

/* -------------------------------------------------------------------- boot */

document.getElementById("brand-sub").textContent = TRACK.tagline || TRACK.name;
document.getElementById("brand-code").textContent = TRACK.name;

const loaded = readLocal();
if (loaded && loaded.q) progress = { v: 1, updatedAt: loaded.updatedAt || null, q: loaded.q || {}, exams: loaded.exams || [] };
migrate();
render();
connect();
</script>
