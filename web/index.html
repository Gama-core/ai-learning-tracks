nd its evaluation set were designed for","KV cache fragmentation accumulating over nine months","The embedding model degrading with index size"],"answer":[1],"explanation":"With everything pinned, the environment is what changed: new policies, new vocabulary, new question types. This is why production agents need scheduled re-evaluation against refreshed data and monitoring of the input distribution, not just a launch-time evaluation. Served weights do not decay and cache behavior does not affect correctness.","tags":["drift","re-evaluation","frozen-stack"],"ref":"https://www.nist.gov/itl/ai-risk-management-framework","case":"CS02"},{"id":"CS03-1","domain":"deployment-scaling","type":"single","difficulty":"hard","stem":"Why did the rehearsal collapse at 60 requests per second when load testing reached 200?","choices":["The rehearsal used a different GPU type","The load test stubbed the order-service tool, so the real dependency's latency and concurrency limits were never exercised","Kubernetes throttled the pods","The model version changed between the test and the rehearsal"],"answer":[1],"explanation":"Agent capacity is bounded by the whole call graph, not the inference tier alone. A load test that stubs tools measures only the model path and overstates capacity whenever a downstream dependency is the real constraint — which the traces confirm here.","tags":["load-testing","dependency-capacity","call-graph"],"ref":"https://docs.nvidia.com/nemo/agent-toolkit/latest/","case":"CS03"},{"id":"CS03-2","domain":"deployment-scaling","type":"single","difficulty":"medium","stem":"The autoscaler never scales out even while users queue. What is wrong?","choices":["The stabilization window is too long","CPU utilization is the wrong signal for a GPU-bound inference service; scale on queue depth, pending requests, or GPU utilization","The pods need larger memory limits","Horizontal autoscaling does not work with GPU workloads"],"answer":[1],"explanation":"An LLM server can sit at low CPU while the GPU is saturated and requests queue, so CPU-based scaling is blind to the actual bottleneck. Tying capacity to queue depth or GPU metrics connects scaling to the real constraint.","tags":["autoscaling","wrong-signal","queue-depth"],"ref":"https://docs.nvidia.com/nim/large-language-models/latest/deploy-helm.html","case":"CS03"},{"id":"CS03-3","domain":"deployment-scaling","type":"multi","difficulty":"hard","stem":"Which TWO changes give the largest cost and latency reduction for the repeated 6,000-token prefix?","choices":["Enable prefix KV-cache reuse so the unchanged leading tokens are not recomputed on every step","Route conversations to the replica already holding their prefix, via session affinity or KV-aware routing","Enable speculative decoding","Reduce max output tokens per step"],"answer":[0,1],"explanation":"The waste is repeated prefill of an identical prefix, so the fixes are caching it and making sure requests land where the cache lives — round-robin routing scatters a conversation across replicas that each pay full prefill. Speculative decoding accelerates decode, and output caps do not touch input cost.","tags":["prefix-caching","kv-aware-routing","prefill"],"ref":"https://nvidia.github.io/TensorRT-LLM/advanced/kv-cache-reuse.html","case":"CS03"},{"id":"CS03-4","domain":"deployment-scaling","type":"single","difficulty":"medium","stem":"For the four-day spike pattern, which capacity approach is most appropriate?","choices":["Scale to zero between spikes to control cost","Keep a warm baseline of replicas with images and weights cached locally, and scale out on a leading indicator before latency degrades","Provision for the 15x peak for the entire quarter","Increase readiness-probe timeouts so pods are not killed during spikes"],"answer":[1],"explanation":"Model servers take minutes to load, so a warm floor absorbs the first requests of a spike while pre-cached images and weights shorten scale-out, and scaling on a leading indicator reacts before users feel it. Scale-to-zero puts a multi-minute wait in front of the spike, and peak provisioning for a quarter wastes the other 86 days.","tags":["autoscaling","cold-start","bursty-traffic"],"ref":"https://docs.nvidia.com/nim/large-language-models/latest/deploy-helm.html","case":"CS03"},{"id":"CS04-1","domain":"agent-architecture","type":"single","difficulty":"medium","stem":"The eight sources are independent and latency is the top complaint. Which topology fits?","choices":["Keep the sequential chain but raise the step limit","Fan out to eight workers in parallel, then synthesize with a single aggregator","Add a debate stage where two agents argue over each source before accepting it","Merge the eight sources into one tool so the agent makes a single call"],"answer":[1],"explanation":"Independent subtasks feeding one synthesis step is the canonical scatter-gather shape, and wall-clock becomes the slowest branch rather than the sum of eight. Sequential traversal serializes work that has no ordering dependency, debate multiplies latency, and collapsing eight heterogeneous sources into one tool hides the structure without making it faster.","tags":["parallelism","fan-out","latency"],"ref":"https://arxiv.org/abs/2402.01680","case":"CS04"},{"id":"CS04-2","domain":"cognition-planning-memory","type":"single","difficulty":"hard","stem":"What best explains the agent losing the thread after about step twelve, and what fixes it?","choices":["The context window is too small; move to a model with a larger window","Goal drift from carrying the objective only in accumulating conversation history; externalize an explicit plan into durable state and re-assert the objective near the current turn","The temperature is too high; set it to zero","The model is not a reasoning model; switch to one"],"answer":[1],"explanation":"As history grows, an objective stated once at the top competes with thousands of intervening tokens and attention to middle-of-context content degrades. Holding the plan in state gives every step a stable reference to the global goal and makes progress checkable. A larger window gives the drift more room rather than removing it.","tags":["goal-drift","planner-executor","context-position"],"ref":"https://arxiv.org/abs/2307.03172","case":"CS04"},{"id":"CS04-3","domain":"agent-development","type":"single","difficulty":"medium","stem":"Which change removes the cost of re-reading the methodology document without losing capability?","choices":["Switch to a model with a larger context window","Read it once, extract the relevant facts, and carry a compact structured summary forward in state","Cap max output tokens per step","Raise the step limit so the agent works more incrementally"],"answer":[1],"explanation":"The waste is redundant input tokens on an unchanging document. Reading once and forwarding a compact structured representation preserves what later steps need while eliminating the repetition. A larger window makes the waste cheaper to tolerate, not smaller, and output caps and step limits do not touch repeated input.","tags":["context-engineering","cost-optimization","state-design"],"ref":"https://docs.nvidia.com/nemo/agent-toolkit/latest/","case":"CS04"},{"id":"CS04-4","domain":"deployment-scaling","type":"single","difficulty":"medium","stem":"Simple lookups and deep research share the same large model. Which change cuts cost with least risk to hard questions?","choices":["Quantize the large model to INT4 and route everything to it","Add a router that sends simple lookups to a small fast model and escalates research questions to the large one","Cap the reasoning budget for all requests","Cache responses keyed on the exact question string"],"answer":[1],"explanation":"Model cascading matches request difficulty to model capability, removing the cheap majority of traffic from the expensive path while leaving hard-case quality untouched. Blanket quantization and global reasoning caps degrade the difficult cases too, and exact-string caching has a very low hit rate on analyst questions.","tags":["model-cascade","routing","cost"],"ref":"https://docs.nvidia.com/nemo/agent-toolkit/latest/","case":"CS04"},{"id":"CS05-1","domain":"safety-ethics-compliance","type":"single","difficulty":"hard","stem":"What class of attack does the wiki sentence represent, and what is the primary mitigation?","choices":["Model hallucination; mitigate with a larger model","Knowledge-base poisoning via indirect prompt injection; treat retrieved content as untrusted data that is fenced and never granted instruction authority, moderate contributions, and filter at the retrieval rail","Data drift; mitigate by re-evaluating the model","Jailbreak; mitigate with an input rail on user messages"],"answer":[1],"explanation":"A writable corpus is an attacker-reachable input to the prompt, so instruction-like text in a document is indirect injection through poisoning. Defenses span the lifecycle: moderate and attribute contributions, keep provenance, filter at the retrieval rail, and structurally prevent retrieved text from carrying instruction authority. Input rails on user messages never see this content.","tags":["knowledge-base-poisoning","indirect-injection","retrieval-rails"],"ref":"https://arxiv.org/abs/2302.12173","case":"CS05"},{"id":"CS05-2","domain":"human-ai-oversight","type":"single","difficulty":"hard","stem":"Clinicians accept nearly every suggestion, sometimes within seconds. What is happening and what is the best response?","choices":["The assistant is highly accurate; reduce the review requirement","Automation bias and review fatigue; present the supporting evidence before the recommendation, make rejection as cheap as approval, and capture the reason","The clinicians need more training on the tool","The interface is too slow; optimize its latency"],"answer":[1],"explanation":"Seconds-long approvals cannot involve verifying evidence, which makes the gate ceremonial. Anchoring is the mechanism: showing the recommendation first frames the review. Ordering evidence before the suggestion, removing the friction asymmetry between accepting and rejecting, and capturing rejection reasons all restore genuine review. Treating high acceptance as proof of accuracy inverts cause and effect.","tags":["automation-bias","anchoring","reviewer-ux"],"ref":"https://www.nist.gov/itl/ai-risk-management-framework","case":"CS05"},{"id":"CS05-3","domain":"safety-ethics-compliance","type":"single","difficulty":"medium","stem":"Under the EU AI Act, how should this deployment be treated?","choices":["Minimal risk, since a clinician makes the final decision","High-risk, bringing obligations for risk management, data governance, technical documentation, logging, human oversight, and conformity assessment","Prohibited, because it involves medical decisions","Limited risk, requiring only that users are told it is an AI"],"answer":[1],"explanation":"Safety-relevant uses in healthcare fall under the high-risk category, which brings substantive lifecycle obligations rather than a disclosure-only or voluntary regime. Having a human in the loop is itself one of the required controls, not an exemption from the classification.","tags":["eu-ai-act","high-risk","healthcare"],"ref":"https://artificialintelligenceact.eu/","case":"CS05"},{"id":"CS05-4","domain":"knowledge-data","type":"multi","difficulty":"hard","stem":"Which TWO design choices most improve a clinician's ability to verify a suggestion?","choices":["Carry a stable document identifier and version through retrieval into the prompt, and require a citation per clinical claim","Verify after generation that each cited identifier exists in the retrieved set and supports the claim, flagging answers that fail","Include the model's full reasoning trace with every suggestion","Report the assistant's historical accuracy on similar cases alongside each suggestion"],"answer":[0,1],"explanation":"Verifiability requires an unambiguous pointer to the evidence and a check that the pointer is real and supportive, which together make citation checkable rather than decorative. Reasoning traces are not a faithful account of the computation and can lend false confidence, and historical accuracy describes the population rather than this case.","tags":["citations","attribution-verification","clinical"],"ref":"https://docs.ragas.io/en/stable/concepts/metrics/available_metrics/faithfulness/","case":"CS05"},{"id":"CS06-1","domain":"nvidia-platform","type":"multi","difficulty":"medium","stem":"Which TWO properties of a self-hosted NIM directly address the regulator's requirement and the silent-update incident?","choices":["It runs as a container on your own infrastructure, so prompts and outputs never leave your network boundary","You control which model version is deployed, so no upstream provider can change behavior underneath you","It guarantees lower cost per token than any hosted API","It removes the need to evaluate the model before deployment"],"answer":[0,1],"explanation":"Data locality and version control are exactly the two properties a shared hosted endpoint cannot give you, and they map one-to-one onto the two problems described. Cost depends entirely on utilization — a lightly used dedicated GPU is more expensive per token — and evaluation is required either way.","tags":["nim","data-residency","version-control"],"ref":"https://docs.nvidia.com/nim/large-language-models/latest/introduction.html","case":"CS06"},{"id":"CS06-2","domain":"agent-development","type":"single","difficulty":"medium","stem":"What lets the team keep their existing client code through the migration?","choices":["NIM exposes an OpenAI-compatible API, so moving from a hosted endpoint to a self-hosted container is largely a base-URL change","NIM automatically translates any client SDK to its native protocol","The team must rewrite the client against Triton's gRPC interface","NIM requires the client to be rewritten but provides a migration tool"],"answer":[0],"explanation":"API compatibility is what makes prototype-to-production migration cheap: the same OpenAI-compatible surface is exposed by hosted build.nvidia.com endpoints and by the self-hosted container, so the client keeps its request shapes including the tools parameter.","tags":["openai-compatible","migration","nim"],"ref":"https://docs.nvidia.com/nim/large-language-models/latest/function-calling.html","case":"CS06"},{"id":"CS06-3","domain":"deployment-scaling","type":"single","difficulty":"hard","stem":"How should the four customer-specific variants be served?","choices":["Four independent full-weight model deployments, one per customer","Train them as LoRA adapters and use multi-LoRA serving against a single loaded base model, selecting the adapter per request by tenant","Merge all four adapters into one set of base weights","Serve one variant and prompt-engineer the differences per customer"],"answer":[1],"explanation":"Adapters are a small fraction of the parameters, so loading the base model once and selecting an adapter per request avoids multiplying GPU cost by the number of customers. Merging adapters collapses the per-customer behavior the tuning created, and four full deployments is the cost mistake multi-LoRA exists to prevent.","tags":["multi-lora","multi-tenancy","serving-efficiency"],"ref":"https://docs.nvidia.com/nim/large-language-models/latest/peft.html","case":"CS06"},{"id":"CS06-4","domain":"evaluation-tuning","type":"single","difficulty":"hard","stem":"To cut cost, the team quantizes to INT4. Aggregate benchmark accuracy drops under a point, but in staging tool calls start failing schema validation. What should they conclude?","choices":["The quantization is faulty and should be redone","Aggregate benchmarks average over many behaviors and hid disproportionate damage to precise structured output; quantized models must be evaluated on the specific capabilities the agent depends on","INT4 models cannot perform tool calling","The inference server stopped applying the chat template"],"answer":[1],"explanation":"A near-flat aggregate score is compatible with severe degradation of a narrow, low-entropy behavior like exact schema adherence. The discipline is capability-specific evaluation of the quantized model — and constrained decoding is a good mitigation here, since it makes conforming output structural.","tags":["quantization-evaluation","structured-output","capability-specific"],"ref":"https://nvidia.github.io/TensorRT-LLM/reference/precision.html","case":"CS06"},{"id":"CS07-1","domain":"safety-ethics-compliance","type":"single","difficulty":"medium","stem":"Which control would most reliably have prevented the exfiltration?","choices":["A system prompt instructing the agent never to obey instructions found in web content","Scoping the email tool to an approved recipient set, so an agent acting on injected instructions cannot reach an external address","A larger model better at recognizing manipulation","Retaining the audit log for longer"],"answer":[1],"explanation":"Indirect injection cannot be reliably prevented at the prompt layer, so the defense must bound what a compromised agent is able to do. An allowlist on recipients makes the exfiltration path structurally unavailable. Prompt prohibitions are bypassable, model capability is not a security boundary, and logs are detection after the loss.","tags":["indirect-injection","allowlist","exfiltration"],"ref":"https://arxiv.org/abs/2302.12173","case":"CS07"},{"id":"CS07-2","domain":"agent-architecture","type":"single","difficulty":"hard","stem":"The single service account with full access to all three systems illustrates which problem?","choices":["A confused deputy: the agent holds broad authority and was manipulated by untrusted input into an action the attacker could not perform directly","A race condition between the three tool integrations","A rate-limiting failure","Context dilution across a long conversation"],"answer":[0],"explanation":"A deputy holds authority and is tricked into exercising it on someone else's behalf. Agents are natural deputies because they run with service credentials while acting on attacker-reachable input. The mitigations are acting with the requesting user's authority rather than the agent's, and narrowing each capability to its own least-privilege scope.","tags":["confused-deputy","least-privilege","service-account"],"ref":"https://genai.owasp.org/llm-top-10/","case":"CS07"},{"id":"CS07-3","domain":"agent-development","type":"multi","difficulty":"hard","stem":"Which TWO prompt-assembly practices reduce this class of incident?","choices":["Place fetched page content in a clearly delimited block labeled as untrusted data that must not be interpreted as instructions","Never interpolate fetched content into the trusted system section of the prompt","Put the fetched content first so the model reads it before the instructions","Merge fetched content into the system prompt so it carries the same authority as the instructions"],"answer":[0,1],"explanation":"Injection resistance depends on maintaining a trust boundary inside the prompt: untrusted content is fenced and labeled as data, and the privileged section is never constructed from attacker-reachable text. Promoting fetched content into the system prompt grants it instruction authority, which is the mechanism by which indirect injection succeeds.","tags":["prompt-assembly","trust-boundary","fencing"],"ref":"https://arxiv.org/abs/2302.12173","case":"CS07"},{"id":"CS07-4","domain":"run-monitor-maintain","type":"single","difficulty":"medium","stem":"Nothing was deployed that day, yet behavior changed at 14:05. What does the investigation need first?","choices":["Roll back the model to the previous version and observe","The traces around 14:05, read as a causal tree, to identify which span introduced the instruction and which tool acted on it","A full offline evaluation run","Increased logging verbosity going forward"],"answer":[1],"explanation":"A sharp time boundary with no deployment points at the input rather than the stack, and a trace preserves the parent-child structure showing exactly which retrieval or fetch introduced the content and which tool call consumed it. Blind rollback treats a data-borne attack as a code regression, and offline runs and future logging both delay the diagnosis.","tags":["incident-response","traces","causal-tree"],"ref":"https://opentelemetry.io/docs/specs/semconv/gen-ai/","case":"CS07"},{"id":"CS08-1","domain":"run-monitor-maintain","type":"single","difficulty":"medium","stem":"With volume flat, which breakdown identifies the cause fastest?","choices":["Cost by time of day","Cost per task split into prompt versus completion tokens and attributed per step, compared against last month","Total GPU hours consumed","Error rate by agent"],"answer":[1],"explanation":"Flat volume with rising spend means cost per task grew, so the question is which component grew. Splitting prompt from completion tokens and attributing to steps separates a context-growth problem from a trajectory-length problem, which have different fixes. GPU hours and error rates do not decompose the token bill.","tags":["cost-attribution","token-accounting","diagnosis"],"ref":"https://docs.nvidia.com/nemo/agent-toolkit/latest/","case":"CS08"},{"id":"CS08-2","domain":"evaluation-tuning","type":"single","difficulty":"hard","stem":"The top-k change from 5 to 20 improved recall. What is the likely trade-off the team did not measure?","choices":["Embedding quality degraded","Prompt tokens per request roughly quadrupled, raising cost and latency, and the extra passages dilute attention through position effects","The vector index became inconsistent","Faithfulness necessarily improved with more context"],"answer":[1],"explanation":"Retrieval quantity is paid for in prompt tokens on every call, and more passages do not straightforwardly improve answers: models attend less reliably to middle-of-context content, so additional low-ranked passages can dilute the useful evidence. Recall improved; cost, latency and possibly precision were the untracked cost.","tags":["top-k-tradeoff","prompt-cost","position-effects"],"ref":"https://arxiv.org/abs/2307.03172","case":"CS08"},{"id":"CS08-3","domain":"agent-architecture","type":"single","difficulty":"medium","stem":"The 47-tool agent shows falling tool-selection accuracy. What addresses the root cause?","choices":["Raise the per-request timeout","Partition the tools across specialized sub-agents, or retrieve a small relevant subset of tool definitions per turn","Repeat the tool list in every user message for redundancy","Switch to a model with a larger context window"],"answer":[1],"explanation":"The cause is tool-space overload: many similar schemas in one context degrade selection and inflate prompt tokens on every call. Partitioning behind sub-agents or retrieving candidate tools shrinks the decision space. Duplicating the catalog makes both problems worse and a larger window accommodates the bloat rather than removing it.","tags":["tool-overload","tool-retrieval","sub-agents"],"ref":"https://modelcontextprotocol.io/docs/learn/architecture","case":"CS08"},{"id":"CS08-4","domain":"run-monitor-maintain","type":"multi","difficulty":"medium","stem":"Which TWO telemetry additions would have surfaced both problems before finance did?","choices":["Per-step prompt and completion token counts, rolled up to cost per completed task","Tool-call counts, tool-error rates, and step counts per task including runs that hit the step limit","HTTP status code distribution per agent","Container CPU and memory utilization"],"answer":[0,1],"explanation":"Token and cost accounting per task would have shown the top-k change's true price immediately, and tool-and-step trajectory metrics would have exposed the selection degradation as rising retries and step counts. Status codes and container metrics are generic infrastructure signals that stay healthy through both failures.","tags":["telemetry","agent-metrics","leading-indicators"],"ref":"https://opentelemetry.io/docs/specs/semconv/gen-ai/","case":"CS08"},{"id":"CS09-1","domain":"human-ai-oversight","type":"single","difficulty":"hard","stem":"Which rollout sequence carries the least risk?","choices":["Enable refunds with a $100 cap, since a cap bounds the damage","Run in shadow mode proposing refunds without executing, compare proposals against human decisions, then enable execution only for the band where agreement is high","Enable refunds for a random 10% of customers to gather a representative sample","Enable refunds and rely on the audit log plus a nightly reconciliation job"],"answer":[1],"explanation":"Shadow mode produces a measured agreement rate against human judgment before any irreversible action reaches a customer, and lets the first release be scoped to where the agent is demonstrably reliable. Caps, random exposure and after-the-fact reconciliation all let wrong irreversible actions happen before any evidence exists.","tags":["shadow-mode","progressive-rollout","irreversibility"],"ref":"https://www.nist.gov/itl/ai-risk-management-framework","case":"CS09"},{"id":"CS09-2","domain":"evaluation-tuning","type":"single","difficulty":"hard","stem":"How much confidence should the 4-point gain on the 60-example set carry?","choices":["High: it is the team's agreed quality gate","Low: 4 points on 60 examples is about two examples and likely within run-to-run variance, and the set is eight months stale","High, provided the judge model is the same one that generated the answers","Low, but only because the set is too small; staleness does not matter"],"answer":[1],"explanation":"The result is underpowered and the measurement instrument is also suspect: a set built at launch no longer represents current traffic, and repeated tuning against a fixed set overfits to it. Both problems matter. Reusing the generator model as judge would add self-preference bias rather than confidence.","tags":["statistical-power","stale-eval-set","overfitting"],"ref":"https://docs.smith.langchain.com/evaluation/concepts","case":"CS09"},{"id":"CS09-3","domain":"evaluation-tuning","type":"single","difficulty":"medium","stem":"At 300 sessions per week, how should the prompt change be validated online?","choices":["Run an A/B test for one week and ship whichever arm is ahead","State the minimum effect worth detecting, size the test against it, and accept a longer run rather than a fast but underpowered result","Ship to 100% and watch the dashboards","Compare this week's metrics against last week's"],"answer":[1],"explanation":"At this volume a one-week test cannot resolve a small effect, and week-over-week comparison confounds the change with everything else that varied. Declaring the minimum detectable effect in advance and sizing the experiment to it is what makes the eventual result mean something.","tags":["minimum-detectable-effect","low-traffic","experiment-design"],"ref":"https://docs.smith.langchain.com/evaluation/concepts","case":"CS09"},{"id":"CS09-4","domain":"human-ai-oversight","type":"single","difficulty":"medium","stem":"For refunds that do go to a human approver, what most improves decision quality?","choices":["The agent's full reasoning transcript for the session","The evidence the agent relied on with links to the source records, plus a precise statement of what will happen on approval and whether it can be reversed","The agent's confidence score, shown prominently","The agent's historical accuracy on refunds of similar size"],"answer":[1],"explanation":"An approver needs to verify the basis for the action and calibrate scrutiny to its consequences, which requires citable evidence and a clear statement of effect and reversibility. Reasoning transcripts overwhelm reviewers and are not a faithful account of the decision, and a prominent confidence score strengthens the anchor that produces rubber-stamping.","tags":["reviewer-ux","evidence","reversibility"],"ref":"https://langchain-ai.github.io/langgraph/concepts/human_in_the_loop/","case":"CS09"},{"id":"CS10-1","domain":"evaluation-tuning","type":"single","difficulty":"medium","stem":"Which intervention fits the terminology and formatting complaint?","choices":["Retrieval-augmented generation over the 3,000 summaries","Parameter-efficient fine-tuning (LoRA) on the 3,000 in-house summaries","Full pre-training on the firm's corpus","Constrained decoding against the output schema"],"answer":[1],"explanation":"Fine-tuning teaches form, style and vocabulary, and a few thousand consistent examples is the right scale for PEFT. Retrieval supplies facts rather than instilling a house voice, pre-training is orders of magnitude disproportionate, and constrained decoding governs structure rather than word choice.","tags":["lora","style-vs-facts","intervention-choice"],"ref":"https://arxiv.org/abs/2106.09685","case":"CS10"},{"id":"CS10-2","domain":"knowledge-data","type":"single","difficulty":"medium","stem":"Which intervention fits the retired-template citation complaint?","choices":["Fine-tune on documents using the current template","Retrieval with effective-date metadata and query-time filtering, and retire the old template from the index","Raise the temperature so the model varies its citations","Add the current clause numbering to the system prompt"],"answer":[1],"explanation":"Clause numbering is volatile, verifiable fact that changes on a schedule, which puts it firmly in the retrieval layer where it can be updated by changing the index. Folding it into weights means it goes stale and requires retraining to correct, and a static prompt listing cannot keep pace with weekly updates.","tags":["freshness","retrieval-vs-tuning","metadata-filtering"],"ref":"https://docs.llamaindex.ai/en/stable/module_guides/indexing/metadata_extraction/","case":"CS10"},{"id":"CS10-3","domain":"agent-development","type":"single","difficulty":"hard","stem":"Which fix makes the enum casing failure structurally impossible rather than merely rarer?","choices":["Add the correct casing to the prompt as a few-shot example","Enumerate the exact permitted values in the schema and use guided decoding, so only conforming tokens can be emitted","Retry the call until the parser accepts the output","Change the field to a free-form string and normalize downstream"],"answer":[1],"explanation":"Constrained decoding against a schema that lists the literal allowed values masks any token that would violate it, eliminating the failure class. Examples and retries reduce the rate of a systematic error without removing it, and loosening the type pushes the problem downstream rather than solving it.","tags":["constrained-decoding","enums","structured-output"],"ref":"https://docs.nvidia.com/nim/large-language-models/latest/structured-generation.html","case":"CS10"},{"id":"CS10-4","domain":"nvidia-platform","type":"multi","difficulty":"medium","stem":"Which TWO NVIDIA components map to the work this team must do?","choices":["NeMo Customizer to train the LoRA adapter","NeMo Retriever for document extraction, embedding and reranking over the weekly-updated store","NeMo Curator to serve the adapter at inference time","NeMo Guardrails to enforce the JSON schema"],"answer":[0,1],"explanation":"Tuning is Customizer and the retrieval pipeline is Retriever, matching the two interventions the case calls for. Curator is a data-curation tool and does not serve anything, and Guardrails governs conversational content rather than enforcing output schemas, which is the job of constrained decoding.","tags":["product-mapping","nemo-customizer","nemo-retriever"],"ref":"https://docs.nvidia.com/nemo/microservices/latest/","case":"CS10"}]};

const PASS = 0.75;

/* Other people's practice exams. Linked, never copied — every question in this
   simulator is original. Sites advertising "actual exam questions" are excluded
   on purpose; see the note rendered above the list. */
const ELSEWHERE = [
  { name: "CertificationPractice", url: "https://certificationpractice.com/practice-exams/nvidia-certified-professional-agentic-ai",
    tag: "free", sub: "Six practice exams, around 420 questions. The most substantial free set found." },

    tag: "free tier", sub: "29 questions with explanations, no signup; the full set is paid." },

    tag: "free", sub: "Covers ReAct, multi-agent, NIM, NeMo Retriever, Guardrails, evals and observability." },
  { name: "ExamHeist", url: "https://www.examheist.com/practice/nvidia/ncp-aai/",
    tag: "free", sub: "182 questions with written explanations." },
];
const KEYS = ["A","B","C","D"];
const LS = "ncp-aai-progress-v1";

const DOM_BY_ID = Object.fromEntries(DATA.domains.map(d => [d.id, d]));
const Q_BY_ID = Object.fromEntries(DATA.questions.map(q => [q.id, q]));
const MIN_ATTEMPTS = 4;   // Below this, a concept's accuracy is noise.
const TAG_TO_CONCEPTS = {};
for (const c of (DATA.concepts || [])) {
  for (const t of c.tags) (TAG_TO_CONCEPTS[t] = TAG_TO_CONCEPTS[t] || []).push(c.id);
}
const CONCEPT_BY_ID = Object.fromEntries((DATA.concepts || []).map(c => [c.id, c]));
const conceptsOf = (q) => [...new Set(q.tags.flatMap(t => TAG_TO_CONCEPTS[t] || []))];

function conceptStats() {
  const out = {};
  for (const c of (DATA.concepts || [])) out[c.id] = { bank: 0, attempts: 0, correct: 0 };
  for (const q of DATA.questions) {
    const rec = progress.q[q.id];
    for (const cid of conceptsOf(q)) {
      const st = out[cid];
      st.bank += 1;
      if (rec?.seen) { st.attempts += rec.seen; st.correct += rec.correct; }
    }
  }
  for (const st of Object.values(out)) st.acc = st.attempts ? st.correct / st.attempts : null;
  return out;
}

/* Rank weak concepts by what they cost on the exam: gap x domain weight. */
function weakConcepts(limit = 6) {
  const st = conceptStats();
  const w = Object.fromEntries(DATA.domains.map(d => [d.id, d.weight]));
  return (DATA.concepts || [])
    .filter(c => st[c.id].attempts >= MIN_ATTEMPTS && st[c.id].acc < PASS)
    .map(c => ({ c, st: st[c.id], impact: (1 - st[c.id].acc) * (w[c.domain] || 5) }))
    .sort((a, b) => b.impact - a.impact)
    .slice(0, limit);
}

const WEIGHT_TOTAL = DATA.domains.reduce((s, d) => s + d.weight, 0);

/* ---------------------------------------------------------------- storage */

let progress = { v: 1, updatedAt: null, q: {}, exams: [] };
let remote = null;          // db document reference, when available
let syncLabel = "this device";
let saveTimer = null;

function readLocal() {
  try {
    const raw = localStorage.getItem(LS);
    if (raw) return JSON.parse(raw);
  } catch (e) { /* private window or blocked storage */ }
  return null;
}

function writeLocal() {
  try { localStorage.setItem(LS, JSON.stringify(progress)); } catch (e) {}
}

function save() {
  progress.updatedAt = new Date().toISOString();
  writeLocal();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    if (remote) remote.set(JSON.parse(JSON.stringify(progress))).catch(() => {});
  }, 1200);
}

const MAX_INTERVAL = 21;
const today = () => new Date().toISOString().slice(0, 10);
const addDays = (n) => new Date(Date.now() + n * 86400000).toISOString().slice(0, 10);

/* SM-2, adapted: binary grade, capped interval, shorter second step. */
function schedule(rec, correct) {
  const grade = correct ? 5 : 2;
  let ease = rec.ease ?? 2.5;
  ease += 0.1 - (5 - grade) * (0.08 + (5 - grade) * 0.02);
  rec.ease = Math.round(Math.max(1.3, Math.min(2.8, ease)) * 1000) / 1000;
  if (!correct) {
    rec.reps = 0;
    rec.interval = 0;
  } else {
    rec.reps = (rec.reps ?? 0) + 1;
    rec.interval = rec.reps === 1 ? 1
      : rec.reps === 2 ? 3
      : Math.min(MAX_INTERVAL, Math.max(1, Math.round((rec.interval ?? 1) * rec.ease)));
  }
  rec.due = addDays(rec.interval);
}

/* Give pre-scheduling records a due date so older progress still counts. */
function migrate() {
  for (const rec of Object.values(progress.q)) {
    if (rec.due) continue;
    rec.ease = rec.ease ?? 2.5;
    rec.reps = rec.reps ?? (rec.streak ?? 0);
    rec.interval = (rec.seen > rec.correct && (rec.streak ?? 0) < 2) ? 0 : 2;
    rec.due = addDays(rec.interval);
  }
}

function duePool() {
  const t = today();
  return DATA.questions
    .filter(q => { const r = progress.q[q.id]; return r && (r.due ?? "9999") <= t; })
    .sort((a, b) => (progress.q[a.id].due || "").localeCompare(progress.q[b.id].due || ""));
}

function dueCounts() {
  const t = today(), wk = addDays(7);
  let due = 0, week = 0, fresh = 0;
  for (const q of DATA.questions) {
    const r = progress.q[q.id];
    if (!r || !r.seen) fresh++;
    else if ((r.due ?? "9999") <= t) due++;
    else if ((r.due ?? "9999") <= wk) week++;
  }
  const cards = DATA.cards.filter(c => (progress.q[c.id]?.due ?? "0") <= t).length;
  return { due, week, fresh, cards };
}

function mergeRecord(qid, correct) {
  const r = progress.q[qid] || { seen: 0, correct: 0, streak: 0 };
  r.seen += 1;
  if (correct) { r.correct += 1; r.streak = (r.streak || 0) + 1; } else { r.streak = 0; }
  r.last = new Date().toISOString();
  schedule(r, correct);
  progress.q[qid] = r;
}

async function connect() {
  let db = null, user = null;
  try { db = await window.claude?.use?.("db"); } catch (e) {}
  try { user = await window.claude?.use?.("user"); } catch (e) {}
  if (!db || !user) return;
  let uid = null;
  try { uid = await user.id(); } catch (e) {}
  if (!uid) return;
  let ref;
  try { ref = db.doc("data/users/" + uid + "/progress"); } catch (e) { return; }
  try {
    const snap = await ref.get();
    const far = snap.exists ? snap.data() : null;
    const mine = progress.updatedAt ? Date.parse(progress.updatedAt) : 0;
    const theirs = far && far.updatedAt ? Date.parse(far.updatedAt) : 0;
    if (far && theirs >= mine) {
      progress = { v: 1, updatedAt: far.updatedAt || null, q: far.q || {}, exams: far.exams || [] };
      migrate();
      writeLocal();
    } else if (progress.updatedAt) {
      await ref.set(JSON.parse(JSON.stringify(progress)));
    }
    remote = ref;
    syncLabel = "synced to your account";
    render();
  } catch (e) { /* read-only viewer, or store unavailable: stay local */ }
}

/* ------------------------------------------------------------------ stats */

function domainStats() {
  const out = {};
  for (const d of DATA.domains) out[d.id] = { bank: 0, seen: 0, attempts: 0, correct: 0 };
  for (const q of DATA.questions) {
    const s = out[q.domain];
    s.bank += 1;
    const r = progress.q[q.id];
    if (r && r.seen) { s.seen += 1; s.attempts += r.seen; s.correct += r.correct; }
  }
  for (const id in out) {
    const s = out[id];
    s.acc = s.attempts ? s.correct / s.attempts : null;
  }
  return out;
}

function readiness(stats) {
  let num = 0, den = 0;
  for (const d of DATA.domains) {
    const s = stats[d.id];
    if (s.acc !== null) { num += s.acc * d.weight; den += d.weight; }
  }
  return { value: den ? num / den : null, coverage: den / WEIGHT_TOTAL };
}

function drillPool() {
  return DATA.questions.filter(q => {
    const r = progress.q[q.id];
    return r && r.seen > r.correct && (r.streak || 0) < 2;
  });
}

function band(frac) { return frac >= PASS ? "pass" : frac >= 0.6 ? "warn" : "fail"; }

/* --------------------------------------------------------------- sampling */

function shuffled(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/** Apportion n questions across domains by blueprint weight (largest remainder). */
function weightedSample(n) {
  const pool = {};
  for (const q of DATA.questions) (pool[q.domain] = pool[q.domain] || []).push(q);
  const exact = {}, counts = {};
  for (const d of DATA.domains) {
    if (!pool[d.id]) continue;
    exact[d.id] = n * d.weight / WEIGHT_TOTAL;
    counts[d.id] = Math.floor(exact[d.id]);
  }
  let short = n - Object.values(counts).reduce((a, b) => a + b, 0);
  const byFrac = Object.keys(exact).sort((a, b) => (exact[b] % 1) - (exact[a] % 1));
  for (const id of byFrac) { if (short <= 0) break; counts[id]++; short--; }

  const picked = [];
  for (const id in counts) {
    // Prefer unseen questions, then ones previously missed.
    const ranked = shuffled(pool[id]).sort((a, b) => score(a) - score(b));
    picked.push(...ranked.slice(0, Math.min(counts[id], ranked.length)));
  }
  const chosen = new Set(picked.map(q => q.id));
  if (picked.length < n) {
    for (const q of shuffled(DATA.questions)) {
      if (picked.length >= n) break;
      if (!chosen.has(q.id)) { picked.push(q); chosen.add(q.id); }
    }
  }
  return shuffled(picked).slice(0, n);

  function score(q) {
    const r = progress.q[q.id];
    if (!r) return -100;
    return r.seen - (r.seen - r.correct) * 2;
  }
}

/** Permute a question's choices so answer position is never memorized. */
function present(q) {
  const order = shuffled(q.choices.map((_, i) => i));
  return {
    ref: q,
    stem: q.stem,
    type: q.type,
    choices: order.map(i => q.choices[i]),
    answer: q.answer.map(a => order.indexOf(a)).sort((x, y) => x - y),
  };
}

/* ------------------------------------------------------------------ views */

let view = "home";
let S = null;   // active session

function startSession(kind) {
  let items, timed = false, feedback = true, title = "Practice";
  if (kind.mode === "exam") {
    const n = Math.min(kind.count || 65, DATA.questions.length);
    items = weightedSample(n);
    timed = true; feedback = false; title = "Mock exam";
  } else if (kind.mode === "domain") {
    items = shuffled(DATA.questions.filter(q => q.domain === kind.domain));
    title = DOM_BY_ID[kind.domain].name;
  } else if (kind.mode === "review") {
    const w = {}; DATA.domains.forEach(d => w[d.id] = d.weight);
    items = duePool().sort((a, b) => {
      const da = (progress.q[a.id].due || ""), db = (progress.q[b.id].due || "");
      return da === db ? (w[b.domain] - w[a.domain]) : da.localeCompare(db);
    });
    title = "Review";
  } else if (kind.mode === "concept") {
    items = shuffled(DATA.questions.filter(q => conceptsOf(q).includes(kind.conceptId)));
    title = "Concept — " + CONCEPT_BY_ID[kind.conceptId].name;
  } else if (kind.mode === "case") {
    const c = DATA.cases.find(x => x.id === kind.caseId);
    items = c.questions.map(id => Q_BY_ID[id]).filter(Boolean);
    title = c.title;
  } else if (kind.mode === "drill") {
    const w = {}; DATA.domains.forEach(d => w[d.id] = d.weight);
    items = drillPool().sort((a, b) => {
      const dw = w[b.domain] - w[a.domain];
      if (dw) return dw;
      const ra = progress.q[a.id], rb = progress.q[b.id];
      return (rb.seen - rb.correct) - (ra.seen - ra.correct);
    });
    title = "Drill";
  } else {
    items = weightedSample(Math.min(15, DATA.questions.length));
  }
  if (!items.length) return;
  S = {
    kind: kind.mode, title, timed, feedback,
    items: items.map(present),
    picks: items.map(() => null),
    flags: new Set(),
    revealed: new Set(),
    i: 0,
    started: Date.now(),
    deadline: timed ? Date.now() + DATA.exam.duration_minutes * 60000 : null,
    report: null,
  };
  view = "quiz";
  render();
  if (timed) tick();
}

let ticker = null;
function tick() {
  clearInterval(ticker);
  ticker = setInterval(() => {
    if (!S || !S.deadline || view !== "quiz") { clearInterval(ticker); return; }
    const left = S.deadline - Date.now();
    const el = document.getElementById("clock");
    if (el) {
      el.textContent = fmtClock(Math.max(0, left));
      el.classList.toggle("low", left < 300000);
    }
    if (left <= 0) { clearInterval(ticker); finish(true); }
  }, 1000);
}

function fmtClock(ms) {
  const t = Math.round(ms / 1000);
  return String(Math.floor(t / 60)).padStart(2, "0") + ":" + String(t % 60).padStart(2, "0");
}

function choose(ci) {
  const it = S.items[S.i];
  if (S.revealed.has(S.i)) return;
  const want = it.answer.length;
  let cur = S.picks[S.i] ? S.picks[S.i].slice() : [];
  if (want === 1) {
    cur = [ci];
  } else if (cur.includes(ci)) {
    cur = cur.filter(x => x !== ci);
  } else {
    cur.push(ci);
    if (cur.length > want) cur.shift();
  }
  S.picks[S.i] = cur.sort((a, b) => a - b);
  if (S.feedback && cur.length === want) reveal();
  else render();
}

function reveal() {
  const it = S.items[S.i];
  const picks = S.picks[S.i] || [];
  S.revealed.add(S.i);
  mergeRecord(it.ref.id, same(picks, it.answer));
  save();
  render();
}

function same(a, b) { return a.length === b.length && a.every((x, i) => x === b[i]); }

function go(delta) {
  const next = S.i + delta;
  if (next < 0 || next >= S.items.length) return;
  S.i = next;
  render();
  window.scrollTo({ top: 0, behavior: "instant" });
}

function finish(expired) {
  clearInterval(ticker);
  if (S.report) { view = "report"; render(); window.scrollTo({ top: 0, behavior: "instant" }); return; }
  const rows = [];
  S.items.forEach((it, idx) => {
    const picks = S.picks[idx];
    if (!S.feedback && picks) mergeRecord(it.ref.id, same(picks, it.answer));
    rows.push({ it, picks: picks || [], ok: picks ? same(picks, it.answer) : false, answered: !!picks });
  });
  const answered = rows.filter(r => r.answered).length;
  const got = rows.filter(r => r.ok).length;
  const frac = rows.length ? got / rows.length : 0;
  if (S.kind === "exam") {
    progress.exams.unshift({
      at: new Date().toISOString(), score: +frac.toFixed(4),
      n: rows.length, answered, seconds: Math.round((Date.now() - S.started) / 1000),
    });
    progress.exams = progress.exams.slice(0, 40);
  }
  save();
  S.report = { rows, got, frac, answered, expired: !!expired, seconds: Math.round((Date.now() - S.started) / 1000) };
  view = "report";
  render();
  window.scrollTo({ top: 0, behavior: "instant" });
}

/* ------------------------------------------------------------------ render */

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function meter(frac, cls) {
  const pct = frac === null ? 0 : Math.round(frac * 100);
  return `<div class="meter ${cls || (frac === null ? "" : band(frac))}"><i style="width:${pct}%"></i></div>`;
}

function render() {
  renderTabs();
  renderRail();
  const main = document.getElementById("main");
  if (view === "home") main.innerHTML = homeHTML();
  else if (view === "quiz") main.innerHTML = quizHTML();
  else if (view === "report") main.innerHTML = reportHTML();
  else if (view === "cases") main.innerHTML = casesHTML();
  else if (view === "cards") main.innerHTML = cardsHTML();
  else if (view === "cheat") main.innerHTML = cheatHTML();
  else if (view === "cram") main.innerHTML = cramHTML();
  renderFoot();
  bind();
}

function renderTabs() {
  const tabs = [["home", "Console"], ["cases", "Case studies"],
                ["cheat", "Cheat sheets"], ["cram", "Cram sheet"]];
  document.getElementById("tabs").innerHTML = tabs.map(([k, label]) =>
    `<button class="tab" data-tab="${k}" aria-current="${view === k}">${label}</button>`).join("");
}

let FC = null;   // active flashcard session

function startCards(deck) {
  const t = today();
  let pool = DATA.cards.filter(c => (progress.q[c.id]?.due ?? "0") <= t);
  if (deck) pool = pool.filter(c => c.deck === deck);
  if (!pool.length) pool = (deck ? DATA.cards.filter(c => c.deck === deck) : DATA.cards).slice();
  pool = shuffled(pool).slice(0, 25);
  FC = { pool, i: 0, shown: false, right: 0, deck };
  view = "cards";
  render();
}

function gradeCard(ok) {
  const card = FC.pool[FC.i];
  const rec = progress.q[card.id] || { seen: 0, correct: 0, streak: 0 };
  rec.seen += 1;
  if (ok) { rec.correct += 1; rec.streak = (rec.streak || 0) + 1; FC.right += 1; }
  else { rec.streak = 0; }
  rec.last = new Date().toISOString();
  schedule(rec, ok);
  progress.q[card.id] = rec;
  save();
  FC.i += 1; FC.shown = false;
  render();
}

    </div>

    <div class="card">
      <span class="col">${esc(c.column)}</span>
      <p class="pr">${esc(c.prompt)}</p>
      ${FC.shown ? `<p class="an">${esc(c.answer)}</p>` : ""}
    </div>
    <div class="qbar">
      ${FC.shown
        ? `<button class="btn" data-grade="0">Missed it</button>
           <span class="spacer"></span>
           <button class="btn go" data-grade="1">Got it</button>`
        : `<button class="btn go" data-reveal-card="1" style="margin:0 auto">Reveal</button>`}
    </div>
  </div>
  <div class="foot" style="margin-top:14px">Space or Enter to reveal · Y / N to grade</div>`;
}

function casesHTML() {
  const total = DATA.cases.reduce((n, c) => n + c.questions.length, 0);
  const done = DATA.cases.filter(c => c.questions.every(id => progress.q[id]?.seen)).length;
  return `<div class="panel">
    <div class="hero" style="padding:22px 24px 20px">
      <span class="eyebrow">Scenario practice</span>
      <h1 style="font-size:clamp(23px,2.9vw,31px);margin-top:9px;max-width:25ch">One situation, several linked questions.</h1>
      <p style="margin-top:11px">Closer to the exam's scenario-heavy style than standalone items:
      each case asks whether you can hold a situation in mind across four questions that span
      different topic areas. The scenario stays on screen throughout.</p>
    </div>
    <div class="facts">
      <div class="fact"><small>Scenarios</small><b>${DATA.cases.length}</b></div>
      <div class="fact"><small>Questions</small><b>${total}</b></div>
      <div class="fact"><small>Completed</small><b>${done}</b></div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-hd"><span class="eyebrow">Choose a case</span>
      <span class="mono" style="margin-left:auto;font-size:11px;color:var(--muted)">${DATA.cases.length} scenarios · ${DATA.cases.reduce((n, c) => n + c.questions.length, 0)} linked questions</span></div>
    <ul class="caselist">${DATA.cases.map(c => {
      const done = c.questions.filter(id => progress.q[id]?.seen).length;
      return `<li><button data-case="${esc(c.id)}">
        <span class="t"><b>${esc(c.title)}</b>
          <span class="mono" style="font-size:10.5px;color:var(--muted)">${esc(c.id)} · ${c.questions.length} questions${done ? ` · ${done} seen` : ""}</span></span>
        <span class="sc">${esc(c.scenario.slice(0, 160))}…</span>
      </button></li>`;
    }).join("")}</ul>
  </div>

  <div class="panel" style="margin-top:14px">
    <div class="panel-hd"><span class="eyebrow">Practice elsewhere</span>
      <span class="mono" style="margin-left:auto;font-size:11px;color:var(--muted)">opens in a new tab</span></div>
    <p class="lk-note">A second opinion is worth having — different authors probe different
      corners of the blueprint. These are other people's practice exams, linked rather than
      copied: every question in this simulator is original. Sites advertising
      <em>actual</em> or <em>real</em> exam questions are deliberately absent; that content is
      reconstructed from live exams, breaches the candidate agreement, and is frequently wrong.</p>
    <ul class="links" style="margin-top:10px">
      ${ELSEWHERE.map(l => `<li><a class="row" href="${esc(l.url)}" target="_blank" rel="noopener">
        <span class="lk-nm">${esc(l.name)} <span style="color:var(--muted);font-weight:400">↗</span></span>
        <span class="lk-sub">${esc(l.sub)}</span>
        <span class="lk-tag">${esc(l.tag)}</span>
      </a></li>`).join("")}
    </ul>
  </div>`;
}

function cheatHTML() {
  return `<div class="panel">
    <div class="panel-hd"><span class="eyebrow">Cheat sheets</span>
      <span class="mono" style="font-size:11px;color:var(--muted)">condensed reference, not questions</span>
      <button class="btn printbtn" data-print="1">Print</button></div>
    <div class="panel-bd" style="padding-top:14px">
      ${DATA.cheats.sections.map(sec => `<section class="cheat-sec" id="cs-${esc(sec.id)}">
        <div class="cheat-hd">
          <h2>${esc(sec.title)}</h2>
          <span class="cheat-kicker">${esc(sec.kicker)}</span>
        </div>
        <div class="cheat-bd">${sec.blocks.map(blockHTML).join("")}</div>
      </section>`).join("")}
    </div>
  </div>`;
}

function cramHTML() {
  return `<div class="panel">
    <div class="panel-hd"><span class="eyebrow">Cram sheet</span>
      <span class="mono" style="margin-left:auto;font-size:11px;color:var(--muted)">${DATA.questions.length} items · answer and reasoning, no quiz</span></div>
    ${DATA.domains.map(d => {
      const qs = DATA.questions.filter(q => q.domain === d.id);
      const open = cramOpen.has(d.id);
      return `<div class="cram-dom">
        <button class="cram-hd" data-cram="${d.id}" aria-expanded="${open}">
          <span class="mono" style="font-size:11px;font-weight:700;color:var(--accent);min-width:28px">${d.weight}%</span>
          <b>${esc(d.name)}</b>
          <span class="mono" style="font-size:11px;color:var(--muted)">${qs.length} · ${open ? "hide" : "show"}</span>
        </button>
        ${open ? `<div class="cram-body">${qs.map(q => `<div class="cram-q">
          <div class="id">${esc(q.id)} · ${esc(q.tags.join(", "))}</div>
          <div class="qs">${esc(q.stem)}</div>
          <div class="ans">→ ${q.answer.map(a => esc(q.choices[a])).join(" · ")}</div>
          <div class="ex">${esc(q.explanation)}</div>
        </div>`).join("")}</div>` : ""}
      </div>`;
    }).join("")}
  </div>`;
}

const cramOpen = new Set();

function renderFoot() {
  document.getElementById("foot").innerHTML =
    `${esc(DATA.exam.name)} · ${esc(DATA.exam.delivery)}<br>
     Topic weights are NVIDIA's published figures, which sum to ${WEIGHT_TOTAL}%; sets are apportioned on the normalized shares.
     Target of ${PASS * 100}% is this tool's own margin — NVIDIA does not publish a cut score.<br>
     Progress saved ${esc(syncLabel)} · <a href="${esc(DATA.exam.source)}" target="_blank" rel="noopener">official exam page ↗</a>`;
}

/* ------------------------------------------------------------------- input */

function bind() {
  document.querySelectorAll("[data-tab]").forEach(el => el.onclick = () => {
    view = el.dataset.tab; render();
    window.scrollTo({ top: 0, behavior: "instant" });
  });
  document.querySelectorAll("[data-start]").forEach(el => el.onclick = () => startSession({ mode: el.dataset.start }));
  document.querySelectorAll("[data-domain]").forEach(el => el.onclick = () => startSession({ mode: "domain", domain: el.dataset.domain }));
  document.querySelectorAll("[data-choose]").forEach(el => el.onclick = () => choose(+el.dataset.choose));
  document.querySelectorAll("[data-nav]").forEach(el => el.onclick = () => go(+el.dataset.nav));
  document.querySelectorAll("[data-jump]").forEach(el => el.onclick = () => { S.i = +el.dataset.jump; render(); });
  document.querySelectorAll("[data-reveal]").forEach(el => el.onclick = reveal);
  document.querySelectorAll("[data-print]").forEach(el => el.onclick = () => window.print());
  document.querySelectorAll("[data-case]").forEach(el => el.onclick = () =>
    startSession({ mode: "case", caseId: el.dataset.case }));
  document.querySelectorAll("[data-cards]").forEach(el => el.onclick = () => startCards(null));
  document.querySelectorAll("[data-concept]").forEach(el => el.onclick = () =>
    startSession({ mode: "concept", conceptId: el.dataset.concept }));
  document.querySelectorAll("[data-cheatjump]").forEach(el => el.onclick = () => {
    view = "cheat"; render();
    document.getElementById("cs-" + el.dataset.cheatjump)?.scrollIntoView({ behavior: "smooth" });
  });
  document.querySelectorAll("[data-deck]").forEach(el => el.onclick = (ev) => {
    ev.preventDefault(); startCards(el.dataset.deck);
  });
  document.querySelectorAll("[data-reveal-card]").forEach(el => el.onclick = () => {
    FC.shown = true; render();
  });
  document.querySelectorAll("[data-grade]").forEach(el => el.onclick = () =>
    gradeCard(el.dataset.grade === "1"));
  document.querySelectorAll("[data-back-report]").forEach(el => el.onclick = () => {
    view = "report"; render(); window.scrollTo({ top: 0, behavior: "instant" });
  });
  document.querySelectorAll("[data-finish]").forEach(el => el.onclick = () => {
    const blank = S.picks.filter(p => !p).length;
    if (S.kind === "exam" && blank && !confirm(`${blank} question${blank > 1 ? "s" : ""} still blank. Submit anyway?`)) return;
    finish(false);
  });
  document.querySelectorAll("[data-flag]").forEach(el => el.onclick = () => {
    S.flags.has(S.i) ? S.flags.delete(S.i) : S.flags.add(S.i);
    render();
  });
  document.querySelectorAll("[data-cram]").forEach(el => el.onclick = () => {
    const id = el.dataset.cram;
    cramOpen.has(id) ? cramOpen.delete(id) : cramOpen.add(id);
    render();
  });
  document.querySelectorAll("[data-review]").forEach(el => el.onclick = () => {
    S.feedback = true;
    S.items.forEach((_, i) => S.revealed.add(i));
    S.i = +el.dataset.review;
    view = "quiz"; render();
    window.scrollTo({ top: 0, behavior: "instant" });
  });
}

document.addEventListener("keydown", ev => {
  if (view === "cards" && FC && !ev.metaKey && !ev.ctrlKey && !ev.altKey) {
    if (FC.i >= FC.pool.length) return;
    const k = ev.key.toUpperCase();
    if (!FC.shown && (ev.key === " " || ev.key === "Enter")) {
      ev.preventDefault(); FC.shown = true; render();
    } else if (FC.shown && (k === "Y" || ev.key === "Enter")) {
      ev.preventDefault(); gradeCard(true);
    } else if (FC.shown && k === "N") {
      ev.preventDefault(); gradeCard(false);
    }
    return;
  }
  if (view !== "quiz" || !S || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  const k = ev.key.toUpperCase();
  if (KEYS.includes(k)) { ev.preventDefault(); choose(KEYS.indexOf(k)); }
  else if (ev.key === "ArrowRight") { ev.preventDefault(); go(1); }
  else if (ev.key === "ArrowLeft") { ev.preventDefault(); go(-1); }
  else if (k === "F") { ev.preventDefault(); S.flags.has(S.i) ? S.flags.delete(S.i) : S.flags.add(S.i); render(); }
  else if (ev.key === "Enter") {
    ev.preventDefault();
    if (S.feedback && !S.revealed.has(S.i) && (S.picks[S.i] || []).length) reveal();
    else if (S.i < S.items.length - 1) go(1);
    else if (!S.report) finish(false);
    else { view = "report"; render(); }
  }
});

/* -------------------------------------------------------------------- boot */

const loaded = readLocal();
if (loaded && loaded.q) progress = { v: 1, updatedAt: loaded.updatedAt || null, q: loaded.q || {}, exams: loaded.exams || [] };
migrate();
render();
connect();
</script>

</body>
</html>
