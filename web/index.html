 at design time.","tags":["embedding-lock-in","re-embedding","architecture-coupling","migration"],"ref":"https://docs.nvidia.com/nim/nemo-retriever/text-embedding/latest/index.html","domain":"knowledge-data"},{"id":"KD-022","type":"single","difficulty":"hard","stem":"Retrieval returns the right documents, faithfulness is high, but users say answers miss important caveats present in the sources. What is the likely cause?","choices":["The embedding model is too small","Context assembly is truncating or de-prioritizing the portions of the retrieved documents that contain the qualifications, or the generation prompt does not ask for limitations and exceptions","The vector index needs rebuilding","The reranker is misconfigured"],"answer":[1],"explanation":"Faithful but incomplete answers point downstream of retrieval: either the relevant passages were trimmed during assembly, or the prompt frames the task as answering the question rather than as reporting conditions and exceptions. Both are fixable in assembly and prompting, without touching the retrieval stack.","tags":["completeness","context-assembly","prompt-framing","caveats"],"ref":"https://arxiv.org/abs/2307.03172","domain":"knowledge-data"},{"id":"KD-023","type":"multi","difficulty":"medium","stem":"Which TWO steps belong in a multimodal document ingestion pipeline for PDFs containing charts?","choices":["Detect and extract figures as separate objects, then generate a text description or caption that is indexed alongside the surrounding text","Preserve the association between a figure and its caption, section, and page so retrieval can return them together","Convert every page to a single image and embed it with a vision model only","Discard figures, since the surrounding text usually explains them"],"answer":[0,1],"explanation":"Figures carry information that text extraction loses, so they must be captured as objects and made searchable via description or multimodal embedding. Equally important is keeping structural context — caption, section, page — so a retrieved figure arrives with what makes it interpretable. Page-level images destroy granularity, and discarding figures discards the answer.","tags":["multimodal-ingestion","figures","structural-context","nv-ingest"],"ref":"https://docs.nvidia.com/nemo/retriever/extraction/overview/","domain":"knowledge-data"},{"id":"KD-024","type":"single","difficulty":"hard","stem":"Your retrieval corpus contains near-duplicate documents (a policy and three lightly edited copies). What is the effect on the agent and the fix?","choices":["No effect; duplicates simply rank together","The top-k fills with redundant copies, crowding out diverse evidence and wasting context; deduplicate at ingestion and apply diversity-aware selection such as MMR at retrieval","Duplicates improve confidence through repetition","The reranker automatically removes duplicates"],"answer":[1],"explanation":"Near-duplicates consume the retrieval budget with the same information, so the agent sees one perspective repeated instead of several distinct pieces of evidence — and inherits whichever copy is stale. The fix is at both ends: deduplicate during ingestion (exact and fuzzy), and use diversity-aware re-ranking so top-k spans different content.","tags":["deduplication","mmr","diversity","redundancy"],"ref":"https://docs.nvidia.com/nemo-framework/user-guide/latest/datacuration/index.html","domain":"knowledge-data"},{"id":"NP-001","type":"single","difficulty":"medium","stem":"Match the requirement to the NVIDIA component: you need to enforce topic boundaries and block unsafe outputs in an agent's conversations using declarative rules. Which component?","choices":["NeMo Curator","NeMo Guardrails","NeMo Customizer","NeMo Evaluator"],"answer":[1],"explanation":"NeMo Guardrails is the programmable rails layer: input, output, dialog, retrieval, and execution rails defined in Colang/YAML to constrain what an LLM application will discuss and emit. Curator prepares data, Customizer fine-tunes, and Evaluator benchmarks.","tags":["nemo-guardrails","product-mapping","nvidia"],"ref":"https://docs.nvidia.com/nemo/guardrails/latest/","domain":"nvidia-platform"},{"id":"NP-002","type":"single","difficulty":"medium","stem":"Which NVIDIA component is responsible for large-scale preparation, filtering, and deduplication of text datasets before training or fine-tuning?","choices":["NeMo Curator","NeMo Retriever","Triton Inference Server","NIM"],"answer":[0],"explanation":"NeMo Curator is the GPU-accelerated data curation library: download, extract, language and quality filtering, exact/fuzzy/semantic deduplication, and PII redaction at corpus scale. Retriever serves RAG-time embedding and reranking, while Triton and NIM are inference serving.","tags":["nemo-curator","data-curation","product-mapping","nvidia"],"ref":"https://docs.nvidia.com/nemo-framework/user-guide/latest/datacuration/index.html","domain":"nvidia-platform"},{"id":"NP-003","type":"single","difficulty":"hard","stem":"You want to try a dozen open models against your agent's prompts before committing to a deployment, without provisioning any GPUs. What is the intended NVIDIA path?","choices":["Download each model from NGC and build TensorRT-LLM engines locally","Use the hosted API endpoints on build.nvidia.com, which expose the same models as OpenAI-compatible NIM endpoints, then self-host the winner as a NIM container","Use NeMo Customizer to fine-tune each candidate first","Deploy all twelve with Triton in a single model repository"],"answer":[1],"explanation":"build.nvidia.com is the try-before-you-deploy surface: hosted, OpenAI-compatible endpoints for the NIM catalog with free credits, so prompts and agent code can be validated with a base-URL change and the selected model later self-hosted as the identical NIM container. Building engines or fine-tuning twelve candidates inverts the effort order.","tags":["build.nvidia.com","nim","model-selection","nvidia"],"ref":"https://build.nvidia.com","domain":"nvidia-platform"},{"id":"NP-004","type":"single","difficulty":"medium","stem":"What are NVIDIA AI Blueprints?","choices":["Hardware reference designs for GPU server chassis","Reference AI workflows — packaged source, NIM microservices, and deployment assets — that implement a complete use case such as multimodal PDF extraction or an AI research assistant","Licensing agreements for enterprise model use","A benchmark suite for measuring agent performance"],"answer":[1],"explanation":"AI Blueprints are end-to-end reference workflows you can deploy and adapt: they compose NIM microservices and example code into a working implementation of a common use case, serving as a starting architecture rather than hardware specs or licensing.","tags":["ai-blueprints","reference-architectures","nvidia"],"ref":"https://build.nvidia.com/blueprints","domain":"nvidia-platform"},{"id":"NP-005","type":"multi","difficulty":"hard","stem":"You must fine-tune a model with LoRA and then serve several LoRA adapters over one base model. Which TWO NVIDIA capabilities are directly relevant?","choices":["NeMo Customizer (or NeMo Framework PEFT) to train the LoRA adapters","NIM's multi-LoRA serving, which hosts multiple adapters against a single base model deployment","NeMo Curator to serve the adapters at inference time","MIG to merge the adapters into the base weights"],"answer":[0,1],"explanation":"Training the adapters is NeMo Customizer / NeMo Framework PEFT; serving many adapters over one loaded base model is NIM's multi-LoRA feature, which avoids a full deployment per adapter. Curator is a data tool, and MIG partitions GPUs — neither has anything to do with adapters.","tags":["lora","multi-lora","nemo-customizer","nim","nvidia"],"ref":"https://docs.nvidia.com/nim/large-language-models/latest/peft.html","domain":"nvidia-platform"},{"id":"NP-006","type":"single","difficulty":"medium","stem":"Which statement about TensorRT-LLM is accurate?","choices":["It is a serving framework that exposes HTTP endpoints directly to clients","It is a library for building and running optimized LLM inference engines — applying kernel fusion, quantization, paged KV cache, and in-flight batching — typically served behind Triton or packaged inside a NIM","It is a fine-tuning library for parameter-efficient adaptation","It converts models to ONNX for CPU inference"],"answer":[1],"explanation":"TensorRT-LLM is the optimization and execution layer: it compiles/configures LLMs into highly tuned GPU engines with features like paged KV cache, quantization, and continuous batching. The HTTP serving surface comes from Triton or a NIM wrapper around it. It does not fine-tune, and its target is NVIDIA GPUs rather than CPU.","tags":["tensorrt-llm","inference-optimization","nvidia"],"ref":"https://nvidia.github.io/TensorRT-LLM/","domain":"nvidia-platform"},{"id":"NP-007","type":"single","difficulty":"hard","stem":"Your agentic RAG pipeline is bottlenecked on building and querying a very large vector index on CPU. Which NVIDIA technology targets this specific bottleneck?","choices":["cuVS / RAFT GPU-accelerated vector search (as integrated into vector databases such as Milvus)","NeMo Guardrails retrieval rails","Triton's dynamic batching","NVLink Switch fabric"],"answer":[0],"explanation":"cuVS (formerly RAFT's vector search) provides GPU-accelerated index construction (for example CAGRA, IVF-PQ) and search, which vector databases like Milvus integrate to cut build times and raise query throughput dramatically. Guardrails, batching, and interconnect fabrics address entirely different layers.","tags":["cuvs","raft","vector-search","rapids","nvidia"],"ref":"https://docs.rapids.ai/api/cuvs/stable/","domain":"nvidia-platform"},{"id":"NP-008","type":"single","difficulty":"medium","stem":"For an agent deployed on-premises in an enterprise with support and security-patch requirements, which NVIDIA offering is the relevant commercial vehicle?","choices":["NVIDIA AI Enterprise, which provides supported, secured, and certified builds of NIM, NeMo, and related software","NVIDIA Omniverse","CUDA Toolkit community edition","NGC public catalog only"],"answer":[0],"explanation":"NVIDIA AI Enterprise is the licensed software suite that packages NIM microservices, NeMo, and frameworks with enterprise support, security patching, and API stability — the answer whenever a question emphasizes production support and compliance on-prem. Omniverse targets simulation and digital twins.","tags":["nvidia-ai-enterprise","licensing","enterprise","nvidia"],"ref":"https://docs.nvidia.com/ai-enterprise/index.html","domain":"nvidia-platform"},{"id":"NP-009","type":"single","difficulty":"hard","stem":"Why does NVLink/NVSwitch matter for serving a very large model with tensor parallelism?","choices":["It increases each GPU's memory capacity","Tensor parallelism requires frequent all-reduce communication between GPUs on every layer, so high-bandwidth, low-latency interconnect directly determines achievable latency and scaling efficiency","It allows the model to run on CPUs when GPUs are saturated","It compresses the KV cache during transfer"],"answer":[1],"explanation":"Tensor parallelism is communication-intensive: partial results must be reduced across GPUs many times per token. NVLink/NVSwitch provides an order of magnitude more bandwidth than PCIe, which is why TP is normally kept within an NVLink domain and why interconnect, not just FLOPS, governs scaling. It does not add memory or enable CPU fallback.","tags":["nvlink","nvswitch","tensor-parallelism","interconnect","nvidia"],"ref":"https://nvidia.github.io/TensorRT-LLM/advanced/executor.html","domain":"nvidia-platform"},{"id":"NP-010","type":"single","difficulty":"medium","stem":"You need to expose an existing LangGraph agent, a CrewAI crew, and a few bare Python tools as one instrumented, profilable workflow with a served endpoint and a UI. Which NVIDIA component is designed for this?","choices":["NeMo Agent Toolkit","NeMo Curator","TensorRT Model Optimizer","DCGM Exporter"],"answer":[0],"explanation":"NeMo Agent Toolkit is the framework-agnostic composition layer: it wraps components from different frameworks behind a uniform function interface, adds profiling and evaluation, and can serve a workflow with an accompanying UI. The other options handle data curation, model compression, and GPU telemetry respectively.","tags":["nemo-agent-toolkit","product-mapping","nvidia"],"ref":"https://github.com/NVIDIA/NeMo-Agent-Toolkit","domain":"nvidia-platform"},{"id":"NP-011","type":"single","difficulty":"hard","stem":"An agent must serve a long-context model with a very large KV cache for many concurrent users. Comparing H100 (80 GB HBM3) with H200 (141 GB HBM3e), what is the main practical benefit of the H200 for this workload?","choices":["Higher peak FP16 matrix throughput, which shortens prefill","Substantially more HBM capacity and bandwidth, which allows a larger KV cache and therefore higher concurrency and longer contexts per GPU","Support for FP4 arithmetic, which halves memory use","Integrated CPU cores that reduce host round trips"],"answer":[1],"explanation":"H200 keeps the Hopper compute architecture but roughly doubles memory capacity and increases bandwidth, which is exactly what KV-cache-bound long-context serving needs: more concurrent sequences per GPU and less need for sharding. FP4 arrives with Blackwell, and integrated CPU cores describe Grace-based superchips.","tags":["h100","h200","gpu-selection","kv-cache","nvidia"],"ref":"https://docs.nvidia.com/nim/large-language-models/latest/supported-models.html","domain":"nvidia-platform"},{"id":"NP-012","type":"single","difficulty":"medium","stem":"Which NVIDIA model family is specifically positioned for safety classification tasks such as detecting unsafe content categories in agent inputs and outputs?","choices":["Llama Nemotron Safety Guard (formerly Llama Guard / Nemotron safety models) used as a guardrail classifier","NV-Embed","Nemotron-Mini for function calling","Cosmos Nemotron for video understanding"],"answer":[0],"explanation":"Safety-guard model variants are content-safety classifiers used as input/output rails, commonly wired into NeMo Guardrails to label prompts and responses against unsafe categories. NV-Embed is an embedding model, and the other families target function calling and multimodal video understanding.","tags":["safety-models","guardrails","nemotron","nvidia"],"ref":"https://docs.nvidia.com/nemo/guardrails/get-started/tutorials/nemotron-safety-guard-deployment","domain":"nvidia-platform"},{"id":"NP-013","type":"single","difficulty":"medium","stem":"What is NVIDIA NemoClaw?","choices":["A quantization format for consumer GPUs","An open-source reference stack for running AI agents more safely on local NVIDIA hardware, packaging an agent framework, a tuned Nemotron profile, and the OpenShell sandboxing runtime","A replacement for the NeMo Agent Toolkit","A managed cloud service for hosting agents"],"answer":[1],"explanation":"NemoClaw is NVIDIA's open stack for running agents locally with policy and safety boundaries, combining LangChain Deep Agents, a tuned Nemotron 3 profile, and NVIDIA OpenShell for sandboxing, credential management, and network proxying. It targets local, always-on agents on RTX PCs, workstations, and DGX Spark-class systems rather than cloud hosting.","tags":["nemoclaw","openshell","local-agents","nvidia"],"ref":"https://developer.nvidia.com/blog/build-a-secure-always-on-local-ai-agent-with-nvidia-nemoclaw-and-openclaw/","domain":"nvidia-platform"},{"id":"NP-014","type":"single","difficulty":"hard","stem":"Which combination of NVIDIA components would you assemble for an enterprise RAG agent that must run on-premises with content safety and auditable evaluation?","choices":["NIM for model serving, NeMo Retriever for extraction/embedding/reranking, NeMo Guardrails for rails, NeMo Evaluator for benchmarking, under NVIDIA AI Enterprise support","NeMo Curator for serving, Triton for guardrails, cuVS for evaluation","TensorRT-LLM for retrieval, NIM for curation, Dynamo for safety","NeMo Agent Toolkit alone, which includes all of the above"],"answer":[0],"explanation":"Each requirement maps to one component: serving to NIM, the retrieval pipeline to NeMo Retriever, content and topic control to NeMo Guardrails, measurement to NeMo Evaluator, and the supported, patched on-prem distribution to NVIDIA AI Enterprise. The NeMo Agent Toolkit composes and profiles such a system but does not replace the individual services.","tags":["stack-assembly","product-mapping","on-prem","nvidia"],"ref":"https://docs.nvidia.com/ai-enterprise/index.html","domain":"nvidia-platform"},{"id":"NP-015","type":"single","difficulty":"medium","stem":"Under which license are Nemotron 3 model weights released, and what does that imply?","choices":["Apache 2.0, so the weights are public domain","The NVIDIA Open Model License, which makes the weights openly available for commercial use under its stated terms rather than fully unrestricted","A research-only license prohibiting commercial use","They are closed weights available only through NIM"],"answer":[1],"explanation":"Nemotron 3 weights ship under the NVIDIA Open Model License — open-weight and usable commercially under the license's terms, which is different both from a permissive OSI license and from a research-only restriction. The distinction matters for enterprise procurement and for self-hosting decisions.","tags":["open-model-license","nemotron-3","licensing","nvidia"],"ref":"https://developer.nvidia.com/blog/inside-nvidia-nemotron-3-techniques-tools-and-data-that-make-it-efficient-and-accurate/","domain":"nvidia-platform"},{"id":"NP-016","type":"single","difficulty":"hard","stem":"An agent team wants to profile which component of a multi-framework workflow consumes the most tokens and time, then optimize it. Which NVIDIA capability targets this directly?","choices":["DCGM Exporter GPU metrics","The NeMo Agent Toolkit profiler, which instruments each function in the workflow and reports per-component latency and token usage to locate bottlenecks","Triton's model analyzer","NeMo Curator's data statistics"],"answer":[1],"explanation":"The toolkit's uniform function interface is what makes workflow-level profiling possible: every agent, tool, and sub-workflow is instrumented identically, so the profile attributes tokens and time across framework boundaries. DCGM reports hardware telemetry and Triton's model analyzer tunes a single model's serving configuration — neither sees the agent's call graph.","tags":["nemo-agent-toolkit","profiling","bottlenecks","nvidia"],"ref":"https://docs.nvidia.com/nemo/agent-toolkit/latest/","domain":"nvidia-platform"},{"id":"NP-017","type":"single","difficulty":"medium","stem":"What is the purpose of NeMo Data Designer in NVIDIA's model development tooling?","choices":["Designing the neural network architecture","Generating and shaping synthetic datasets for training and evaluation","Laying out GPU cluster topology","Designing prompts for production agents"],"answer":[1],"explanation":"NeMo Data Designer is part of the data-side tooling released around Nemotron 3, aimed at producing synthetic data for post-training and evaluation. It sits alongside NeMo Curator (curating and filtering real corpora) and NeMo Gym (interactive RL environments) in the data and training pipeline.","tags":["nemo-data-designer","synthetic-data","nvidia","tooling"],"ref":"https://developer.nvidia.com/blog/inside-nvidia-nemotron-3-techniques-tools-and-data-that-make-it-efficient-and-accurate/","domain":"nvidia-platform"},{"id":"NP-018","type":"multi","difficulty":"hard","stem":"Which TWO statements about deploying models on NVIDIA infrastructure are accurate?","choices":["A NIM exposes an OpenAI-compatible API, so client code can move between hosted build.nvidia.com endpoints and self-hosted containers with a base-URL change","TensorRT-LLM engines are built for a specific model, precision, and GPU architecture, so an engine built for one GPU generation is not portable to another","NIM containers run on any accelerator including AMD and Intel GPUs","Triton can only serve one model per deployment"],"answer":[0,1],"explanation":"API compatibility is the property that makes prototype-to-production migration cheap, and engine specificity is the constraint teams most often trip over: TensorRT-LLM builds are tied to the target architecture and precision, so hardware changes require a rebuild. NIM targets NVIDIA GPUs, and Triton is explicitly a multi-model server.","tags":["nim","tensorrt-llm","portability","openai-compatible","nvidia"],"ref":"https://nvidia.github.io/TensorRT-LLM/","domain":"nvidia-platform"},{"id":"NP-019","type":"single","difficulty":"medium","stem":"Which NVIDIA offering would you point a team to for a ready-made, deployable reference implementation of an agentic use case such as multimodal PDF extraction or a research assistant?","choices":["NGC container registry","NVIDIA AI Blueprints","NVIDIA Omniverse","CUDA samples"],"answer":[1],"explanation":"AI Blueprints are packaged reference workflows — source, composed NIM microservices, and deployment assets — that implement a complete use case and are meant to be customized. NGC is the registry that hosts containers and models; Omniverse targets simulation and digital twins.","tags":["ai-blueprints","reference-workflows","nvidia","ngc"],"ref":"https://build.nvidia.com/blueprints","domain":"nvidia-platform"},{"id":"NP-020","type":"single","difficulty":"hard","stem":"An agent must run entirely on a developer workstation with no cloud calls, serving a mid-sized open model plus an embedder. Which NVIDIA path fits?","choices":["Deploy Dynamo across a multi-node cluster","Run NIM containers locally on the workstation GPU (or use the NemoClaw stack for a sandboxed local agent), keeping all inference and data on the machine","Use build.nvidia.com hosted endpoints","Use NVIDIA AI Enterprise cloud tenancy"],"answer":[1],"explanation":"Local, no-cloud deployment is exactly what self-hosted NIM containers and the NemoClaw local-agent stack address: models and data stay on the workstation. build.nvidia.com is a hosted service and therefore not no-cloud, and Dynamo's disaggregated serving targets multi-node scale-out rather than a single workstation.","tags":["local-deployment","workstation","nemoclaw","nim","nvidia"],"ref":"https://developer.nvidia.com/blog/build-a-secure-always-on-local-ai-agent-with-nvidia-nemoclaw-and-openclaw/","domain":"nvidia-platform"},{"id":"NP-021","type":"single","difficulty":"medium","stem":"What does multi-token prediction (MTP) aim to improve during inference?","choices":["Training convergence speed only","Decode throughput, by having the model predict several future tokens in one forward pass so more tokens are produced per step","Retrieval accuracy","Memory footprint of the KV cache"],"answer":[1],"explanation":"Multi-token prediction trains the model to emit several future tokens per forward pass, which — like speculative decoding, and often combined with it — increases tokens produced per step and therefore decode throughput. NVIDIA cited MTP among the techniques applied to the larger Nemotron 3 variants. It does not change KV cache size or retrieval.","tags":["multi-token-prediction","decode-throughput","nemotron-3","nvidia"],"ref":"https://developer.nvidia.com/blog/inside-nvidia-nemotron-3-techniques-tools-and-data-that-make-it-efficient-and-accurate/","domain":"nvidia-platform"},{"id":"NP-022","type":"multi","difficulty":"hard","stem":"Which TWO NVIDIA components are specifically part of the retrieval path rather than the generation path?","choices":["NeMo Retriever text embedding NIM","NeMo Retriever text reranking NIM","NeMo Guardrails dialog rails","TensorRT-LLM engine builder"],"answer":[0,1],"explanation":"Embedding and reranking microservices operate on the retrieval side: turning text into vectors and reordering candidate passages before generation. Dialog rails govern conversational behavior around the model, and the TensorRT-LLM engine builder is generation-side inference optimization.","tags":["nemo-retriever","retrieval-path","product-mapping","nvidia"],"ref":"https://docs.nvidia.com/nim/nemo-retriever/text-reranking/latest/index.html","domain":"nvidia-platform"},{"id":"NP-023","type":"single","difficulty":"medium","stem":"A team asks why they should use NIM rather than running vLLM themselves with the same open weights. What is the most accurate answer?","choices":["NIM produces higher-quality outputs from the same weights","NIM packages a tuned engine, runtime, and standardized API as a supported, versioned container so teams skip engine-building and configuration tuning; running vLLM yourself is a valid choice that trades that packaging for more control","vLLM cannot serve NVIDIA models","NIM is free while vLLM requires a license"],"answer":[1],"explanation":"The honest comparison is packaging and support versus control: a NIM ships a pre-optimized configuration behind a standard API with enterprise support under AI Enterprise, while self-managed vLLM gives more control and requires you to own tuning and operations. Output quality from identical weights is not the differentiator, and vLLM is open source.","tags":["nim-vs-vllm","packaging","tradeoffs","nvidia"],"ref":"https://docs.nvidia.com/nim/large-language-models/latest/introduction.html","domain":"nvidia-platform"},{"id":"NP-024","type":"single","difficulty":"hard","stem":"Which NVIDIA library would you reach for to accelerate the dataframe and preprocessing stage of a large document-ingestion pipeline?","choices":["RAPIDS (cuDF and related libraries) for GPU-accelerated dataframe and ETL operations","NeMo Guardrails","Triton Inference Server","TensorRT Model Optimizer"],"answer":[0],"explanation":"RAPIDS provides GPU-accelerated dataframe and ETL primitives (cuDF, and cuVS for vector search), which is what speeds up the data-wrangling stage of ingestion at scale. Guardrails, Triton, and Model Optimizer all operate on models rather than on the data pipeline.","tags":["rapids","cudf","etl","ingestion","nvidia"],"ref":"https://docs.rapids.ai/api/cuvs/stable/","domain":"nvidia-platform"},{"id":"NP-025","type":"single","difficulty":"medium","stem":"Which statement about NVIDIA's agentic safety dataset released alongside Nemotron 3 is most relevant to an agent developer?","choices":["It is a benchmark that must be run before deploying any NIM","It provides agentic safety traces usable for post-training and evaluating safety behavior in tool-using, multi-step settings, rather than single-turn content safety alone","It is a list of prohibited prompts to block at the guardrail layer","It replaces the need for NeMo Guardrails"],"answer":[1],"explanation":"The point of an agentic safety dataset is that agent safety is trajectory-level: unsafe behavior shows up in which tools get called and in what sequence, not only in a single response. Such traces support post-training and evaluation of that behavior. It complements runtime rails rather than replacing them.","tags":["agentic-safety-dataset","trajectory-safety","nemotron-3","nvidia"],"ref":"https://developer.nvidia.com/blog/inside-nvidia-nemotron-3-techniques-tools-and-data-that-make-it-efficient-and-accurate/","domain":"nvidia-platform"},{"id":"NP-026","type":"single","difficulty":"hard","stem":"You must choose between DGX-class systems and cloud GPU instances for an agent platform with steady, high, predictable utilization and strict data residency. Which reasoning is sound?","choices":["Cloud is always cheaper because you pay only for what you use","On-premises DGX-class infrastructure tends to win on cost at sustained high utilization and satisfies residency directly, while cloud wins on elasticity and low upfront commitment for variable demand","On-premises is required for any GPU workload over 8 GPUs","Cloud cannot satisfy data residency under any circumstances"],"answer":[1],"explanation":"The deciding variables are utilization pattern and data control. Steady high utilization amortizes owned hardware well and residency is satisfied by construction; bursty or uncertain demand favors cloud elasticity. Cloud providers do offer region-pinned deployments, so residency is a constraint to verify rather than an automatic disqualifier.","tags":["dgx","on-prem-vs-cloud","utilization","residency","nvidia"],"ref":"https://docs.nvidia.com/ai-enterprise/index.html","domain":"nvidia-platform"},{"id":"NP-027","type":"single","difficulty":"medium","stem":"Which NeMo Guardrails capability would you use to stop an agent from discussing topics outside its supported scope?","choices":["Retrieval rails","Topic control via dialog rails (optionally backed by a topic-control safety model)","Execution rails","Output rails only"],"answer":[1],"explanation":"Scope enforcement is a dialog-level concern: the rails define which topics the assistant engages with and how it declines otherwise, and a topic-control classifier can back that decision. Retrieval rails filter fetched context, execution rails wrap actions, and output rails filter generated text — useful adjuncts but not the mechanism for topic boundaries.","tags":["topic-control","dialog-rails","nemo-guardrails","nvidia"],"ref":"https://docs.nvidia.com/nemo/guardrails/get-started/tutorials/nemoguard-topiccontrol-deployment","domain":"nvidia-platform"},{"id":"NP-028","type":"single","difficulty":"hard","stem":"An agent needs a small, fast model for routing and a large model for reasoning, both self-hosted. Which Nemotron 3 property makes the family well suited to this?","choices":["All variants share identical weights","The family spans Nano, Super, and Ultra sizes with a consistent architecture and licensing, so a cascade can be built from one family with comparable behavior and one operational toolchain","Only the smallest variant supports tool calling","The variants cannot be deployed together"],"answer":[1],"explanation":"A model cascade is easier to operate when the tiers come from one family: consistent prompting and tool-calling behavior, one license, and one serving toolchain reduce the variance a routing architecture has to absorb. Nemotron 3's Nano/Super/Ultra spread is designed for that kind of tiering.","tags":["model-cascade","nemotron-3","family-tiering","routing","nvidia"],"ref":"https://developer.nvidia.com/nemotron","domain":"nvidia-platform"},{"id":"RM-001","type":"single","difficulty":"medium","stem":"Why is distributed tracing more valuable than request-level logging for debugging a multi-step agent?","choices":["Traces are cheaper to store than logs","A trace links every LLM call, tool call, and retrieval into one causal tree with timing and token counts, so you can see which step caused a wrong or slow outcome","Traces automatically redact sensitive data","Traces replace the need for metrics"],"answer":[1],"explanation":"Agent failures are path failures: the final output is wrong because of something that happened three steps earlier. A trace preserves the parent-child structure, inputs/outputs, latency, and token usage of each span, making attribution possible. Logs record events without that causal structure. Traces are typically more expensive, do not redact by default, and complement rather than replace metrics.","tags":["tracing","observability","spans","debugging"],"ref":"https://opentelemetry.io/docs/specs/semconv/gen-ai/","domain":"run-monitor-maintain"},{"id":"RM-002","type":"multi","difficulty":"hard","stem":"You are defining production telemetry for an agent. Which TWO agent-specific signals should you capture that a conventional web service would not have?","choices":["Per-step token consumption (prompt/completion) and cumulative cost per task","Tool-call counts, tool error rates, and step counts per task, including runs that hit the step limit","HTTP status code distribution","Container CPU and memory utilization"],"answer":[0,1],"explanation":"Token/cost accounting and tool-and-step trajectory metrics are the distinctive agent signals: they reveal cost regressions, loop behavior, and tool degradation that no standard web metric exposes. Status codes and container resource usage are necessary but generic infrastructure telemetry.","tags":["telemetry","cost-tracking","agent-metrics","observability"],"ref":"https://docs.nvidia.com/nemo/agent-toolkit/latest/","domain":"run-monitor-maintain"},{"id":"RM-003","type":"single","difficulty":"hard","stem":"An agent that performed well at launch shows a slow quality decline over six months with no code or model changes. What is the most likely cause?","choices":["GPU thermal throttling degrading model quality","Drift: the distribution of user requests and the underlying knowledge base have changed away from what the prompts, retrieval, and evaluation set were designed for","KV cache fragmentation accumulating over time","Gradual weight corruption in the served model"],"answer":[1],"explanation":"With the stack frozen, the environment is what changed: new user intents, new vocabulary, new or stale documents. This is data/concept drift, and it is why production agents need periodic re-evaluation against refreshed datasets and monitoring of input distributions. Hardware throttling affects speed, not correctness, and served weights do not decay.","tags":["drift","monitoring","maintenance","re-evaluation"],"ref":"https://www.nist.gov/itl/ai-risk-management-framework","domain":"run-monitor-maintain"},{"id":"RM-004","type":"single","difficulty":"medium","stem":"Your team wants to change a production agent's system prompt. Which practice best supports safe operation and incident response?","choices":["Edit the prompt in the running configuration and note the change in a chat channel","Version prompts as code artifacts, deploy them through canary rollout with metrics comparison, and make rollback a single reversible operation","Store prompts in a database so they can be edited without a deploy","Let each engineer maintain a personal prompt variant for their own tests"],"answer":[1],"explanation":"Prompts are production behavior and deserve the same discipline as code: versioning, reviewable diffs, progressive exposure with metric gates, and instant rollback. Hot-editing configuration or databases without versioning removes the ability to correlate a regression with a change or revert it cleanly.","tags":["prompt-versioning","canary","rollback","change-management"],"ref":"https://docs.smith.langchain.com/evaluation/concepts","domain":"run-monitor-maintain"},{"id":"RM-005","type":"single","difficulty":"hard","stem":"Which alerting condition is the best early warning that an agent is degrading, before users complain?","choices":["A rise in average response length","A rise in the rate of runs that terminate by hitting the maximum step limit, or in tool-error and retry rates","A rise in total GPU memory used","A rise in the number of unique users"],"answer":[1],"explanation":"Step-limit terminations and rising tool-error/retry rates are leading indicators: the agent is failing to converge or its dependencies are failing, which precedes visible wrong answers and complaints. Response length and GPU memory are weak proxies, and user growth is not a health signal.","tags":["alerting","leading-indicators","sli","monitoring"],"ref":"https://docs.nvidia.com/nemo/agent-toolkit/latest/","domain":"run-monitor-maintain"},{"id":"RM-006","type":"single","difficulty":"medium","stem":"What is the purpose of the OpenTelemetry GenAI semantic conventions?","choices":["To define a standard vector database schema for embeddings","To standardize span names and attributes for LLM and agent operations (model, token counts, tool names, and so on) so traces are portable across vendors and tools","To specify how to encrypt prompts in transit","To define a benchmark suite for agent quality"],"answer":[1],"explanation":"The GenAI semantic conventions specify a shared vocabulary for instrumenting model and agent calls, so any compliant backend can interpret the same traces. That portability is why they are the recommended basis for agent observability instead of proprietary formats.","tags":["opentelemetry","semantic-conventions","standards","observability"],"ref":"https://opentelemetry.io/docs/specs/semconv/gen-ai/","domain":"run-monitor-maintain"},{"id":"RM-007","type":"single","difficulty":"hard","stem":"A production incident: the agent begins giving wrong answers at 14:05. Which diagnostic sequence is most efficient?","choices":["Immediately roll back the model to the previous version and observe","Correlate the 14:05 boundary against the change and dependency timeline (prompt, model, tool, index, upstream API versions), then inspect traces from just before and just after to localize the failing span","Re-run the full offline evaluation suite and wait for results","Increase logging verbosity and wait for more examples to accumulate"],"answer":[1],"explanation":"A sharp temporal boundary is the strongest evidence available: something changed at that moment. Correlating the timestamp with deployment and dependency events, then diffing traces across the boundary, localizes the cause quickly. Blind rollback may miss the actual culprit (an upstream API or reindex), and offline suites and more logging both delay diagnosis.","tags":["incident-response","diagnosis","change-correlation","traces"],"ref":"https://opentelemetry.io/docs/specs/semconv/gen-ai/","domain":"run-monitor-maintain"},{"id":"RM-008","type":"single","difficulty":"medium","stem":"Why should trace payloads containing prompts and tool arguments be treated as sensitive data?","choices":["They are large and expensive to store","They frequently contain user PII, credentials, or proprietary content, so traces need redaction, access control, and retention limits like any other sensitive datastore","They can be replayed to reconstruct model weights","They invalidate the prompt cache"],"answer":[1],"explanation":"Observability data for LLM systems captures raw user input and tool payloads verbatim, which makes the tracing backend an unintentional copy of your most sensitive data. It requires redaction at instrumentation time, restricted access, and a retention policy. Storage cost is real but secondary, and traces do not expose weights.","tags":["trace-privacy","redaction","retention","compliance"],"ref":"https://genai.owasp.org/llm-top-10/","domain":"run-monitor-maintain"},{"id":"RM-009","type":"single","difficulty":"hard","stem":"Which maintenance practice best protects against silent regressions when an upstream model provider updates a model behind the same alias?","choices":["Pin an explicit model version and run the regression evaluation suite before promoting any new version","Always use the `latest` alias so you benefit from improvements immediately","Increase the temperature to smooth over behavioral differences","Cache responses so old behavior persists"],"answer":[0],"explanation":"Version pinning converts an uncontrolled external change into a deliberate, testable upgrade: you choose when to move, and the regression suite gates the promotion. Floating aliases make behavior change without a corresponding change on your side, which is the definition of a silent regression.","tags":["version-pinning","regression-testing","model-updates","maintenance"],"ref":"https://docs.nvidia.com/nim/large-language-models/latest/supported-models.html","domain":"run-monitor-maintain"},{"id":"RM-010","type":"single","difficulty":"medium","stem":"What does the NeMo Agent Toolkit's profiler provide that generic APM tooling typically does not?","choices":["GPU temperature and fan-speed monitoring","Workflow-level breakdown of token usage, per-component latency, and bottleneck identification across the agent's tools and LLM calls, enabling targeted optimization","Automatic prompt rewriting to reduce cost","Network packet capture between microservices"],"answer":[1],"explanation":"The toolkit instruments each function in a workflow, so profiling reports where tokens and time actually go across LLM calls, tools, and sub-agents — the agentic equivalent of a flame graph. Hardware telemetry (DCGM) and packet capture are separate concerns, and it does not rewrite prompts for you.","tags":["nemo-agent-toolkit","profiling","bottlenecks","nvidia"],"ref":"https://docs.nvidia.com/nemo/agent-toolkit/latest/","domain":"run-monitor-maintain"},{"id":"RM-011","type":"single","difficulty":"medium","stem":"Which span structure best represents one agent task in a trace?","choices":["A single span covering the whole task with the final answer as an attribute","A root span for the task with child spans per step — each LLM call, tool call, and retrieval — carrying model name, token counts, and status","One span per LLM call with no parent, correlated by timestamp","A span per user session regardless of how many tasks it contains"],"answer":[1],"explanation":"The causal tree is what makes a trace diagnostic: a root task span with nested child spans preserves which step led to which, how long each took, and what each consumed. Flat or timestamp-correlated spans lose the parent-child relationship that attribution depends on, and a single coarse span hides everything that happened inside.","tags":["span-structure","tracing","opentelemetry","attribution"],"ref":"https://opentelemetry.io/docs/specs/semconv/gen-ai/","domain":"run-monitor-maintain"},{"id":"RM-012","type":"multi","difficulty":"hard","stem":"Which TWO SLOs are meaningful for an agentic service, as opposed to a plain API?","choices":["Task success rate: the fraction of tasks completed to a defined acceptance criterion","p95 end-to-end task completion time, including all tool and model calls in the trajectory","p95 latency of a single LLM call","Uptime of the inference endpoint"],"answer":[0,1],"explanation":"Users experience tasks, not calls. Task success against an explicit acceptance criterion and end-to-end completion time capture the whole trajectory, which is where agentic failures live. Per-call latency and endpoint uptime are necessary component SLIs, but both can look healthy while tasks routinely fail or take ten steps too many.","tags":["slo","task-level-metrics","agentic-sli","end-to-end"],"ref":"https://docs.nvidia.com/nemo/agent-toolkit/latest/","domain":"run-monitor-maintain"},{"id":"RM-013","type":"single","difficulty":"medium","stem":"Your token-cost dashboard shows a 40% month-over-month increase with flat request volume. Which breakdown identifies the cause fastest?","choices":["Cost by time of day","Cost per task broken down by prompt versus completion tokens and by step, compared against the previous month's distribution","Total GPU hours consumed","Cost by user geography"],"answer":[1],"explanation":"With volume flat, cost per task rose, so the question is which component grew. Splitting prompt versus completion tokens and attributing to steps distinguishes a context-growth problem (longer prompts, more retrieved chunks, history not compacted) from a trajectory-length problem (more steps per task) — two different fixes.","tags":["cost-analysis","token-attribution","dashboards","diagnosis"],"ref":"https://docs.nvidia.com/nemo/agent-toolkit/latest/","domain":"run-monitor-maintain"},{"id":"RM-014","type":"single","difficulty":"hard","stem":"You want to detect agent quality regressions in production without waiting for user complaints. Which approach is most practical?","choices":["Run the full evaluation suite against production traffic continuously","Sample a small slice of live traffic, score it with automated proxies (groundedness checks, tool-error rate, step-limit terminations) and a periodic human-reviewed subset, and alert on trend shifts","Ask users to rate every response","Compare production output length to the baseline"],"answer":[1],"explanation":"Continuous full evaluation is too costly, and complaint-driven detection is too slow. Sampling with cheap automated proxies gives a continuous signal, and a periodic human-reviewed slice calibrates those proxies so you know what a trend shift actually means. Asking for ratings on everything gets sparse, biased responses.","tags":["production-monitoring","sampling","automated-proxies","regression-detection"],"ref":"https://docs.ragas.io/en/stable/concepts/metrics/overview/","domain":"run-monitor-maintain"},{"id":"RM-015","type":"single","difficulty":"medium","stem":"Which artifacts must be versioned together to reproduce an agent's behavior from a past date?","choices":["The application code only","Code, prompts, tool definitions and their schemas, model identifier and version, retrieval index version, and guardrail configuration","The model weights only","The conversation transcripts"],"answer":[1],"explanation":"An agent's behavior is the joint product of all of these. Reproducing a past decision requires knowing which prompt, which tool schemas, which model version, which index snapshot, and which rails were in force. Versioning only code leaves the majority of the behavior surface unpinned — which is why post-incident analysis so often stalls.","tags":["versioning","reproducibility","configuration-management","audit"],"ref":"https://docs.smith.langchain.com/evaluation/concepts","domain":"run-monitor-maintain"},{"id":"RM-016","type":"single","difficulty":"hard","stem":"An agent's tool starts returning subtly wrong data after an upstream schema change: a field was renamed and your wrapper now silently passes null. How should this have been caught?","choices":["By a larger model that would notice the missing field","By contract tests against the upstream API that fail when the response schema changes, plus strict parsing that errors on unexpected or missing fields rather than defaulting to null","By monitoring GPU utilization","By increasing the retry count"],"answer":[1],"explanation":"Silent nulls are a parsing-leniency failure. Strict deserialization turns a schema change into a loud error at the boundary, and scheduled contract tests catch the upstream change before it reaches production. Relying on the model to notice missing data is not a control — and this class of bug is exactly what makes agents confidently wrong.","tags":["contract-tests","strict-parsing","schema-drift","silent-failure"],"ref":"https://docs.nvidia.com/nemo/agent-toolkit/latest/","domain":"run-monitor-maintain"},{"id":"RM-017","type":"multi","difficulty":"medium","stem":"Which TWO practices make an agent incident postmortem effective?","choices":["Link the incident to the exact trace ids and the change timeline so cause and effect are established from evidence rather than inference","Add the failing case to the regression evaluation suite so the specific defect cannot silently return","Retrain the model on the failure case","Increase logging verbosity globally"],"answer":[0,1],"explanation":"Evidence-based attribution and a regression test are what convert an incident into durable improvement: the first establishes what actually happened, the second guarantees you will notice if it recurs. Retraining on a single case is disproportionate and risks new regressions, and blanket verbose logging adds cost and noise without targeting anything.","tags":["postmortem","regression-suite","trace-linkage","incident-response"],"ref":"https://opentelemetry.io/docs/specs/semconv/gen-ai/","domain":"run-monitor-maintain"},{"id":"RM-018","type":"single","difficulty":"hard","stem":"You are rolling out a new model version for an agent. Which canary design gives the clearest signal with the least risk?","choices":["Route 50% of traffic to the new version for one hour","Route a small percentage to the new version, compare task success, tool-error rate, cost per task, and latency against the control on the same traffic mix, and hold long enough to cover the normal variety of requests","Route all internal users to the new version indefinitely","Deploy to a separate region and compare regional metrics"],"answer":[1],"explanation":"A canary needs a small blast radius, a matched comparison on the same traffic distribution, and enough duration to see the variety of real requests rather than one hour's slice. Large immediate splits raise exposure, internal-only traffic is not representative, and cross-region comparison confounds the version change with regional differences.","tags":["canary","progressive-delivery","comparison-design","model-rollout"],"ref":"https://docs.nvidia.com/nim/large-language-models/latest/supported-models.html","domain":"run-monitor-maintain"},{"id":"RM-019","type":"single","difficulty":"medium","stem":"During an incident, which piece of evidence most reliably separates a code change from a data or dependency change as the cause?","choices":["The error message text","A timeline that overlays deployments, configuration changes, index rebuilds and upstream dependency releases against the metric break","The number of affected users","The model's confidence scores at the time"],"answer":[1],"explanation":"Attribution depends on correlating the moment behavior changed with everything that changed around it. An overlaid timeline covering deploys, config, index rebuilds and upstream releases is what lets you rule causes in or out; an agent's failures frequently originate in data or a dependency rather than in your own code.","tags":["incident-response","change-correlation","diagnosis","timeline"],"ref":"https://opentelemetry.io/docs/specs/semconv/gen-ai/","domain":"run-monitor-maintain"},{"id":"RM-020","type":"multi","difficulty":"hard","stem":"An incident is resolved. Which TWO actions convert it into durable improvement?","choices":["Add the failing case to the regression evaluation suite so it cannot silently return","Add or fix the telemetry that would have surfaced it earlier, and set an alert on that signal","Write a detailed narrative of the outage for the wiki","Increase logging verbosity across all services"],"answer":[0,1],"explanation":"A postmortem earns its cost through two artifacts: a test that fails if the defect recurs, and a signal that would have caught it sooner next time. Narrative documentation aids understanding but changes no behavior, and blanket verbose logging adds noise and expense without targeting the gap that let the incident run undetected.","tags":["postmortem","regression-suite","alerting","incident-response"],"ref":"https://docs.nvidia.com/nemo/agent-toolkit/latest/","domain":"run-monitor-maintain"},{"id":"SE-001","type":"single","difficulty":"medium","stem":"In NeMo Guardrails, which rail type inspects and can filter content retrieved from a knowledge base before it reaches the LLM?","choices":["Input rails","Output rails","Retrieval rails","Execution rails"],"answer":[2],"explanation":"Retrieval rails act on retrieved chunks, allowing filtering or rejection of untrusted or sensitive context before it is inserted into the prompt — an important defense against indirect prompt injection via documents. Input rails handle user messages, output rails handle model responses, and execution rails wrap custom action/tool invocation.","tags":["nemo-guardrails","retrieval-rails","rail-types","nvidia"],"ref":"https://docs.nvidia.com/nemo/guardrails/latest/user-guides/guardrails-process.html","domain":"safety-ethics-compliance"},{"id":"SE-002","type":"single","difficulty":"hard","stem":"An agent summarizes web pages. A page contains hidden text instructing the agent to email its conversation history to an external address. The agent has an email tool. Which control would have prevented the exfiltration most reliably?","choices":["A system prompt instruction to ignore instructions found in web content","Removing the agent's ability to send email to unapproved recipients — least-privilege tool scoping with an allowlist — combined with treating fetched content as untrusted data","A larger model that is better at detecting manipulation","Logging all outbound emails for later review"],"answer":[1],"explanation":"Indirect prompt injection cannot be reliably prevented at the prompt layer, so the defense must limit what a compromised agent can do: scope the email tool to an approved recipient set (or require approval), and mark fetched content as data rather than instructions. Prompt instructions are bypassable, model capability is not a security boundary, and logging is detection after the loss.","tags":["indirect-prompt-injection","exfiltration","least-privilege","allowlist"],"ref":"https://arxiv.org/abs/2302.12173","domain":"safety-ethics-compliance"},{"id":"SE-003","type":"single","difficulty":"medium","stem":"Under the EU AI Act's risk-based structure, how is an AI system used to screen job applicants generally treated?","choices":["Prohibited outright","High-risk, triggering obligations such as risk management, data governance, technical documentation, logging, human oversight, and conformity assessment","Minimal risk, requiring only voluntary codes of conduct","Exempt because it supports rather than replaces human decisions"],"answer":[1],"explanation":"Employment and worker-management uses, including recruitment and candidate screening, are listed as high-risk. That classification brings substantive obligations across the lifecycle — risk management, data quality, documentation, record-keeping, transparency, and meaningful human oversight — rather than a ban or a light-touch regime. Having a human in the loop does not remove the classification.","tags":["eu-ai-act","high-risk","regulation","compliance"],"ref":"https://artificialintelligenceact.eu/","domain":"safety-ethics-compliance"},{"id":"SE-004","type":"multi","difficulty":"hard","stem":"An agent with database write access is exposed to public user input. Which TWO controls most reduce the risk of excessive agency?","choices":["Grant the agent's database credentials the minimum privileges required, scoped to specific tables and operations","Require out-of-band human approval for irreversible or high-value actions, enforced by the orchestrator rather than the model","Instruct the agent to confirm with itself before writing","Increase the model's context window so it understands the full schema"],"answer":[0,1],"explanation":"Excessive agency is mitigated by reducing permissions and by interposing authorization the model cannot bypass. Least-privilege credentials bound the worst case; orchestrator-enforced approval gates put a human decision in the path of consequential actions. Self-confirmation is still the model deciding, and schema visibility does not limit authority.","tags":["excessive-agency","least-privilege","approval-gates","owasp"],"ref":"https://genai.owasp.org/llm-top-10/","domain":"safety-ethics-compliance"},{"id":"SE-005","type":"single","difficulty":"medium","stem":"Which of the following is the best description of defense in depth for an agentic application's safety architecture?","choices":["Choosing the single most effective guardrail and applying it consistently","Layering independent controls — input filtering, retrieval filtering, tool-level authorization, output filtering, and monitoring — so that bypassing one does not compromise the system","Running two different models and comparing their answers","Encrypting all data at rest and in transit"],"answer":[1],"explanation":"Defense in depth assumes each individual control will sometimes fail, and places independent controls at different layers so a single bypass is not sufficient for harm. Model redundancy and encryption are useful techniques but address specific concerns rather than layered containment.","tags":["defense-in-depth","layered-controls","architecture"],"ref":"https://genai.owasp.org/llm-top-10/","domain":"safety-ethics-compliance"},{"id":"SE-006","type":"single","difficulty":"hard","stem":"Your agent must be auditable for a regulated deployment. Which record set is minimally sufficient to reconstruct why a specific decision was made?","choices":["The final response and a timestamp","The full trajectory: inputs, retrieved sources with identifiers and versions, every tool call with arguments and results, model and prompt versions, guardrail decisions, and any human approvals","Aggregate accuracy metrics for the month in which the decision was made","The model's confidence score for the final answer"],"answer":[1],"explanation":"Auditability requires reproducible causal detail: which evidence was used (and which version of it), what actions were taken, which model and prompt produced the reasoning, what the guardrails decided, and who approved what. Outputs, aggregate metrics, and confidence scores cannot reconstruct a specific decision.","tags":["auditability","traceability","regulated-deployment","record-keeping"],"ref":"https://www.nist.gov/itl/ai-risk-management-framework","domain":"safety-ethics-compliance"},{"id":"SE-007","type":"single","difficulty":"medium","stem":"What are the four core functions of the NIST AI Risk Management Framework?","choices":["Plan, Build, Test, Deploy","Govern, Map, Measure, Manage","Identify, Protect, Detect, Respond","Collect, Curate, Train, Evaluate"],"answer":[1],"explanation":"The NIST AI RMF is organized around Govern (cross-cutting culture, policies, accountability), Map (context and risk identification), Measure (analysis and tracking), and Manage (prioritization and response). Identify/Protect/Detect/Respond belongs to the NIST Cybersecurity Framework.","tags":["nist-ai-rmf","governance","frameworks","compliance"],"ref":"https://www.nist.gov/itl/ai-risk-management-framework","domain":"safety-ethics-compliance"},{"id":"SE-008","type":"single","difficulty":"hard","stem":"A third-party MCP server your agent uses is updated, and its tool description now includes hidden text instructing the agent to forward credentials. What class of risk is this, and what is the appropriate mitigation?","choices":["Model hallucination; mitigate with better prompting","Supply-chain / tool-poisoning risk; mitigate by pinning and reviewing tool definitions, verifying server provenance, and monitoring for changes in tool metadata","Data drift; mitigate by re-evaluating the model","Denial of service; mitigate with rate limiting"],"answer":[1],"explanation":"Tool descriptions are trusted prompt content, so a compromised or malicious server can inject instructions through metadata — a supply-chain attack. Mitigations are supply-chain mitigations: pin versions, review definitions as code, verify provenance, restrict which servers are permitted, and alert on metadata changes.","tags":["tool-poisoning","supply-chain","mcp","provenance"],"ref":"https://genai.owasp.org/llm-top-10/","domain":"safety-ethics-compliance"},{"id":"SE-009","type":"single","difficulty":"medium","stem":"Why is it insufficient to rely solely on an output-filtering guardrail to prevent an agent from taking a harmful action?","choices":["Output filters add too much latency","By the time an output is filtered, tool calls made during the run may already have caused irreversible side effects — actions must be authorized before execution","Output filters cannot detect toxic language reliably","Output filters require a separate GPU"],"answer":[1],"explanation":"Output filtering protects what the user sees, not what the system did. An agent that deleted records or sent money has already caused harm regardless of how its final message is filtered. Consequential actions need pre-execution authorization at the tool boundary.","tags":["output-filtering","pre-authorization","side-effects","guardrails"],"ref":"https://docs.nvidia.com/nemo/guardrails/latest/","domain":"safety-ethics-compliance"},{"id":"SE-010","type":"single","difficulty":"hard","stem":"A hiring-support agent recommends candidates. Which evaluation practice is most important for detecting discriminatory behavior?","choices":["Measuring overall recommendation accuracy against past hiring decisions","Disaggregated evaluation: measuring outcome rates and error rates separately across protected groups, including counterfactual tests that vary only group-correlated attributes","Asking the model to explain each recommendation and reviewing the explanations","Ensuring the training data contains no explicit demographic fields"],"answer":[1],"explanation":"Bias is visible only when metrics are broken out by group and probed counterfactually — holding qualifications constant while varying names, schools, or other proxies. Aggregate accuracy hides disparate impact, and benchmarking against historical decisions can encode past discrimination as the target. Removing explicit demographic fields does not remove proxies, and model-generated explanations are not reliable evidence of the actual decision basis.","tags":["bias","disaggregated-evaluation","counterfactual-testing","fairness"],"ref":"https://www.nist.gov/itl/ai-risk-management-framework","domain":"safety-ethics-compliance"},{"id":"SE-011","type":"single","difficulty":"medium","stem":"Which approach to jailbreak detection is most robust in a production agent?","choices":["A denylist of known jailbreak phrases","A layered approach: a classifier model scoring input intent, output-side safety checks, and — most importantly — tool-level authorization so a successful jailbreak still cannot perform a privileged action","Instructing the model to refuse jailbreak attempts","Rejecting any prompt over a length threshold"],"answer":[1],"explanation":"Jailbreak phrasings are unbounded and adversaries adapt, so detection alone will always have a false-negative rate. The layered posture assumes some attempts succeed and ensures the consequences are bounded by authorization the model cannot influence. Denylists, self-refusal instructions, and length heuristics are all trivially evaded.","tags":["jailbreak-detection","layered-defense","authorization","assume-breach"],"ref":"https://docs.nvidia.com/nemo/guardrails/get-started/tutorials/nemoguard-jailbreakdetect-deployment","domain":"safety-ethics-compliance"},{"id":"SE-012","type":"single","difficulty":"hard","stem":"Under GDPR, an agent logs full prompts including customer messages to a tracing backend retained for two years. Which issues does this raise?","choices":["None, since tracing is a legitimate operational need","Purpose limitation, data minimization, and storage limitation: the trace store holds personal data beyond what operations require, so it needs redaction at capture, a lawful basis, access controls, and a defensible retention period","Only an access-control issue","Only an encryption issue"],"answer":[1],"explanation":"Traces are a personal-data store even when nobody intended them to be. The obligations follow: collect only what debugging requires (redact at instrumentation time), have a lawful basis and purpose, restrict access, and set a retention period you can justify. Encryption and access control are necessary but do not address minimization or retention.","tags":["gdpr","trace-retention","data-minimization","purpose-limitation"],"ref":"https://www.nist.gov/itl/ai-risk-management-framework","domain":"safety-ethics-compliance"},{"id":"SE-013","type":"multi","difficulty":"medium","stem":"Which TWO are appropriate uses of a content-safety classifier in an agent pipeline?","choices":["Screening user input before it reaches the model, to catch harmful requests early","Screening model output before it reaches the user, to catch harmful generations","Deciding whether a tool call is authorized","Validating that JSON output matches a schema"],"answer":[0,1],"explanation":"Safety classifiers operate on natural-language content at the input and output boundaries. Authorization is a policy decision that belongs to the tool layer and must not depend on a probabilistic text classifier, and schema conformance is a structural check handled by validation or constrained decoding.","tags":["safety-classifier","input-output-rails","scope-of-controls"],"ref":"https://docs.nvidia.com/nemo/guardrails/about-nemo-guardrails-library/rail-types","domain":"safety-ethics-compliance"},{"id":"SE-014","type":"single","difficulty":"hard","stem":"Under the EU AI Act, what obligation is triggered when an AI system interacts directly with people?","choices":["The system must be registered as high-risk regardless of use","People must be informed that they are interacting with an AI system, unless it is obvious from the circumstances","The system must publish its training data","The system must have a human approve every response"],"answer":[1],"explanation":"Transparency obligations apply to systems that interact with people: disclosure that the counterpart is an AI, unless obvious from context. This applies independently of risk classification — a minimal-risk chatbot still carries it — and is separate from the substantive obligations that attach to high-risk systems.","tags":["eu-ai-act","transparency-obligation","disclosure","interaction"],"ref":"https://artificialintelligenceact.eu/","domain":"safety-ethics-compliance"},{"id":"SE-015","type":"single","difficulty":"medium","stem":"An agent has access to a tool that can read any file on a shared drive. A user asks it to summarize 'the latest HR document'. What is the design flaw?","choices":["The prompt is ambiguous about which document","The tool's scope is the whole drive rather than the requesting user's authorized subset, so the agent can surface documents the user is not entitled to read","The agent should summarize rather than read","The tool should return the file path instead of contents"],"answer":[1],"explanation":"The flaw is authorization scope, not phrasing. A tool whose reach exceeds the requesting user's entitlements will eventually return something it should not, and no prompt fixes that. The tool must enforce the end user's permissions at query time, which is the same principle as document-level access control in RAG.","tags":["tool-scope","user-permissions","confused-deputy","authorization"],"ref":"https://genai.owasp.org/llm-top-10/","domain":"safety-ethics-compliance"},{"id":"SE-016","type":"single","difficulty":"hard","stem":"Which scenario best illustrates the confused-deputy problem in an agentic system?","choices":["An agent calls a tool with malformed arguments","An agent with broad privileges is manipulated by a low-privilege user's input into performing an action that user could not perform directly","An agent exceeds its token budget","An agent retrieves stale documents"],"answer":[1],"explanation":"A confused deputy holds authority and is tricked into exercising it on someone else's behalf. Agents are natural deputies: they run with service credentials while acting on untrusted input. The mitigation is to act with the requesting user's authority rather than the agent's, and to require explicit authorization for privileged operations.","tags":["confused-deputy","privilege-escalation","delegated-authority","security"],"ref":"https://genai.owasp.org/llm-top-10/","domain":"safety-ethics-compliance"},{"id":"SE-017","type":"multi","difficulty":"medium","stem":"Which TWO belong in an AI risk register entry for a production agent, per NIST AI RMF thinking?","choices":["The specific harm scenario, who it affects, and its severity and likelihood","The controls in place, the residual risk after those controls, and the named owner accountable for it","The model's parameter count","The framework used to build the agent"],"answer":[0,1],"explanation":"A risk register entry must describe the harm concretely (what, to whom, how bad, how likely) and the mitigation posture (controls, what risk remains, who owns it). That is the Map-Measure-Manage sequence made operational. Technical facts like parameter count and framework choice are implementation details, not risk statements.","tags":["risk-register","nist-ai-rmf","accountability","residual-risk"],"ref":"https://www.nist.gov/itl/ai-risk-management-framework","domain":"safety-ethics-compliance"},{"id":"SE-018","type":"single","difficulty":"hard","stem":"Your agent's retrieval corpus is user-contributed. What attack does this enable and what is the mitigation?","choices":["Model inversion; mitigate with differential privacy","Knowledge-base poisoning, where crafted documents are retrieved and either inject instructions or supply false facts; mitigate by treating retrieved content as untrusted data, validating and moderating contributions, tracking provenance, and filtering at the retrieval rail","Denial of service; mitigate with rate limiting","Prompt leaking; mitigate by hiding the system prompt"],"answer":[1],"explanation":"A writable corpus is an attacker-controlled input to the prompt, enabling both indirect injection and factual poisoning. Defenses span the lifecycle: moderate and attribute contributions at ingestion, keep provenance so suspect sources can be traced and revoked, filter at the retrieval rail, and never let retrieved text carry instruction authority.","tags":["knowledge-base-poisoning","untrusted-corpus","provenance","retrieval-rails"],"ref":"https://arxiv.org/abs/2302.12173","domain":"safety-ethics-compliance"},{"id":"SE-019","type":"single","difficulty":"hard","stem":"A loan-assistance agent is audited for fairness. Applicant postcode is not an input, but the retrieval corpus includes branch-level guidance that varies by region. What is the risk?","choices":["None, since the protected attribute is not an input feature","Proxy discrimination: region-correlated guidance can reproduce a protected-attribute effect through retrieval, so fairness testing must cover the retrieved context, not just the inputs","Only a data-freshness risk","Only a latency risk from the extra retrieval"],"answer":[1],"explanation":"Removing an attribute does not remove its proxies, and in a RAG system the proxy can enter through retrieved content rather than the prompt. Fairness evaluation therefore has to treat the retrieval path as part of the model: measure outcomes by group and run counterfactuals that vary only the region-correlated signal.","tags":["bias","fairness","proxy-discrimination","retrieval"],"ref":"https://www.nist.gov/itl/ai-risk-management-framework","domain":"safety-ethics-compliance"},{"id":"SE-020","type":"multi","difficulty":"medium","stem":"You are designing a fairness evaluation for an agent that screens support tickets for priority. Which TWO measurements matter most?","choices":["Priority-assignment rates and error rates broken out by customer segment","Counterfactual pairs where only a group-correlated attribute changes, holding the ticket content constant","Overall agreement with historical human prioritization","Average response latency per segment"],"answer":[0,1],"explanation":"Disaggregation reveals disparate outcomes an aggregate hides, and counterfactual pairs isolate whether the attribute itself is driving the decision rather than a legitimate correlate. Agreement with historical decisions can encode past bias as the target, and latency is a service-quality metric rather than a fairness one.","tags":["bias","fairness","disaggregated-evaluation","counterfactual-testing"],"ref":"https://www.nist.gov/itl/ai-risk-management-framework","domain":"safety-ethics-compliance"},{"id":"SE-021","type":"single","difficulty":"hard","stem":"An incident review finds the agent behaved correctly but a tool returned wrong data because an upstream team changed a field's units from cents to dollars. Who owns the fix, and what is the durable control?","choices":["The agent team, by instructing the model to sanity-check magnitudes","The integration boundary: a versioned, typed contract for the tool response with validation that fails loudly on a schema or semantic change","The upstream team alone, by reverting the change","No fix is needed, since the agent reasoned correctly"],"answer":[1],"explanation":"Correct reasoning over wrong data still produces wrong outcomes, and the defect lives at the contract between systems. A versioned typed contract plus strict validation converts an invisible semantic change into a loud failure. Asking the model to guess at magnitudes is not a control, and reverting fixes this instance without preventing the next.","tags":["schema-drift","contract-tests","integration","silent-failure"],"ref":"https://opentelemetry.io/docs/specs/semconv/gen-ai/","domain":"safety-ethics-compliance"},{"id":"CS01-1","domain":"agent-architecture","type":"single","difficulty":"medium","stem":"Which change addresses both the skipped validation and the duplicate ledger posting?","choices":["Lower the temperature to zero and add an instruction listing the four steps in order","Replace the free-form loop with an explicit graph that encodes the step order, and make the ledger write a single terminal node guarded by an idempotency key","Add a reviewer agent that reads the transcript after each run and flags anomalies","Increase the step limit so the agent has room to complete all four steps"],"answer":[1],"explanation":"The order is known in advance, so it belongs in the orchestration layer rather than in the model's discretion; a graph guarantees validation runs. The duplicate posting is a retry-safety problem, fixed by idempotency at the write, not by better prompting. A reviewer agent detects after the money has moved, and temperature and step limits do not constrain sequence or side effects.","tags":["state-machine","idempotency","determinism"],"ref":"https://langchain-ai.github.io/langgraph/concepts/low_level/","case":"CS01"},{"id":"CS01-2","domain":"safety-ethics-compliance","type":"single","difficulty":"hard","stem":"Security requires that the agent can never post a payout above the $25,000 policy cap, even if the model is manipulated. Where must that limit live?","choices":["In the system prompt, stated as an absolute rule the agent must never violate","In the ledger service, which rejects any posting above the cap regardless of what the caller sends","In the tool description for the posting tool, so the model knows the constraint when it chooses arguments","In an output rail that inspects the final response for amounts over the cap"],"answer":[1],"explanation":"A limit the model can talk past is not a limit. Enforcing the cap server-side in the ledger makes it structural: no prompt, injection, or model error can exceed it. Prompts and tool descriptions inform the model's choice but do not constrain it, and an output rail inspects text after the posting has already happened.","tags":["server-side-enforcement","least-privilege","guardrails"],"ref":"https://genai.owasp.org/llm-top-10/","case":"CS01"},{"id":"CS01-3","domain":"human-ai-oversight","type":"single","difficulty":"medium","stem":"The insurer wants human approval without stalling the 10,000 claims it processes daily. Which design fits?","choices":["Require approval on every claim, since payouts are irreversible","Auto-approve low-value claims that match policy cleanly, route high-value, low-confidence, or rule-flagged claims to a human, and sample-audit the auto-approved stream","Approve a random 5% before execution and let the rest through","Let all claims through and review the ones that generate complaints"],"answer":[1],"explanation":"Risk-tiered routing concentrates human attention where the expected cost of error is highest while sampling keeps statistical oversight of the automated path. Approving everything does not scale to the volume, random pre-approval blocks throughput without targeting risk, and complaint-driven review is purely reactive on an irreversible action.","tags":["risk-tiering","escalation","sampling-audit"],"ref":"https://www.nist.gov/itl/ai-risk-management-framework","case":"CS01"},{"id":"CS01-4","domain":"run-monitor-maintain","type":"multi","difficulty":"hard","stem":"To satisfy the regulator's reconstruction requirement, which TWO must be captured per claim?","choices":["The full trajectory: every tool call with arguments and results, the policy documents consulted with their version identifiers, and any human approval","The model identifier and version, the prompt version, and the guardrail decisions in force at the time","The aggregate monthly accuracy of the agent on similar claims","The model's self-reported confidence in the payout figure"],"answer":[0,1],"explanation":"Reconstructing a specific decision requires the evidence used and the actions taken, plus the exact configuration that produced the reasoning — a decision cannot be explained without knowing which model, prompt and rails were live. Aggregate statistics describe the population, not the case, and self-reported confidence is neither calibrated nor evidence.","tags":["auditability","versioning","traceability"],"ref":"https://opentelemetry.io/docs/specs/semconv/gen-ai/","case":"CS01"},{"id":"CS02-1","domain":"knowledge-data","type":"single","difficulty":"medium","stem":"Which problem does the 256-token, no-overlap chunking most directly explain?","choices":["Citing the superseded 2023 policy","Answers that stop halfway through a multi-step procedure","Claims absent from the retrieved passages","The overall decline in satisfaction over time"],"answer":[1],"explanation":"Fixed-size chunking with no overlap severs documents at arbitrary boundaries, so a procedure spanning more than 256 tokens is split and only part is retrieved. The truncated-procedure symptom maps to segmentation. Stale citations are a governance problem and ungrounded claims are a grounding problem, neither caused by chunk size.","tags":["chunking","symptom-attribution","procedures"],"ref":"https://docs.llamaindex.ai/en/stable/module_guides/loading/node_parsers/","case":"CS02"},{"id":"CS02-2","domain":"knowledge-data","type":"single","difficulty":"hard","stem":"What is the most reliable fix for answers citing the superseded 2023 policy?","choices":["Add a reranker so the newer document outranks the older one","Attach effective-date and status metadata at ingestion, filter on it at query time, and tombstone or remove superseded documents","Instruct the model in the system prompt to prefer the most recent source","Re-embed the corpus with a newer embedding model"],"answer":[1],"explanation":"Recency is not something a relevance model can infer from text — a superseded policy is often the more semantically relevant document. Versioned metadata with query-time filtering plus an explicit retirement process makes the guarantee deterministic. Rerankers and prompts both optimize for relevance, and re-embedding changes nothing about which version exists.","tags":["freshness","metadata-filtering","supersession"],"ref":"https://docs.llamaindex.ai/en/stable/module_guides/indexing/metadata_extraction/","case":"CS02"},{"id":"CS02-3","domain":"evaluation-tuning","type":"single","difficulty":"medium","stem":"Which metric would have caught the ungrounded-claim problem on production traffic without labeled answers?","choices":["Context recall","Faithfulness","Exact match against reference answers","Perplexity"],"answer":[1],"explanation":"Faithfulness compares the answer's claims against the retrieved context and needs no ground truth, so it can run continuously on live traffic. Context recall requires a reference answer, exact match requires labels, and perplexity measures nothing about grounding.","tags":["faithfulness","reference-free","production-monitoring"],"ref":"https://docs.ragas.io/en/stable/concepts/metrics/available_metrics/faithfulness/","case":"CS02"},{"id":"CS02-4","domain":"run-monitor-maintain","type":"single","difficulty":"hard","stem":"The stack is frozen, yet quality declined steadily. What is the underlying cause?","choices":["Gradual corruption of the served model weights","Drift: the questions users ask and the corpus itself both moved away from what the pipeline a
