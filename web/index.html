 the effect, require explicit confirmation of the reviewed scope, and bound the damage server-side regardless of what the model sends. Descriptions, logs, and sampling settings do not constrain the actual effect of the call.","tags":["destructive-actions","guardrails","dry-run","tool-design"],"ref":"https://genai.owasp.org/llm-top-10/","domain":"agent-development"},{"id":"AD-018","type":"multi","difficulty":"hard","stem":"Your agent runs on a NIM-hosted open model and you want to add reliable tool calling. Which TWO steps are most relevant?","choices":["Select a model whose card documents function-calling/tool-use support and use the endpoint's `tools` parameter rather than hand-rolled prompt formats","Validate every returned tool call against your JSON schema before execution and return a structured error on mismatch","Fine-tune the model on your specific tool set before any tool calling will work","Disable streaming, because tool calls cannot be produced in streaming mode"],"answer":[0,1],"explanation":"Use a tool-use-capable model through its documented OpenAI-compatible `tools` interface so the server applies the correct chat template and parser, and validate the resulting arguments before execution because schema compliance is never guaranteed end to end. Fine-tuning is not required for tool use, and streaming with tool calls is supported.","tags":["nim","function-calling","validation","nvidia"],"ref":"https://docs.nvidia.com/nim/large-language-models/latest/function-calling.html","domain":"agent-development"},{"id":"AD-019","type":"single","difficulty":"medium","stem":"Your agent returns a Pydantic-validated object. Validation fails roughly 3% of the time on an enum field where the model invents a near-miss value such as 'in_progress' instead of 'IN_PROGRESS'. What is the most robust fix?","choices":["Add a case-insensitive coercion in the validator and, more importantly, enumerate the exact permitted values in the tool schema so guided decoding can only emit them","Retry the call until validation passes","Change the field type to a free-form string and normalize downstream","Add an example of the correct casing to the prompt"],"answer":[0],"explanation":"The schema is the contract the decoder enforces, so putting the literal allowed values in it removes the failure class entirely; lenient coercion handles anything that still slips through older or non-constrained paths. Retries burn tokens on a systematic error, loosening the type pushes the problem downstream, and prompt examples reduce but do not eliminate the drift.","tags":["pydantic","validation","enums","structured-output"],"ref":"https://docs.nvidia.com/nim/large-language-models/latest/structured-generation.html","domain":"agent-development"},{"id":"AD-020","type":"multi","difficulty":"hard","stem":"An agent must stream its answer to the user while also calling tools mid-stream. Which TWO implementation concerns are real?","choices":["The client must distinguish content deltas from tool-call deltas, because tool arguments arrive incrementally and are not user-visible text","Partial tool-call arguments must be accumulated and only executed once the call is complete, never parsed and executed mid-stream","Streaming prevents the use of structured output entirely","Tools cannot be called after streaming has begun; the stream must be closed first"],"answer":[0,1],"explanation":"Streaming APIs interleave message content and tool-call fragments in the same event stream, so the client must route them differently and must buffer argument fragments until the call is complete before executing anything. Executing a half-built argument object is a real bug. Streaming is compatible with both structured output and tool calls.","tags":["streaming","tool-calls","deltas","client-implementation"],"ref":"https://docs.nvidia.com/nim/large-language-models/latest/function-calling.html","domain":"agent-development"},{"id":"AD-021","type":"single","difficulty":"medium","stem":"You wrap an internal REST API as an agent tool. The API returns a 900-line JSON document per call. What should the tool wrapper do?","choices":["Return the full document so the model has complete information","Project the response down to the fields the agent actually needs, summarize or paginate large collections, and return a compact structured result","Return the document as a base64 string to save tokens","Store the document in a file and return the path"],"answer":[1],"explanation":"Tool output is prompt input, so the wrapper's job includes shaping the response for a model's context budget: select relevant fields, collapse long collections, and keep the result small and structured. Full documents waste tokens and dilute attention, base64 removes the model's ability to read it at all, and a bare file path is useless unless the agent also has a tool to read it.","tags":["tool-wrappers","response-shaping","context-budget","rest"],"ref":"https://modelcontextprotocol.io/docs/learn/server-concepts","domain":"agent-development"},{"id":"AD-022","type":"single","difficulty":"hard","stem":"An agent intermittently calls a tool with an argument copied from user text that contains an injection payload. What development-time practice most reduces this class of incident?","choices":["Validate and normalize tool arguments against the schema's constraints server-side, and never interpolate model-supplied strings into privileged commands, queries, or paths","Ask the model to sanitize user input before using it","Log the arguments so the payload can be found later","Use a larger model that is less likely to be fooled"],"answer":[0],"explanation":"This is injection in the classic sense: untrusted text reaching an interpreter. The defense is the same as it has always been — strict server-side validation plus parameterized construction, never string interpolation of model output into commands, SQL, or filesystem paths. Asking the model to sanitize its own input makes the untrusted component the security control.","tags":["injection","argument-validation","parameterization","security"],"ref":"https://genai.owasp.org/llm-top-10/","domain":"agent-development"},{"id":"AD-023","type":"single","difficulty":"medium","stem":"Which statement about temperature and top-p in an agentic workflow is accurate?","choices":["Temperature 0 makes the agent fully deterministic across runs and model versions","Lower temperature tightens the output distribution and suits tool selection and structured output, but does not guarantee reproducibility across model versions, batching, or hardware","Top-p and temperature are interchangeable controls","Higher temperature improves tool-selection accuracy by encouraging exploration"],"answer":[1],"explanation":"Low temperature is the right default for the precision-critical parts of an agent, but greedy decoding is not a reproducibility guarantee: floating-point non-associativity under different batch compositions and kernels, plus model version changes, all shift results. Treat determinism as a testing strategy (stubs and fixtures), not a sampling setting.","tags":["temperature","determinism","sampling","reproducibility"],"ref":"https://nvidia.github.io/TensorRT-LLM/","domain":"agent-development"},{"id":"AD-024","type":"single","difficulty":"hard","stem":"You are adding a new tool to an agent that already has 12. After the addition, accuracy on two existing tools drops. What is the most likely cause and the right response?","choices":["The model ran out of context; increase the context window","The new tool's description overlaps semantically with the existing two, creating selection ambiguity; sharpen the boundaries in all three descriptions and add negative guidance","The new tool has a bug; disable it","Tool order in the schema changed; restore the original order"],"answer":[1],"explanation":"Adding a tool changes the decision problem for every other tool. A regression concentrated in two specific tools points to semantic overlap with the newcomer. The fix is to make the boundaries explicit in the descriptions — including when not to use each — rather than to treat it as a capacity or ordering issue. This is also why tool additions need a regression run.","tags":["tool-overlap","selection-ambiguity","regression","tool-descriptions"],"ref":"https://modelcontextprotocol.io/docs/learn/server-concepts","domain":"agent-development"},{"id":"AD-025","type":"multi","difficulty":"medium","stem":"Which TWO belong in an agent's automated CI suite, as opposed to its periodic evaluation suite?","choices":["Assertions that a fixed stubbed model response produces a specific tool call with specific arguments","Schema-conformance tests for every tool's input and output contract","LLM-as-judge scoring of answer quality on 500 production samples","A full timed run against live third-party APIs"],"answer":[0,1],"explanation":"CI needs fast, deterministic, hermetic checks: stubbed trajectories and contract tests fit, and they fail loudly on real regressions. Judge-scored quality suites are stochastic, slow, and expensive, so they belong in a scheduled evaluation job with trend tracking, and live third-party calls make CI flaky and rate-limited.","tags":["ci","testing-strategy","contract-tests","hermetic"],"ref":"https://docs.smith.langchain.com/evaluation/concepts","domain":"agent-development"},{"id":"AD-026","type":"single","difficulty":"medium","stem":"What is the purpose of a system prompt's 'stop conditions' section in a tool-using agent?","choices":["To set the API's stop sequences so generation halts at a token","To tell the model explicitly when the task is complete and it should answer rather than call another tool, reducing unnecessary tool loops","To define the maximum number of tokens per response","To list which tools are forbidden"],"answer":[1],"explanation":"Agents frequently over-call tools because nothing in their instructions defines sufficiency. Stating what constitutes a complete answer, and that the model should respond once that condition holds, materially reduces redundant tool use. That is a semantic instruction, distinct from the API-level stop-sequence parameter.","tags":["system-prompt","stop-conditions","tool-loops","prompting"],"ref":"https://learn.nvidia.com/courses/course-detail?course_id=course-v1%3ADLI+S-FX-16+V1","domain":"agent-development"},{"id":"AD-027","type":"single","difficulty":"hard","stem":"A LangGraph agent must fan out to N subtasks where N is only known at runtime. Which mechanism fits?","choices":["Declare N parallel nodes at graph-construction time","Use dynamic dispatch that emits one task per item at runtime and collects the results into a reducer-backed state field","Call the subtask node N times sequentially in a loop","Create a separate graph per item and merge the outputs manually"],"answer":[1],"explanation":"Runtime-determined fan-out needs the graph to emit work items dynamically and aggregate the results through a state channel with a reducer that appends rather than overwrites. Declaring nodes statically cannot express an unknown N, and looping sequentially discards the parallelism that motivated the fan-out.","tags":["langgraph","dynamic-fanout","reducers","state"],"ref":"https://langchain-ai.github.io/langgraph/concepts/low_level/","domain":"agent-development"},{"id":"AD-028","type":"single","difficulty":"medium","stem":"Your agent occasionally emits a tool call for a tool that does not exist. What is the correct handling?","choices":["Return a structured error naming the unknown tool and listing the available tool names, so the model can correct itself on the next turn","Crash the run so the bug is visible","Silently map it to the closest matching tool name","Retry the same request with a higher temperature"],"answer":[0],"explanation":"Hallucinated tool names are recoverable if the error message is informative: name the problem and enumerate the valid options so the next turn can be correct. Fuzzy-matching to a nearby tool can execute the wrong action, crashing loses recoverable work, and resampling at higher temperature does not address the cause.","tags":["hallucinated-tools","error-handling","self-correction"],"ref":"https://docs.nvidia.com/nemo/agent-toolkit/latest/","domain":"agent-development"},{"id":"AD-029","type":"single","difficulty":"hard","stem":"An agent reads a user's uploaded CSV of 80,000 rows to answer aggregate questions. Passing the file into context is impossible. What is the right design?","choices":["Chunk the CSV and retrieve the most similar chunks by embedding","Give the agent a query tool over the data (load it into a table or dataframe and expose filter/aggregate operations), so computation happens outside the model","Summarize the CSV with a first LLM pass, then answer from the summary","Increase the context window and pass the first 100,000 tokens"],"answer":[1],"explanation":"Aggregate questions over tabular data are a computation problem, not a retrieval problem: embedding similarity cannot compute a sum, and a lossy summary cannot answer an arbitrary future question. Exposing query and aggregation operations lets a deterministic engine do the arithmetic and the model do the interpretation.","tags":["tabular-data","computation-vs-retrieval","tool-design","aggregation"],"ref":"https://docs.llamaindex.ai/en/stable/module_guides/indexing/","domain":"agent-development"},{"id":"AD-030","type":"single","difficulty":"medium","stem":"What does NVIDIA NeMo Gym provide in the model and agent development lifecycle?","choices":["A hosted playground for prompt experimentation","A library of interactive environments for multi-environment reinforcement learning, used to post-train models on tool calls, code generation, and multi-step workflows","A benchmark leaderboard for agent frameworks","A GPU scheduling system for training jobs"],"answer":[1],"explanation":"NeMo Gym supplies the interactive environments that make RL post-training on agentic behavior possible — evaluating tool use, code generation, and multi-step task completion rather than single-turn text. It was used in Nemotron 3's post-training and is released alongside NeMo RL for teams doing the same.","tags":["nemo-gym","rl-post-training","nvidia","agentic-training"],"ref":"https://developer.nvidia.com/blog/inside-nvidia-nemotron-3-techniques-tools-and-data-that-make-it-efficient-and-accurate/","domain":"agent-development"},{"id":"AD-031","type":"single","difficulty":"hard","stem":"You must support 'undo' for an agent that has already sent an email, created a calendar event, and updated a CRM record. What is the realistic design?","choices":["Wrap the three actions in a database transaction and roll back","Define a compensating action for each operation (send a correction, delete the event, restore the prior CRM field values) and record enough state at execution time to run them","Delay all three actions by 60 seconds so they can be cancelled","Re-run the agent with instructions to reverse what it did"],"answer":[1],"explanation":"External side effects across independent systems cannot participate in a transaction, so reversal is implemented as compensation: a defined inverse per action, plus the before-state captured at execution time so the inverse has something to restore to. A cancellation window helps for some actions but does not cover the ones already delivered, and asking the model to improvise a reversal is not a guarantee.","tags":["compensating-actions","saga","undo","side-effects"],"ref":"https://genai.owasp.org/llm-top-10/","domain":"agent-development"},{"id":"AD-032","type":"single","difficulty":"medium","stem":"Which approach best handles an agent tool whose upstream API paginates results across many pages?","choices":["Have the tool fetch every page and return the concatenated result","Expose pagination in the tool's schema (a cursor or page parameter) and return a page plus a continuation token, letting the agent request more only if needed","Return only the first page and note in the description that more exist","Fetch all pages and return a model-generated summary of them"],"answer":[1],"explanation":"Making pagination explicit gives the agent control over how much it pulls into context and keeps each call bounded. Fetching everything can blow the context budget and the latency budget on data the agent may not need; truncating to page one silently loses data; summarizing at the tool layer discards detail before the agent knows what matters.","tags":["pagination","tool-design","context-budget","cursors"],"ref":"https://modelcontextprotocol.io/docs/learn/server-concepts","domain":"agent-development"},{"id":"AD-033","type":"multi","difficulty":"hard","stem":"An agent's prompt is assembled from a system template, retrieved documents, conversation history, and tool definitions. Which TWO assembly practices reduce prompt-injection risk?","choices":["Place retrieved and user-supplied content inside clearly delimited blocks labeled as untrusted data that must not be interpreted as instructions","Keep the ordering and content of the trusted system section fixed and never let retrieved text be interpolated into it","Put retrieved documents at the very top so the model reads them first","Merge retrieved content into the system prompt so it carries the same authority"],"answer":[0,1],"explanation":"Injection resistance comes from maintaining a trust boundary inside the prompt: untrusted content is fenced and labeled as data, and the privileged system section is never built from attacker-reachable text. Promoting retrieved content into the system prompt does the opposite, granting it instruction authority — the single most common way indirect injection succeeds.","tags":["prompt-assembly","trust-boundary","injection","fencing"],"ref":"https://arxiv.org/abs/2302.12173","domain":"agent-development"},{"id":"AD-034","type":"single","difficulty":"medium","stem":"When is it appropriate to give an agent a tool that itself invokes another agent?","choices":["Never; nested agents always cause runaway cost","When the sub-agent encapsulates a genuinely distinct capability, and the call is bounded by its own step limit, budget, and timeout so the parent cannot inherit unbounded cost","Whenever the parent's prompt becomes long","Only when both agents use the same model"],"answer":[1],"explanation":"Agent-as-tool is a legitimate composition primitive, and the NeMo Agent Toolkit's uniform function interface is built on exactly this idea. What makes it safe is bounding: the nested call needs its own step ceiling, token budget, and timeout, or an inner loop can consume the parent's entire budget invisibly.","tags":["nested-agents","composition","budgets","agent-as-tool"],"ref":"https://docs.nvidia.com/nemo/agent-toolkit/latest/","domain":"agent-development"},{"id":"AD-035","type":"single","difficulty":"medium","stem":"An agent calls a partner API limited to 600 requests per minute across your whole organization. You run 12 replicas. Which enforcement is correct?","choices":["Each replica enforces 50 requests per minute locally, since 12 x 50 = 600","A shared token bucket in Redis that every replica consults before the call","A semaphore in each replica sized to the expected concurrency","A retry-with-backoff wrapper, since 429s will naturally shape the rate"],"answer":[1],"explanation":"Static per-replica division breaks the moment traffic is uneven or the replica count changes — eleven idle replicas waste their share while the twelfth is throttled. A shared bucket enforces the true global limit regardless of distribution or scaling. Local semaphores bound concurrency, not rate, and backoff reacts after you have already breached the limit.","tags":["rate-limiting","concurrency","distributed-state"],"ref":"https://docs.nvidia.com/nemo/agent-toolkit/latest/","domain":"agent-development"},{"id":"AD-036","type":"single","difficulty":"hard","stem":"Your agent's tool is rate-limited upstream and returns 429 with a Retry-After header. What should the tool wrapper do?","choices":["Return the 429 to the model as an error so it can decide what to do","Honor Retry-After with a bounded wait inside the wrapper, and only surface an error to the model if the budget is exhausted","Immediately retry in a tight loop until it succeeds","Fall back to a different tool automatically"],"answer":[1],"explanation":"Transient, self-describing backpressure is an infrastructure concern, not a reasoning one: handling it inside the wrapper keeps the model's context free of noise and avoids wasting a turn. The wait must be bounded so a long outage surfaces as a real error rather than a hang. Tight retry loops worsen the overload, and silent tool substitution changes behavior the agent did not choose.","tags":["rate-limiting","retries","tool-wrappers","backpressure"],"ref":"https://docs.nvidia.com/nemo/agent-toolkit/latest/","domain":"agent-development"},{"id":"AD-037","type":"multi","difficulty":"medium","stem":"An agent must process 5,000 documents through a tool that allows 10 concurrent calls. Which TWO approaches fit?","choices":["A bounded worker pool of 10 that pulls from a queue until the backlog is drained","Batch the work and checkpoint progress so a restart resumes rather than reprocessing","Fire all 5,000 calls and let the upstream service reject the excess","Increase the agent's step limit to 5,000"],"answer":[0,1],"explanation":"Bulk work with a concurrency ceiling is a queue-and-worker problem: a bounded pool respects the limit while keeping it saturated, and checkpointing makes a multi-hour job restartable. Flooding the upstream converts a throughput problem into an outage, and step limits govern agent reasoning turns rather than batch throughput.","tags":["concurrency","rate-limiting","checkpointing","batch-processing"],"ref":"https://langchain-ai.github.io/langgraph/concepts/persistence/","domain":"agent-development"},{"id":"AD-038","type":"single","difficulty":"medium","stem":"A tool returns HTTP 500 intermittently, roughly 1 call in 50, and succeeds on retry. What should the wrapper return to the model when retries are exhausted?","choices":["An empty result, so the agent can continue without an error","A structured error stating the tool is temporarily unavailable, how many attempts were made, and whether the operation may have partially applied","The raw HTTP response body","A message instructing the agent to try a different approach"],"answer":[1],"explanation":"After exhausting retries the model needs three facts to reason correctly: that the failure is transient rather than a bad request, that retrying has already been tried, and crucially whether the side effect may have landed. Empty results silently corrupt the agent's world model, raw bodies waste context, and prescribing the next action removes the agent's ability to weigh it.","tags":["error-handling","tool-errors","retries","partial-failure"],"ref":"https://docs.nvidia.com/nemo/agent-toolkit/latest/","domain":"agent-development"},{"id":"CP-001","type":"single","difficulty":"easy","stem":"What are the three repeating elements of the ReAct pattern?","choices":["Retrieve, Augment, Generate","Thought, Action, Observation","Plan, Execute, Reflect","Perceive, Decide, Learn"],"answer":[1],"explanation":"ReAct interleaves reasoning traces with tool use: the model produces a Thought, emits an Action (tool call), receives an Observation, and repeats. Interleaving is the key idea — reasoning conditions the next action and each observation conditions the next thought.","tags":["react","reasoning","patterns"],"ref":"https://arxiv.org/abs/2210.03629","domain":"cognition-planning-memory"},{"id":"CP-002","type":"single","difficulty":"hard","stem":"An agent handles a 20-step task. With a single ReAct loop it frequently loses track of the overall goal after step 8 and starts optimizing locally. Which change most directly addresses this?","choices":["Increase the recursion/step limit so it has room to recover","Adopt a planner-executor split: generate an explicit plan up front, keep it in state, and have the executor work through it while a re-planning step revises it on failure","Add a reflection pass only at the very end of the run","Switch to a model with a longer context window"],"answer":[1],"explanation":"Goal drift over long horizons is a planning-representation problem. Externalizing the plan into durable state gives every step a stable reference to the global objective and makes progress checkable, while a re-planning step handles deviation. Longer contexts and higher step limits give the loop more room to drift; end-of-run reflection is too late to steer.","tags":["planner-executor","goal-drift","long-horizon","replanning"],"ref":"https://arxiv.org/abs/2305.04091","domain":"cognition-planning-memory"},{"id":"CP-003","type":"single","difficulty":"medium","stem":"Which memory type does a skill library — reusable, verified procedures an agent has learned and can call later — most closely correspond to?","choices":["Episodic memory","Semantic memory","Procedural memory","Working memory"],"answer":[2],"explanation":"Procedural memory stores how-to knowledge: executable skills and routines. This is the Voyager-style skill library, where verified code is stored and retrieved for reuse. Episodic memory holds specific past events, semantic memory holds facts and concepts, and working memory is the transient contents of the current context.","tags":["memory-types","procedural-memory","skill-library","voyager"],"ref":"https://arxiv.org/abs/2305.16291","domain":"cognition-planning-memory"},{"id":"CP-004","type":"multi","difficulty":"medium","stem":"A conversational agent must remember user preferences across sessions that span months. Which TWO design elements are required?","choices":["An external persistent store for memories, keyed by user identity and written deliberately rather than as raw transcript","A retrieval step that selects only the memories relevant to the current turn and injects them into context","A context window large enough to hold every past session verbatim","Re-running fine-tuning nightly on each user's transcripts"],"answer":[0,1],"explanation":"Cross-session memory is a write-then-retrieve system: durable storage of distilled, user-scoped memories, plus relevance-based recall into the working context. Stuffing all history into context does not scale in cost or attention quality, and per-user nightly fine-tuning is impractical and the wrong tool for volatile preferences.","tags":["long-term-memory","personalization","memory-retrieval"],"ref":"https://arxiv.org/abs/2304.03442","domain":"cognition-planning-memory"},{"id":"CP-005","type":"single","difficulty":"hard","stem":"What is the central idea of Reflexion as applied to an agent that failed a task?","choices":["Sampling multiple answers and taking the majority vote","Converting the failure signal into verbal self-feedback that is stored in memory and conditions the next attempt","Updating the model weights through reinforcement learning after each failure","Exploring multiple reasoning branches in parallel and pruning the weakest"],"answer":[1],"explanation":"Reflexion performs verbal reinforcement: the agent reflects on why it failed, writes that reflection into episodic memory, and retries with the reflection in context. No weight updates occur — the learning is in the memory, not the parameters. Majority voting is self-consistency, and parallel branch exploration is Tree of Thoughts.","tags":["reflexion","self-improvement","verbal-reinforcement","episodic-memory"],"ref":"https://arxiv.org/abs/2303.11366","domain":"cognition-planning-memory"},{"id":"CP-006","type":"single","difficulty":"medium","stem":"When is Tree of Thoughts preferable to plain chain-of-thought?","choices":["When the task requires exploring and evaluating multiple candidate reasoning paths with backtracking, and per-token cost is acceptable","When latency is the dominant constraint","When the task is a single-step factual lookup","When the output must conform to a strict JSON schema"],"answer":[0],"explanation":"ToT generalizes CoT into a search over partial solutions with explicit state evaluation and backtracking, which pays off on problems where early commitments can be wrong (planning, puzzles, proof search). It multiplies inference cost and latency, so it is inappropriate for latency-sensitive or trivial tasks and orthogonal to output formatting.","tags":["tree-of-thoughts","search","test-time-compute"],"ref":"https://arxiv.org/abs/2305.10601","domain":"cognition-planning-memory"},{"id":"CP-007","type":"single","difficulty":"hard","stem":"An agent's context is nearing its limit mid-task. Which compaction strategy best preserves task capability?","choices":["Truncate the oldest messages until the context fits","Summarize older turns into a structured digest while preserving verbatim the current goal, open sub-tasks, key identifiers, and recent tool outputs","Drop all tool outputs and keep only natural-language messages","Keep only the last two messages and restart reasoning from there"],"answer":[1],"explanation":"Good compaction is selective, not positional: lossy-compress narrative history but keep the state the agent needs to act correctly — the objective, outstanding work, exact identifiers, and the most recent observations. Blind truncation and dropping tool outputs discard precisely the load-bearing details, especially identifiers that cannot be reconstructed.","tags":["context-compaction","summarization","state-preservation"],"ref":"https://arxiv.org/abs/2310.08560","domain":"cognition-planning-memory"},{"id":"CP-008","type":"single","difficulty":"medium","stem":"What distinguishes a reasoning model's test-time compute scaling from ordinary chain-of-thought prompting?","choices":["The model is trained to produce and use extended internal reasoning, and quality improves as it is allotted more reasoning tokens at inference","It requires no tokens because reasoning occurs in the weights","It replaces the need for tools and retrieval","It only applies to models under 10B parameters"],"answer":[0],"explanation":"Reasoning models are post-trained so that spending more inference tokens on deliberation reliably improves accuracy, making compute a tunable dial at serving time. CoT prompting coaxes similar behavior from a non-reasoning model without that training. Reasoning still consumes tokens, does not obviate retrieval of facts the model lacks, and is not size-limited.","tags":["reasoning-models","test-time-compute","inference-scaling"],"ref":"https://arxiv.org/abs/2201.11903","domain":"cognition-planning-memory"},{"id":"CP-009","type":"single","difficulty":"hard","stem":"A planning agent decomposes requests into sub-tasks, but roughly 15% of plans contain a step that depends on information only available after a later step runs. What is the most robust fix?","choices":["Ask the model to double-check its plan before executing","Adopt interleaved/adaptive planning: plan only to the next decision point, execute, then re-plan with the new observations, rather than committing to a full plan up front","Increase the plan's step count so more detail is available","Execute the plan steps in parallel so ordering no longer matters"],"answer":[1],"explanation":"The defect is committing to a complete plan under incomplete information. Interleaving planning with execution (plan-act-replan) lets each decision use observations that did not exist at planning time. Self-checking cannot conjure the missing information, more detail compounds the error, and parallel execution breaks genuine data dependencies.","tags":["adaptive-planning","replanning","dependencies","interleaved-planning"],"ref":"https://arxiv.org/abs/2205.10625","domain":"cognition-planning-memory"},{"id":"CP-010","type":"single","difficulty":"medium","stem":"Which statement about self-consistency is correct?","choices":["It samples multiple reasoning paths at non-zero temperature and selects the most common final answer","It requires a separate verifier model to score each path","It reduces inference cost relative to a single greedy sample","It is only valid for open-ended generation tasks"],"answer":[0],"explanation":"Self-consistency marginalizes over diverse reasoning paths by sampling several and taking the majority answer, which improves accuracy on tasks with a single correct answer. It needs no verifier, costs proportionally more than one sample, and depends on answers being comparable — so it suits closed-form rather than open-ended outputs.","tags":["self-consistency","majority-vote","sampling"],"ref":"https://arxiv.org/abs/2203.11171","domain":"cognition-planning-memory"},{"id":"CP-011","type":"multi","difficulty":"hard","stem":"An agent stores every conversational turn as a memory and retrieves the top 10 by embedding similarity. Users report it surfaces stale, contradicted preferences. Which TWO improvements address this?","choices":["Write memories deliberately (extract durable facts and preferences) instead of storing raw turns, and update or supersede existing entries on conflict","Include recency and importance in the retrieval score rather than similarity alone","Increase top-k from 10 to 50 so the correct memory is more likely included","Lower the embedding dimension to sharpen similarity"],"answer":[0,1],"explanation":"Two separate defects: an ingestion problem (raw turns produce many near-duplicate, mutually contradictory memories with no invalidation) and a ranking problem (pure similarity is blind to which memory is current or significant). Generative-agents-style retrieval combines relevance, recency, and importance. Raising top-k adds more stale entries, and shrinking embedding dimensions degrades retrieval quality.","tags":["memory-writes","memory-invalidation","retrieval-scoring","recency"],"ref":"https://arxiv.org/abs/2304.03442","domain":"cognition-planning-memory"},{"id":"CP-012","type":"single","difficulty":"medium","stem":"In agent design, what is the practical difference between working (short-term) memory and long-term memory?","choices":["Working memory is the model's parameters; long-term memory is the context window","Working memory is the active context for the current task and is bounded by the context window; long-term memory is external storage that outlives the task and is selectively retrieved into context","Working memory is stored in a vector database; long-term memory is stored in the prompt","They are the same mechanism with different retention settings"],"answer":[1],"explanation":"Working memory is what is in the context right now — bounded, volatile, and expensive per token. Long-term memory lives outside the model in files, databases, or vector stores, persists beyond the session, and enters working memory only when retrieved. Parameters encode parametric knowledge, which is a third, distinct category.","tags":["memory-architecture","working-memory","definitions"],"ref":"https://arxiv.org/abs/2308.11432","domain":"cognition-planning-memory"},{"id":"CP-013","type":"single","difficulty":"medium","stem":"An agent needs to remember that a user prefers metric units. Which memory design is appropriate?","choices":["Append the full conversation to a vector store and retrieve by similarity each turn","Extract the preference as a durable structured fact scoped to the user, store it, and inject it into the system context on every session","Fine-tune a per-user adapter nightly","Keep the whole conversation in context indefinitely"],"answer":[1],"explanation":"A small, stable, always-relevant preference is not a retrieval problem — it is a profile fact. Extracting it once and injecting it deterministically guarantees it is present, whereas similarity retrieval may simply not surface it on a turn where the query is about something else. Per-user tuning is wildly disproportionate for a single preference.","tags":["profile-memory","always-inject","memory-design","personalization"],"ref":"https://arxiv.org/abs/2304.03442","domain":"cognition-planning-memory"},{"id":"CP-014","type":"single","difficulty":"hard","stem":"Which statement best captures why chain-of-thought can make an agent's answers less reliable rather than more?","choices":["Reasoning tokens always increase latency beyond acceptable limits","Generated reasoning is a post-hoc narrative that need not reflect the computation that produced the answer, so a confident, fluent chain can rationalize a wrong conclusion and mislead reviewers","Chain-of-thought disables tool calling","Chain-of-thought requires a reasoning-tuned model to work at all"],"answer":[1],"explanation":"CoT reliably helps on multi-step problems, but the trace is not a faithful account of the model's internal process. That matters operationally: a plausible chain can lend unwarranted confidence to a wrong answer, which is why reasoning traces are weak evidence for human reviewers and why verification should rest on checkable outputs instead.","tags":["chain-of-thought","faithfulness-of-reasoning","reviewer-risk"],"ref":"https://arxiv.org/abs/2201.11903","domain":"cognition-planning-memory"},{"id":"CP-015","type":"multi","difficulty":"medium","stem":"An agent's context regularly reaches its limit mid-task. Which TWO strategies preserve capability better than truncation?","choices":["Offload detail to an external store and keep a compact index or pointer set in context","Summarize completed sub-tasks into outcomes while retaining open sub-tasks and identifiers verbatim","Drop the system prompt, since the model has already read it","Reduce the max output tokens to leave room"],"answer":[0,1],"explanation":"Both work by separating what must be exactly present from what can be compressed or stored elsewhere. Externalizing detail with retrievable pointers, and compressing finished work while preserving live state, keep the agent able to act. Dropping the system prompt removes the instructions governing behavior, and shrinking output limits does not reclaim input space.","tags":["context-management","offloading","selective-compression","memgpt"],"ref":"https://arxiv.org/abs/2310.08560","domain":"cognition-planning-memory"},{"id":"CP-016","type":"single","difficulty":"hard","stem":"An agent repeatedly attempts the same failing action across a long session, each time slightly rephrased. What is the missing cognitive component?","choices":["A larger context window","A record of attempted approaches and their outcomes that is consulted before choosing the next action, so failed strategies are recognized as already tried","A higher temperature to encourage variety","More tools"],"answer":[1],"explanation":"Repeating a failed strategy is an episodic-memory gap: without an accessible record of what was tried and what happened, each attempt starts from the same reasoning and reaches the same conclusion. Maintaining and consulting an attempt log — the mechanism Reflexion formalizes — is what breaks the cycle.","tags":["episodic-memory","attempt-log","loop-prevention","reflexion"],"ref":"https://arxiv.org/abs/2303.11366","domain":"cognition-planning-memory"},{"id":"CP-017","type":"single","difficulty":"medium","stem":"In a planner-executor architecture, what should trigger re-planning?","choices":["A fixed number of executed steps","An observation that invalidates an assumption the plan depended on, a step failure, or the discovery of information that changes the remaining work","Every step, to stay adaptive","Only when the user intervenes"],"answer":[1],"explanation":"Re-planning is event-driven, keyed to evidence that the current plan is no longer valid. Replanning on every step collapses the architecture back into a per-step reasoning loop and discards the efficiency that motivated the split; a fixed cadence is arbitrary and can either waste calls or miss an invalidation.","tags":["replanning","triggers","planner-executor","adaptivity"],"ref":"https://arxiv.org/abs/2305.04091","domain":"cognition-planning-memory"},{"id":"CP-018","type":"single","difficulty":"hard","stem":"Which description correctly distinguishes parametric knowledge from retrieved knowledge in an agent?","choices":["Parametric knowledge lives in the model's weights, is fixed at training time, cannot be cited, and cannot be updated without retraining; retrieved knowledge is external, current, citable, and updated by changing the index","Parametric knowledge is stored in the vector database; retrieved knowledge is in the prompt","Parametric knowledge is always more accurate","They are the same thing accessed by different means"],"answer":[0],"explanation":"The distinction governs design: anything that must be current, auditable, or correctable belongs in retrieval, because parametric knowledge has a training cutoff, no provenance, and no update path short of retraining. Conflicts between the two are a known failure mode, which is why grounding instructions tell the model to prefer the provided context.","tags":["parametric-vs-retrieved","provenance","knowledge-cutoff","grounding"],"ref":"https://arxiv.org/abs/2005.11401","domain":"cognition-planning-memory"},{"id":"CP-019","type":"single","difficulty":"medium","stem":"What does least-to-most prompting add over standard chain-of-thought?","choices":["It samples multiple chains and votes","It explicitly decomposes the problem into ordered sub-problems and solves them in sequence, feeding each answer into the next, which helps when later steps depend on earlier results","It searches over a tree of partial solutions with backtracking","It removes the need for examples"],"answer":[1],"explanation":"Least-to-most makes decomposition an explicit first stage and then solves sub-problems in dependency order, carrying results forward. That structure generalizes better to problems harder than the demonstrations than a single undifferentiated reasoning chain. Voting is self-consistency and tree search with backtracking is Tree of Thoughts.","tags":["least-to-most","decomposition","dependency-order","prompting"],"ref":"https://arxiv.org/abs/2205.10625","domain":"cognition-planning-memory"},{"id":"CP-020","type":"multi","difficulty":"hard","stem":"You must decide what an agent writes to long-term memory. Which TWO criteria make a good memory-write policy?","choices":["Write facts that are durable and likely to be relevant to future sessions, not transient task state","Write with an explicit supersession rule so a new fact invalidates or updates a contradicting older one","Write every turn, since storage is cheap and retrieval will filter","Write only what the user explicitly asks to be remembered"],"answer":[0,1],"explanation":"Memory quality is decided at write time. Storing only durable, future-relevant facts keeps the store dense in signal, and an explicit supersession rule prevents the accumulation of mutually contradictory entries that later surface as stale advice. Writing everything shifts an unsolvable filtering burden onto retrieval; restricting to explicit requests misses most of what makes memory useful.","tags":["memory-write-policy","supersession","durability","curation"],"ref":"https://arxiv.org/abs/2304.03442","domain":"cognition-planning-memory"},{"id":"CP-021","type":"single","difficulty":"medium","stem":"An agent is given a reasoning-capable model and a thinking-token budget. What is the correct way to set that budget?","choices":["Always set it to the maximum for best quality","Tune it per task class, since additional reasoning tokens show diminishing returns and on easy tasks buy nothing while costing latency and money","Set it to zero for tool-calling tasks","Set it equal to the expected output length"],"answer":[1],"explanation":"Test-time compute is a dial with a task-dependent return curve: hard multi-step problems benefit substantially, routine ones plateau almost immediately. Treating the budget as a per-task-class setting — and measuring where the curve flattens — is what turns it into a cost control rather than a flat tax.","tags":["thinking-budget","test-time-compute","diminishing-returns","tuning"],"ref":"https://arxiv.org/abs/2201.11903","domain":"cognition-planning-memory"},{"id":"CP-022","type":"single","difficulty":"hard","stem":"Two agents in a system hold contradictory beliefs about an order's status because each read the database at a different time. What is the architectural lesson?","choices":["Agents should share a single memory store","Derived state should be read from the system of record at the point of use rather than cached in agent memory, or cached entries must carry a freshness bound","One agent should be designated authoritative","The agents should exchange their beliefs each turn"],"answer":[1],"explanation":"The problem is caching mutable external state inside agent memory without an invalidation story. Facts owned by an external system of record should be read when needed, or held only with an explicit TTL. Sharing a memory store or reconciling beliefs each turn propagates the staleness rather than removing it.","tags":["state-freshness","system-of-record","caching-mutable-state","consistency"],"ref":"https://arxiv.org/abs/2402.01680","domain":"cognition-planning-memory"},{"id":"CP-023","type":"single","difficulty":"medium","stem":"What is the main risk of letting an agent write its own reflections into long-term memory unsupervised over many sessions?","choices":["Storage cost growth","Error compounding: an incorrect inference stored as a fact is retrieved and reinforced in later sessions, so a single mistake becomes persistent and self-confirming","Retrieval latency increase","The reflections will contradict the system prompt"],"answer":[1],"explanation":"Self-written memory is a feedback loop without an error-correction term. A wrong conclusion, once stored, is retrieved as established fact, shapes later reasoning, and may spawn further reflections built on it. Mitigations are confidence-tagging, provenance, periodic revalidation against sources, and a path to correct or expire entries.","tags":["error-compounding","self-written-memory","feedback-loops","validation"],"ref":"https://arxiv.org/abs/2303.11366","domain":"cognition-planning-memory"},{"id":"CP-024","type":"single","difficulty":"hard","stem":"An agent must decide between answering from parametric knowledge and calling a retrieval tool. Which policy is most defensible for an enterprise assistant?","choices":["Always retrieve, accepting the latency cost, because any enterprise-specific or time-sensitive claim must be grounded and citable","Always answer from parametric knowledge first and retrieve only if unsure","Let the model decide with no guidance","Retrieve only when the question contains a date"],"answer":[0],"explanation":"In an enterprise context the cost of an ungrounded, uncitable claim about internal or current information far exceeds the latency of a retrieval call, and the model's own sense of whether it knows something is poorly calibrated. Adaptive retrieval policies exist, but defaulting to grounded-and-cited is the defensible baseline; heuristics like date-detection miss most of the cases that matter.","tags":["retrieval-policy","grounding-default","calibration","enterprise"],"ref":"https://arxiv.org/abs/2310.11511","domain":"cognition-planning-memory"},{"id":"CP-025","type":"single","difficulty":"hard","stem":"A reasoning model answers a routine classification task as accurately with a 500-token thinking budget as with 8,000. What does this tell you?","choices":["The model is under-trained for reasoning","The task sits on the flat part of the return curve, so the extra budget is pure cost and latency — budgets should be set per task class, not globally","Thinking budgets do not affect accuracy","The evaluation set is too small to detect a difference"],"answer":[1],"explanation":"Test-time compute has a task-dependent return curve that flattens quickly on easy tasks and keeps rising on hard multi-step ones. Measuring where it flattens for each task class turns the budget from a flat tax into a cost control, and routing routine work to a smaller budget or a smaller model follows directly.","tags":["test-time-compute","thinking-budget","diminishing-returns","cost"],"ref":"https://arxiv.org/abs/2201.11903","domain":"cognition-planning-memory"},{"id":"CP-026","type":"single","difficulty":"medium","stem":"An agent must answer a question about a company policy that changed last week. The model's training cutoff predates the change. What determines whether the answer is correct?","choices":["The model's parameter count","Whether the current policy is supplied in context through retrieval, and whether the prompt instructs the model to prefer provided context over its parametric knowledge","The temperature setting","Whether the model is a reasoning model"],"answer":[1],"explanation":"Parametric knowledge is fixed at training and cannot contain last week's change, so correctness depends on retrieval supplying the current text and on the grounding instruction resolving the conflict in favor of the provided context. Model size, sampling and reasoning capability do not create knowledge the weights never had.","tags":["grounding","parametric-vs-retrieved","knowledge-cutoff","retrieval-policy"],"ref":"https://arxiv.org/abs/2005.11401","domain":"cognition-planning-memory"},{"id":"DS-001","type":"single","difficulty":"medium","stem":"Which technique most directly increases LLM serving throughput under many concurrent requests of differing lengths?","choices":["Static batching with a fixed batch size and padding to the longest sequence","In-flight (continuous) batching, which admits new requests and evicts finished ones at each decode iteration","Increasing the model's context window","Raising temperature to shorten responses"],"answer":[1],"explanation":"Static batching wastes GPU cycles because the whole batch waits for its longest member. Continuous/in-flight batching keeps the GPU saturated by swapping completed sequences out and new ones in every iteration, which is why it is the default in TensorRT-LLM and vLLM. Context size and temperature are unrelated to batch efficiency.","tags":["continuous-batching","throughput","tensorrt-llm","vllm"],"ref":"https://nvidia.github.io/TensorRT-LLM/advanced/gpt-attention.html","domain":"deployment-scaling"},{"id":"DS-002","type":"single","difficulty":"hard","stem":"During long-context agent sessions your serving tier starts rejecting requests with out-of-memory errors even though model weights fit comfortably. What is the most likely memory consumer?","choices":["The tokenizer vocabulary","The KV cache, which grows with batch size times sequence length times layers","CUDA kernel binaries","The optimizer state"],"answer":[1],"explanation":"At inference, KV cache is the memory term that scales with concurrency and sequence length and routinely exceeds the weights for long contexts. Optimizer state only exists during training. Tokenizer tables and kernels are negligible and fixed.","tags":["kv-cache","memory","long-context","oom"],"ref":"https://arxiv.org/abs/2309.06180","domain":"deployment-scaling"},{"id":"DS-003","type":"single","difficulty":"medium","stem":"What is the primary value proposition of NVIDIA NIM microservices for deploying an agent's models?","choices":["They train models on your proprietary data automatically","They package an optimized inference engine, runtime, and OpenAI-compatible API into a portable container you can deploy on any supported GPU environment","They replace the need for Kubernetes in production","They provide a vector database for retrieval"],"answer":[1],"explanation":"A NIM is a prebuilt, GPU-optimized inference container exposing standard (typically OpenAI-compatible) endpoints, so teams get tuned TensorRT-LLM/backend performance without hand-building engines, and can run the same artifact in cloud, data center, or workstation. It does not train models, replace orchestration, or serve as a vector store.","tags":["nim","nvidia","deployment","containers"],"ref":"https://docs.nvidia.com/nim/large-language-models/latest/introduction.html","domain":"deployment-scaling"},{"id":"DS-004","type":"single","difficulty":"hard","stem":"A 70B-parameter model in FP16 must be served on GPUs with 80 GB of memory each. Which parallelism strategy is the standard first choice to fit and serve it with low latency on a single NVLink-connected node?","choices":["Data parallelism across 4 GPUs","Tensor parallelism across multiple GPUs within the node","Pipeline parallelism across 4 separate nodes","Expert parallelism"],"answer":[1],"explanation":"Roughly 140 GB of weights plus KV cache exceeds one 80 GB GPU, so the model must be sharded. Tensor parallelism splits individual layers across GPUs and, over high-bandwidth NVLink inside a node, adds the least latency. Data parallelism replicates rather than shards. Pipeline parallelism adds bubble overhead and is used mainly across nodes. Expert parallelism applies only to MoE models.","tags":["tensor-parallelism","model-sharding","nvlink","sizing"],"ref":"https://nvidia.github.io/TensorRT-LLM/advanced/executor.html","domain":"deployment-scaling"},{"id":"DS-005","type":"multi","difficulty":"medium","stem":"Your agent is interactive and users judge it by responsiveness. Which TWO metrics should you make primary SLOs?","choices":["Time to first token (TTFT)","Inter-token latency / tokens per second per user (TPOT)","Aggregate cluster tokens per second","GPU utilization percentage"],"answer":[0,1],"explanation":"Perceived responsiveness is governed by how soon output starts (TTFT, dominated by prefill) and how fast it streams (TPOT/ITL, dominated by decode). Aggregate throughput and GPU utilization are capacity and efficiency indicators that can look excellent while individual users wait.","tags":["slo","ttft","tpot","latency-metrics"],"ref":"https://docs.nvidia.com/nim/benchmarking/llm/latest/metrics.html","domain":"deployment-scaling"},{"id":"DS-006","type":"single","difficulty":"hard","stem":"You quantize a function-calling model from FP16 to INT4 to cut cost. Benchmarks show a small drop in general accuracy, but in production the agent's tool calls start failing schema validation frequently. What is the most likely explanation?","choices":["INT4 weights cannot represent JSON characters","Quantization degraded the precise, low-entropy structured-output behavior more than aggregate accuracy benchmarks reveal, because those benchmarks do not measure schema conformance","The inference server stopped applying the chat template after quantization","INT4 models cannot use constrained decoding"],"answer":[1],"explanation":"Aggregate accuracy benchmarks average over many behaviors and can mask disproportionate damage to narrow, high-precision capabilities like exact schema adherence and argument formatting. The lesson is to evaluate quantized models on the specific capabilities your agent depends on. INT4 models can still use chat templates and constrained decoding; the latter is in fact a good mitigation here.","tags":["quantization","structured-output","evaluation-gap","int4"],"ref":"https://nvidia.github.io/TensorRT-LLM/reference/precision.html","domain":"deployment-scaling"},{"id":"DS-007","type":"single","difficulty":"medium","stem":"What problem does disaggregated serving (as in NVIDIA Dynamo) address?","choices":["Prefill and decode have different compute and memory profiles, so running them on the same GPUs forces a poor compromise; disaggregation schedules them on separate resource pools","It splits the model's weights across nodes to fit larger models","It removes the need for a KV cache","It compresses embeddings to reduce vector database size"],"answer":[0],"explanation":"Prefill is compute-bound and bursty; decode is memory-bandwidth-bound and long-lived. Co-locating them means interference and unavoidable tuning trade-offs. Disaggregated serving separates the two phases onto independently scaled pools, with KV cache transferred between them, and adds KV-aware routing. It is a scheduling architecture, not model sharding or cache elimination.","tags":["dynamo","disaggregated-serving","prefill-decode","nvidia"],"ref":"https://github.com/ai-dynamo/dynamo","domain":"deployment-scaling"},{"id":"DS-008","type":"single","difficulty":"hard","stem":"An agentic workload has bursty traffic: near-zero for hours, then 50x spikes. Cold-starting a NIM container takes about 4 minutes because of model loading. Which approach best balances cost and responsiveness?","choices":["Scale to zero and accept the 4-minute cold start on the first request of a burst","Keep a small warm baseline of replicas, pre-pull images and cache model weights on fast local storage, and scale out on a leading indicator such as queue depth","Over-provision for peak at all times to guarantee latency","Increase the readiness-probe timeout so Kubernetes does not kill slow-starting pods"],"answer":[1],"explanation":"The practical pattern is a warm floor plus fast scale-out: a minimum replica count absorbs the first requests, cached images and local weight storage cut start time, and scaling on queue depth or pending requests reacts before latency degrades. Scale-to-zero pushes a 4-minute wait onto users, peak provisioning wastes the idle hours, and probe timeouts only prevent restarts.","tags":["autoscaling","cold-start","kubernetes","bursty-traffic"],"ref":"https://docs.nvidia.com/nim/large-language-models/latest/deploy-helm.html","domain":"deployment-scaling"},{"id":"DS-009","type":"single","difficulty":"medium","stem":"Which statement about NVIDIA Triton Inference Server in an agentic stack is accurate?","choices":["It only serves TensorRT engines","It is a multi-framework, multi-model serving platform that can host LLM backends alongside embedding, reranking, and classical models, with features like model ensembles and dynamic batching","It is the same product as NIM, under an older name","It performs fine-tuning as well as inference"],"answer":[1],"explanation":"Triton is a general serving platform supporting many backends (TensorRT, TensorRT-LLM, PyTorch, ONNX Runtime, Python, vLLM), useful in agentic stacks where LLM, embedder, reranker, and guardrail models coexist, with ensembles/business-logic scripting and dynamic batching. NIM is a higher-level packaged microservice that may use Triton or TensorRT-LLM internally; they are not the same product.","tags":["triton","nvidia","multi-model-serving"],"ref":"https://docs.nvidia.com/deeplearning/triton-inference-server/user-guide/docs/index.html","domain":"deployment-scaling"},{"id":"DS-010","type":"single","difficulty":"hard","stem":"A multi-turn agent re-sends a 6,000-token system prompt and tool catalog on every step of a 10-step task. Which serving feature reduces the cost of this pattern most directly?","choices":["Speculative decoding","Prefix KV-cache reuse across requests that share the same leading tokens","INT8 weight-only quantization","Tensor parallelism"],"answer":[1],"explanation":"The waste is repeated prefill of an identical prefix. Prefix caching (KV-cache reuse) recognizes the shared prefix and skips recomputing it, cutting prefill cost and TTFT on every subsequent step. Speculative decoding accelerates decode, quantization reduces weight memory and bandwidth, and tensor parallelism addresses fitting and scaling — none of them eliminate redundant prefill.","tags":["prefix-caching","kv-cache-reuse","multi-turn","cost"],"ref":"https://nvidia.github.io/TensorRT-LLM/advanced/kv-cache-reuse.html","domain":"deployment-scaling"},{"id":"DS-011","type":"single","difficulty":"medium","stem":"How does speculative decoding improve inference latency?","choices":["By skipping layers of the target model for easy tokens","By having a small draft model (or extra heads) propose several tokens that the target model verifies in one forward pass, accepting the longest correct prefix","By reducing the precision of activations during decode","By caching complete responses for repeated prompts"],"answer":[1],"explanation":"Speculative decoding exploits the fact that verifying k proposed tokens costs about one target-model forward pass. A cheap drafter proposes, the target verifies, and accepted tokens come nearly free — preserving the target model's output distribution. It is not layer skipping, quantization, or response caching.","tags":["speculative-decoding","latency","draft-model"],"ref":"https://arxiv.org/abs/2211.17192","domain":"deployment-scaling"},{"id":"DS-012","type":"multi","difficulty":"hard","stem":"You must cut cost per agent task by half without degrading quality on hard tasks. Which TWO levers are most likely to deliver that?","choices":["Route easy sub-steps to a smaller model and reserve the large model for hard reasoning steps","Eliminate redundant context re-sends and enable prefix caching for the static prompt and tool catalog","Reduce the retriever's top-k from 20 to 1 for all queries","Set the step limit to 2 for every task"],"answer":[0,1],"explanation":"Model cascading and context/prefill efficiency both remove cost from the cheap majority of work while leaving the hard path intact. Collapsing top-k to 1 and hard-capping steps at 2 cut cost by cutting capability, which violates the stated constraint.","tags":["cost-optimization","model-cascade","prefix-caching"],"ref":"https://docs.nvidia.com/nemo/agent-toolkit/latest/","domain":"deployment-scaling"},{"id":"DS-013","type":"single","difficulty":"medium","stem":"Why is MIG (Multi-Instance GPU) relevant when deploying the smaller supporting models of an agentic pipeline?","choices":["It combines multiple GPUs into one logical device for large models","It partitions a single GPU into isolated instances with dedicated memory and compute slices, so small models such as embedders, rerankers, and guardrail classifiers can be co-hosted with hardware-level isolation","It enables FP4 arithmetic on older GPUs","It migrates running inference sessions between GPUs"],"answer":[1],"explanation":"MIG carves one physical GPU into several hardware-isolated instances, giving predictable QoS for multiple small models on one card — a good fit for the embedder/reranker/guardrail tier. Aggregating GPUs is NVLink/NVSwitch territory; MIG neither adds numeric formats nor migrates sessions.","tags":["mig","gpu-partitioning","nvidia","small-models"],"ref":"https://docs.nvidia.com/datacenter/tesla/mig-user-guide/","domain":"deployment-scaling"},{"id":"DS-014","type":"single","difficulty":"hard","stem":"An agent service has p50 latency of 1.2 s but p99 of 22 s. Traces show the slow tail is dominated by requests with very long retrieved contexts sharing GPUs with short requests. Which mitigation is most appropriate?","choices":["Raise the global timeout to 30 s so fewer requests fail","Separate long-context requests into their own serving pool (or apply chunked prefill and priority scheduling) so large prefills stop blocking short requests","Reduce the number of replicas to increase per-replica batch efficiency","Switch to greedy decoding to make latency deterministic"],"answer":[1],"explanation":"This is head-of-line blocking: one enormous prefill monopolizes the GPU while short requests queue. Workload isolation, chunked prefill, and priority-aware scheduling all break that coupling. Higher timeouts merely tolerate the tail, fewer replicas worsen queuing, and decoding strategy does not change prefill contention.","tags":["tail-latency","head-of-line-blocking","chunked-prefill","scheduling"],"ref":"https://github.com/ai-dynamo/dynamo","domain":"deployment-scaling"},{"id":"DS-015","type":"single","difficulty":"medium","stem":"When deploying an agent that must meet strict data-residency requirements, which NIM property is most relevant?","choices":["NIM containers are self-hosted, so models and inference traffic can run entirely inside your own VPC, data center, or region","NIM automatically encrypts prompts before sending them to NVIDIA-hosted endpoints","NIM anonymizes PII in prompts by default","NIM stores all traffic in NVIDIA's compliance audit log"],"answer":[0],"explanation":"The compliance-relevant property is deployment locality: because a NIM is a container you run on your own infrastructure, prompts and outputs need never leave your boundary. NIM does not provide automatic PII redaction (that is guardrails/pipeline work) and does not route traffic to NVIDIA-hosted logs when self-hosted.","tags":["nim","data-residency","compliance","self-hosting"],"ref":"https://docs.nvidia.com/nim/large-language-models/latest/introduction.html","domain":"deployment-scaling"},{"id":"DS-016","type":"single","difficulty":"medium","stem":"What is the operational significance of Nemotron 3's mixture-of-experts design, where only about a tenth of total parameters activate per token?","choices":["The model's memory footprint at inference equals only the active parameters","Compute per token resembles a much smaller dense model while all experts must still be resident in memory, so it buys throughput and cost, not memory savings","MoE models cannot be quantized","It removes the need for a KV cache"],"answer":[1],"explanation":"MoE decouples capacity from per-token compute: routing activates a small fraction of experts, so FLOPs per token resemble a far smaller model, but every expert must be loaded, so memory capacity is sized by total parameters. Getting this backwards is the classic MoE sizing mistake. KV cache and quantization are unaffected by the routing scheme.","tags":["moe","nemotron-3","sizing","memory-vs-compute"],"ref":"https://developer.nvidia.com/blog/inside-nvidia-nemotron-3-techniques-tools-and-data-that-make-it-efficient-and-accurate/","domain":"deployment-scaling"},{"id":"DS-017","type":"single","difficulty":"hard","stem":"Why does a hybrid Mamba-Transformer architecture like Nemotron 3's matter specifically for long-context agentic workloads?","choices":["Mamba layers remove the need for training data","State-space (Mamba) layers scale with sequence length far better than full attention, so interleaving them with a smaller number of attention layers keeps very long contexts tractable while retaining attention's precise recall","It eliminates the need for retrieval entirely","It allows the model to run on CPUs"],"answer":[1],"explanation":"Full attention costs grow quadratically with sequence length, which is what makes million-token contexts expensive. Interleaving state-space layers, whose cost grows linearly, with a reduced number of attention layers preserves the precise token-level recall attention provides while making long sequences affordable — directly relevant to agents carrying long histories and large retrieved contexts.","tags":["mamba","hybrid-architecture","long-context","nemotron-3"],"ref":"https://developer.nvidia.com/blog/inside-nvidia-nemotron-3-techniques-tools-and-data-that-make-it-efficient-and-accurate/","domain":"deployment-scaling"},{"id":"DS-018","type":"multi","difficulty":"medium","stem":"You are writing the Kubernetes deployment for a NIM container. Which TWO configuration details matter most for a model server with a long startup?","choices":["A startup probe (or a readiness probe with a generous failure threshold) so the pod is not killed while weights load","GPU resource requests and limits plus a node selector or taint toleration so the pod lands on a GPU node","A high CPU limit so the model loads faster","A liveness probe with a one-second period for fast failure detection"],"answer":[0,1],"explanation":"Model servers load for minutes, so the probe configuration must tolerate that or Kubernetes restarts the pod forever; and GPU scheduling must be explicit or the pod schedules onto a node with no accelerator. An aggressive liveness probe makes the restart loop worse, and CPU limits do not materially speed GPU weight loading.","tags":["kubernetes","probes","gpu-scheduling","nim"],"ref":"https://docs.nvidia.com/nim/large-language-models/latest/deploy-helm.html","domain":"deployment-scaling"},{"id":"DS-019","type":"single","difficulty":"hard","stem":"Your agent service autoscales on CPU utilization and never scales out, even when users report queuing. Why?","choices":["CPU is the wrong signal for a GPU-bound inference service; scale on a workload signal such as pending requests, queue depth, or GPU utilization","The HPA needs a longer stabilization window","The pods need more memory","Autoscaling does not work with GPUs"],"answer":[0],"explanation":"An LLM server can sit at low CPU while the GPU is saturated and requests queue, so CPU-based autoscaling is blind to the actual bottleneck. Scaling on queue depth, pending requests, or GPU metrics exported by DCGM ties capacity to the real constraint. Autoscaling works fine with GPUs given the right signal.","tags":["autoscaling","hpa","wrong-signal","queue-depth"],"ref":"https://docs.nvidia.com/nim/large-language-models/latest/deploy-helm.html","domain":"deployment-scaling"},{"id":"DS-020","type":"single","difficulty":"medium","stem":"Which statement about vLLM's PagedAttention is accurate?","choices":["It compresses KV cache entries to half precision","It manages KV cache in fixed-size blocks like virtual-memory pages, eliminating the fragmentation and over-reservation caused by contiguous per-sequence allocation and enabling prefix sharing","It replaces attention with a linear-time approximation","It batches requests by padding them to equal length"],"answer":[1],"explanation":"PagedAttention applies paging to the KV cache: blocks are allocated on demand and need not be contiguous, so memory is not reserved for a sequence's maximum possible length and fragmentation largely disappears. Blocks can also be shared across sequences with a common prefix, which is what makes prefix caching cheap.","tags":["pagedattention","vllm","kv-cache","memory-fragmentation"],"ref":"https://arxiv.org/abs/2309.06180","domain":"deployment-scaling"},{"id":"DS-021","type":"single","difficulty":"hard","stem":"An agent's per-task cost is dominated by input tokens, not output. Which optimization is most likely to be wasted effort?","choices":["Enabling prefix caching for the static system prompt and tool catalog","Trimming redundant retrieved context and repeated document re-reads","Enabling speculative decoding","Routing simple steps to a smaller model"],"answer":[2],"explanation":"Speculative decoding accelerates the decode phase, which is where output tokens are produced. If the cost is concentrated in the prompt, it addresses the wrong half of the workload. Prefix caching and context trimming attack prefill directly, and model routing reduces both.","tags":["cost-attribution","prefill-vs-decode","speculative-decoding","optimization-targeting"],"ref":"https://nvidia.github.io/TensorRT-LLM/advanced/kv-cache-reuse.html","domain":"deployment-scaling"},{"id":"DS-022","type":"multi","difficulty":"medium","stem":"Which TWO are genuine advantages of deploying a self-hosted NIM over calling a third-party hosted model API for an enterprise agent?","choices":["Prompts and outputs never leave your network boundary, satisfying data-residency and confidentiality requirements","Model version is under your control, so an upstream provider cannot change behavior underneath you","It is always cheaper per token than a hosted API","It removes the need to evaluate the model"],"answer":[0,1],"explanation":"Self-hosting buys data locality and version control — the two properties enterprises most often need and cannot get from a shared hosted endpoint. Cost depends entirely on utilization: a lightly used dedicated GPU is far more expensive per token than a hosted API, and evaluation is required either way.","tags":["self-hosting","data-residency","version-control","nim"],"ref":"https://docs.nvidia.com/nim/large-language-models/latest/introduction.html","domain":"deployment-scaling"},{"id":"DS-023","type":"single","difficulty":"hard","stem":"A multi-turn agent session is routed to a different replica on each turn, and you observe that time-to-first-token is much worse than in single-replica testing. What is the likely cause?","choices":["Network latency between replicas","The prefix KV cache is per-replica, so a session landing on a replica that has not seen its prefix must recompute the entire prefill; session-affinity or KV-aware routing restores the cache hits","The replicas are running different model versions","The load balancer is adding overhead per request"],"answer":[1],"explanation":"Prefix caching is local to the replica that built it. Round-robin routing therefore scatters a conversation across replicas that each have a cold prefix, and every turn pays full prefill. Session affinity, or KV-aware routing of the kind Dynamo provides, sends the request where the cache already lives.","tags":["kv-aware-routing","session-affinity","prefix-cache","dynamo"],"ref":"https://github.com/ai-dynamo/dynamo","domain":"deployment-scaling"},{"id":"DS-024","type":"single","difficulty":"medium","stem":"What does NVFP4 refer to in the context of NVIDIA's model training and inference stack?","choices":["A four-bit floating-point format used to reduce compute and memory cost, applied in training as well as inference on supporting hardware","A four-way tensor parallelism configuration","A network protocol for GPU-to-GPU transfer","A file format for model checkpoints"],"answer":[0],"explanation":"NVFP4 is a 4-bit floating-point numeric format supported by newer NVIDIA hardware, notable because it has been applied to training and not only to post-training quantization — NVIDIA cited NVFP4 training among the techniques used for the larger Nemotron 3 variants. It is a precision format, not a parallelism scheme or transport.","tags":["nvfp4","precision","low-bit-training","nvidia"],"ref":"https://developer.nvidia.com/blog/inside-nvidia-nemotron-3-techniques-tools-and-data-that-make-it-efficient-and-accurate/","domain":"deployment-scaling"},{"id":"DS-025","type":"single","difficulty":"hard","stem":"You must serve an embedding model, a reranker, a guardrail classifier, and a 70B chat model for one agent. Which deployment topology is most sensible?","choices":["One large pod running all four models to minimize network hops","Serve the 70B model on its own GPUs with tensor parallelism, and co-host the three small models on a separate, independently scaled tier (MIG partitions or a shared Triton deployment)","Run all four on CPU except the 70B model","Deploy four identical replicas each running all four models"],"answer":[1],"explanation":"The models have entirely different resource profiles and scaling curves: the large model is memory- and bandwidth-bound and needs sharding, while the small ones are cheap and called at different rates. Separating the tiers lets each scale on its own demand; co-locating everything couples their scaling and wastes GPU on whichever model is idle.","tags":["topology","tiering","mig","triton","independent-scaling"],"ref":"https://docs.nvidia.com/deeplearning/triton-inference-server/user-guide/docs/index.html","domain":"deployment-scaling"},{"id":"DS-026","type":"single","difficulty":"medium","stem":"Why is a 1M-token context window not a substitute for retrieval in an agentic system?","choices":["Models cannot attend to more than 100k tokens in practice","Filling a very long context costs prefill compute and money on every call and still suffers position effects, whereas retrieval selects only what is relevant — long context complements retrieval rather than replacing it","Long contexts cannot be cached","Retrieval is always more accurate than long context"],"answer":[1],"explanation":"Long context changes what is feasible but not the economics or the attention characteristics: every token in the prompt is paid for on every call, and recall of middle-of-context material remains weaker. The practical pattern is retrieval to select, long context to accommodate what selection returns without aggressive chunking.","tags":["long-context","retrieval-tradeoff","prefill-cost","position-effects"],"ref":"https://arxiv.org/abs/2307.03172","domain":"deployment-scaling"},{"id":"DS-027","type":"multi","difficulty":"hard","stem":"Your agent platform must serve 40 fine-tuned variants for 40 customers. Which TWO approaches keep this tractable?","choices":["Train the variants as LoRA adapters and serve them with multi-LoRA against a single loaded base model","Route requests to the correct adapter by tenant id at the serving layer, keeping one base-model deployment","Deploy 40 independent full-weight model servers","Merge all 40 adapters into one set of weights"],"answer":[0,1],"explanation":"Multi-LoRA exists for exactly this: adapters are small, the base model is loaded once, and the serving layer selects the adapter per request. Forty full deployments multiplies GPU cost by forty for models that differ by a fraction of a percent of parameters, and merging adapters collapses the per-customer behavior the tuning created.","tags":["multi-lora","multi-tenancy","serving-efficiency","nim"],"ref":"https://docs.nvidia.com/nim/large-language-models/latest/peft.html","domain":"deployment-scaling"},{"id":"DS-028","type":"single","difficulty":"medium","stem":"What is the practical effect of setting an overly large maximum batch size on an interactive LLM service?","choices":["Throughput and per-user latency both improve","Aggregate throughput may improve while per-user inter-token latency degrades, because decode work per iteration is shared across more sequences","Memory use falls because batching is more efficient","It has no effect once continuous batching is enabled"],"answer":[1],"explanation":"Batch size is the throughput-versus-latency dial. A larger batch amortizes weight reads across more sequences and raises aggregate tokens per second, but each sequence advances more slowly per iteration and the KV cache grows. For interactive agents the batch ceiling should be tuned against the inter-token latency SLO, not maximized.","tags":["batch-size","throughput-latency-tradeoff","tuning","slo"],"ref":"https://docs.nvidia.com/nim/benchmarking/llm/latest/metrics.html","domain":"deployment-scaling"},{"id":"DS-029","type":"single","difficulty":"hard","stem":"An agent deployment passes load testing at 200 requests per second but fails in production at 60. Traces show most time in a tool that calls an internal service. What did the load test miss?","choices":["The production model is slower","The load test exercised the LLM path but used stubbed or unrealistically fast tool responses, so the real dependency's capacity and latency were never in the test","Production has fewer GPUs","The load generator was misconfigured"],"answer":[1],"explanation":"Agent capacity is bounded by the whole call graph, not the model alone. A load test that stubs the tools measures only the inference tier and will overstate capacity whenever a downstream dependency is the real constraint. Realistic load testing must include the dependencies, or at least model their latency and concurrency limits.","tags":["load-testing","dependency-capacity","call-graph","capacity-planning"],"ref":"https://docs.nvidia.com/nemo/agent-toolkit/latest/","domain":"deployment-scaling"},{"id":"DS-030","type":"single","difficulty":"medium","stem":"Which statement about FP8 versus INT8 quantization is accurate?","choices":["They are equivalent formats with different names","FP8 keeps a floating-point exponent so it handles wide dynamic range and outlier activations better, while INT8 is uniform and usually needs more careful per-channel scaling or calibration","INT8 always produces higher quality than FP8","FP8 can only be used for training, not inference"],"answer":[1],"explanation":"The practical difference is
