dynamic range. Floating-point formats devote bits to an exponent, which tolerates the activation outliers that are common in transformers, whereas integer quantization spreads a uniform grid across the range and therefore depends more on good scaling and calibration to avoid clipping. Both are used at inference on supporting hardware.","tags":["quantization","precision","fp8","int4"],"ref":"https://nvidia.github.io/TensorRT-LLM/reference/precision.html","domain":"deployment-scaling"},{"id":"DS-031","type":"single","difficulty":"hard","stem":"A team quantizes weights only, leaving activations in higher precision. What do they gain and what do they not?","choices":["Both memory and compute throughput improve proportionally","Memory footprint and memory bandwidth improve, which helps the bandwidth-bound decode phase, but compute-bound prefill benefits far less than with full weight-and-activation quantization","Nothing improves unless activations are quantized too","Only latency improves, never memory"],"answer":[1],"explanation":"Weight-only quantization shrinks what must be read from memory each decode step, which is exactly the bottleneck during decode, so tokens per second rises. Prefill is compute-bound, and without quantized activations the matrix multiplications still run at the higher precision, so the speedup there is much smaller.","tags":["quantization","precision","prefill-vs-decode","memory"],"ref":"https://nvidia.github.io/TensorRT-LLM/reference/precision.html","domain":"deployment-scaling"},{"id":"DS-032","type":"single","difficulty":"hard","stem":"Speculative decoding gives a large speedup on one workload and almost none on another. What most likely explains the difference?","choices":["The second workload uses a larger target model","Acceptance rate: speculative decoding only pays off when the draft model's proposals are frequently accepted, which depends on how predictable the target's output is for that workload","The second workload has shorter prompts","Speculative decoding only works with greedy decoding"],"answer":[1],"explanation":"The speedup is governed by how many drafted tokens survive verification. Predictable output — boilerplate, structured formats, code with strong conventions — yields high acceptance and large gains, while highly variable output rejects most drafts and the drafting cost is close to wasted. Target model size and prompt length are secondary.","tags":["speculative-decoding","acceptance-rate","draft-model","decode-throughput"],"ref":"https://arxiv.org/abs/2211.17192","domain":"deployment-scaling"},{"id":"ET-001","type":"single","difficulty":"medium","stem":"A RAG agent returns an answer that is fluent and relevant to the question but contains a claim absent from the retrieved passages. Which metric is designed to catch exactly this?","choices":["Context recall","Answer relevancy","Faithfulness (groundedness)","Context precision"],"answer":[2],"explanation":"Faithfulness/groundedness measures whether every claim in the answer is supported by the retrieved context — precisely the ungrounded-claim failure. Answer relevancy only asks whether the response addresses the question. Context recall and precision evaluate the retrieved set, not the generated text.","tags":["ragas","faithfulness","rag-metrics"],"ref":"https://docs.ragas.io/en/stable/concepts/metrics/available_metrics/faithfulness/","domain":"evaluation-tuning"},{"id":"ET-002","type":"single","difficulty":"hard","stem":"Which RAGAS-style metric requires labeled ground-truth answers (reference data) rather than only the question, context, and generated answer?","choices":["Faithfulness","Answer relevancy","Context recall","Context relevance"],"answer":[2],"explanation":"Context recall asks what fraction of the ground-truth answer's claims are covered by the retrieved context, so it needs a reference answer. Faithfulness compares answer to context, and answer relevancy compares answer to question — both are reference-free, which is why they are usable on production traffic without labels.","tags":["ragas","ground-truth","reference-free","rag-metrics"],"ref":"https://docs.ragas.io/en/stable/concepts/metrics/available_metrics/context_recall/","domain":"evaluation-tuning"},{"id":"ET-003","type":"single","difficulty":"medium","stem":"An agent reaches the correct final answer but takes 11 tool calls where 3 would do, sometimes calling a paid API redundantly. Which evaluation approach surfaces this problem?","choices":["Final-response (outcome) evaluation against expected answers","Trajectory evaluation that scores the sequence of steps, tool choices, and arguments","Perplexity on a held-out corpus","BLEU against reference answers"],"answer":[1],"explanation":"Outcome-only evaluation is blind to how the answer was produced, so an inefficient or unsafe path scores perfectly. Trajectory evaluation inspects the step sequence — tool selection, argument correctness, redundancy, and order — which is where this defect lives. Perplexity and BLEU are irrelevant to agent process quality.","tags":["trajectory-evaluation","agent-metrics","efficiency"],"ref":"https://docs.smith.langchain.com/evaluation/concepts","domain":"evaluation-tuning"},{"id":"ET-004","type":"multi","difficulty":"hard","stem":"You are setting up LLM-as-judge evaluation for agent answers. Which TWO practices most improve the judge's reliability?","choices":["Give the judge an explicit rubric with defined score levels and require a short justification before the score","Validate the judge against a human-labeled subset and measure agreement before trusting it at scale","Use the same model and prompt that generated the answers, to keep conditions consistent","Ask for a single 1-100 numeric score with no explanation, to reduce token cost"],"answer":[0,1],"explanation":"Judges need an operational definition of quality (rubric with anchored levels, reasoning before the verdict) and calibration against human labels so you know the metric's error rate. Reusing the generator model and prompt invites self-preference bias, and fine-grained scores without justification are noisy and poorly calibrated.","tags":["llm-as-judge","rubrics","calibration","bias"],"ref":"https://deepeval.com/docs/metrics-llm-evals","domain":"evaluation-tuning"},{"id":"ET-005","type":"single","difficulty":"hard","stem":"Diagnosis shows your RAG agent's answers are unfaithful because the retriever returns passages that do not contain the answer at all. Which intervention addresses the actual bottleneck?","choices":["Fine-tune the generator model with LoRA on your domain's answer style","Improve retrieval: revisit chunking, add hybrid search and a reranker, and rewrite queries","Lower the generation temperature to reduce hallucination","Increase max output tokens so the answer can cite more context"],"answer":[1],"explanation":"If the answer is not in the retrieved context, no amount of generator tuning or decoding adjustment can produce a grounded answer. The failure is a retrieval failure, so the fix belongs in chunking, hybrid (lexical + dense) retrieval, reranking, and query rewriting. Tuning the generator on style would be solving the wrong layer.","tags":["diagnosis","retrieval","root-cause","rag"],"ref":"https://docs.ragas.io/en/stable/concepts/metrics/overview/","domain":"evaluation-tuning"},{"id":"ET-006","type":"single","difficulty":"medium","stem":"Your model follows instructions well but consistently uses the wrong internal terminology and cites no company-specific facts. You have 3,000 high-quality domain Q&A pairs. What is the most appropriate first intervention?","choices":["Full pre-training from scratch on the domain corpus","Parameter-efficient fine-tuning (LoRA) for terminology and style, combined with RAG for the factual content","RLHF with a reward model trained on the 3,000 pairs","Increase the temperature so the model varies its vocabulary"],"answer":[1],"explanation":"The canonical division of labor: fine-tuning teaches form, behavior, and vocabulary; retrieval supplies volatile, verifiable facts. With a few thousand pairs, PEFT/LoRA is the right scale of intervention. Pre-training is orders of magnitude too expensive, RLHF targets preference alignment rather than terminology, and temperature is unrelated.","tags":["lora","peft","finetune-vs-rag","tuning-decisions"],"ref":"https://arxiv.org/abs/2106.09685","domain":"evaluation-tuning"},{"id":"ET-007","type":"single","difficulty":"hard","stem":"Which statement correctly contrasts DPO with classic RLHF (PPO-based)?","choices":["DPO optimizes the policy directly from preference pairs without training a separate reward model or running RL rollouts","DPO requires a larger preference dataset than PPO-based RLHF to reach comparable quality","DPO trains a reward model first and then samples with PPO, but on-policy only","DPO is a form of supervised fine-tuning on the chosen responses only"],"answer":[0],"explanation":"DPO reformulates the RLHF objective so the preference data can update the policy directly with a simple classification-style loss, eliminating the separate reward model and the RL loop. That is its main practical appeal: simpler and more stable. It is not SFT on chosen responses alone, since the rejected response enters the loss.","tags":["dpo","rlhf","alignment","tuning"],"ref":"https://arxiv.org/abs/2305.18290","domain":"evaluation-tuning"},{"id":"ET-008","type":"single","difficulty":"medium","stem":"What is the role of NVIDIA NeMo Evaluator in an agentic development lifecycle?","choices":["Serving optimized models behind an OpenAI-compatible API","Running standardized academic and custom benchmarks plus LLM-as-judge evaluations against models and RAG/agent pipelines, as a managed service in the NeMo microservices stack","Applying input and output guardrails at inference time","Curating and deduplicating pre-training datasets at scale"],"answer":[1],"explanation":"NeMo Evaluator is the evaluation microservice: academic benchmarks, custom datasets, similarity metrics, and LLM-as-judge against endpoints and RAG pipelines. Serving is NIM, guardrails are NeMo Guardrails, and large-scale data curation is NeMo Curator.","tags":["nemo-evaluator","nvidia","tooling"],"ref":"https://docs.nvidia.com/nemo/microservices/latest/evaluate/index.html","domain":"evaluation-tuning"},{"id":"ET-009","type":"single","difficulty":"hard","stem":"A new prompt scores 4% higher on your 60-example offline evaluation set. What is the most defensible next step before shipping it to all traffic?","choices":["Ship it, since the offline set is the team's agreed quality gate","Treat the result as underpowered, check whether the difference exceeds run-to-run variance, and validate with a controlled online A/B test on live traffic","Expand the offline set to 600 examples generated by the same model and re-measure","Ship it to 100% of traffic but keep the old prompt ready for rollback"],"answer":[1],"explanation":"A 4% delta on 60 examples is roughly two examples and is likely within noise, especially with a stochastic judge. The rigorous path is to quantify variance (repeat runs, confidence intervals) and then confirm on real traffic with a controlled experiment. Synthetically expanding the set with the same model can import the model's own biases, and full rollout with rollback ready is still an unmeasured change.","tags":["statistical-significance","ab-testing","offline-vs-online"],"ref":"https://docs.smith.langchain.com/evaluation/concepts","domain":"evaluation-tuning"},{"id":"ET-010","type":"single","difficulty":"medium","stem":"In the \"RAG triad\" used by TruLens, which three dimensions are assessed?","choices":["Latency, throughput, and cost","Context relevance, groundedness, and answer relevance","Precision, recall, and F1","Faithfulness, toxicity, and bias"],"answer":[1],"explanation":"The RAG triad checks each hop of the pipeline: is the retrieved context relevant to the query, is the answer grounded in that context, and is the answer relevant to the query. Failing any one localizes the defect to retrieval, generation grounding, or response targeting respectively.","tags":["trulens","rag-triad","rag-metrics"],"ref":"https://www.trulens.org/getting_started/core_concepts/rag_triad/","domain":"evaluation-tuning"},{"id":"ET-011","type":"single","difficulty":"hard","stem":"Which benchmark is specifically designed to measure an LLM's function/tool-calling accuracy?","choices":["MTEB","BFCL (Berkeley Function-Calling Leaderboard)","MMLU-Pro","HumanEval"],"answer":[1],"explanation":"BFCL evaluates tool-calling ability: correct function selection, argument construction, handling of multiple and parallel calls, and relevance detection (knowing when not to call). MTEB benchmarks embedding/retrieval models, MMLU-Pro measures knowledge and reasoning, and HumanEval measures code generation.","tags":["benchmarks","bfcl","function-calling"],"ref":"https://github.com/EleutherAI/lm-evaluation-harness","domain":"evaluation-tuning"},{"id":"ET-012","type":"multi","difficulty":"medium","stem":"You must build an evaluation dataset for a production agent. Which TWO sourcing strategies produce the most useful set?","choices":["Mine real production traces, prioritizing failures, escalations, and edge cases, then label them","Include a deliberately adversarial slice: prompt injections, ambiguous requests, and out-of-scope questions","Generate all examples with the same LLM that powers the agent, for volume and coverage","Use only examples the agent currently answers correctly, to establish a stable regression baseline"],"answer":[0,1],"explanation":"Evaluation sets earn their value from distribution realism and difficulty. Real traffic (weighted toward failures) keeps the set representative, and an adversarial slice tests the properties you most need to hold. Self-generated data inherits the agent's blind spots, and a set of only-passing examples cannot detect anything except regressions on already-solved cases.","tags":["eval-datasets","adversarial-testing","data-sourcing"],"ref":"https://docs.ragas.io/en/stable/concepts/test_data_generation/","domain":"evaluation-tuning"},{"id":"ET-013","type":"single","difficulty":"hard","stem":"An agent's quality is acceptable but p95 latency is 9 seconds and users complain. Profiling shows 6.5 seconds in a reranking step that improves faithfulness by 1 point. What is the most balanced optimization decision?","choices":["Remove the reranker entirely, since latency matters more than a 1-point gain","Keep the reranker but move it to a GPU-accelerated NIM reranking endpoint and shrink the candidate set, then re-measure both metrics","Accept the latency because quality must never regress","Cache reranker outputs keyed on the full document set"],"answer":[1],"explanation":"The choice is not binary. Reranking cost scales with candidate count and is highly GPU-accelerable, so serving the reranker on an optimized endpoint and reducing top-k usually recovers most of the latency while retaining most of the quality. The engineering discipline is to re-measure both axes after the change rather than trading one blindly.","tags":["latency-quality-tradeoff","reranking","profiling","nim"],"ref":"https://docs.nvidia.com/nim/nemo-retriever/text-reranking/latest/index.html","domain":"evaluation-tuning"},{"id":"ET-014","type":"single","difficulty":"medium","stem":"Which evaluation signal best indicates that an agent's tool set — rather than its reasoning — is the limiting factor?","choices":["Tool-call arguments are frequently malformed against the schema","The agent selects an appropriate tool but the tool's response lacks the information needed, across many different queries","The agent's final answers are verbose","The agent occasionally exceeds its step budget"],"answer":[1],"explanation":"Correct selection followed by insufficient tool output points at a capability gap in the tools or their underlying data, not at the model's planning. Malformed arguments indicate a schema/prompting problem, verbosity is a style issue, and step-budget overruns are ambiguous on their own.","tags":["diagnosis","tool-evaluation","attribution"],"ref":"https://docs.smith.langchain.com/evaluation/concepts","domain":"evaluation-tuning"},{"id":"ET-015","type":"single","difficulty":"medium","stem":"Why is `pass@k` on a held-out task suite often reported alongside single-attempt accuracy for coding agents?","choices":["It measures token efficiency across attempts","It captures whether the agent can solve a task given k independent attempts, separating capability from single-sample reliability","It is required for statistical significance testing","It measures how well the agent's output matches a reference solution textually"],"answer":[1],"explanation":"pass@k reveals the gap between \"the agent can do this at all\" and \"the agent does this dependably on the first try.\" A high pass@8 with low pass@1 indicates a sampling/selection problem addressable with self-consistency, verification, or reranking rather than a fundamental capability gap.","tags":["pass-at-k","benchmarks","reliability"],"ref":"https://github.com/EleutherAI/lm-evaluation-harness","domain":"evaluation-tuning"},{"id":"ET-016","type":"single","difficulty":"medium","stem":"The CLASSic framework for evaluating enterprise agents covers which five dimensions?","choices":["Correctness, Latency, Availability, Security, Scalability","Cost, Latency, Accuracy, Stability, Security","Compliance, Learning, Autonomy, Safety, Speed","Coverage, Load, Accuracy, Stability, Support"],"answer":[1],"explanation":"CLASSic is an industry (Aisera) framework, not an NVIDIA one, that scores agents on Cost, Latency, Accuracy, Stability, and Security. Its value for exam purposes is the idea it encodes: production agent quality is multi-dimensional, and an accuracy-only evaluation misses the operational dimensions that decide whether an agent is deployable.","tags":["classic-framework","multi-dimensional-evaluation","enterprise"],"ref":"https://arxiv.org/abs/2511.14136","domain":"evaluation-tuning"},{"id":"ET-017","type":"single","difficulty":"hard","stem":"Your agent scores 91% on your evaluation set and 68% in production. The evaluation set was built six months ago from the first month of traffic. What is the most likely explanation?","choices":["The judge model has degraded","The evaluation set no longer represents production traffic, and repeated optimization against it has overfit the agent to that fixed distribution","Production is running a different model version","The production prompt is longer"],"answer":[1],"explanation":"A large, persistent gap between a static offline set and live traffic is the signature of two compounding problems: distribution shift since the set was collected, and overfitting from repeatedly tuning against the same fixed examples. The remedy is continuous refresh from recent traffic plus a held-out slice that is never used for tuning.","tags":["overfitting","distribution-shift","eval-refresh","offline-online-gap"],"ref":"https://docs.smith.langchain.com/evaluation/concepts","domain":"evaluation-tuning"},{"id":"ET-018","type":"multi","difficulty":"medium","stem":"Which TWO metrics specifically evaluate an agent's tool use rather than its final answer?","choices":["Tool-selection correctness: did it choose the right tool for the step","Argument correctness: were the parameters well-formed and semantically right","Answer relevancy","Faithfulness"],"answer":[0,1],"explanation":"Tool-correctness metrics decompose into choosing the right tool and calling it correctly; together they localize failures to the agent's action layer. Answer relevancy and faithfulness assess the generated response against the question and the context respectively, and can both look fine even when the agent took an inefficient or wrong path to get there.","tags":["tool-correctness","agent-metrics","deepeval"],"ref":"https://deepeval.com/docs/metrics-llm-evals","domain":"evaluation-tuning"},{"id":"ET-019","type":"single","difficulty":"hard","stem":"You want to compare two agent versions on open-ended tasks where no single reference answer exists. Which evaluation design is most reliable?","choices":["Score each version independently on a 1-10 scale with an LLM judge and compare the means","Pairwise comparison: show the judge both outputs for the same input in randomized order and ask which is better against a rubric","Compare average response length as a proxy for thoroughness","Compare the two versions' perplexity on the task inputs"],"answer":[1],"explanation":"Absolute numeric scoring from LLM judges is poorly calibrated and drifts, so differences in the means are hard to trust. Pairwise preference with position randomization is far more reliable because the judge only has to make a relative call, and randomization controls for the well-documented position bias. Length and perplexity are not quality measures.","tags":["pairwise-evaluation","position-bias","llm-judge","ab-comparison"],"ref":"https://docs.smith.langchain.com/evaluation/concepts","domain":"evaluation-tuning"},{"id":"ET-020","type":"single","difficulty":"medium","stem":"When is supervised fine-tuning (SFT) preferable to few-shot prompting for an agent's behavior?","choices":["When you need the behavior on a handful of examples only","When the behavior is stable and high-volume, the few-shot examples have grown long enough to cost real latency and tokens on every call, and you have enough consistent labeled examples","When the underlying facts change weekly","When you need the model to cite sources"],"answer":[1],"explanation":"Few-shot examples are prompt overhead paid on every request. Once a behavior is settled and traffic is high, folding it into weights removes that recurring cost and usually improves consistency. Volatile facts belong in retrieval rather than weights, and citation behavior depends on having sources in context, not on tuning.","tags":["sft","finetune-vs-prompt","cost","decision-criteria"],"ref":"https://docs.nvidia.com/nemo/microservices/latest/","domain":"evaluation-tuning"},{"id":"ET-021","type":"single","difficulty":"hard","stem":"After LoRA fine-tuning for domain tone, your model's general instruction-following degrades noticeably. What is this and what is the standard mitigation?","choices":["Catastrophic forgetting; mitigate by mixing a replay set of general instruction data into the fine-tuning mix and lowering the LoRA rank or learning rate","Overfitting to the validation set; mitigate by early stopping only","Quantization error; mitigate by serving in FP16","Data leakage; mitigate by deduplicating the training set"],"answer":[0],"explanation":"Narrow fine-tuning shifts the model away from behaviors it is not being trained on. The usual controls are mixing in general instruction data so those capabilities keep getting signal, and reducing the capacity or step size of the adaptation (lower rank, lower learning rate, fewer epochs) so the update stays small. Evaluating general capability before and after is what makes the regression visible at all.","tags":["catastrophic-forgetting","lora","replay-data","regression"],"ref":"https://arxiv.org/abs/2106.09685","domain":"evaluation-tuning"},{"id":"ET-022","type":"single","difficulty":"medium","stem":"What does context precision measure in a RAG evaluation, as distinct from context recall?","choices":["Whether the retrieved chunks that are relevant appear near the top of the ranked list, penalizing relevant items buried under noise","What fraction of the ground-truth answer is covered by the retrieved context","Whether the answer contains only claims supported by the context","How many chunks were retrieved in total"],"answer":[0],"explanation":"Context precision is a ranking-quality measure: of what was retrieved, are the useful items ranked highly. Context recall is a coverage measure against the reference answer. A pipeline can have high recall and poor precision — it found the evidence, but buried it under noise, which matters because of position effects in long contexts.","tags":["context-precision","context-recall","ranking","ragas"],"ref":"https://docs.ragas.io/en/stable/concepts/metrics/available_metrics/context_precision/","domain":"evaluation-tuning"},{"id":"ET-023","type":"multi","difficulty":"hard","stem":"An agent must be evaluated before release. Which TWO slices should be reported separately rather than folded into one aggregate score?","choices":["Performance on the adversarial slice (injections, out-of-scope, ambiguous requests)","Performance on high-consequence actions where an error is costly or irreversible","Performance grouped by the day of week the sample was collected","Performance grouped by response length"],"answer":[0,1],"explanation":"Aggregate scores hide exactly the failures that matter. The adversarial slice and the high-consequence slice each have a different acceptable error rate from routine traffic, so they need their own thresholds and their own release gates. Day-of-week and response-length groupings do not correspond to a risk or capability boundary.","tags":["disaggregated-reporting","release-gates","adversarial-slice","risk"],"ref":"https://www.nist.gov/itl/ai-risk-management-framework","domain":"evaluation-tuning"},{"id":"ET-024","type":"single","difficulty":"medium","stem":"What is the role of NeMo Customizer within the NeMo microservices stack?","choices":["Running benchmarks and LLM-as-judge evaluations","Providing a managed service for fine-tuning models with techniques such as LoRA and SFT, producing adapters or checkpoints for deployment","Applying dialog and content rails at inference time","Extracting and embedding documents for retrieval"],"answer":[1],"explanation":"Customizer is the tuning microservice: it runs SFT and PEFT jobs (LoRA among them) against a base model and emits artifacts you can then serve, commonly as multi-LoRA adapters on a NIM. Evaluation is Evaluator, rails are Guardrails, and retrieval-side extraction and embedding are Retriever.","tags":["nemo-customizer","nvidia","fine-tuning","product-mapping"],"ref":"https://docs.nvidia.com/nemo/microservices/latest/","domain":"evaluation-tuning"},{"id":"ET-025","type":"single","difficulty":"hard","stem":"A judge model marks an agent's answer wrong. On inspection the answer is correct but phrased differently from the reference. What does this reveal about the evaluation setup?","choices":["The agent needs fine-tuning to match the reference style","The judge prompt is treating surface form as correctness; it should be instructed to score semantic equivalence against the rubric, and the disagreement should feed judge calibration","The reference answers are wrong","The evaluation set is too small"],"answer":[1],"explanation":"A false negative of this kind is a judge defect, not an agent defect. The judge's instructions must separate meaning from wording, and every human-reviewed disagreement is calibration data for the judge prompt. Tuning the agent to imitate reference phrasing would be optimizing the metric rather than the capability.","tags":["judge-calibration","false-negatives","semantic-equivalence","metric-gaming"],"ref":"https://deepeval.com/docs/metrics-llm-evals","domain":"evaluation-tuning"},{"id":"ET-026","type":"single","difficulty":"medium","stem":"Which statement about quantization-aware evaluation is correct?","choices":["If aggregate benchmark accuracy is within 1 point of the FP16 baseline, the quantized model is safe to deploy","The quantized model must be evaluated on the specific capabilities the agent depends on — tool-call schema conformance, long-context recall, instruction adherence — because aggregate scores can mask disproportionate damage to narrow behaviors","Quantization only affects throughput, never output quality","Only weights-and-activations quantization requires re-evaluation; weight-only quantization does not"],"answer":[1],"explanation":"Aggregate benchmarks average across many behaviors and can look nearly unchanged while a precision-critical capability degrades badly. The discipline is to evaluate the quantized model on your agent's actual load-bearing behaviors. All quantization schemes change numerics and therefore warrant re-evaluation.","tags":["quantization-evaluation","capability-specific","int4","regression"],"ref":"https://nvidia.github.io/TensorRT-LLM/reference/precision.html","domain":"evaluation-tuning"},{"id":"ET-027","type":"single","difficulty":"hard","stem":"You need to measure whether an agent improved after a change, but traffic is low: only about 300 sessions per week. What is the most appropriate experimental approach?","choices":["Run an A/B test for one week and act on whichever arm is ahead","Run the change against a curated offline set for a directional read, then run a longer online test sized to the effect you care about, and state the minimum detectable effect up front","Ship to 100% and watch the dashboards","Compare this week's metrics against last week's"],"answer":[1],"explanation":"At low volume, a one-week A/B test is underpowered and a week-over-week comparison confounds the change with everything else that varied. The sound approach is to use offline evaluation for a fast directional signal and to size the online test against the effect you actually need to detect, accepting a longer run rather than a fast but meaningless result.","tags":["statistical-power","minimum-detectable-effect","low-traffic","experiment-design"],"ref":"https://docs.smith.langchain.com/evaluation/concepts","domain":"evaluation-tuning"},{"id":"ET-028","type":"multi","difficulty":"medium","stem":"Which TWO are valid reasons to prefer prompt or retrieval changes over fine-tuning as a first response to a quality problem?","choices":["They are reversible within minutes and require no training infrastructure","They keep volatile knowledge out of the weights, where it would go stale and require retraining to correct","They always produce better accuracy than fine-tuning","They eliminate the need for an evaluation suite"],"answer":[0,1],"explanation":"Prompt and retrieval changes are cheap, fast, and reversible, and they keep changing facts in a layer you can update without touching the model. Fine-tuning remains the right answer for stable behavioral and stylistic requirements. Neither approach is universally more accurate, and both still need an evaluation suite to confirm they helped.","tags":["intervention-ordering","reversibility","knowledge-volatility","tuning-decisions"],"ref":"https://docs.nvidia.com/nemo/microservices/latest/","domain":"evaluation-tuning"},{"id":"ET-029","type":"single","difficulty":"hard","stem":"An agent handles five distinct task types. Overall accuracy is 84%, which meets the release bar. What should you check before shipping?","choices":["Whether the 84% is stable across repeated runs","The per-task-type breakdown, because a uniformly strong average can conceal one task type performing far below the bar","Whether the evaluation set is large enough overall","Whether latency also meets its target"],"answer":[1],"explanation":"A single aggregate over heterogeneous task types is the most common way a release gate passes something it should not: four types at 92% and one at 50% averages to 84%. Users of the failing task type experience an unusable product. Run stability, set size, and latency all matter too, but the disaggregation is what this number is actively hiding.","tags":["aggregate-vs-segment","release-gates","task-breakdown"],"ref":"https://docs.smith.langchain.com/evaluation/concepts","domain":"evaluation-tuning"},{"id":"ET-030","type":"single","difficulty":"medium","stem":"You are comparing an FP16 model against its INT4 quantization for an agent that relies on long-context recall and strict tool schemas. Which evaluation design is appropriate?","choices":["A general benchmark suite, since it covers many capabilities","Targeted suites for the capabilities the agent depends on — needle-in-a-haystack style long-context recall and schema-conformance rates on real tool calls — reported separately from any aggregate","Only a latency and throughput comparison","A single side-by-side sample of a few outputs"],"answer":[1],"explanation":"Aggregate benchmarks average across behaviors and can stay nearly flat while a narrow capability collapses. Evaluating precisely what the agent leans on, and reporting those numbers separately rather than folding them into a mean, is what makes a quantization decision defensible.","tags":["quantization-evaluation","capability-specific","long-context","evaluation-gap"],"ref":"https://nvidia.github.io/TensorRT-LLM/reference/precision.html","domain":"evaluation-tuning"},{"id":"HO-001","type":"single","difficulty":"medium","stem":"What distinguishes human-in-the-loop from human-on-the-loop oversight?","choices":["In-the-loop means a human approves or acts before the system proceeds; on-the-loop means the system proceeds autonomously while a human monitors and can intervene","In-the-loop applies to training; on-the-loop applies to inference","In-the-loop requires a UI; on-the-loop requires an API","They are interchangeable terms for the same control"],"answer":[0],"explanation":"The difference is whether human action is a precondition for execution. In-the-loop places a blocking approval in the critical path, suitable for irreversible or high-stakes actions. On-the-loop preserves throughput with supervisory monitoring and an intervention capability, suitable for high-volume, reversible actions.","tags":["hitl","hotl","oversight-models","definitions"],"ref":"https://langchain-ai.github.io/langgraph/concepts/human_in_the_loop/","domain":"human-ai-oversight"},{"id":"HO-002","type":"single","difficulty":"hard","stem":"An agent processes 10,000 refund requests daily. Requiring human approval for all of them is infeasible. Which oversight design best balances throughput and risk?","choices":["Approve a random 5% sample before execution and let the rest through","Auto-approve low-value, high-confidence, policy-conforming cases; route to humans anything above a value threshold, below a confidence threshold, or matching a risk rule; and sample-audit the auto-approved stream","Require approval only for the first 100 requests each day","Let all requests through and review complaints as they arrive"],"answer":[1],"explanation":"Risk-tiered routing puts human attention where the expected cost of error is highest, while retaining statistical oversight of the automated path through sampling audits. Random pre-approval sampling blocks throughput without targeting risk, first-N approval is arbitrary, and complaint-driven review is purely reactive.","tags":["risk-tiering","escalation-thresholds","sampling-audit","scale"],"ref":"https://www.nist.gov/itl/ai-risk-management-framework","domain":"human-ai-oversight"},{"id":"HO-003","type":"single","difficulty":"medium","stem":"Reviewers approve nearly every action the agent proposes, including ones later found wrong. What is the most likely cause and the best remedy?","choices":["Reviewers lack domain expertise; hire more senior reviewers","Automation bias and review fatigue from too many low-information approvals; reduce approval volume to genuinely consequential cases and give reviewers the evidence, uncertainty, and a concrete rejection path for each one","The approval UI is too slow; optimize its latency","The agent is too accurate for review to add value; remove the gate"],"answer":[1],"explanation":"Rubber-stamping is the classic failure of oversight design: when approvals are frequent, undifferentiated, and presented without the evidence needed to disagree, the gate becomes ceremonial. The fix is fewer, better-instrumented decisions — surface the reasoning, the sources, the confidence, and what rejection will do. Removing the gate abandons oversight, and expertise cannot compensate for missing information.","tags":["automation-bias","review-fatigue","rubber-stamping","ux"],"ref":"https://www.nist.gov/itl/ai-risk-management-framework","domain":"human-ai-oversight"},{"id":"HO-004","type":"multi","difficulty":"hard","stem":"Which TWO pieces of information most improve a human reviewer's ability to make a correct accept/reject decision on an agent's proposed action?","choices":["The specific evidence the agent relied on, with links to the source documents and their versions","A precise statement of what will happen if approved, including side effects and whether the action is reversible","The agent's full chain-of-thought transcript for every step","Aggregate historical accuracy of the agent on similar tasks"],"answer":[0,1],"explanation":"Reviewers need to verify the basis for the action and understand its consequences. Citable evidence makes verification possible, and a clear statement of effect and reversibility calibrates how much scrutiny is warranted. Full reasoning transcripts overwhelm reviewers and may not reflect the true decision process; aggregate accuracy informs policy but not this instance.","tags":["reviewer-ux","evidence-presentation","reversibility","hitl"],"ref":"https://langchain-ai.github.io/langgraph/concepts/human_in_the_loop/","domain":"human-ai-oversight"},{"id":"HO-005","type":"single","difficulty":"hard","stem":"Which uncertainty signal is most trustworthy for deciding when an agent should escalate to a human?","choices":["The model's self-reported confidence percentage in its answer","Verifiable external signals: retrieval returned no sufficiently relevant evidence, tool calls failed or conflicted, answers disagreed across repeated samples, or the request matched a known out-of-scope pattern","The length of the model's reasoning trace","Whether the user's message contains a question mark"],"answer":[1],"explanation":"LLM self-reported confidence is poorly calibrated and easily inflated. Grounded signals — absence of supporting evidence, tool disagreement or failure, sampling variance across repeated attempts, scope rules — are measurable and correlate with actual error, so they make sounder escalation triggers.","tags":["uncertainty","calibration","escalation-triggers","confidence"],"ref":"https://docs.ragas.io/en/stable/concepts/metrics/overview/","domain":"human-ai-oversight"},{"id":"HO-006","type":"single","difficulty":"medium","stem":"An agent takes an action that turns out to be wrong. Which design property most limits the harm?","choices":["A detailed audit log of the action","A compensating action (undo) path plus a bounded window during which the action can be reversed before it becomes final","A confidence score recorded alongside the action","A notification sent to the user after the action"],"answer":[1],"explanation":"Recoverability is the property that converts an error into an inconvenience: an explicit compensating transaction and a delay before finality (staging, cancellation window, soft delete) let mistakes be undone. Logs, scores, and notifications support detection and accountability but do not reverse the effect.","tags":["reversibility","compensating-actions","harm-limitation","design"],"ref":"https://genai.owasp.org/llm-top-10/","domain":"human-ai-oversight"},{"id":"HO-007","type":"single","difficulty":"medium","stem":"How should an agent hand off a conversation to a human support representative?","choices":["Send the raw conversation transcript and let the representative read it","Transfer a structured handoff package: the user's goal, actions already taken, evidence gathered, what was attempted and failed, and the specific reason for escalation","Start the representative with a fresh conversation to avoid biasing them","Ask the user to restate their problem to the representative"],"answer":[1],"explanation":"A good handoff preserves context while reducing cognitive load: state the objective, what has already been done (so it is not repeated), the evidence, and precisely why the agent could not finish. Raw transcripts force reconstruction, and discarding context makes the user repeat themselves — the most common complaint about escalation.","tags":["handoff","escalation","context-transfer","ux"],"ref":"https://langchain-ai.github.io/langgraph/concepts/human_in_the_loop/","domain":"human-ai-oversight"},{"id":"HO-008","type":"single","difficulty":"hard","stem":"You want to use reviewer accept/reject decisions to improve the agent. Which use of that feedback is most defensible?","choices":["Immediately fine-tune the model on every rejected action as a negative example","Treat the decisions as a labeled dataset: analyze rejection patterns to fix prompts, tools, or retrieval, add the cases to the evaluation suite, and only then consider preference tuning once patterns are validated","Automatically lower the agent's autonomy threshold after each rejection","Discard rejections, since they represent cases the agent should not have attempted"],"answer":[1],"explanation":"Reviewer decisions are valuable but noisy and confounded (reviewers differ, and rejection reasons vary). The disciplined path is to analyze them for systematic causes, fix the cheapest correct layer, and encode the cases as regression tests before contemplating weight updates. Reflexive fine-tuning on raw rejections bakes in reviewer noise and can cause regressions elsewhere.","tags":["feedback-loops","preference-data","continuous-improvement","evaluation"],"ref":"https://arxiv.org/abs/2305.18290","domain":"human-ai-oversight"},{"id":"HO-009","type":"single","difficulty":"medium","stem":"Which transparency practice is most important when an agent answers end users directly?","choices":["Disclosing the model's parameter count","Disclosing that the user is interacting with an AI system, citing the sources behind factual claims, and making clear how to reach a human","Publishing the full system prompt","Showing the token cost of each response"],"answer":[1],"explanation":"User-facing transparency means the things that affect user decisions and rights: knowing it is an AI, being able to verify claims against sources, and having a route to human help. Model internals, prompts, and costs are operational details, and publishing system prompts can weaken safety controls.","tags":["transparency","disclosure","citations","user-rights"],"ref":"https://artificialintelligenceact.eu/","domain":"human-ai-oversight"},{"id":"HO-010","type":"single","difficulty":"hard","stem":"An agent's autonomy is configured per action type. Which factor should most strongly determine how much autonomy a given action receives?","choices":["How frequently the action occurs","The product of the action's potential harm and its irreversibility, weighed against the agent's measured reliability on that specific action","How long the action takes to execute","Whether the action calls an internal or external API"],"answer":[1],"explanation":"Autonomy should be graduated by risk and evidence: severity and reversibility set how much a mistake costs, and measured per-action reliability sets how likely one is. Frequency and duration affect operational design, and the internal/external distinction is a weak proxy for consequence.","tags":["graduated-autonomy","risk-assessment","reversibility","policy"],"ref":"https://www.nist.gov/itl/ai-risk-management-framework","domain":"human-ai-oversight"},{"id":"HO-011","type":"single","difficulty":"medium","stem":"An approval queue shows reviewers 40 pending agent actions at once. Median review time is 4 seconds per item. What does this most likely indicate?","choices":["The reviewers are highly efficient","Review is not actually happening: 4 seconds is insufficient to verify evidence, which means the gate is providing the appearance of oversight rather than oversight","The agent is highly accurate","The queue should be made longer to batch more efficiently"],"answer":[1],"explanation":"Four seconds per item cannot cover reading the evidence and judging the action. A gate that is never exercised meaningfully creates documented accountability without any actual control — arguably worse than no gate, because it manufactures a false assurance. The fix is fewer items routed to humans and better-instrumented decisions, not a bigger queue.","tags":["oversight-theater","review-quality","throughput","automation-bias"],"ref":"https://www.nist.gov/itl/ai-risk-management-framework","domain":"human-ai-oversight"},{"id":"HO-012","type":"multi","difficulty":"hard","stem":"Which TWO design choices reduce automation bias in reviewers of agent output?","choices":["Present the evidence before the agent's recommendation, so the reviewer forms a view before seeing the suggested answer","Make disagreement low-friction and capture the reason, so rejecting is as easy as approving and the reason becomes data","Show the agent's confidence score prominently to help reviewers calibrate","Pre-select the agent's recommendation as the default choice"],"answer":[0,1],"explanation":"Anchoring is the mechanism behind automation bias, so ordering matters: evidence first, recommendation second. Making rejection as cheap as approval removes the friction asymmetry that produces rubber-stamping, and captured reasons feed improvement. Prominent confidence scores and pre-selected defaults both strengthen the anchor.","tags":["automation-bias","anchoring","reviewer-ux","defaults"],"ref":"https://www.nist.gov/itl/ai-risk-management-framework","domain":"human-ai-oversight"},{"id":"HO-013","type":"single","difficulty":"medium","stem":"An agent is uncertain and must ask the user for clarification. What makes the request most useful?","choices":["A general statement that the agent needs more information","A specific question naming the ambiguity, the options it is deciding between, and what it will do with each answer","A request for the user to rephrase the whole task","A list of everything the agent has done so far"],"answer":[1],"explanation":"A clarifying question is useful in proportion to how little work it leaves the user. Naming the specific ambiguity, offering the candidate interpretations, and stating the consequence of each turns an open-ended demand into a quick choice. Vague requests and full-restart prompts push the cognitive load back onto the user.","tags":["clarification-quality","ambiguity","user-effort","ux"],"ref":"https://langchain-ai.github.io/langgraph/concepts/human_in_the_loop/","domain":"human-ai-oversight"},{"id":"HO-014","type":"single","difficulty":"hard","stem":"You must decide whether an agent action requires approval before execution or review after. Which framing is correct?","choices":["Approve before execution when the action is irreversible or high-consequence; review after when it is reversible and low-consequence, since post-hoc review preserves throughput","Always approve before execution, since safety outweighs speed","Always review after, since blocking harms user experience","Decide based on how often the action occurs"],"answer":[0],"explanation":"Reversibility and consequence determine whether a human must be in the path or can be on it. Irreversible or high-impact actions need pre-execution authorization because after-the-fact review cannot undo them; reversible low-stakes actions can flow and be sampled afterwards. Frequency affects the design of the review process, not whether a decision is reversible.","tags":["pre-vs-post-review","reversibility","consequence","gate-design"],"ref":"https://langchain-ai.github.io/langgraph/concepts/human_in_the_loop/","domain":"human-ai-oversight"},{"id":"HO-015","type":"single","difficulty":"medium","stem":"What is the most important property of an agent's explanation to an end user who must act on its output?","choices":["That it describes the model's internal reasoning process","That it is verifiable: it points to evidence the user can independently check, and states what the agent did not or could not verify","That it is brief","That it expresses high confidence so the user can act decisively"],"answer":[1],"explanation":"A user acting on output needs to be able to check it. Verifiable evidence plus explicit acknowledgment of what remains unverified supports a real decision. Narrated reasoning is not a faithful account of the model's computation and can lend false credibility, and projecting confidence without grounds is actively harmful.","tags":["explainability","verifiability","uncertainty-disclosure","user-decisions"],"ref":"https://artificialintelligenceact.eu/","domain":"human-ai-oversight"},{"id":"HO-016","type":"multi","difficulty":"hard","stem":"An agent handles a task partially and hands off to a human. Which TWO measures indicate whether the handoff design is working?","choices":["Time for the human to reach a decision after receiving the handoff","Rate at which humans must re-gather context the agent already had","Number of handoffs per day","Average agent response length before handoff"],"answer":[0,1],"explanation":"A good handoff transfers understanding, so the measures are how quickly the human can act and how often they have to redo work the agent already did. Rework rate is the sharpest signal that the handoff package is incomplete. Raw handoff volume is a workload figure whose desirable value depends on the escalation policy, and response length says nothing.","tags":["handoff-metrics","rework","context-transfer","escalation"],"ref":"https://langchain-ai.github.io/langgraph/concepts/human_in_the_loop/","domain":"human-ai-oversight"},{"id":"HO-017","type":"single","difficulty":"medium","stem":"Which feedback signal from end users is most useful for improving an agent, and why?","choices":["A thumbs-down alone, because it is easy to collect at scale","A thumbs-down paired with a structured reason category and the trace id, because it makes the failure attributable to a specific step and groupable into causes","A star rating averaged across sessions","Free-text feedback with no linkage to the session"],"answer":[1],"explanation":"Unlabeled negative signal tells you something was wrong but not what or where. Pairing the rating with a reason category and a trace id makes failures attributable to a step and aggregable into patterns you can act on. Session-averaged stars and unlinked free text are almost impossible to convert into fixes.","tags":["user-feedback","attribution","trace-linkage","signal-quality"],"ref":"https://docs.smith.langchain.com/evaluation/concepts","domain":"human-ai-oversight"},{"id":"HO-018","type":"single","difficulty":"hard","stem":"An agent's autonomy was raised after it hit 95% accuracy on an internal evaluation. Three weeks later errors surface in a category the evaluation did not cover. What governance step was missed?","choices":["The evaluation set should have been larger","Autonomy should be scoped to the specific action types and input distribution where reliability was measured, with an explicit boundary and a fallback for anything outside it","The model should have been fine-tuned before the change","Accuracy should have been 99% before raising autonomy"],"answer":[1],"explanation":"Evidence of reliability is evidence about a measured scope, not a general licence. Raising autonomy must therefore name the action types and input distribution the measurement covers, and route anything outside that boundary to a lower-autonomy path. Without that scoping, uncovered categories inherit an autonomy level nothing justified.","tags":["autonomy-scoping","evidence-boundaries","governance","out-of-distribution"],"ref":"https://www.nist.gov/itl/ai-risk-management-framework","domain":"human-ai-oversight"},{"id":"HO-019","type":"single","difficulty":"hard","stem":"An agent has been fully autonomous on refund approvals under $50 for three months at 98% accuracy. Product asks to raise the threshold to $500. What does the existing evidence support?","choices":["Raising it to $500, since 98% accuracy is well established","Nothing about $500: reliability was measured on a distribution of sub-$50 cases, which may differ systematically from larger ones, so the higher band needs its own measurement before autonomy extends to it","Raising it to $250 as a compromise","Lowering it, since three months is too short"],"answer":[1],"explanation":"Evidence of reliability is evidence about the distribution it was gathered on. Larger refunds may involve different customers, reasons and edge cases, so the measured accuracy does not transfer. The disciplined move is to run the higher band in shadow or with approval until it has its own track record.","tags":["autonomy-scoping","evidence-boundaries","out-of-distribution","graduated-autonomy"],"ref":"https://www.nist.gov/itl/ai-risk-management-framework","domain":"human-ai-oversight"},{"id":"HO-020","type":"multi","difficulty":"medium","stem":"Which TWO conditions should automatically drop an agent to a lower autonomy level without waiting for a human decision?","choices":["A sustained rise in the rate of runs terminating at the step limit or with tool errors","Input that falls outside the distribution autonomy was granted on, such as an unseen request type or an unusually large value","A single customer complaint","An increase in total request volume"],"answer":[0,1],"explanation":"Autonomy should be conditional on the evidence that justified it still holding. Degradation signals and out-of-distribution inputs both indicate the conditions no longer apply, so the system should fall back automatically rather than wait for someone to notice. A single complaint is too noisy to act on alone, and volume growth is not a reliability signal.","tags":["autonomy-scoping","graduated-autonomy","out-of-distribution","fallback"],"ref":"https://www.nist.gov/itl/ai-risk-management-framework","domain":"human-ai-oversight"},{"id":"HO-021","type":"single","difficulty":"medium","stem":"Users can rate agent answers. 92% of ratings are positive, yet support tickets about the agent are rising. What is the most likely explanation?","choices":["The rating widget is broken","Response bias: users who are satisfied rate and leave, while frustrated users abandon the agent and open a ticket instead, so the rating pool excludes the failures","Users do not understand the rating scale","The agent is improving and tickets are unrelated"],"answer":[1],"explanation":"Voluntary feedback is a self-selected sample, and the people most affected by failures are often the least likely to stay and rate. Reconciling in-product ratings against downstream signals such as ticket volume, escalations and abandonment is what makes the feedback interpretable.","tags":["user-feedback","response-bias","signal-quality","sampling"],"ref":"https://docs.smith.langchain.com/evaluation/concepts","domain":"human-ai-oversight"},{"id":"HO-022","type":"single","difficulty":"hard","stem":"You want end-user feedback that actually improves the agent. Which capture design is most useful?","choices":["A thumbs up/down on every response","A thumbs-down that asks for a reason category, attaches the trace id, and is reconciled against escalation and abandonment data","A five-star rating at the end of each session","A free-text comment box with no other metadata"],"answer":[1],"explanation":"Useful feedback is attributable and groupable: a reason category turns a negative signal into a cause, the trace id localizes it to a step, and reconciliation against behavioral signals corrects for who chose to respond. Bare ratings and unlinked free text cannot be converted into a fix.","tags":["user-feedback","attribution","trace-linkage","signal-quality"],"ref":"https://docs.smith.langchain.com/evaluation/concepts","domain":"human-ai-oversight"},{"id":"HO-023","type":"single","difficulty":"medium","stem":"An agent handles a request partially, then escalates. Which practice most reduces the human's time to resolution?","choices":["Providing the complete conversation transcript","A structured package: the user's goal, what the agent already did and confirmed, what it attempted that failed, and the specific blocker","Starting the human on a clean slate to avoid bias","Routing to whichever human is free soonest"],"answer":[1],"explanation":"Handoff quality is measured by how little the receiver must reconstruct. Stating the goal, the confirmed work, the failed attempts and the precise blocker prevents duplicated effort and points straight at the decision. Transcripts force reconstruction, and a clean slate guarantees the user repeats themselves.","tags":["handoff","context-transfer","rework","escalation"],"ref":"https://langchain-ai.github.io/langgraph/concepts/human_in_the_loop/","domain":"human-ai-oversight"},{"id":"HO-024","type":"single","difficulty":"medium","stem":"Which disclosure is required when an agent's answer is based on retrieved documents the user cannot access?","choices":["Nothing, as long as the answer is correct","That the answer rests on sources the user cannot open, so they know verification requires someone who can — silently citing inaccessible sources creates false verifiability","The full text of the restricted documents","The names of the people who can access them"],"answer":[1],"explanation":"A citation the reader cannot follow looks like evidence while providing none, which is worse than no citation because it invites misplaced confidence. Saying the basis exists but is not reachable by this user preserves honesty and points to the right escalation. Disclosing restricted content or personnel would breach the access control itself.","tags":["transparency","citations","disclosure","verifiability"],"ref":"https://artificialintelligenceact.eu/","domain":"human-ai-oversight"},{"id":"KD-001","type":"single","difficulty":"medium","stem":"Users ask questions whose answers require a full procedure, but your retriever returns fragments that cut procedures in half. Chunk size is 256 tokens with no overlap. Which change best addresses this?","choices":["Reduce chunk size to 128 tokens to increase precision","Use structure-aware chunking that respects document sections, with overlap, and retrieve parent or neighboring context around the matched chunk","Increase top-k from 5 to 50 and let the model sort it out","Switch to a larger embedding model"],"answer":[1],"explanation":"The failure is boundary-induced loss of coherence. Splitting on semantic/structural boundaries with overlap, and expanding a hit to its parent section (small-to-big or parent-document retrieval), returns complete procedures. Smaller chunks worsen fragmentation, a huge top-k floods the context with noise, and a better embedder cannot recover text that was severed at ingestion.","tags":["chunking","parent-document-retrieval","ingestion"],"ref":"https://docs.llamaindex.ai/en/stable/module_guides/loading/node_parsers/","domain":"knowledge-data"},{"id":"KD-002","type":"single","difficulty":"hard","stem":"Your semantic search misses documents when users search for exact product codes like \"XT-4429-B\". Which retrieval change most directly fixes this?","choices":["Fine-tune the embedding model on product descriptions","Add lexical (BM25/sparse) retrieval and fuse it with dense results — hybrid search","Increase the vector index's number of probes","Lower the similarity threshold"],"answer":[1],"explanation":"Dense embeddings generalize semantically and are weak on rare exact tokens such as SKUs and identifiers, which lexical matching handles natively. Hybrid retrieval with score fusion covers both regimes. Index tuning and threshold changes affect recall within the dense space but cannot make it token-exact, and embedding fine-tuning does not reliably create exact-match behavior.","tags":["hybrid-search","bm25","exact-match","retrieval"],"ref":"https://docs.nvidia.com/nim/nemo-retriever/text-embedding/latest/index.html","domain":"knowledge-data"},{"id":"KD-003","type":"single","difficulty":"medium","stem":"What does a cross-encoder reranker do that a bi-encoder embedding retriever cannot?","choices":["Encode documents once, offline, for fast lookup","Jointly attend over the query and candidate document together, producing a far more accurate relevance score at higher per-pair cost","Generate an answer from the retrieved documents","Compress documents to reduce storage"],"answer":[1],"explanation":"Bi-encoders embed query and document independently, which enables precomputed indexes and fast approximate search but loses query-document interaction. Cross-encoders process the pair jointly and score it directly, giving much better ordering — which is why the standard architecture retrieves broadly with a bi-encoder and reranks a shortlist with a cross-encoder.","tags":["reranking","cross-encoder","bi-encoder","architecture"],"ref":"https://docs.nvidia.com/nim/nemo-retriever/text-reranking/latest/index.html","domain":"knowledge-data"},{"id":"KD-004","type":"multi","difficulty":"hard","stem":"Users phrase questions vaguely and with pronouns referring to earlier turns, and retrieval quality suffers. Which TWO techniques address this at the query stage?","choices":["Query rewriting that resolves coreference and expands the question into a standalone, self-contained query using conversation history","Generating multiple query variants (or a hypothetical answer document, HyDE) and retrieving with each, then fusing results","Increasing the chunk overlap during ingestion","Switching the vector index from HNSW to a flat index"],"answer":[0,1],"explanation":"Both fixes belong at query transformation. Rewriting turns \"does it support that?\" into a fully specified query, and multi-query or HyDE expansion covers vocabulary mismatch between question and document phrasing. Chunk overlap is an ingestion parameter, and index type affects recall/latency, not query ambiguity.","tags":["query-rewriting","hyde","multi-query","coreference"],"ref":"https://arxiv.org/abs/2212.10496","domain":"knowledge-data"},{"id":"KD-005","type":"single","difficulty":"hard","stem":"A question requires connecting facts across three documents (\"which supplier of the component used in product X was acquired in 2023?\"). Standard top-k vector retrieval fails consistently. Which approach is most suitable?","choices":["Increase top-k to 100 so all three documents are retrieved","A graph-based retrieval approach (GraphRAG) that extracts entities and relations so multi-hop connections can be traversed","Use a larger generation model","Reduce chunk size so each fact lands in its own chunk"],"answer":[1],"explanation":"Multi-hop questions fail under similarity search because no single chunk is similar to the whole question — the answer exists only in the relationships between documents. Knowledge-graph construction plus traversal (or community summaries) makes those links explicit and queryable. Flooding the context or enlarging the generator does not supply the missing structure.","tags":["graphrag","multi-hop","knowledge-graph"],"ref":"https://arxiv.org/abs/2404.16130","domain":"knowledge-data"},{"id":"KD-006","type":"single","difficulty":"medium","stem":"What is the role of NVIDIA NeMo Retriever in a RAG pipeline?","choices":["It is a vector database that stores and indexes embeddings","It is a collection of GPU-accelerated NIM microservices for document extraction, embedding, and reranking that feed a vector store of your choice","It fine-tunes embedding models on your corpus automatically","It replaces the LLM with a retrieval-only question answering system"],"answer":[1],"explanation":"NeMo Retriever provides the retrieval-side building blocks as microservices — multimodal document extraction/parsing, text and multimodal embedding, and reranking — while the vector index itself remains a separate component (Milvus, Elasticsearch, pgvector, and others). It is neither a database nor a substitute for generation.","tags":["nemo-retriever","nvidia","rag-pipeline"],"ref":"https://docs.nvidia.com/nim/nemo-retriever/text-embedding/latest/index.html","domain":"knowledge-data"},{"id":"KD-007","type":"single","difficulty":"hard","stem":"Your knowledge base contains both a 2023 policy and its 2025 replacement. The agent sometimes answers from the obsolete document. Which fix is most reliable?","choices":["Instruct the model in the system prompt to prefer newer information","Attach effective-date and status metadata at ingestion and filter or boost on it at query time, removing or tombstoning superseded documents","Rely on the reranker to prefer the newer document","Re-embed the corpus with a newer embedding model"],"answer":[1],"explanation":"Freshness is a data-governance property, not something a relevance model can infer from text. Versioned metadata with query-time filtering, plus an explicit supersession/retirement process, makes the guarantee deterministic. Prompts and rerankers optimize for semantic relevance and will happily return a highly relevant obsolete document; re-embedding changes nothing about recency.","tags":["freshness","metadata-filtering","versioning","data-governance"],"ref":"https://docs.llamaindex.ai/en/stable/module_guides/indexing/metadata_extraction/","domain":"knowledge-data"},{"id":"KD-008","type":"single","difficulty":"medium","stem":"Your source documents are scanned PDFs containing tables and charts that carry most of the answers. Which ingestion approach preserves the most usable information?","choices":["Plain text extraction with a PDF text library, discarding anything unparsable","A multimodal extraction pipeline that performs OCR, detects and reconstructs table structure, and captions or embeds charts and images alongside text","Embedding each page as a single large chunk of raw text","Converting the PDFs to plain text and increasing chunk overlap"],"answer":[1],"explanation":"Scanned documents have no text layer, and tables lose all meaning when flattened into a token stream. Layout-aware multimodal extraction (OCR, table structure recognition, chart/figure handling — the job of NeMo Retriever extraction/NV-Ingest) retains the structure that answers depend on. Text-only approaches discard exactly the content that matters.","tags":["multimodal-ingestion","ocr","tables","nv-ingest"],"ref":"https://docs.nvidia.com/nemo/retriever/extraction/overview/","domain":"knowledge-data"},{"id":"KD-009","type":"multi","difficulty":"hard","stem":"A RAG agent serves multiple customers from one index. Which TWO controls are essential to prevent cross-tenant data exposure?","choices":["Enforce tenant and permission filters inside the retrieval query itself, evaluated server-side before results are returned","Propagate the end user's identity through the pipeline and apply document-level access control at query time, not after generation","Instruct the model never to reveal documents belonging to other tenants","Post-process the generated answer to remove other tenants' names"],"answer":[0,1],"explanation":"Authorization must be enforced at retrieval, before content ever enters the prompt: filter by tenant and by the requesting user's document-level permissions on the server side. Anything applied after the data is in context is a leak that has already happened, and prompt instructions are not an access-control mechanism.","tags":["multi-tenancy","access-control","security","retrieval-filters"],"ref":"https://genai.owasp.org/llm-top-10/","domain":"knowledge-data"},{"id":"KD-010","type":"single","difficulty":"medium","stem":"What does the \"lost in the middle\" finding imply for how you assemble retrieved context?","choices":["Retrieved passages should always be sorted alphabetically","Models attend most reliably to content at the beginning and end of a long context, so the most important passages should be placed at those positions rather than buried in the middle","Contexts longer than 4,000 tokens are always ignored","Reranking is unnecessary if top-k is large enough"],"answer":[1],"explanation":"Accuracy varies with position: information at the extremes of a long context is used more reliably than information in the middle. Practically this means ranking matters, top passages should be positioned at the edges, and stuffing many passages in arbitrary order wastes retrieval quality — which strengthens rather than weakens the case for reranking.","tags":["lost-in-the-middle","context-assembly","position-bias"],"ref":"https://arxiv.org/abs/2307.03172","domain":"knowledge-data"},{"id":"KD-011","type":"single","difficulty":"hard","stem":"Which description matches Self-RAG / Corrective RAG (CRAG) style pipelines?","choices":["They always retrieve exactly k documents and generate once","They add self-assessment steps that decide whether to retrieve, grade retrieved documents for relevance, and trigger corrective action such as query rewriting or web fallback when retrieval is poor","They fine-tune the retriever and generator jointly end-to-end","They replace the vector store with a knowledge graph"],"answer":[1],"explanation":"Self-RAG and CRAG make retrieval adaptive and self-critical: the system reflects on whether retrieval is needed, grades the retrieved evidence, and takes corrective paths — rewrite, re-retrieve, or fall back to another source — instead of generating unconditionally on whatever came back. That control loop is the defining feature.","tags":["self-rag","crag","adaptive-retrieval","document-grading"],"ref":"https://arxiv.org/abs/2401.15884","domain":"knowledge-data"},{"id":"KD-012","type":"single","difficulty":"medium","stem":"Documents in your corpus contain customer PII, but the agent's use case does not require it. When is the most appropriate point to handle this?","choices":["At generation time, by instructing the model not to output PII","At ingestion time, by detecting and redacting or tokenizing PII before it is embedded and stored, with access controls on any retained originals","At the API gateway, by scanning responses for PII patterns","At retrieval time, by lowering the rank of documents containing PII"],"answer":[1],"explanation":"Minimize at the earliest point: if PII is never embedded or indexed, it cannot be retrieved, logged in traces, or leaked in an answer. Output-side scanning and model instructions are late, partial defenses, and de-ranking still keeps the data reachable. Output filtering remains useful as defense in depth, but it is not the primary control.","tags":["pii","data-minimization","ingestion","privacy"],"ref":"https://www.nist.gov/itl/ai-risk-management-framework","domain":"knowledge-data"},{"id":"KD-013","type":"single","difficulty":"medium","stem":"You must choose a vector store for an agent that needs metadata filtering, 50M vectors, and GPU-accelerated index builds. Which consideration should drive the decision?","choices":["Whichever store has the most integrations with agent frameworks","Whether it supports pre-filtered (not post-filtered) search at that scale and can use GPU index builds such as CAGRA, since post-filtering at 50M vectors silently degrades recall","Whichever store is easiest to run locally","Whichever store has the lowest storage cost per vector"],"answer":[1],"explanation":"At scale, the filtering strategy is the decisive functional difference: post-filtering retrieves top-k then discards non-matching results, so a selective filter can leave almost nothing, while pre-filtering constrains the search itself. GPU-accelerated index construction matters because rebuilds at 50M vectors are otherwise measured in hours. Integrations and local convenience are secondary.","tags":["vector-database","pre-vs-post-filtering","cagra","scale"],"ref":"https://docs.rapids.ai/api/cuvs/stable/","domain":"knowledge-data"},{"id":"KD-014","type":"single","difficulty":"hard","stem":"What is the practical trade-off between an HNSW index and an IVF-PQ index for a large vector collection?","choices":["HNSW gives high recall at low latency but high memory use and slow updates; IVF-PQ compresses vectors for far smaller memory at some recall cost","HNSW is exact; IVF-PQ is approximate","IVF-PQ is always faster than HNSW","HNSW cannot support metadata filtering"],"answer":[0],"explanation":"Both are approximate. HNSW's graph structure delivers excellent recall-latency behavior but stores full vectors plus graph links, so memory is large and incremental updates are costly. IVF-PQ quantizes vectors into compact codes, cutting memory dramatically in exchange for quantization error, which makes it the usual choice when the collection no longer fits comfortably in RAM.","tags":["hnsw","ivf-pq","index-tradeoffs","memory"],"ref":"https://docs.rapids.ai/api/cuvs/stable/","domain":"knowledge-data"},{"id":"KD-015","type":"multi","difficulty":"medium","stem":"Your corpus is updated continuously. Which TWO ingestion design choices keep the index correct over time?","choices":["Content-hash each chunk so unchanged content is not re-embedded and changed content is updated in place","Delete or tombstone chunks whose source document was removed, rather than leaving orphans in the index","Rebuild the entire index nightly from scratch","Append new versions of documents without removing old ones, so history is preserved"],"answer":[0,1],"explanation":"Incremental correctness needs change detection and deletion propagation: hashing avoids redundant embedding cost and updates only what moved, and removing orphaned chunks prevents the index from serving content that no longer exists. Full nightly rebuilds are expensive and leave a staleness window; appending without retiring old versions guarantees contradictory retrievals.","tags":["incremental-ingestion","change-detection","deletion-propagation","freshness"],"ref":"https://docs.llamaindex.ai/en/stable/module_guides/indexing/","domain":"knowledge-data"},{"id":"KD-016","type":"single","difficulty":"hard","stem":"A GDPR erasure request arrives for a user whose data was embedded into your RAG index and also appears in a fine-tuned model's training set. What is the honest assessment?","choices":["Both are equally easy: delete the index entries and the model forgets","Index entries and their source documents can be deleted deterministically; removing the influence of that data from fine-tuned weights generally requires retraining without it, which is why personal data should be kept out of training sets in the first place","Neither can be complied with, so the request must be refused","Deleting the source documents is sufficient, since the index will refresh"],"answer":[1],"explanation":"Retrieval indexes support deletion; weights do not, short of retraining. That asymmetry is a design argument, not just a compliance detail: personal data belongs in a layer you can delete from. Note also that deleting source documents does nothing until the deletion is propagated to the index, and any derived caches or traces must be covered too.","tags":["gdpr","right-to-erasure","training-data","deletability"],"ref":"https://www.nist.gov/itl/ai-risk-management-framework","domain":"knowledge-data"},{"id":"KD-017","type":"single","difficulty":"medium","stem":"Which retrieval evaluation signal indicates your chunking strategy is wrong rather than your embedding model?","choices":["Retrieved chunks are topically correct but consistently truncate the information needed to answer","Retrieved chunks are from unrelated topics","Retrieval latency is high","The reranker reorders results heavily"],"answer":[0],"explanation":"Topically correct but informationally incomplete chunks mean the embedding located the right region and the segmentation severed the answer — a chunking failure. Unrelated topics point at the embedding or query formulation instead. Latency is an index concern, and heavy reranker reordering says the first-stage ranking was imprecise, not that the chunks are malformed.","tags":["chunking-diagnosis","attribution","retrieval-debugging"],"ref":"https://docs.llamaindex.ai/en/stable/module_guides/loading/node_parsers/","domain":"knowledge-data"},{"id":"KD-018","type":"single","difficulty":"hard","stem":"What does RAPTOR add to a retrieval pipeline over flat chunk retrieval?","choices":["It reranks chunks with a cross-encoder","It builds a hierarchy by recursively clustering and summarizing chunks, so retrieval can return either fine detail or higher-level synthesis depending on the question's scope","It converts documents into a knowledge graph","It compresses embeddings to reduce index size"],"answer":[1],"explanation":"RAPTOR addresses the mismatch between questions that need one specific passage and questions that need the gist of a whole document or corpus section. By building a tree of recursive cluster summaries, retrieval can serve either granularity. Graph construction is GraphRAG, and reranking and compression are separate concerns.","tags":["raptor","hierarchical-retrieval","summarization-tree","granularity"],"ref":"https://arxiv.org/abs/2401.18059","domain":"knowledge-data"},{"id":"KD-019","type":"multi","difficulty":"medium","stem":"Which TWO practices most improve citation quality in a RAG agent's answers?","choices":["Carry a stable chunk or document identifier through retrieval into the prompt, and require the model to cite it per claim","Verify after generation that each cited identifier actually exists in the retrieved set and supports the claim, rejecting or flagging answers that fail","Ask the model to include a bibliography at the end of its answer","Increase top-k so more sources are available to cite"],"answer":[0,1],"explanation":"Reliable citations need an identifier the model can reference unambiguously and a verification step that catches fabricated or mismatched references. Together these make citation checkable rather than decorative. A trailing bibliography does not tie sources to specific claims, and more candidates does not make attribution more accurate.","tags":["citations","attribution-verification","identifiers","grounding"],"ref":"https://docs.ragas.io/en/stable/concepts/metrics/available_metrics/faithfulness/","domain":"knowledge-data"},{"id":"KD-020","type":"single","difficulty":"hard","stem":"An agent ingests sensor telemetry alongside documents. Which handling is appropriate for the telemetry?","choices":["Embed each reading as text and retrieve by similarity","Store it in a time-series store and expose query and aggregation tools, because numeric time-series questions are computational and range-based rather than semantic","Summarize each hour into prose and embed the summaries","Concatenate readings into the system prompt"],"answer":[1],"explanation":"Vector similarity is the wrong retrieval primitive for numeric time series: questions about ranges, thresholds, trends, and aggregates are computational and need an engine that indexes time and computes. The correct pattern is a purpose-built store behind query tools, with the model interpreting results rather than deriving them.","tags":["time-series","multimodal-data","wrong-primitive","tool-design"],"ref":"https://docs.llamaindex.ai/en/stable/module_guides/indexing/","domain":"knowledge-data"},{"id":"KD-021","type":"single","difficulty":"medium","stem":"Why does embedding model choice constrain later architectural decisions more than generator model choice?","choices":["Embedding models are more expensive to run","Changing the embedding model invalidates the entire index and requires re-embedding the whole corpus, while the generator can be swapped without touching stored data","Embedding models cannot be self-hosted","Generator models do not affect answer quality"],"answer":[1],"explanation":"Embeddings and index are coupled: vectors from a different model are not comparable, so a swap means a full re-embed and rebuild, which at corpus scale is a significant project. The generator reads the retrieved text at request time and can be changed independently. That asymmetry is worth weighing
