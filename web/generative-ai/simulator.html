ach batch, so an unlucky batch of long examples exceeds what average batches needed. Sorting by length into buckets, capping maximum length, or lowering batch size all make the peak predictable.","tags":["out-of-memory","memory","variable-length","batch-size"],"ref":"https://huggingface.co/docs/transformers/perf_train_gpu_one","domain":"finetuning"},{"id":"FT-022","type":"single","difficulty":"hard","stem":"Why does adapter-based tuning such as LoRA reduce catastrophic forgetting compared with full fine-tuning?","choices":["It trains for fewer epochs by default","The pretrained weights are frozen, so the original capability is preserved intact and the learned update is a small addition on top","It uses a different loss function","It trains on more general data"],"answer":[1],"explanation":"Full fine-tuning moves the pretrained weights themselves, so behaviours receiving no gradient signal can drift. LoRA leaves those weights untouched and learns a bounded low-rank addition, which limits how far behaviour can move and makes the adaptation removable by simply not applying the adapter.","tags":["catastrophic-forgetting","lora","peft","freezing"],"ref":"https://huggingface.co/docs/peft/conceptual_guides/lora","domain":"finetuning"},{"id":"GA-001","type":"single","difficulty":"easy","stem":"What distinguishes a generative model from a discriminative one?","choices":["A generative model learns to produce new samples resembling its training distribution; a discriminative model learns a boundary between classes","A generative model is always larger","A discriminative model cannot be trained on text","A generative model requires no training data"],"answer":[0],"explanation":"Discriminative models answer 'which class is this?' by learning the boundary between categories. Generative models learn the distribution itself well enough to draw new samples from it, which is why they can write text or synthesise images rather than only labelling them.","tags":["generative-vs-discriminative","definitions"],"ref":"https://www.ibm.com/topics/generative-ai","domain":"genai-intro"},{"id":"GA-002","type":"single","difficulty":"medium","stem":"In a generative adversarial network, what is the discriminator's role during training?","choices":["It generates candidate samples for the generator to refine","It judges whether a sample is real or produced by the generator, providing the signal the generator learns from","It compresses inputs into a latent representation","It adds noise to the training data"],"answer":[1],"explanation":"A GAN trains two networks against each other: the generator produces candidates and the discriminator tries to tell them from real data. The discriminator's judgement is the generator's training signal, and the two improve together. Compression into a latent space describes an autoencoder, not a GAN.","tags":["gan","discriminator","generator","architectures"],"ref":"https://www.ibm.com/topics/generative-ai","domain":"genai-intro"},{"id":"GA-003","type":"single","difficulty":"medium","stem":"What characterises a variational autoencoder (VAE) compared with a plain autoencoder?","choices":["It has no decoder","It encodes inputs to a probability distribution over the latent space rather than a single point, so the space can be sampled to generate new data","It uses convolution instead of dense layers","It trains without a loss function"],"answer":[1],"explanation":"A plain autoencoder maps each input to one latent point, leaving the space between points undefined. A VAE encodes to a distribution and regularises it toward a known prior, so sampling anywhere in the latent space decodes to something plausible. That is what makes a VAE generative.","tags":["vae","autoencoder","latent-space","architectures"],"ref":"https://www.ibm.com/topics/generative-ai","domain":"genai-intro"},{"id":"GA-004","type":"single","difficulty":"medium","stem":"How does a diffusion model generate an image?","choices":["By assembling the image from a library of stored patches","By learning to reverse a gradual noising process, starting from pure noise and denoising step by step toward an image","By competing against a discriminator network","By directly predicting all pixels in a single forward pass"],"answer":[1],"explanation":"Diffusion models are trained on a forward process that progressively corrupts data into noise, and learn to invert it. Generation runs that reverse process from random noise, denoising iteratively. The iterative nature explains both their sample quality and their comparatively slow inference.","tags":["diffusion","image-generation","architectures"],"ref":"https://www.ibm.com/topics/generative-ai","domain":"genai-intro"},{"id":"GA-005","type":"multi","difficulty":"medium","stem":"Which TWO are realistic current capabilities of generative AI as presented in the course?","choices":["Producing draft code from a natural-language description","Generating synthetic data to supplement a small training set","Guaranteeing factual accuracy without external grounding","Independently setting and pursuing its own business objectives"],"answer":[0,1],"explanation":"Code drafting and synthetic data generation are established, practical uses. Factual guarantees are precisely what generative models cannot give without retrieval or verification, and autonomous goal-setting describes a capability no current system has.","tags":["capabilities","code-generation","synthetic-data","limitations"],"ref":"https://www.ibm.com/topics/generative-ai","domain":"genai-intro"},{"id":"GA-006","type":"single","difficulty":"medium","stem":"What is a hallucination in the context of a large language model?","choices":["The model refuses to answer","The model produces fluent, confident output that is factually wrong or unsupported","The model outputs the same text repeatedly","The model returns an error"],"answer":[1],"explanation":"A hallucination is plausible-sounding content with no basis in fact or in any provided source. It arises because the model is optimised to produce likely continuations, not true ones — fluency and truth are different objectives. This is why grounding with retrieval matters.","tags":["hallucination","limitations","factuality"],"ref":"https://www.ibm.com/topics/ai-hallucinations","domain":"genai-intro"},{"id":"GA-007","type":"single","difficulty":"medium","stem":"A company wants a model to draft product descriptions in its own house style. Which is the most proportionate first approach?","choices":["Pre-train a new foundation model from scratch","Prompt an existing model with clear instructions and a few examples of the house style","Fine-tune on a million examples","Build a GAN"],"answer":[1],"explanation":"Prompting with a handful of style examples is fast, free of training cost and reversible, and it very often suffices for a stylistic requirement. Only if it proves inadequate at volume does fine-tuning become worth its cost; pre-training from scratch is never proportionate for this.","tags":["prompting-first","proportionality","intervention-choice"],"ref":"https://www.ibm.com/topics/prompt-engineering","domain":"genai-intro"},{"id":"GA-008","type":"single","difficulty":"easy","stem":"What is a foundation model?","choices":["A model trained on broad data at scale that can be adapted to many downstream tasks","A model that runs only on a local machine","The first model a team trains on a project","A model with fewer than one billion parameters"],"answer":[0],"explanation":"The defining property is breadth plus adaptability: trained once on large, general data, then adapted to many specific tasks by prompting or fine-tuning. This is what shifted the field from building a bespoke model per task to adapting a shared base.","tags":["foundation-models","definitions","adaptation"],"ref":"https://www.ibm.com/topics/foundation-models","domain":"genai-intro"},{"id":"GA-009","type":"multi","difficulty":"medium","stem":"Which TWO risks does the course associate specifically with generative AI rather than machine learning generally?","choices":["Convincing misinformation produced at scale and low cost","Uncertainty about the provenance and copyright status of generated content","Overfitting to the training set","Class imbalance in the labels"],"answer":[0,1],"explanation":"Both risks follow from the ability to produce novel, plausible content: misinformation becomes cheap to manufacture, and outputs derived from training data raise unresolved provenance and rights questions. Overfitting and class imbalance are longstanding concerns across all supervised learning.","tags":["risks","misinformation","copyright","provenance"],"ref":"https://www.ibm.com/topics/generative-ai","domain":"genai-intro"},{"id":"GA-010","type":"single","difficulty":"medium","stem":"Which application is a poor fit for a generative model used on its own?","choices":["Summarising a long document into key points","Drafting marketing copy variations","Returning the current balance of a customer's account","Rewriting text into a different tone"],"answer":[2],"explanation":"A precise, current, verifiable fact must come from a system of record, not from a model that produces likely text. Summarising, drafting and rewriting are transformations of provided or learned language, which is what generative models do well. Answering the balance question requires a tool call.","tags":["use-case-fit","limitations","system-of-record"],"ref":"https://www.ibm.com/topics/generative-ai","domain":"genai-intro"},{"id":"GA-011","type":"single","difficulty":"hard","stem":"Why does the same prompt sent twice to the same model sometimes return different answers?","choices":["The model weights change between calls","Generation samples from a probability distribution over next tokens, so settings such as temperature introduce randomness","The prompt is tokenised differently each time","The model retrains on each request"],"answer":[1],"explanation":"Decoding chooses each token from a distribution, and any sampling temperature above zero makes that choice stochastic. Weights are fixed at inference and tokenisation is deterministic. This variability is why reproducibility in generative systems needs fixed seeds or greedy decoding, and even then is not guaranteed across versions.","tags":["sampling","temperature","determinism","decoding"],"ref":"https://www.ibm.com/topics/generative-ai","domain":"genai-intro"},{"id":"GA-012","type":"single","difficulty":"medium","stem":"What does 'multimodal' mean for a generative model?","choices":["It can be deployed in multiple cloud regions","It accepts or produces more than one type of data, such as text together with images or audio","It has multiple layers","It supports multiple languages"],"answer":[1],"explanation":"Modality refers to the type of data — text, image, audio, video. A multimodal model handles more than one, for example describing a photograph or generating an image from a caption. Multiple languages is still a single modality, and layer count and deployment topology are unrelated.","tags":["multimodal","definitions","modalities"],"ref":"https://www.ibm.com/topics/generative-ai","domain":"genai-intro"},{"id":"GA-013","type":"single","difficulty":"medium","stem":"Which statement about generative AI in software development is accurate?","choices":["It removes the need for testing because generated code is correct by construction","It accelerates drafting and boilerplate, but generated code still requires review and testing because it can be subtly wrong","It can only generate comments, not code","It works only for Python"],"answer":[1],"explanation":"Generated code compiles and reads plausibly while containing logic errors, insecure patterns or calls to APIs that do not exist. The productivity gain is real but is realised in drafting; review and testing remain necessary, arguably more so because plausible-looking code invites less scrutiny.","tags":["code-generation","review","limitations"],"ref":"https://www.ibm.com/topics/generative-ai","domain":"genai-intro"},{"id":"GA-014","type":"single","difficulty":"hard","stem":"An organisation is deciding whether to send prompts containing customer data to a hosted generative API. What is the central question?","choices":["Whether the API is fast enough","What the provider does with submitted data — retention, use for training, and where it is processed — measured against the organisation's obligations","Whether the model has enough parameters","Whether the API returns JSON"],"answer":[1],"explanation":"Sending data to a third party is a data-governance decision before it is a technical one: retention periods, whether submissions train future models, and processing location determine whether the use is lawful. Performance and response format matter, but they do not determine whether you are permitted to make the call.","tags":["data-governance","privacy","hosted-api","compliance"],"ref":"https://www.ibm.com/topics/ai-governance","domain":"genai-intro"},{"id":"GA-015","type":"single","difficulty":"medium","stem":"What is the relationship between a large language model and a transformer?","choices":["They are unrelated","A transformer is the neural network architecture most large language models are built on","A large language model is a kind of transformer hardware","Transformers replaced large language models"],"answer":[1],"explanation":"The transformer is an architecture introduced for sequence modelling; large language models are models of language built using it at scale. Nearly every prominent LLM — GPT, BERT, T5, LLaMA — is a transformer variant, which is why understanding attention is foundational.","tags":["transformers","llm","architectures","definitions"],"ref":"https://www.ibm.com/topics/transformer-model","domain":"genai-intro"},{"id":"GA-016","type":"single","difficulty":"medium","stem":"Which best describes prompt engineering's role relative to model training?","choices":["It replaces training entirely for all tasks","It steers an already-trained model's behaviour at inference time without changing its weights","It is a stage of training that adjusts weights","It is only useful for image models"],"answer":[1],"explanation":"Prompt engineering operates entirely at inference: the weights are fixed and the prompt shapes which of the model's learned behaviours are elicited. That is why it is cheap and instantly reversible, and also why it cannot install a capability the model does not already have.","tags":["prompt-engineering","inference-time","definitions"],"ref":"https://www.ibm.com/topics/prompt-engineering","domain":"genai-intro"},{"id":"GA-017","type":"multi","difficulty":"medium","stem":"Before sending prompts containing personal data to a third-party model API, which TWO questions must be answered?","choices":["Whether submitted data is retained, and for how long","Whether submissions are used to train the provider's future models","Whether the API supports streaming","Whether the model is open weight"],"answer":[0,1],"explanation":"Retention and training use determine whether the transfer is lawful and whether the data could resurface elsewhere. Both are contractual facts to establish before the first call, not technical features. Streaming and licensing matter for engineering, not for permission.","tags":["data-governance","privacy","hosted-api","compliance"],"ref":"https://www.ibm.com/topics/ai-governance","domain":"genai-intro"},{"id":"IA-001","type":"single","difficulty":"easy","stem":"Which statement correctly orders artificial intelligence, machine learning, deep learning and generative AI?","choices":["They are four independent fields that overlap only occasionally","Generative AI contains deep learning, which contains machine learning, which contains AI","AI is the broadest field; machine learning is a subset of it, deep learning a subset of machine learning, and generative AI a subset of deep learning","Machine learning is the broadest field and AI is a specific application of it"],"answer":[2],"explanation":"The nesting runs from general to specific: AI is any technique that makes machines appear intelligent, machine learning is the subset that learns patterns from data rather than following hand-written rules, deep learning is the subset of machine learning using multi-layer neural networks, and generative AI is the subset of deep learning that produces new content. Getting this hierarchy backwards is the single most common conceptual error in the introductory material.","tags":["ai-hierarchy","definitions","machine-learning","deep-learning"],"ref":"https://www.ibm.com/topics/artificial-intelligence","domain":"intro-ai"},{"id":"IA-002","type":"single","difficulty":"easy","stem":"A model is trained on thousands of emails, each labelled 'spam' or 'not spam'. What kind of learning is this?","choices":["Unsupervised learning","Supervised learning","Reinforcement learning","Self-supervised learning"],"answer":[1],"explanation":"Supervised learning trains on examples that carry the correct answer, so the model learns a mapping from input to label. The defining feature is the presence of labels, not the algorithm used. Unsupervised learning finds structure in unlabelled data, and reinforcement learning learns from reward signals rather than labelled examples.","tags":["supervised-learning","labels","definitions"],"ref":"https://www.ibm.com/topics/supervised-learning","domain":"intro-ai"},{"id":"IA-003","type":"single","difficulty":"medium","stem":"A retailer wants to discover natural groupings among its customers without deciding the groups in advance. Which approach fits?","choices":["Classification with a labelled training set","Clustering, an unsupervised technique","Regression against past revenue","Reinforcement learning with a reward function"],"answer":[1],"explanation":"When the categories are not known beforehand and no labels exist, the task is to find structure in the data itself — clustering. Classification requires the groups to be defined in advance and labelled, regression predicts a continuous value rather than a grouping, and reinforcement learning needs an environment and reward signal that this problem does not have.","tags":["unsupervised-learning","clustering","use-case-selection"],"ref":"https://www.ibm.com/topics/unsupervised-learning","domain":"intro-ai"},{"id":"IA-004","type":"single","difficulty":"medium","stem":"Which task is best described as narrow (weak) AI rather than general (strong) AI?","choices":["A system that transfers its chess skill to diagnosing disease without retraining","A model that transcribes speech to text with high accuracy","A machine that understands and reasons across any domain a human can","A system that sets its own goals across unrelated fields"],"answer":[1],"explanation":"Narrow AI performs one well-defined task, however well it performs it; speech transcription is a clear example. General AI — a system matching human breadth of understanding and transferring capability across arbitrary domains — does not currently exist. Every AI system in commercial use today is narrow.","tags":["narrow-ai","general-ai","definitions"],"ref":"https://www.ibm.com/topics/artificial-intelligence","domain":"intro-ai"},{"id":"IA-005","type":"multi","difficulty":"medium","stem":"Which TWO are genuine reasons an AI project fails at the data stage rather than the modelling stage?","choices":["The training data does not represent the population the model will serve in production","The labels are inconsistent because different annotators applied different criteria","The learning rate was set too high","The model has too few layers for the task"],"answer":[0,1],"explanation":"Representativeness and label quality are data problems that no amount of modelling can repair: a model can only learn the relationship present in its training set, and inconsistent labels teach it contradictions. Learning rate and network depth are modelling choices, tuned after the data is sound.","tags":["data-quality","representativeness","labelling","project-lifecycle"],"ref":"https://www.ibm.com/topics/machine-learning","domain":"intro-ai"},{"id":"IA-006","type":"single","difficulty":"medium","stem":"A hiring model trained on ten years of a company's past hiring decisions recommends mostly candidates resembling previous hires. What is happening?","choices":["Overfitting to the validation set","The model has learned historical bias present in the training data and is reproducing it","The model needs more layers","Data drift between training and inference"],"answer":[1],"explanation":"A model trained on historical decisions learns whatever pattern those decisions contained, including discriminatory ones. This is bias inherited from data, not a technical defect in fitting — the model is working exactly as trained. Detecting it requires evaluating outcomes by group rather than looking at aggregate accuracy.","tags":["bias","historical-bias","fairness","ethics"],"ref":"https://www.ibm.com/topics/ai-ethics","domain":"intro-ai"},{"id":"IA-007","type":"single","difficulty":"medium","stem":"Which principle does 'explainability' refer to in responsible AI?","choices":["The model source code is published openly","Affected people can understand the basis on which a decision was reached","The model has high accuracy on a benchmark","The training data is stored indefinitely for audit"],"answer":[1],"explanation":"Explainability concerns whether the reasoning behind an output can be understood and scrutinised by the people it affects. Open source, accuracy and data retention are separate concerns — a fully open, highly accurate model can still be unexplainable, which is precisely the problem with large neural networks.","tags":["explainability","responsible-ai","ethics","transparency"],"ref":"https://www.ibm.com/topics/explainable-ai","domain":"intro-ai"},{"id":"IA-008","type":"single","difficulty":"easy","stem":"What distinguishes a chatbot built on rules from one built on a large language model?","choices":["The rule-based bot matches inputs against predefined patterns and returns scripted replies; the LLM generates responses from learned language patterns","The rule-based bot is always more accurate","Only the LLM version can be deployed on the web","The rule-based bot requires more training data"],"answer":[0],"explanation":"A rule-based system maps recognised inputs to authored responses and cannot answer anything outside its script. An LLM generates responses token by token from patterns learned during training, giving it far wider coverage at the cost of predictability. Rule-based systems need no training data at all, which is sometimes exactly why they are chosen.","tags":["chatbots","rule-based","llm","definitions"],"ref":"https://www.ibm.com/topics/chatbots","domain":"intro-ai"},{"id":"IA-009","type":"single","difficulty":"medium","stem":"In computer vision, what does a convolutional layer primarily do?","choices":["Flattens the image into a single vector before classification","Applies learned filters across the image to detect local patterns such as edges and textures","Normalises pixel values to a fixed range","Randomly drops pixels to prevent overfitting"],"answer":[1],"explanation":"A convolutional layer slides learned filters over the input, producing feature maps that respond to local patterns. Because the same filter is applied everywhere, the layer detects a pattern wherever it appears and uses far fewer parameters than a fully connected layer. Flattening, normalisation and dropout are separate operations.","tags":["computer-vision","cnn","convolution","neural-networks"],"ref":"https://www.ibm.com/topics/convolutional-neural-networks","domain":"intro-ai"},{"id":"IA-010","type":"single","difficulty":"medium","stem":"Which scenario best describes reinforcement learning?","choices":["A model predicts house prices from square footage and location","An agent learns to play a game by receiving rewards and penalties from the outcomes of its moves","A model groups news articles into topics without labels","A model translates sentences using paired examples"],"answer":[1],"explanation":"Reinforcement learning is defined by an agent acting in an environment and learning from a reward signal that follows its actions, rather than from labelled examples. Price prediction is supervised regression, topic grouping is unsupervised clustering, and translation from paired examples is supervised sequence learning.","tags":["reinforcement-learning","definitions","rewards"],"ref":"https://www.ibm.com/topics/reinforcement-learning","domain":"intro-ai"},{"id":"IA-011","type":"single","difficulty":"hard","stem":"A model scores 99% on training data and 62% on unseen data. What is the diagnosis and the usual first response?","choices":["Underfitting; increase model capacity","Overfitting; add regularisation, gather more data, or reduce model complexity","Data drift; retrain on recent data","Label noise; relabel the training set"],"answer":[1],"explanation":"A large gap between training and held-out performance is the signature of overfitting: the model has memorised the training set, including its noise, rather than learning generalisable structure. The standard responses reduce the model's ability to memorise or give it more varied data. Underfitting would show poor performance on both sets.","tags":["overfitting","generalisation","diagnosis","model-evaluation"],"ref":"https://www.ibm.com/topics/overfitting","domain":"intro-ai"},{"id":"IA-012","type":"single","difficulty":"medium","stem":"Why is a held-out test set kept separate from the validation set?","choices":["To speed up training","Because the validation set influences model and hyperparameter choices, so performance on it is optimistically biased; the test set gives an untouched estimate","Because the test set must be larger","Because the test set is used to compute the loss during training"],"answer":[1],"explanation":"Every decision made by looking at validation performance leaks information about that set into the model, so validation scores drift upward relative to true generalisation. A test set touched only once at the end provides an honest estimate. The training loss is computed on the training set, never on either held-out split.","tags":["train-validation-test","data-splitting","evaluation","leakage"],"ref":"https://www.ibm.com/topics/machine-learning","domain":"intro-ai"},{"id":"IA-013","type":"multi","difficulty":"medium","stem":"Which TWO belong to the problem-definition stage of an AI project rather than a later stage?","choices":["Deciding what outcome would count as success and how it will be measured","Establishing whether the problem needs machine learning at all, or whether rules would serve","Selecting an optimiser and learning rate","Converting the trained model to a deployment format"],"answer":[0,1],"explanation":"Both are framing decisions that determine whether the rest of the work is worth doing: a success criterion makes the project evaluable, and asking whether ML is needed prevents building a model where a lookup table would do. Optimiser choice is modelling and format conversion is deployment.","tags":["project-lifecycle","problem-framing","success-criteria"],"ref":"https://www.ibm.com/topics/machine-learning","domain":"intro-ai"},{"id":"IA-014","type":"single","difficulty":"easy","stem":"What is natural language processing (NLP)?","choices":["The field concerned with enabling computers to process, interpret and generate human language","A technique for compressing text files","A database query language","A method for translating programming languages into one another"],"answer":[0],"explanation":"NLP covers the whole range of computational work on human language: understanding, interpretation and generation. It spans tasks from tokenisation and named-entity recognition through translation and question answering, and it is the branch of AI that large language models belong to.","tags":["nlp","definitions"],"ref":"https://www.ibm.com/topics/natural-language-processing","domain":"intro-ai"},{"id":"IA-015","type":"single","difficulty":"medium","stem":"An organisation must decide between building a model and buying a pre-built AI service. Which consideration most favours buying?","choices":["The task is generic — speech transcription, language detection, standard OCR — and no proprietary data confers an advantage","The task depends on proprietary data that no vendor has","Regulatory rules forbid data leaving the organisation","The organisation has a large, experienced ML team"],"answer":[0],"explanation":"Buying wins when the capability is a commodity and your data would not make the model meaningfully better — you get quality immediately without carrying the training and maintenance cost. Proprietary data advantage, data-residency constraints and in-house capability all push the other way.","tags":["build-vs-buy","decision-criteria","strategy"],"ref":"https://www.ibm.com/topics/artificial-intelligence","domain":"intro-ai"},{"id":"IA-016","type":"single","difficulty":"medium","stem":"What does IBM watsonx.ai provide within the watsonx platform?","choices":["A data lakehouse for storing and querying enterprise data","A studio for training, validating, tuning and deploying AI models, including foundation models","A governance toolkit for tracking model risk and compliance","A managed Kubernetes service"],"answer":[1],"explanation":"watsonx is organised into three components with distinct jobs: watsonx.ai is the studio for building and deploying models, watsonx.data is the lakehouse for the data those models use, and watsonx.governance handles risk, compliance and lifecycle documentation. Keeping the three apart is a common exam distinction.","tags":["watsonx","ibm","product-mapping"],"ref":"https://www.ibm.com/products/watsonx-ai","domain":"intro-ai"},{"id":"IA-017","type":"single","difficulty":"medium","stem":"Which watsonx component is concerned with documenting model risk, monitoring for drift and supporting regulatory compliance?","choices":["watsonx.ai","watsonx.data","watsonx.governance","watsonx Orchestrate"],"answer":[2],"explanation":"watsonx.governance is the component built for the accountability side of AI: model inventories, risk documentation, drift monitoring and audit support. watsonx.ai builds and deploys, watsonx.data stores and queries, and watsonx Orchestrate automates business workflows.","tags":["watsonx","governance","ibm","product-mapping"],"ref":"https://www.ibm.com/products/watsonx-governance","domain":"intro-ai"},{"id":"IA-018","type":"single","difficulty":"hard","stem":"A model's accuracy is 97% on a dataset where 97% of cases are the negative class. What does this tell you?","choices":["The model is performing very well","Accuracy is uninformative here — a model that always predicts the majority class scores the same, so precision, recall or a confusion matrix is needed","The dataset is too small","The model is overfitting"],"answer":[1],"explanation":"On heavily imbalanced data, accuracy is dominated by the majority class and a trivial constant predictor matches a genuinely good model. Precision and recall on the minority class, or the confusion matrix itself, reveal whether the model detects the cases that matter. This is the classic trap in fraud, disease and defect detection.","tags":["class-imbalance","accuracy","precision-recall","evaluation"],"ref":"https://www.ibm.com/topics/machine-learning","domain":"intro-ai"},{"id":"IA-019","type":"single","difficulty":"medium","stem":"Which is the clearest example of AI augmenting rather than replacing human work?","choices":["A system that fully automates invoice approval with no review","A radiology tool that highlights suspicious regions for a radiologist to assess","A chatbot that answers every customer query without escalation","A scheduling system that assigns shifts automatically"],"answer":[1],"explanation":"Augmentation keeps the human as the decision-maker while the system does the work humans are worse at — here, exhaustively scanning for candidate regions. The other options describe automation, where the system makes the decision. The distinction matters because augmentation and automation carry very different risk and governance profiles.","tags":["augmentation","automation","human-ai","ethics"],"ref":"https://www.ibm.com/topics/ai-ethics","domain":"intro-ai"},{"id":"IA-020","type":"single","difficulty":"medium","stem":"What is a neural network's activation function for?","choices":["To normalise the input data before training","To introduce non-linearity so the network can represent relationships a stack of linear layers could not","To reduce the number of parameters","To select which training examples to use"],"answer":[1],"explanation":"Without a non-linear activation, any stack of linear layers collapses mathematically into a single linear transformation, so depth would buy nothing. Activations such as ReLU, sigmoid and tanh are what make deep networks able to approximate complex functions.","tags":["activation-function","neural-networks","non-linearity"],"ref":"https://www.ibm.com/topics/neural-networks","domain":"intro-ai"},{"id":"IA-021","type":"multi","difficulty":"hard","stem":"Which TWO are legitimate concerns about deploying AI that the introductory material raises as ethical rather than technical?","choices":["Decisions may be made about people who have no way to contest or understand them","Training and inference consume significant energy with an environmental cost","The model's inference latency exceeds the service level objective","The framework version is out of date"],"answer":[0,1],"explanation":"Contestability and environmental impact are questions about what the system does to people and the world, and cannot be resolved by better engineering alone. Latency and dependency versions are operational matters with clear technical fixes.","tags":["ethics","contestability","environmental-impact","responsible-ai"],"ref":"https://www.ibm.com/topics/ai-ethics","domain":"intro-ai"},{"id":"IA-022","type":"single","difficulty":"medium","stem":"Which best describes 'training data' versus 'model parameters'?","choices":["They are two names for the same thing","Training data are the examples the model learns from; parameters are the values inside the model adjusted during learning","Parameters are supplied by the user at inference; training data is generated by the model","Training data is stored inside the model after training"],"answer":[1],"explanation":"The data is the input to the learning process and the parameters — weights and biases — are its output, adjusted to reduce the loss. A trained model does not contain its training data, though it can memorise portions of it, which is itself a privacy concern.","tags":["parameters","training-data","fundamentals"],"ref":"https://www.ibm.com/topics/machine-learning","domain":"intro-ai"},{"id":"IA-023","type":"single","difficulty":"hard","stem":"A team reports that their model 'has 95% confidence' in a prediction. What should you check before relying on that number?","choices":["Whether the confidence is calibrated — that among predictions made at 95%, roughly 95% are actually correct","Whether the model has enough layers","Whether the training set was shuffled","Whether the confidence is stored as a float"],"answer":[0],"explanation":"A model's output score is not a probability unless it has been calibrated. Neural networks are frequently overconfident, so a reported 95% may correspond to a far lower true accuracy. Calibration is checked empirically by bucketing predictions by confidence and measuring accuracy within each bucket.","tags":["calibration","confidence","evaluation","overconfidence"],"ref":"https://www.ibm.com/topics/machine-learning","domain":"intro-ai"},{"id":"IA-024","type":"single","difficulty":"medium","stem":"Which statement about AI and jobs reflects the position taken in the introductory material?","choices":["AI will replace most professional roles within a few years","AI tends to change the composition of tasks within roles, automating some while creating demand for new skills, rather than eliminating roles wholesale","AI has no measurable effect on employment","Only manual roles are affected"],"answer":[1],"explanation":"The consistent framing is task-level rather than role-level: jobs are bundles of tasks, and AI absorbs some of those tasks while raising the value of others, including working with the systems themselves. Both the wholesale-replacement and no-effect positions overstate the evidence.","tags":["ai-and-work","task-automation","ethics"],"ref":"https://www.ibm.com/topics/artificial-intelligence","domain":"intro-ai"},{"id":"IA-025","type":"single","difficulty":"medium","stem":"A team wants to query enterprise data stored across several formats and locations to feed an AI application. Which watsonx component is designed for that?","choices":["watsonx.ai","watsonx.data","watsonx.governance","watsonx Assistant"],"answer":[1],"explanation":"watsonx.data is the lakehouse layer: it stores and queries enterprise data across formats and sources so models can use it. watsonx.ai is the studio for building and deploying models, and watsonx.governance handles risk and compliance. Keeping the three straight is a recurring exam distinction.","tags":["watsonx","ibm","product-mapping"],"ref":"https://www.ibm.com/products/watsonx-data","domain":"intro-ai"},{"id":"IA-026","type":"single","difficulty":"medium","stem":"An auditor asks which model version made a particular decision, what data trained it, and how its risk was assessed. Which capability is being exercised?","choices":["Model serving throughput","AI governance: model inventory, lineage and risk documentation","Hyperparameter tuning","Data augmentation"],"answer":[1],"explanation":"Answering after the fact requires records kept deliberately: which model version was live, what it was trained on, and what risk assessment was performed. That is the governance function, and it has to be designed in — it cannot be reconstructed later from a serving log.","tags":["governance","ibm","watsonx","responsible-ai"],"ref":"https://www.ibm.com/products/watsonx-governance","domain":"intro-ai"},{"id":"IA-027","type":"single","difficulty":"medium","stem":"Why does a deep network need many layers rather than one very wide layer?","choices":["Wide layers cannot be trained","Depth lets the network compose progressively more abstract features, where a single layer must represent everything at one level","Wide layers use more memory than deep ones always","Depth removes the need for activation functions"],"answer":[1],"explanation":"Each layer transforms the representation produced below it, so depth builds a hierarchy — edges to shapes to objects, or tokens to phrases to meaning. A single layer, however wide, has no opportunity to compose. Non-linear activations remain essential regardless of depth.","tags":["neural-networks","deep-learning","representation","non-linearity"],"ref":"https://www.ibm.com/topics/neural-networks","domain":"intro-ai"},{"id":"LA-001","type":"single","difficulty":"medium","stem":"Which generative architecture is best suited to high-fidelity image synthesis through iterative refinement?","choices":["Recurrent neural network","Diffusion model","Bag-of-words model","Support vector machine"],"answer":[1],"explanation":"Diffusion models generate by reversing a learned noising process step by step, which produces high-quality images at the cost of many forward passes. RNNs model sequences, and bag-of-words and SVMs are not generative architectures for images at all.","tags":["diffusion","architectures","image-generation"],"ref":"https://www.ibm.com/topics/generative-ai","domain":"llm-architecture"},{"id":"LA-002","type":"single","difficulty":"medium","stem":"What is the architectural difference between GPT-style and BERT-style models?","choices":["GPT is a decoder stack trained to predict the next token; BERT is an encoder stack trained with masked language modelling to build bidirectional representations","GPT uses attention and BERT does not","BERT is larger than GPT by definition","GPT cannot be fine-tuned"],"answer":[0],"explanation":"The split is causal versus bidirectional. GPT attends only to previous tokens, which suits generation. BERT sees the whole sequence and is trained by predicting masked tokens, which suits understanding tasks like classification and extraction but makes it unsuitable for free generation.","tags":["gpt","bert","encoder-decoder","architectures"],"ref":"https://www.ibm.com/topics/transformer-model","domain":"llm-architecture"},{"id":"LA-003","type":"single","difficulty":"easy","stem":"What does tokenisation do?","choices":["Encrypts the text before training","Splits raw text into the discrete units the model actually consumes, then maps them to integer ids","Removes stop words","Translates text into English"],"answer":[1],"explanation":"A model cannot consume characters directly: tokenisation segments text into units — words, subwords or characters — and maps each to an id in the vocabulary. Every downstream length, cost and context-window calculation is measured in these units, not in words.","tags":["tokenisation","preprocessing","fundamentals"],"ref":"https://huggingface.co/docs/transformers/tokenizer_summary","domain":"llm-architecture"},{"id":"LA-004","type":"multi","difficulty":"medium","stem":"Which TWO statements about subword tokenisation are correct?","choices":["It lets the model represent a word it has never seen by composing known pieces","It keeps the vocabulary far smaller than one entry per word would require","It guarantees one token per word","It removes the need for an unknown-token symbol in every design"],"answer":[0,1],"explanation":"Subword schemes such as WordPiece and byte-pair encoding split rare words into familiar fragments, which handles unseen vocabulary and keeps the embedding table manageable. A common word may be one token while a rare one becomes several, so the one-token-per-word assumption is exactly what subword tokenisation abandons.","tags":["subword","bpe","wordpiece","vocabulary"],"ref":"https://huggingface.co/docs/transformers/tokenizer_summary","domain":"llm-architecture"},{"id":"LA-005","type":"single","difficulty":"medium","stem":"You tokenise the same sentence with BertTokenizer and with XLNetTokenizer and get different token counts. Why?","choices":["One of them is faulty","Each tokenizer implements a different algorithm and carries its own vocabulary, so the segmentation differs","The sentence contains an error","Token counts depend on the GPU"],"answer":[1],"explanation":"A tokenizer is part of the model it was trained with: BERT uses WordPiece, XLNet uses SentencePiece with a different vocabulary and special tokens. That is why you must always pair a model with its own tokenizer — using another model's tokenizer produces ids that mean something else entirely.","tags":["tokenizers","bert","xlnet","model-pairing"],"ref":"https://huggingface.co/docs/transformers/tokenizer_summary","domain":"llm-architecture"},{"id":"LA-006","type":"single","difficulty":"medium","stem":"In PyTorch, what is the role of a Dataset compared with a DataLoader?","choices":["Dataset defines how to access one example; DataLoader handles batching, shuffling and parallel loading over it","Dataset trains the model; DataLoader evaluates it","They are interchangeable","DataLoader stores the data and Dataset iterates it"],"answer":[0],"explanation":"A Dataset implements __len__ and __getitem__, answering 'how many items are there and how do I fetch item i'. A DataLoader wraps it to produce batches, optionally shuffled and loaded by worker processes. Separating the two keeps data access independent of how it is fed to training.","tags":["pytorch","dataset","dataloader","data-pipeline"],"ref":"https://pytorch.org/docs/stable/data.html","domain":"llm-architecture"},{"id":"LA-007","type":"single","difficulty":"hard","stem":"Your NLP batches contain sequences of different lengths and stacking them fails. What is the standard fix?","choices":["Truncate every sequence to the shortest in the dataset","Supply a custom collate function to the DataLoader that pads sequences in each batch to a common length","Set batch size to one","Sort the dataset alphabetically"],"answer":[1],"explanation":"A collate function decides how a list of individual samples becomes one batched tensor, and for variable-length text that means padding to the longest item in that batch. Padding per batch rather than across the dataset wastes far less compute. Truncating to the shortest destroys data and batch size one abandons throughput.","tags":["collate-fn","padding","dataloader","variable-length"],"ref":"https://pytorch.org/docs/stable/data.html","domain":"llm-architecture"},{"id":"LA-008","type":"single","difficulty":"medium","stem":"Why is an attention mask passed alongside padded input ids?","choices":["To tell the model which positions are real tokens and which are padding, so padding does not influence the result","To hide the labels during training","To mask out the most frequent words","To reduce the vocabulary size"],"answer":[0],"explanation":"Padding tokens exist only to square off the tensor and carry no meaning. The attention mask marks them so attention skips them; without it the model attends to padding and the output depends on batch composition, which is a subtle and hard-to-trace bug.","tags":["attention-mask","padding","batching"],"ref":"https://huggingface.co/docs/transformers/glossary","domain":"llm-architecture"},{"id":"LA-009","type":"multi","difficulty":"medium","stem":"Which TWO properties make a training corpus suitable for a language model?","choices":["Diversity across domains, registers and sources rather than one narrow slice","Cleanliness: deduplicated, with boilerplate and corrupted text removed","Being as large as possible regardless of quality","Containing only text from a single author for consistency"],"answer":[0,1],"explanation":"Diversity determines what the model can generalise to, and cleanliness determines how much of its capacity is spent modelling noise; duplicates in particular cause memorisation. Scale matters but does not redeem bad data, and a single-source corpus produces a model that reproduces one voice and little else.","tags":["data-quality","diversity","deduplication","corpus"],"ref":"https://www.ibm.com/topics/large-language-models","domain":"llm-architecture"},{"id":"LA-010","type":"single","difficulty":"medium","stem":"What does NLTK provide that a model-specific tokenizer such as BertTokenizer does not?","choices":["Faster GPU tokenisation","General linguistic tooling — word and sentence segmentation, stemming, stop-word lists — independent of any particular model","A larger vocabulary","Support for subword units"],"answer":[1],"explanation":"NLTK and spaCy are general NLP toolkits offering linguistically motivated processing useful for analysis and classical pipelines. A model tokenizer exists to produce exactly the ids its model was trained on. They serve different purposes, and only the latter is correct for feeding a transformer.","tags":["nltk","spacy","tokenisation","tooling"],"ref":"https://www.nltk.org/","domain":"llm-architecture"},{"id":"LA-011","type":"single","difficulty":"hard","stem":"A dataset of 100,000 documents is loaded into memory as one list of strings before training, and the job runs out of memory. What is the idiomatic PyTorch remedy?","choices":["Reduce the batch size","Implement a Dataset that reads each document from disk in __getitem__, so only the batches in flight are resident","Use a larger machine","Convert the strings to bytes"],"answer":[1],"explanation":"The Dataset abstraction exists precisely so data can be fetched lazily per item; combined with DataLoader workers this streams from disk and keeps memory proportional to batch size rather than corpus size. Reducing batch size does not help when the whole corpus is already resident before training begins.","tags":["dataset","lazy-loading","memory","pytorch"],"ref":"https://pytorch.org/docs/stable/data.html","domain":"llm-architecture"},{"id":"LA-012","type":"single","difficulty":"medium","stem":"What is a context window?","choices":["The time limit for a request","The maximum number of tokens the model can attend to in one forward pass, covering prompt and generated output together","The number of documents retrieved","The size of the training corpus"],"answer":[1],"explanation":"The context window bounds the total token count the model can process at once, shared between input and output. Exceeding it forces truncation, which is why long-document work needs chunking, summarisation or retrieval rather than simply sending more text.","tags":["context-window","tokens","limits"],"ref":"https://www.ibm.com/topics/large-language-models","domain":"llm-architecture"},{"id":"LA-013","type":"single","difficulty":"medium","stem":"Why might you choose a smaller model over a larger one for a production task?","choices":["Smaller models are always more accurate","Latency, memory and cost scale with size, and a smaller model that meets the quality bar for a narrow task is cheaper to serve","Smaller models cannot be fine-tuned","Larger models cannot run on GPUs"],"answer":[1],"explanation":"Model size is a cost decision as much as a quality one. If a small model, possibly fine-tuned, clears the quality bar for a bounded task, it serves faster and cheaper at scale. The engineering question is not which model is best but which is sufficient.","tags":["model-selection","cost","latency","sizing"],"ref":"https://www.ibm.com/topics/large-language-models","domain":"llm-architecture"},{"id":"LA-014","type":"single","difficulty":"medium","stem":"Why is deduplication an important step when preparing a pretraining corpus?","choices":["It reduces disk cost only","Repeated passages are memorised rather than generalised from, which wastes capacity and increases the chance the model reproduces training text verbatim","It improves tokenizer speed","It balances the class labels"],"answer":[1],"explanation":"Duplicated text is effectively upweighted, pushing the model toward memorisation of those exact passages. That wastes capacity and creates a privacy and copyright exposure when the model regurgitates them. Deduplication is one of the highest-value cleaning steps in corpus preparation.","tags":["deduplication","corpus","data-quality","memorisation"],"ref":"https://www.ibm.com/topics/large-language-models","domain":"llm-architecture"},{"id":"LA-015","type":"single","difficulty":"medium","stem":"A corpus is assembled entirely from one technical forum. What is the likely consequence for the resulting model?","choices":["It will generalise well to all domains","It will reproduce that community's register, assumptions and blind spots, and perform poorly outside them","It will train faster with no downside","It will have a smaller vocabulary but equal capability"],"answer":[1],"explanation":"A model can only generalise across the variation its corpus contains. A single-source corpus teaches one register and one set of assumptions, so the model transfers poorly and inherits whatever biases that community holds. Diversity across domains and registers is what buys breadth.","tags":["diversity","corpus","data-quality","bias"],"ref":"https://www.ibm.com/topics/large-language-models","domain":"llm-architecture"},{"id":"LA-016","type":"multi","difficulty":"hard","stem":"Which TWO checks would you run over a scraped corpus before training on it?","choices":["Remove boilerplate such as navigation, cookie banners and repeated headers","Filter for language and quality so the corpus is not dominated by machine-generated or corrupted text","Sort documents alphabetically","Truncate every document to the same length"],"answer":[0,1],"explanation":"Scraped text arrives wrapped in template furniture and mixed with low-quality or generated content, both of which the model would otherwise learn to imitate. Sorting changes nothing about content, and truncating to a uniform length destroys documents rather than cleaning them.","tags":["corpus","data-quality","cleaning","diversity"],"ref":"https://www.ibm.com/topics/large-language-models","domain":"llm-architecture"},{"id":"NF-001","type":"single","difficulty":"easy","stem":"What is the main weakness of one-hot encoding for representing words?","choices":["It cannot represent more than 1,000 words","Every word is equidistant from every other, so it encodes no similarity, and the vectors are as long as the vocabulary","It requires a GPU","It cannot be used with neural networks"],"answer":[1],"explanation":"One-hot vectors are orthogonal by construction: 'cat' is exactly as far from 'dog' as from 'parliament'. They also grow with the vocabulary, producing enormous sparse inputs. Both problems are what dense embeddings were introduced to solve.","tags":["one-hot","sparsity","word-representation"],"ref":"https://www.ibm.com/topics/natural-language-processing","domain":"nlp-foundations"},{"id":"NF-002","type":"single","difficulty":"medium","stem":"What does a bag-of-words representation discard?","choices":["The identity of the words","Word order and syntax, keeping only which words occur and how often","The document length","The vocabulary"],"answer":[1],"explanation":"Bag of words records counts and throws away sequence, so 'the dog bit the man' and 'the man bit the dog' are identical. That makes it fast and surprisingly effective for topic-level tasks, and useless where order carries the meaning.","tags":["bag-of-words","word-order","representation"],"ref":"https://www.ibm.com/topics/natural-language-processing","domain":"nlp-foundations"},{"id":"NF-003","type":"single","difficulty":"medium","stem":"What property do word embeddings have that one-hot vectors lack?","choices":["They are longer","Semantically related words occupy nearby positions in a continuous vector space","They are binary","They require no training"],"answer":[1],"explanation":"Embeddings are learned dense vectors in which distance reflects distributional similarity, so related words cluster. That geometry is what lets a model generalise from a word it saw in training to a related word it did not.","tags":["embeddings","semantic-similarity","representation"],"ref":"https://www.ibm.com/topics/word-embeddings","domain":"nlp-foundations"},{"id":"NF-004","type":"single","difficulty":"medium","stem":"What distinguishes the skip-gram and CBOW variants of word2vec?","choices":["Skip-gram predicts context words from a target word; CBOW predicts the target word from its context","Skip-gram is supervised and CBOW is not","CBOW handles subwords and skip-gram does not","They differ only in vector size"],"answer":[0],"explanation":"The two invert the same prediction task. Skip-gram, predicting context from a target, gives more training signal per occurrence and tends to work better for rare words; CBOW predicts the target from surrounding words and trains faster. Both learn embeddings as a side effect of the task.","tags":["word2vec","skip-gram","cbow","training-objective"],"ref":"https://www.ibm.com/topics/word-embeddings","domain":"nlp-foundations"},{"id":"NF-005","type":"single","difficulty":"medium","stem":"In PyTorch, what does nn.EmbeddingBag do that nn.Embedding does not?","choices":["It supports larger vocabularies","It looks up and aggregates a bag of embeddings in one operation, avoiding materialising the intermediate per-token tensor","It trains without gradients","It normalises the vectors"],"answer":[1],"explanation":"EmbeddingBag fuses lookup and reduction — mean, sum or max — over a sequence of indices. For bag-style models it is faster and more memory-efficient than an Embedding followed by a separate aggregation, because the per-token tensor is never built.","tags":["embeddingbag","pytorch","efficiency"],"ref":"https://pytorch.org/docs/stable/generated/torch.nn.EmbeddingBag.html","domain":"nlp-foundations"},{"id":"NF-006","type":"single","difficulty":"medium","stem":"What does an N-gram language model estimate?","choices":["The probability of the next word given the previous N-1 words","The number of distinct words in a document","The sentiment of a sentence","The translation of a phrase"],"answer":[0],"explanation":"An N-gram model makes a Markov assumption: the next word depends only on a fixed window of preceding words. That makes it easy to estimate by counting, and fundamentally unable to capture dependencies longer than the window — the limitation neural language models address.","tags":["n-gram","language-model","markov-assumption"],"ref":"https://www.ibm.com/topics/natural-language-processing","domain":"nlp-foundations"},{"id":"NF-007","type":"multi","difficulty":"hard","stem":"Which TWO problems limit recurrent neural networks on long sequences?","choices":["Gradients vanish or explode as they are propagated back through many time steps","Computation is inherently sequential, so time steps cannot be parallelised during training","They cannot represent word embeddings","They require labelled data at every time step"],"answer":[0,1],"explanation":"Both limits motivated the transformer. Long gradient paths make distant dependencies hard to learn, and the recurrence forces step-by-step computation that no amount of hardware can parallelise. Attention replaces recurrence with a direct connection between all positions, computed in parallel.","tags":["rnn","vanishing-gradient","sequential-computation","limitations"],"ref":"https://www.ibm.com/topics/recurrent-neural-networks","domain":"nlp-foundations"},{"id":"NF-008","type":"single","difficulty":"medium","stem":"How do LSTM and GRU cells improve on a plain RNN?","choices":["They remove the recurrence entirely","They add gating that controls what is kept, forgotten and output, giving gradients a shorter path across time","They process sequences in parallel","They eliminate the need for embeddings"],"answer":[1],"explanation":"Gates let the cell carry information across many steps without repeatedly multiplying it, which mitigates vanishing gradients. They ease the memory problem but keep the sequential bottleneck, so they remain slower to train than attention-based models.","tags":["lstm","gru","gating","rnn"],"ref":"https://www.ibm.com/topics/recurrent-neural-networks","domain":"nlp-foundations"},{"id":"NF-009","type":"single","difficulty":"medium","stem":"In a sequence-to-sequence model, what does the encoder produce?","choices":["The output sequence directly","A representation of the input sequence that the decoder conditions on when generating output","The loss value","The vocabulary"],"answer":[1],"explanation":"The encoder compresses the source into a representation; the decoder generates the target one token at a time, conditioned on that representation and on what it has already produced. Forcing everything through a single fixed vector was the bottleneck that attention removed.","tags":["seq2seq","encoder","decoder","architecture"],"ref":"https://www.ibm.com/topics/transformer-model","domain":"nlp-foundations"},{"id":"NF-010","type":"single","difficulty":"hard","stem":"What is teacher forcing during sequence model training?","choices":["Training on a teacher model's outputs instead of real data","Feeding the ground-truth previous token as input at each step rather than the model's own prediction","Freezing the encoder while training the decoder","Using a larger learning rate early in training"],"answer":[1],"explanation":"Teacher forcing keeps training on the correct trajectory and converges much faster, but it creates exposure bias: at inference the model must consume its own outputs, including its mistakes, a condition it never trained under. Training on a teacher model's outputs is knowledge distillation, a different technique.","tags":["teacher-forcing","exposure-bias","training","seq2seq"],"ref":"https://www.ibm.com/topics/recurrent-neural-networks","domain":"nlp-foundations"},{"id":"NF-011","type":"single","difficulty":"medium","stem":"What does perplexity measure for a language model?","choices":["How fast the model generates text","How surprised the model is by the held-out text — lower perplexity means it assigned higher probability to what actually occurred","How many parameters it has","How diverse its outputs are"],"answer":[1],"explanation":"Perplexity is the exponentiated average negative log-likelihood of held-out text, interpretable as the effective number of equally likely choices at each step. It measures modelling of the distribution, not usefulness — a low-perplexity model can still be unhelpful or untruthful.","tags":["perplexity","evaluation","language-model"],"ref":"https://www.ibm.com/topics/large-language-models","domain":"nlp-foundations"},{"id":"NF-012","type":"single","difficulty":"medium","stem":"What does BLEU score compare?","choices":["Model size against accuracy","N-gram overlap between generated text and one or more reference texts","Training loss against validation loss","Token count against latency"],"answer":[1],"explanation":"BLEU measures precision of overlapping n-grams against references, with a brevity penalty. It was designed for machine translation and rewards surface agreement, so it penalises a correct paraphrase that uses different words — a known weakness for open-ended generation.","tags":["bleu","evaluation","n-gram-overlap","translation"],"ref":"https://www.ibm.com/topics/natural-language-processing","domain":"nlp-foundations"},{"id":"NF-013","type":"single","difficulty":"hard","stem":"Why can BLEU and ROUGE be misleading for evaluating a summarisation model?","choices":["They only work on translation","They reward surface overlap with the reference, so a faithful summary phrased differently scores poorly while a fluent but inaccurate one reusing reference wording can score well","They require a GPU","They cannot handle documents over 1,000 words"],"answer":[1],"explanation":"Both metrics are proxies for agreement with a reference, not for correctness or usefulness. A valid summary that paraphrases is punished, and copying reference vocabulary is rewarded regardless of meaning. That gap is why semantic metrics and human or model-based judgement supplement them.","tags":["rouge","bleu","metric-limitations","summarisation"],"ref":"https://www.ibm.com/topics/natural-language-processing","domain":"nlp-foundations"},{"id":"NF-014","type":"single","difficulty":"medium","stem":"What is the purpose of a softmax layer at the output of a language model?","choices":["To reduce the vocabulary","To convert raw scores over the vocabulary into a probability distribution summing to one","To mask padding tokens","To compute the gradient"],"answer":[1],"explanation":"Softmax exponentiates and normalises the logits so they can be read as probabilities over the next token, which is what sampling and cross-entropy loss both require. Temperature acts by scaling the logits before this step.","tags":["softmax","output-layer","probability"],"ref":"https://www.ibm.com/topics/neural-networks","domain":"nlp-foundations"},{"id":"NF-015","type":"single","difficulty":"medium","stem":"What loss function is standard for training a language model to predict the next token?","choices":["Mean squared error","Cross-entropy loss between the predicted distribution and the actual next token","Hinge loss","Cosine similarity"],"answer":[1],"explanation":"Next-token prediction is classification over the vocabulary, so cross-entropy is the natural loss: it penalises assigning low probability to the token that actually occurred. Mean squared error suits regression, and hinge loss suits margin-based classifiers.","tags":["cross-entropy","loss-function","training"],"ref":"https://pytorch.org/docs/stable/generated/torch.nn.CrossEntropyLoss.html","domain":"nlp-foundations"},{"id":"NF-016","type":"multi","difficulty":"medium","stem":"Which TWO are true of pretrained embeddings such as word2vec or GloVe compared with contextual embeddings from BERT?","choices":["They assign one fixed vector per word regardless of the sentence it appears in","They cannot distinguish the two senses of a word like 'bank'","They are computed fresh for each occurrence","They require the whole sentence as input"],"answer":[0,1],"explanation":"Static embeddings are a lookup table: one vector per word type, so every sense collapses into a single point. Contextual models compute a different vector for each occurrence based on surrounding text, which is precisely what resolves polysemy.","tags":["static-embeddings","contextual-embeddings","polysemy","word2vec"],"ref":"https://www.ibm.com/topics/word-embeddings","domain":"nlp-foundations"},{"id":"NF-017","type":"single","difficulty":"hard","stem":"A classifier trained on embeddings performs well on common words and poorly on rare ones. What is the likely cause?","choices":["The learning rate is too low","Rare words have few occurrences, so their embeddings are poorly estimated; subword representations or pooling with frequent neighbours help","The model has too many layers","The batch size is too large"],"answer":[1],"explanation":"An embedding is learned from the contexts a word appears in, so words seen a handful of times get vectors little better than noise. Subword units let rare words inherit meaning from familiar fragments, which is one reason modern tokenisers are subword-based.","tags":["rare-words","embedding-quality","subword","diagnosis"],"ref":"https://huggingface.co/docs/transformers/tokenizer_summary","domain":"nlp-foundations"},{"id":"NF-018","type":"single","difficulty":"medium","stem":"What does it mean that a language model is autoregressive?","choices":["It regresses to the mean of the training data","It generates each token conditioned on the tokens it has already produced","It trains on its own outputs","It predicts all tokens simultaneously"],"answer":[1],"explanation":"Autoregressive generation feeds each produced token back as input for the next, which is why output is inherently sequential and why generating N tokens costs roughly N forward passes. Training on one's own outputs is a separate idea, and simultaneous prediction describes non-autoregressive models.","tags":["autoregressive","generation","decoding"],"ref":"https://www.ibm.com/topics/large-language-models","domain":"nlp-foundations"},{"id":"NF-019","type":"single","difficulty":"medium","stem":"Why is a validation set used during training rather than only at the end?","choices":["To increase the training data","To detect the point at which the model begins to overfit, so training can stop or hyperparameters be adjusted","To compute the gradients","To shuffle the data"],"answer":[1],"explanation":"Watching held-out loss during training reveals the divergence point where training loss keeps falling while validation loss rises — the signature of memorisation. Early stopping uses exactly this signal. Gradients come only from the training set.","tags":["validation","early-stopping","overfitting","training"],"ref":"https://www.ibm.com/topics/overfitting","domain":"nlp-foundations"},{"id":"NF-020","type":"single","difficulty":"hard","stem":"Beam search with a wide beam sometimes produces worse translations than a narrow beam. What explains this?","choices":["Wider beams are computationally unstable","Wider search finds higher-probability sequences, and very high-probability output under the model tends toward short, generic text — the model's objective and output quality are not perfectly aligned","The beam width must equal the batch size","Wider beams overflow the context window"],"answer":[1],"explanation":"Beam search optimises sequence likelihood, and searching harder finds more of what the model considers likely — which for trained sequence models skews short and bland. Length normalisation and coverage penalties exist to counteract it. It is a clean illustration of a proxy objective diverging from the goal.","tags":["beam-search","decoding","objective-mismatch","translation"],"ref":"https://www.ibm.com/topics/natural-language-processing","domain":"nlp-foundations"},{"id":"PE-001","type":"multi","difficulty":"easy","stem":"Which TWO elements most reliably improve a prompt according to the course's best practices?","choices":["Stating the task clearly and specifically rather than vaguely","Giving the model the context it needs, including the audience and desired format","Making the prompt as short as possible","Asking several unrelated questions at once"],"answer":[0,1],"explanation":"Clarity and sufficient context are the two levers that consistently improve output. Brevity is not a virtue in itself — an under-specified short prompt performs worse than a longer precise one — and bundling unrelated questions splits the model's attention and produces shallow answers to each.","tags":["prompt-basics","clarity","context","best-practices"],"ref":"https://www.ibm.com/topics/prompt-engineering","domain":"prompt-engineering"},{"id":"PE-002","type":"single","difficulty":"easy","stem":"What is zero-shot prompting?","choices":["Asking the model to perform a task with no worked examples in the prompt","Prompting with exactly one example","Prompting a model that has never been trained","Prompting without any instructions"],"answer":[0],"explanation":"Zero-shot means no demonstrations of the task are provided — the instruction alone must carry it. It relies entirely on what the model learned during training, which is why it works well for common tasks and poorly for unusual formats.","tags":["zero-shot","definitions","in-context-learning"],"ref":"https://www.ibm.com/topics/prompt-engineering","domain":"prompt-engineering"},{"id":"PE-003","type":"single","difficulty":"medium","stem":"You need output in an unusual structure that is awkward to describe in words. Which technique fits best?","choices":["Zero-shot with a longer description","Few-shot prompting with two or three worked examples of the exact structure","Raising the temperature","Chain-of-thought prompting"],"answer":[1],"explanation":"Demonstration communicates format far more reliably than description; the model pattern-matches the shape of the examples. Chain-of-thought helps reasoning rather than formatting, and higher temperature works against structural consistency.","tags":["few-shot","formatting","demonstrations"],"ref":"https://www.ibm.com/topics/prompt-engineering","domain":"prompt-engineering"},{"id":"PE-004","type":"single","difficulty":"medium","stem":"What does chain-of-thought prompting ask the model to do, and when does it help most?","choices":["Produce intermediate reasoning steps before the answer; it helps most on multi-step problems such as arithmetic and logic","Produce several answers and pick one; it helps on factual recall","Break the prompt into multiple API calls; it helps with latency","Cite its sources; it helps with grounding"],"answer":[0],"explanation":"Chain-of-thought elicits explicit intermediate steps, which improves accuracy where the answer depends on a sequence of deductions. On single-step factual recall it adds tokens without benefit. Producing several answers and voting is self-consistency, a related but distinct technique.","tags":["chain-of-thought","reasoning","multi-step"],"ref":"https://www.ibm.com/topics/prompt-engineering","domain":"prompt-engineering"},{"id":"PE-005","type":"single","difficulty":"medium","stem":"What is self-consistency in prompting?","choices":["Making sure the prompt does not contradict itself","Sampling several reasoning paths at non-zero temperature and taking the most common final answer","Reusing the same prompt template across a team","Checking the answer against a knowledge base"],"answer":[1],"explanation":"Self-consistency marginalises over diverse reasoning paths: sample several chains, then take the majority answer. It improves accuracy on problems with a single correct answer, at a cost proportional to the number of samples. It requires comparable answers, so it suits closed-form rather than open-ended output.","tags":["self-consistency","majority-vote","sampling"],"ref":"https://www.ibm.com/topics/prompt-engineering","domain":"prompt-engineering"},{"id":"PE-006","type":"single","difficulty":"medium","stem":"In the interview-pattern prompt, who asks the questions?","choices":["The user asks the model a series of questions","The model asks the user questions to gather what it needs before producing the output","A second model interrogates the first","Questions are drawn from a fixed list"],"answer":[1],"explanation":"The interview pattern inverts the usual direction: the model elicits the requirements by questioning the user, then produces the result once it has enough. It suits tasks where the user knows what they want but not what the model needs to know — requirements gathering, travel planning, specification drafting.","tags":["interview-pattern","prompt-patterns","elicitation"],"ref":"https://www.ibm.com/topics/prompt-engineering","domain":"prompt-engineering"},{"id":"PE-007","type":"single","difficulty":"medium","stem":"What does a persona prompt do?","choices":["Assigns the model a role or point of view to shape its tone, vocabulary and framing","Gives the model access to the user's profile data","Restricts the model to a single language","Reduces the token cost"],"answer":[0],"explanation":"Assigning a role — a tax specialist, a primary-school teacher, a code reviewer — conditions the register, depth and vocabulary of the response. It shapes how the model answers, not what it knows; a persona confers no expertise the model lacks and is not a substitute for grounding.","tags":["persona","prompt-patterns","tone"],"ref":"https://www.ibm.com/topics/prompt-engineering","domain":"prompt-engineering"},{"id":"PE-008","type":"single","difficulty":"hard","stem":"A prompt reliably produces good answers on short inputs but degrades on long documents. What is the most likely reason?","choices":["The model's weights differ for long inputs","Key instructions sit far from the content they govern and compete with the intervening text for attention; restating the constraints near the end helps","The tokeniser fails on long text","Longer prompts are always truncated"],"answer":[1],"explanation":"Attention to content in the middle of a long context degrades, so an instruction given once at the top loses force over a long document. Repeating the critical constraints close to the point of use, or processing the document in sections, restores reliability. Weights and tokenisation do not vary with length.","tags":["long-context","instruction-placement","attention"],"ref":"https://www.ibm.com/topics/prompt-engineering","domain":"prompt-engineering"},{"id":"PE-009","type":"multi","difficulty":"medium","stem":"Which TWO practices make prompts maintainable in a production application?","choices":["Keep prompts in version control as templates with named variables rather than inline concatenated strings","Track which prompt version produced which output so a regression can be traced","Make every prompt as long as possible for completeness","Let each developer keep a personal variant"],"answer":[0,1],"explanation":"Prompts are production behaviour and deserve the same discipline as code: versioned templates with explicit parameters, and traceability from output back to the exact prompt. Personal variants make behaviour unreproducible, and length for its own sake adds cost and dilutes instructions.","tags":["prompt-templates","versioning","production","maintainability"],"ref":"https://www.ibm.com/topics/prompt-engineering","domain":"prompt-engineering"},{"id":"PE-010","type":"single","difficulty":"medium","stem":"Which prompt is better specified?","choices":["'Write about our product.'","'Write a 120-word product description for our noise-cancelling headphones, aimed at commuters, emphasising battery life and comfort, in a plain and factual tone.'","'Write a great product description.'","'Product description please, make it good.'"],"answer":[1],"explanation":"The strong prompt fixes every dimension that would otherwise be guessed: length, subject, audience, what to emphasise, and register. Words like 'great' and 'good' carry no instruction because they name a judgement rather than a property the model can act on.","tags":["specificity","prompt-anatomy","audience","constraints"],"ref":"https://www.ibm.com/topics/prompt-engineering","domain":"prompt-engineering"},{"id":"PE-011","type":"single","difficulty":"hard","stem":"You want the model to avoid a behaviour. Which phrasing tends to work better?","choices":["A negative instruction such as 'do not be verbose'","A positive instruction stating what to do instead, such as 'answer in at most three sentences'","Repeating the negative instruction several times","Putting the negative instruction in capitals"],"answer":[1],"explanation":"Positive, checkable instructions give the model a target to hit, whereas a prohibition describes a region to avoid without saying where to go. 'At most three sentences' is verifiable and unambiguous; 'not verbose' is neither. Repetition and capitalisation add tokens without adding precision.","tags":["positive-instructions","constraints","phrasing"],"ref":"https://www.ibm.com/topics/prompt-engineering","domain":"prompt-engineering"},{"id":"PE-012","type":"single","difficulty":"medium","stem":"What is the purpose of a delimiter such as triple backticks or XML-style tags in a prompt?","choices":["To make the prompt look tidy","To mark clearly where user-supplied or retrieved content begins and ends, separating it from your instructions","To reduce token count","To force the model to output markdown"],"answer":[1],"explanation":"Delimiters establish a boundary between the instructions you control and content you do not. That matters for correctness — the model knows which text is the subject rather than a command — and for safety, since it is the first structural defence against instructions embedded in supplied content.","tags":["delimiters","prompt-structure","injection"],"ref":"https://www.ibm.com/topics/prompt-engineering","domain":"prompt-engineering"},{"id":"PE-013","type":"single","difficulty":"medium","stem":"What does the temperature parameter control?","choices":["How long the response will be","How sharply the sampling distribution is peaked: lower values concentrate probability on the likeliest tokens, higher values flatten it","How many tokens the prompt may contain","Which model version is used"],"answer":[1],"explanation":"Temperature rescales the logits before sampling. Low values make output more deterministic and conventional, which suits extraction and structured tasks; higher values increase variety, which suits ideation. It affects the choice among tokens, not the length or the model.","tags":["temperature","sampling","decoding-parameters"],"ref":"https://www.ibm.com/topics/prompt-engineering","domain":"prompt-engineering"},{"id":"PE-014","type":"single","difficulty":"hard","stem":"A summarisation prompt occasionally invents details not present in the source. Which prompt-level change most reduces this?","choices":["Increase temperature to encourage creativity","Instruct the model to use only information present in the supplied text and to say when something is not stated","Make the prompt shorter","Ask for a longer summary"],"answer":[1],"explanation":"Explicitly restricting the model to the provided text and giving it a sanctioned way to report absence removes the pressure to fill gaps with plausible invention. This is a prompt-level mitigation, not a guarantee — verification against the source remains necessary — but it measurably reduces fabrication.","ta
