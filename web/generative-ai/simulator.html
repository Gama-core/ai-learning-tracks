<title>Generative AI Console</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  /* Gama Core design tokens */
  --ground:#FFFFFF; --surface:#F4F6FA; --surface-2:#EAEDF4; --raise:#FFFFFF; --sunk:#E1E6F0;
  --ink:#12172B; --ink-2:#39415C; --muted:#565F78; --faint:#8890A6;
  --line:rgba(18,23,43,0.10); --line-2:rgba(18,23,43,0.20);
  --red:#C5184B; --red-dim:#EFB8C7; --red-wash:#FBEDF1;
  --accent:#1D98D6; --accent-soft:#E2F1FA;
  --pass:#12805C; --pass-bg:#E3F3ED;
  --warn:#B9740C; --warn-bg:#FBF0DF; --ochre:#B9740C;
  --fail:#C5184B; --fail-bg:#FBEDF1;
  --glow:rgba(29,152,214,0.10);
  --shadow:0 1px 2px rgba(18,23,43,.05), 0 10px 30px -18px rgba(18,23,43,.22);
  --display:"Space Grotesk","Helvetica Neue",Arial,sans-serif;
  --sans:"Inter","Helvetica Neue",Arial,sans-serif;
  --read:"Inter","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:3px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0D1120; --surface:#151B2E; --surface-2:#1D2440; --raise:#1D2440; --sunk:#0A0E1A;
    --ink:#E9EDF8; --ink-2:#C2C9DC; --muted:#A3ABC4; --faint:#6E7895;
    --line:rgba(233,237,248,0.10); --line-2:rgba(233,237,248,0.22);
    --red:#FF2E63; --red-dim:#7C3050; --red-wash:#2A1020;
    --accent:#4FB8F0; --accent-soft:#12283C;
    --pass:#3FBF8F; --pass-bg:#0E2A22;
    --warn:#E0A33C; --warn-bg:#2C2113; --ochre:#E0A33C;
    --fail:#FF2E63; --fail-bg:#2A1020;
    --glow:rgba(79,184,240,0.12);
    --shadow:0 1px 2px rgba(0,0,0,.45), 0 12px 32px -18px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --ground:#0D1120; --surface:#151B2E; --surface-2:#1D2440; --raise:#1D2440; --sunk:#0A0E1A;
  --ink:#E9EDF8; --ink-2:#C2C9DC; --muted:#A3ABC4; --faint:#6E7895;
  --line:rgba(233,237,248,0.10); --line-2:rgba(233,237,248,0.22);
  --red:#FF2E63; --red-dim:#7C3050; --red-wash:#2A1020;
  --accent:#4FB8F0; --accent-soft:#12283C;
  --pass:#3FBF8F; --pass-bg:#0E2A22;
  --warn:#E0A33C; --warn-bg:#2C2113; --ochre:#E0A33C;
  --fail:#FF2E63; --fail-bg:#2A1020;
  --glow:rgba(79,184,240,0.12);
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 12px 32px -18px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{margin:0; font-family:var(--display); font-weight:600; letter-spacing:-.015em; text-wrap:balance}
p{margin:0}
button{font:inherit; color:inherit; cursor:pointer; border:0; background:none}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:2px}
.mono{font-family:var(--mono); font-variant-numeric:tabular-nums}
.eyebrow{
  font-family:var(--mono); font-size:10.5px; font-weight:600; letter-spacing:.16em;
  text-transform:uppercase; color:var(--red);
}

/* ---------- shell ---------- */
.topbar{
  position:sticky; top:env(safe-area-inset-top, 0px); z-index:20;
  background:var(--ground);
  background:color-mix(in srgb, var(--ground) 88%, transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.topbar-in{
  max-width:1180px; margin:0 auto; padding:12px 20px;
  display:flex; align-items:center; gap:18px; flex-wrap:wrap;
}
.brand{
  display:flex; align-items:center; gap:11px; margin-right:auto; min-width:0;
  text-decoration:none; color:inherit;
}
.brand:hover .name b{color:var(--red)}
.brand svg{width:32px; height:32px; flex:0 0 32px; display:block}
.brand .name{display:flex; flex-direction:column; line-height:1.15; min-width:0}
.brand .name b{font-family:var(--display); font-size:15px; font-weight:600; letter-spacing:-.02em; transition:color .15s}
.brand .name span{
  font-family:var(--mono); font-size:9.5px; font-weight:500; letter-spacing:.15em;
  text-transform:uppercase; color:var(--muted); white-space:nowrap;
}
.code{
  font-family:var(--mono); font-size:10.5px; font-weight:600; color:var(--red);
  border:1px solid var(--red); padding:2px 7px; border-radius:2px; letter-spacing:.06em;
}
@media (max-width:560px){ .brand .name span{display:none} }
.tabs{display:flex; gap:2px; flex-wrap:wrap}
.tab{
  font-family:var(--mono); font-size:11px; font-weight:500; letter-spacing:.09em;
  text-transform:uppercase; padding:6px 11px; border-radius:var(--r); color:var(--muted);
  transition:color .15s, background .15s; min-height:32px;
}
@media (max-width:640px){
  .tab{min-height:40px; padding:11px 12px; font-size:11.5px}
  .tabs{gap:1px; width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch}
  .btn{min-height:42px; padding:11px 16px}
  .choice{padding:14px 14px}
  .navcell{min-height:36px}
}
.tab:hover{color:var(--ink); background:var(--surface)}
.tab[aria-current="true"]{color:var(--ink); background:var(--surface); box-shadow:inset 0 0 0 1px var(--line-2)}

.wrap{max-width:1180px; margin:0 auto; padding:22px 20px 64px; overflow-x:clip}
/* align-items:start would size the rail's grid area to the panel's own height,
   leaving position:sticky with no travel. Stretch gives it the full row. */
.cols{display:grid; grid-template-columns:302px minmax(0,1fr); gap:26px; align-items:stretch}
.cols > *{min-width:0}
@media (max-width:900px){ .cols{grid-template-columns:1fr; gap:18px} }

.panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--r)}
.panel-hd{padding:13px 16px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px}
.panel-bd{padding:16px}

/* ---------- readiness rail ---------- */
.rail{position:sticky; top:calc(env(safe-area-inset-top, 0px) + 62px)}
@media (max-width:900px){ .rail{position:static} }

.gauge{padding:16px; border-bottom:1px solid var(--line)}
.gauge-val{display:flex; align-items:baseline; gap:8px; margin:6px 0 10px}
.gauge-val b{font-family:var(--mono); font-size:38px; font-weight:600; text-transform:uppercase; letter-spacing:-.03em; line-height:1}
.gauge-val span{font-family:var(--mono); font-size:11px; color:var(--muted)}
.meter{height:9px; background:var(--sunk); border-radius:1px; position:relative; overflow:hidden}
.meter i{display:block; height:100%; background:var(--accent)}
.meter::after{
  content:""; position:absolute; inset:0; pointer-events:none;
  background:repeating-linear-gradient(90deg, transparent 0 calc(10% - 1px), var(--surface) calc(10% - 1px) 10%);
}
.meter.pass i{background:var(--pass)} .meter.warn i{background:var(--warn)} .meter.fail i{background:var(--fail)}
.gauge-note{margin-top:8px; font-size:12px; color:var(--muted); line-height:1.4}

.doms{list-style:none; margin:0; padding:6px 0}
.dom{display:block; width:100%; text-align:left; padding:8px 16px; border-radius:0}
.dom:hover{background:var(--surface-2)}
.dom-top{display:flex; align-items:baseline; gap:8px}
.dom-wt{font-family:var(--mono); font-size:11px; font-weight:700; color:var(--accent); min-width:26px}
.dom-nm{font-family:var(--display); font-size:12.5px; font-weight:500; line-height:1.3; flex:1; letter-spacing:-.01em}
.dom-sc{font-family:var(--mono); font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums}
.dom .meter{height:5px; margin-top:5px; margin-left:34px}

/* ---------- home ---------- */
.hero{padding:26px 24px 24px; position:relative; overflow:hidden}
.hero::before{
  content:""; position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(60% 52% at 50% 0%, var(--glow), transparent 72%);
}
.hero > *{position:relative}
.hero h1{
  font-family:var(--display); font-weight:600;
  font-size:clamp(27px,3.6vw,40px); line-height:1.06; letter-spacing:-.015em; max-width:21ch;
}
.hero p{margin-top:14px; font-size:16px; line-height:1.6; color:var(--muted); max-width:62ch}
.facts{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(112px,1fr));
  border-top:1px solid var(--line);
}
.fact{padding:12px 16px; border-right:1px solid var(--line)}
.fact:last-child{border-right:0}
.fact b{display:block; font-family:var(--mono); font-size:19px; font-weight:600; margin-top:4px; letter-spacing:-.02em; color:var(--ink)}
.fact small{font-family:var(--mono); font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint)}

.modes{display:grid; grid-template-columns:repeat(auto-fit,minmax(224px,1fr)); gap:12px; margin-top:18px}
.mode{
  background:var(--raise); border:1px solid var(--line); border-radius:var(--r);
  padding:16px 17px; text-align:left; display:flex; flex-direction:column; gap:6px;
  transition:border-color .18s, transform .18s, box-shadow .18s;
}
.mode:hover{border-color:var(--line-2); transform:translateY(-1px); box-shadow:var(--shadow)}
.mode.primary{background:var(--red); color:#FFFFFF; border-color:var(--red)}
.mode.primary .mode-sub, .mode.primary .mode-meta{color:rgba(255,255,255,.82)}
.mode.primary:hover{box-shadow:0 10px 26px -12px var(--red)}
.mode-nm{font-family:var(--display); font-size:16px; font-weight:600; letter-spacing:-.015em}
.mode-sub{font-size:12.5px; color:var(--muted); line-height:1.4}
.mode-meta{font-family:var(--mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; opacity:.8}
.mode:disabled{opacity:.45; cursor:not-allowed; transform:none; border-color:var(--line)}

.history{margin-top:18px}
.htable{width:100%; border-collapse:collapse; font-family:var(--mono); font-size:12px}
.htable th{
  text-align:left; font-size:10px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--muted); font-weight:700; padding:0 10px 6px; border-bottom:1px solid var(--line);
}
.htable td{padding:7px 10px; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums}
.htable tr:last-child td{border-bottom:0}
.pill{
  font-family:var(--mono); font-size:10px; font-weight:700; letter-spacing:.08em;
  text-transform:uppercase; padding:2px 6px; border-radius:2px;
}
.pill.pass{background:var(--pass-bg); color:var(--pass)}
.pill.fail{background:var(--fail-bg); color:var(--fail)}

/* ---------- quiz ---------- */
.qhead{display:flex; align-items:center; gap:14px; flex-wrap:wrap}
.qhead .eyebrow{white-space:nowrap}
.clock{
  margin-left:auto; font-family:var(--mono); font-size:15px; font-weight:700;
  font-variant-numeric:tabular-nums; letter-spacing:.02em;
}
.clock.low{color:var(--fail)}
.qprog{height:2px; background:var(--sunk)}
.qprog i{display:block; height:100%; background:var(--accent); transition:width .25s}
.stem{font-family:var(--read); font-size:17.5px; line-height:1.52; margin:4px 0 4px; max-width:66ch}
.stem-multi{margin-top:10px; font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--ochre)}
.choices{display:flex; flex-direction:column; gap:8px; margin-top:16px}
.choice{
  display:flex; gap:12px; align-items:flex-start; text-align:left;
  padding:12px 14px; border:1px solid var(--line); border-radius:var(--r);
  background:var(--raise); transition:border-color .14s, background .14s;
}
.choice:hover:not(:disabled){border-color:var(--line-2); background:var(--surface-2)}
.choice-k{
  font-family:var(--mono); font-size:12px; font-weight:700; line-height:1.55;
  width:20px; height:20px; flex:0 0 20px; display:grid; place-items:center;
  border:1px solid var(--line-2); border-radius:2px; margin-top:1px; color:var(--muted);
}
.choice-t{font-family:var(--read); font-size:15.5px; line-height:1.45}
.choice[aria-pressed="true"]{border-color:var(--accent); background:var(--accent-soft)}
.choice[aria-pressed="true"] .choice-k{background:var(--accent); border-color:var(--accent); color:var(--surface)}
.choice.right{border-color:var(--pass); background:var(--pass-bg)}
.choice.right .choice-k{background:var(--pass); border-color:var(--pass); color:var(--surface)}
.choice.wrong{border-color:var(--fail); background:var(--fail-bg)}
.choice.wrong .choice-k{background:var(--fail); border-color:var(--fail); color:var(--surface)}
.choice:disabled{cursor:default}

.verdict{margin-top:18px; border-top:1px solid var(--line); padding-top:14px}
.verdict-hd{display:flex; align-items:center; gap:10px; font-weight:800; font-size:14px}
.verdict-hd.ok{color:var(--pass)} .verdict-hd.no{color:var(--fail)}
.expl{font-family:var(--read); font-size:15.5px; line-height:1.55; margin-top:9px; color:var(--ink-2); max-width:68ch}
.qmeta{margin-top:12px; display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.tagchip{font-family:var(--mono); font-size:10px; color:var(--muted); border:1px solid var(--line); padding:1px 5px; border-radius:2px}
.reflink{font-family:var(--mono); font-size:11px; color:var(--accent); text-decoration:none; border-bottom:1px solid var(--accent-soft)}
.reflink:hover{border-bottom-color:var(--accent)}

.qbar{display:flex; gap:8px; align-items:center; padding:13px 16px; border-top:1px solid var(--line); flex-wrap:wrap}
.btn{
  font-family:var(--sans); font-size:13px; font-weight:600; letter-spacing:0;
  text-transform:none; padding:9px 16px; border-radius:var(--r);
  border:1px solid var(--line-2); background:var(--raise); color:var(--ink);
  transition:all .18s ease;
}
.btn:hover:not(:disabled){border-color:var(--ink); background:var(--surface-2)}
.btn:disabled{opacity:.4; cursor:not-allowed}
.btn.go{background:var(--red); color:#FFFFFF; border-color:var(--red)}
.btn.go:hover:not(:disabled){background:var(--red); border-color:var(--red); box-shadow:0 8px 20px -10px var(--red)}
.btn.flag[aria-pressed="true"]{background:var(--warn-bg); border-color:var(--warn); color:var(--warn)}
.spacer{margin-left:auto}

/* navigator */
.navgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(31px,1fr)); gap:4px; padding:14px 16px}
.navcell{
  font-family:var(--mono); font-size:11px; font-weight:500; aspect-ratio:1;
  border:1px solid var(--line); border-radius:2px; background:var(--surface-2);
  display:grid; place-items:center; position:relative; color:var(--muted);
}
.navcell.done{background:var(--accent-soft); border-color:var(--accent); color:var(--ink)}
.navcell.flag::after{
  content:""; position:absolute; top:-1px; right:-1px; width:6px; height:6px;
  background:var(--warn); border-radius:0 2px 0 100%;
}
.navcell.here{outline:2px solid var(--ink); outline-offset:1px; color:var(--ink); font-weight:700}
.navkey{display:flex; gap:12px; flex-wrap:wrap; padding:0 16px 14px; font-family:var(--mono); font-size:10px; color:var(--muted)}
.navkey i{display:inline-block; width:9px; height:9px; border:1px solid var(--line); margin-right:4px; vertical-align:-1px}
.navkey i.d{background:var(--accent-soft); border-color:var(--accent)}
.navkey i.f{background:var(--warn)}

/* ---------- report ---------- */
.score{display:flex; align-items:flex-end; gap:20px; flex-wrap:wrap; padding:20px 22px}
.score-n{font-family:var(--mono); font-size:56px; font-weight:600; line-height:.9; letter-spacing:-.04em}
.score-side{display:flex; flex-direction:column; gap:3px; padding-bottom:4px}
.dtable{width:100%; border-collapse:collapse}
.dtable th{
  text-align:left; font-family:var(--mono); font-size:10px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--muted); font-weight:700;
  padding:0 12px 7px; border-bottom:1px solid var(--line);
}
.dtable td{padding:9px 12px; border-bottom:1px solid var(--line); vertical-align:middle}
.dtable tr:last-child td{border-bottom:0}
.dtable .nm{font-family:var(--display); font-size:13.5px; font-weight:500; letter-spacing:-.01em}
.dtable .num{font-family:var(--mono); font-size:12px; font-variant-numeric:tabular-nums; white-space:nowrap}
.dtable td.mt{width:38%; min-width:120px}
.missed{list-style:none; margin:0; padding:0; display:flex; flex-direction:column}
.missed li{border-bottom:1px solid var(--line)}
.missed li:last-child{border-bottom:0}
.missed button{display:flex; gap:12px; width:100%; text-align:left; padding:11px 16px; align-items:baseline}
.missed button:hover{background:var(--surface-2)}
.missed .id{font-family:var(--mono); font-size:11px; font-weight:700; color:var(--fail); flex:0 0 58px}
.missed .tx{font-family:var(--read); font-size:14px; line-height:1.4; color:var(--ink-2)}
.next{padding:4px 0}
.next-item{padding:12px 16px; border-bottom:1px solid var(--line)}
.next-item:last-child{border-bottom:0}
.next-hd{display:flex; align-items:baseline; gap:9px}
.next-hd b{font-size:13.5px; font-weight:700}
.next-hd .mono{font-size:11px; color:var(--muted)}
.next-sc{font-family:var(--read); font-size:13.5px; color:var(--ink-2); margin-top:4px; line-height:1.45}

/* ---------- cram ---------- */
.cram-dom{border-bottom:1px solid var(--line)}
.cram-dom:last-child{border-bottom:0}
.cram-hd{display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:13px 16px}
.cram-hd:hover{background:var(--surface-2)}
.cram-hd b{font-size:14px; font-weight:700; flex:1}
.cram-body{padding:0 16px 16px; display:flex; flex-direction:column; gap:18px}
.cram-q{border-left:2px solid var(--line); padding-left:14px}
.cram-q .id{font-family:var(--mono); font-size:10.5px; font-weight:700; color:var(--muted); letter-spacing:.06em}
.cram-q .qs{font-family:var(--read); font-size:15px; line-height:1.45; margin-top:4px}
.cram-q .ans{font-family:var(--read); font-size:14.5px; line-height:1.45; margin-top:8px; color:var(--pass); font-weight:600}
.cram-q .ex{font-family:var(--read); font-size:14px; line-height:1.5; margin-top:6px; color:var(--muted)}

/* concepts */
.cx{list-style:none; margin:0; padding:0}
.cx li{border-bottom:1px solid var(--line); padding:12px 16px}
.cx li:last-child{border-bottom:0}
.cx .hd{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
.cx .nm{font-family:var(--display); font-size:14px; font-weight:600; letter-spacing:-.01em}
.cx .sc{font-family:var(--mono); font-size:11px; font-variant-numeric:tabular-nums; color:var(--muted)}
.cx .sm{font-family:var(--read); font-size:13.5px; color:var(--ink-2); line-height:1.45; margin-top:4px; max-width:74ch}
.cx .acts{display:flex; gap:7px; margin-top:9px; flex-wrap:wrap}
.cx .meter{margin-top:8px; max-width:200px}
.btn.sm{font-size:10.5px; padding:5px 9px}
/* case scenario + flashcards */
.scenario{
  border-left:2px solid var(--accent); background:var(--accent-soft);
  padding:13px 16px; margin-bottom:16px; border-radius:0 var(--r) var(--r) 0;
}
.scenario .tag{
  font-family:var(--mono); font-size:9.5px; font-weight:600; letter-spacing:.14em;
  text-transform:uppercase; color:var(--accent); display:block; margin-bottom:6px;
}
.scenario p{font-family:var(--read); font-size:14.5px; line-height:1.5; color:var(--ink)}
.caselist{list-style:none; margin:0; padding:0}
.caselist li{border-bottom:1px solid var(--line)}
.caselist li:last-child{border-bottom:0}
.caselist button{display:block; width:100%; text-align:left; padding:13px 16px}
.caselist button:hover{background:var(--surface-2)}
.caselist .t{display:flex; align-items:baseline; gap:10px}
.caselist .t b{font-family:var(--display); font-size:14.5px; font-weight:600; letter-spacing:-.01em}
.caselist .sc{font-family:var(--read); font-size:13.5px; color:var(--muted); line-height:1.45; margin-top:4px; max-width:78ch}
.card{padding:30px 22px; text-align:center; min-height:190px; display:flex; flex-direction:column; justify-content:center; gap:14px}
.card .col{font-family:var(--mono); font-size:10px; letter-spacing:.11em; text-transform:uppercase; color:var(--muted)}
.card .pr{font-family:var(--display); font-weight:500; font-size:22px; line-height:1.3; max-width:44ch; margin:0 auto; text-wrap:balance; letter-spacing:-.01em}
.card .an{font-family:var(--read); font-size:17px; line-height:1.45; color:var(--pass); max-width:52ch; margin:0 auto; border-top:1px solid var(--line); padding-top:14px}
.due-pill{font-family:var(--mono); font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; padding:2px 6px; border-radius:2px; background:var(--accent-soft); color:var(--accent)}
/* cheat sheets */
.cheat-sec{scroll-margin-top:84px}
.cheat-hd{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap}
.cheat-hd h2{font-family:var(--display); font-weight:600; font-size:20px; letter-spacing:-.02em}
.cheat-kicker{font-family:var(--read); font-size:13.5px; color:var(--muted)}
.cheat-bd{padding:4px 0 16px; display:flex; flex-direction:column; gap:16px}
.tblwrap{overflow-x:auto; min-width:0; max-width:100%; border:1px solid var(--line); border-radius:var(--r)}
table.cs{width:100%; border-collapse:collapse; min-width:420px}
table.cs th{
  text-align:left; font-family:var(--mono); font-size:9.5px; letter-spacing:.11em;
  text-transform:uppercase; color:var(--muted); font-weight:700;
  padding:8px 12px; background:var(--surface-2); border-bottom:1px solid var(--line); white-space:nowrap;
}
table.cs td{padding:9px 12px; border-bottom:1px solid var(--line); font-size:13.5px; line-height:1.45; vertical-align:top}
table.cs tr:last-child td{border-bottom:0}
table.cs td:first-child{font-weight:600; letter-spacing:-.005em}
table.cs td:not(:first-child){font-family:var(--read); font-size:14px; color:var(--ink-2)}
table.cs.three td:nth-child(2){font-weight:600; font-family:var(--sans); font-size:13.5px; color:var(--ink); white-space:nowrap}
ul.cs{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:9px}
ul.cs li{
  font-family:var(--read); font-size:14.5px; line-height:1.5; color:var(--ink-2);
  padding-left:17px; position:relative; max-width:76ch;
}
ul.cs li::before{content:""; position:absolute; left:2px; top:.62em; width:5px; height:5px; background:var(--accent); border-radius:50%}
.cs-note{
  font-family:var(--read); font-size:14.5px; line-height:1.55; padding:12px 15px;
  border-left:2px solid var(--accent); background:var(--accent-soft); color:var(--ink);
  max-width:78ch; border-radius:0 var(--r) var(--r) 0;
}
.toc{list-style:none; margin:0; padding:6px 0}
.toc a{display:flex; gap:9px; align-items:baseline; padding:8px 16px; text-decoration:none; color:inherit; font-size:12.5px; font-weight:600; letter-spacing:-.005em; min-width:0}
.toc a > span:last-child{min-width:0; overflow-wrap:anywhere}
.toc a:hover{background:var(--surface-2); color:var(--accent)}
.toc .n{font-family:var(--mono); font-size:10px; color:var(--muted); min-width:16px}
.printbtn{margin-left:auto}
@media print{
  .topbar,#rail,.printbtn{display:none !important}
  .wrap{max-width:none; padding:0}
  .cols{display:block}
  .panel{border:0; box-shadow:none; break-inside:auto}
  .cheat-sec{break-inside:avoid-page}
  table.cs{min-width:0; font-size:10pt}
  body{background:#fff; color:#000}
}
.links{list-style:none; margin:0; padding:0}
.links li{border-bottom:1px solid var(--line)}
.links li:last-child{border-bottom:0}
.links a.row{display:flex; gap:14px; align-items:baseline; padding:12px 16px; text-decoration:none; color:inherit}
.links a.row:hover{background:var(--surface-2)}
.links a.row:hover .lk-nm{color:var(--accent)}
.lk-nm{font-family:var(--display); font-size:14px; font-weight:600; letter-spacing:-.01em; flex:0 0 auto}
.lk-sub{font-family:var(--read); font-size:13.5px; color:var(--ink-2); line-height:1.45; flex:1; min-width:0}
.lk-tag{font-family:var(--mono); font-size:9.5px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); border:1px solid var(--line); padding:1px 5px; border-radius:2px; white-space:nowrap}
.lk-note{font-family:var(--read); font-size:13.5px; color:var(--muted); line-height:1.5; padding:13px 16px 0; max-width:70ch; overflow-wrap:anywhere}
@media (max-width:560px){ .links a.row{flex-wrap:wrap; gap:6px} .lk-sub{flex:1 1 100%} }
.foot{margin-top:26px; font-family:var(--mono); font-size:11px; color:var(--muted); line-height:1.7}
.foot a{color:var(--accent); text-decoration:none; border-bottom:1px solid var(--accent-soft)}
@media (max-width:640px){ .foot a{display:inline-block; padding:6px 0} }
.sync{font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.sync b{color:var(--accent); font-weight:700}
.empty{padding:26px 16px; text-align:center; font-family:var(--read); font-size:15px; color:var(--muted)}
@media (prefers-reduced-motion:reduce){ *{transition:none !important; animation:none !important} }
@media (max-width:560px){
  .wrap{padding:16px 14px 52px}
  .stem{font-size:16.5px} .choice-t{font-size:15px}
  .score-n{font-size:44px}
  .dtable td.mt{display:none} .dtable th.mt{display:none}
}

/* eslint-disable */
const DATA = {"track":{"id":"generative-ai","name":"Generative AI Engineering","tagline":"From prompting through transformers and fine-tuning to RAG","target_pct":80,"assessment_minutes":90,"assessment_min":50,"assessment_max":60,"weights_note":"This certificate publishes no exam blueprint — it is 16 courses, not one exam. Topic weights here are each course's share of the covered hours.","scope_note":"Covers the 10 generative-AI courses (1-3 and 10-16), 91 of the certificate's 168 hours. The Python, Flask, Pandas, scikit-learn and Keras block (courses 4-9) is excluded: it teaches library work that multiple choice tests poorly.","facts":[{"label":"Topic areas","value":"10"},{"label":"Target","value":"80%"},{"label":"Also preps","value":"IBM cert"}],"ui":{"page_title":"Generative AI Console","eyebrow":"Learning track · Generative AI","hero_title":"From a prompt to a fine-tuned, retrieval-grounded system.","hero_body":"Prompt engineering, tokenisation and data pipelines, transformer internals, fine-tuning and alignment, RAG and agents. {N} questions across ten topic areas, each with the reasoning and a primary source.","assessment_name":"Timed assessment","readiness_label":"Weighted readiness","assessment_sub":"Weighted by course hours, no feedback until you submit. A cumulative self-check the certificate itself never gives you.","footer_note":"No published exam blueprint exists: this is 16 courses, not one exam. Weights are each course's share of the 91 covered hours. The 80% target is this tool's own bar — Coursera quizzes are retakeable and typically pass at 70-80%."},"certification":{"name":"IBM Generative AI Engineering Professional Certificate","code":"IBM-GENAI","source":"https://www.coursera.org/professional-certificates/ibm-generative-ai-engineering","format":"16 self-paced Coursera courses with retakeable per-course quizzes and a capstone","price_usd":49,"alignment":"The ten topic areas map to the ten generative-AI courses of IBM's certificate (1–3 and 10–16), weighted by each course's share of the 91 covered hours. The Python, Flask, Pandas, scikit-learn and Keras block is out of scope here."}},"domains":[{"id":"intro-ai","name":"Introduction to Artificial Intelligence","course":1,"hours":13,"weight":14,"prefix":"IA","scope":"What AI is and is not, machine learning vs deep learning vs generative AI, supervised and unsupervised learning, use cases across industries, AI ethics and bias, the AI project lifecycle, and IBM watsonx positioning."},{"id":"genai-intro","name":"Generative AI: Introduction and Applications","course":2,"hours":8,"weight":9,"prefix":"GA","scope":"Generative vs discriminative models, capabilities across text, image, audio, code and data, common generative architectures, real-world applications by sector, and the tool landscape."},{"id":"prompt-engineering","name":"Prompt Engineering Basics","course":3,"hours":10,"weight":11,"prefix":"PE","scope":"Prompt anatomy and best practices, zero-shot and few-shot prompting, chain-of-thought, self-consistency, interview-pattern and persona prompting, and prompt engineering tools."},{"id":"llm-architecture","name":"LLM Architecture and Data Preparation","course":10,"hours":6,"weight":7,"prefix":"LA","scope":"Generative architectures (GANs, VAEs, diffusion, transformers), GPT vs BERT, tokenization with NLTK, spaCy, BertTokenizer and XLNetTokenizer, PyTorch Dataset and DataLoader, custom collate functions, and data quality for training."},{"id":"nlp-foundations","name":"Foundational Models for NLP and Language Understanding","course":11,"hours":10,"weight":11,"prefix":"NF","scope":"One-hot encoding, bag of words, embeddings and embedding bags, word2vec, N-gram and sequence-to-sequence language models, RNNs and their limits, encoder-decoder models with PyTorch, and evaluation metrics for generated text."},{"id":"transformers","name":"Language Modeling with Transformers","course":12,"hours":9,"weight":10,"prefix":"TR","scope":"Positional encoding, attention and scaled dot-product self-attention, multi-head attention, encoder stacks for classification, decoder stacks and causal language modeling, BERT pretraining via masked language modeling and next sentence prediction, and translation."},{"id":"finetuning","name":"Engineering and Fine-Tuning Transformers","course":13,"hours":8,"weight":9,"prefix":"FT","scope":"Hugging Face pipelines, tokenizers, models and Trainer, full fine-tuning versus feature extraction, adapting pretrained models to downstream tasks in PyTorch, parameter-efficient methods including LoRA, and when each is appropriate."},{"id":"advanced-finetuning","name":"Advanced Fine-Tuning for LLMs","course":14,"hours":9,"weight":10,"prefix":"AF","scope":"Instruction tuning, reward modelling and reward trainers, LLMs as probabilistic policies, RLHF, proximal policy optimization and its configuration, and direct preference optimization with its partition-function reasoning."},{"id":"rag-langchain","name":"AI Agents with RAG and LangChain","course":15,"hours":9,"weight":10,"prefix":"RL","scope":"What distinguishes an agent, tool calling, the RAG process end to end, dense passage retrieval with context and question encoders, FAISS similarity search, and LangChain components: chat models, prompt templates, example selectors, output parsers, document loaders, retrievers, chains and agents."},{"id":"capstone","name":"Project: Applications with RAG and LangChain","course":16,"hours":9,"weight":9,"prefix":"PJ","scope":"Loading and splitting documents, configuring a vector store, embedding documents, building a retriever, wiring a QA chain, and putting a Gradio interface in front of it. Integration decisions rather than new theory."}],"questions":[{"id":"AF-001","type":"single","difficulty":"medium","stem":"What distinguishes instruction tuning from ordinary supervised fine-tuning on a single task?","choices":["It uses reinforcement learning","It trains on many tasks phrased as instructions with their responses, teaching the model to follow instructions in general rather than to perform one task","It requires no labelled data","It only adjusts the embedding layer"],"answer":[1],"explanation":"Instruction tuning generalises the objective: by training across a broad mixture of instruction-response pairs, the model learns the behaviour of following instructions, which then transfers to instructions it has never seen. Single-task fine-tuning produces a specialist instead. It is still supervised learning, not RL.","tags":["instruction-tuning","generalisation","sft"],"ref":"https://www.ibm.com/topics/fine-tuning","domain":"advanced-finetuning"},{"id":"AF-002","type":"single","difficulty":"medium","stem":"What does a reward model learn to do?","choices":["Generate better responses directly","Score a response so that its output correlates with human preference, providing a signal that can be optimised against","Classify prompts by topic","Compress the base model"],"answer":[1],"explanation":"A reward model is a scorer, typically trained on pairs where a human marked one response better than another. It converts sparse, expensive human judgement into a cheap differentiable signal that an optimiser can consult millions of times. It never generates anything itself.","tags":["reward-model","preferences","rlhf","scoring"],"ref":"https://huggingface.co/docs/trl/reward_trainer","domain":"advanced-finetuning"},{"id":"AF-003","type":"single","difficulty":"hard","stem":"Reward models are usually trained on pairwise comparisons rather than absolute scores. Why?","choices":["Pairwise data is cheaper to store","Humans judge 'which of these two is better' far more consistently than they assign an absolute number, so the labels are less noisy","Absolute scores cannot be used in a loss function","Pairwise comparison requires no annotators"],"answer":[1],"explanation":"Absolute ratings drift between annotators and within one annotator over time, so a 7 from one person is not a 7 from another. Relative comparisons are stable and are what the standard ranking loss consumes. It is a measurement decision, not a storage one.","tags":["pairwise-preference","annotation","label-noise","reward-model"],"ref":"https://huggingface.co/docs/trl/reward_trainer","domain":"advanced-finetuning"},{"id":"AF-004","type":"single","difficulty":"medium","stem":"In what sense is a language model treated as a policy in RLHF?","choices":["It enforces content policy rules","Its conditional distribution over next tokens is the policy: given a state (the context) it assigns probabilities to actions (tokens)","It stores the training policy in its weights","It governs which users may call it"],"answer":[1],"explanation":"Framing generation as sequential decision-making is what lets reinforcement learning apply: context is state, the next token is an action, and the model's distribution is the policy to be improved. The reward arrives at the end of a generated sequence.","tags":["policy","rlhf","reinforcement-learning","framing"],"ref":"https://huggingface.co/docs/trl/ppo_trainer","domain":"advanced-finetuning"},{"id":"AF-005","type":"single","difficulty":"medium","stem":"What are the three stages of a classic RLHF pipeline, in order?","choices":["Reward modelling, supervised fine-tuning, then PPO","Supervised fine-tuning on demonstrations, reward-model training on preference comparisons, then policy optimisation against the reward model","PPO, supervised fine-tuning, then evaluation","Pretraining, quantisation, then deployment"],"answer":[1],"explanation":"SFT first gives a model that already responds sensibly, which makes the samples used for preference collection worth comparing. The reward model is then fit to those comparisons, and finally RL optimises the policy against it. Reversing the first two stages would mean collecting preferences over incoherent output.","tags":["rlhf","pipeline","sft","ordering"],"ref":"https://huggingface.co/docs/trl/ppo_trainer","domain":"advanced-finetuning"},{"id":"AF-006","type":"single","difficulty":"hard","stem":"Why does PPO include a KL penalty against the reference (pre-RL) model?","choices":["To speed up convergence","To keep the policy from drifting far from the original distribution, which would let it exploit the reward model and produce degenerate high-scoring text","To reduce GPU memory","To normalise the reward scale"],"answer":[1],"explanation":"The reward model is an imperfect proxy, and an unconstrained policy will find inputs that score highly while being useless — the classic reward-hacking failure. Penalising divergence from the reference keeps the policy in the region where the reward model was trained and remains meaningful.","tags":["ppo","kl-penalty","reward-hacking","reference-model"],"ref":"https://huggingface.co/docs/trl/ppo_trainer","domain":"advanced-finetuning"},{"id":"AF-007","type":"single","difficulty":"hard","stem":"What does the 'proximal' in proximal policy optimization refer to?","choices":["The proximity of the reward model to the policy model in memory","Constraining each update so the new policy stays close to the previous one, via a clipped objective, which keeps training stable","Training on nearby tokens only","The distance between training and inference hardware"],"answer":[1],"explanation":"Policy-gradient methods can take a catastrophically large step from a lucky batch. PPO clips the probability ratio between new and old policies so no single update moves the policy far, trading some sample efficiency for much greater stability.","tags":["ppo","clipping","stability","policy-gradient"],"ref":"https://huggingface.co/docs/trl/ppo_trainer","domain":"advanced-finetuning"},{"id":"AF-008","type":"multi","difficulty":"medium","stem":"Which TWO components must be held in memory during a PPO run, beyond the policy being trained?","choices":["The reward model, to score generated responses","The frozen reference model, to compute the KL penalty","The original pretraining corpus","The tokenizer of a different model family"],"answer":[0,1],"explanation":"PPO's memory cost is a common surprise: the trainable policy, a frozen reference for the KL term, and the reward model must all be resident, often alongside a value head. That multiplied footprint is a large part of why DPO became attractive.","tags":["ppo","memory","reference-model","reward-model"],"ref":"https://huggingface.co/docs/trl/ppo_trainer","domain":"advanced-finetuning"},{"id":"AF-009","type":"single","difficulty":"hard","stem":"What is the central claim of direct preference optimization (DPO)?","choices":["Preferences can be learned without any human data","The RLHF objective can be reparameterised so the optimal policy is obtained directly from preference pairs with a simple classification-style loss, removing the separate reward model and the RL loop","PPO is mathematically invalid","Preferences must be converted to absolute scores first"],"answer":[1],"explanation":"DPO shows the reward model is implicit in the policy itself under the standard RLHF formulation, so the preference data can update the policy directly. That removes reward-model training, sampling and the RL machinery, leaving a stable supervised-style objective over the same human data.","tags":["dpo","reparameterisation","simplification","alignment"],"ref":"https://arxiv.org/abs/2305.18290","domain":"advanced-finetuning"},{"id":"AF-010","type":"single","difficulty":"hard","stem":"Why does the partition function matter in the derivation of DPO?","choices":["It sets the learning rate","It is the intractable normalising constant of the optimal policy, and the derivation cancels it by working with the ratio between chosen and rejected responses","It counts the training partitions","It determines the batch size"],"answer":[1],"explanation":"The optimal RLHF policy has a closed form containing a normalising constant that cannot be computed. Because the loss compares a chosen response against a rejected one for the same prompt, that constant appears in both terms and cancels — which is exactly what makes the objective tractable.","tags":["partition-function","dpo","derivation","normalisation"],"ref":"https://arxiv.org/abs/2305.18290","domain":"advanced-finetuning"},{"id":"AF-011","type":"multi","difficulty":"medium","stem":"Which TWO are practical advantages of DPO over PPO-based RLHF?","choices":["No separate reward model needs to be trained and held in memory","Training is more stable, being a supervised-style objective rather than an RL loop with sampling","It needs less preference data than PPO","It guarantees better final quality in every case"],"answer":[0,1],"explanation":"The operational gains are real: fewer models resident, no rollout sampling, and far fewer things to go wrong. Both methods consume the same preference pairs, and which yields better final quality is task-dependent rather than settled.","tags":["dpo","ppo","comparison","stability"],"ref":"https://arxiv.org/abs/2305.18290","domain":"advanced-finetuning"},{"id":"AF-012","type":"single","difficulty":"medium","stem":"In the course's sentiment-steering example, what role does a sentiment classifier play?","choices":["It replaces the language model","It acts as the reward function, scoring generated responses so the policy can be optimised toward the desired sentiment","It tokenises the input","It evaluates perplexity"],"answer":[1],"explanation":"Any function that scores a response can serve as a reward, and an off-the-shelf sentiment classifier is a convenient stand-in for a learned reward model when demonstrating the mechanics. It makes the reward concrete and inspectable while the RLHF loop stays identical.","tags":["reward-function","sentiment","rlhf","worked-example"],"ref":"https://huggingface.co/docs/trl/ppo_trainer","domain":"advanced-finetuning"},{"id":"AF-013","type":"single","difficulty":"hard","stem":"An RLHF-tuned model scores highly on the reward model but users find its answers evasive and padded. What is happening?","choices":["The learning rate was too low","Reward hacking: the policy has found features the reward model rewards that do not correspond to genuine quality","The tokenizer is mismatched","The KL penalty is too strong"],"answer":[1],"explanation":"A proxy optimised hard enough stops tracking the thing it proxied. Hedging and padding are classic artefacts because they are hard to mark wrong. The countermeasures are a stronger KL constraint, refreshing the reward model on new comparisons, and holding out human evaluation the optimiser never sees.","tags":["reward-hacking","proxy-objective","evaluation","rlhf"],"ref":"https://huggingface.co/docs/trl/ppo_trainer","domain":"advanced-finetuning"},{"id":"AF-014","type":"single","difficulty":"medium","stem":"Why is LoRA frequently combined with RLHF or DPO training?","choices":["It improves the reward model's accuracy","It cuts the trainable parameters and optimiser state dramatically, which matters when several large models must be resident at once","It removes the need for preference data","It makes the KL penalty unnecessary"],"answer":[1],"explanation":"Alignment training is memory-bound because policy, reference and reward models share the device. Training only low-rank adapters shrinks the optimiser state for the trainable part, often making the difference between fitting on available hardware and not.","tags":["lora","memory","rlhf","peft"],"ref":"https://huggingface.co/docs/peft/conceptual_guides/lora","domain":"advanced-finetuning"},{"id":"AF-015","type":"single","difficulty":"medium","stem":"What is the purpose of a held-out preference set during alignment training?","choices":["To increase the training signal","To measure whether improvements generalise rather than reflecting overfitting to the preference data the model was optimised on","To compute the KL penalty","To initialise the reward model"],"answer":[1],"explanation":"Both the reward model and the policy can overfit the comparisons they saw. A held-out split, never used for either, shows whether the alignment gains extend to new preferences. Without it, rising training reward is indistinguishable from memorisation.","tags":["held-out-set","overfitting","alignment","evaluation"],"ref":"https://huggingface.co/docs/trl/reward_trainer","domain":"advanced-finetuning"},{"id":"AF-016","type":"single","difficulty":"medium","stem":"What does the TRL library provide?","choices":["A tokenizer implementation","Trainers for the alignment stack — supervised fine-tuning, reward modelling, PPO and DPO — built on top of Transformers","A vector database","A dataset annotation interface"],"answer":[1],"explanation":"TRL supplies SFTTrainer, RewardTrainer, PPOTrainer and DPOTrainer, mirroring the stages of the alignment pipeline so each can be run without reimplementing the algorithm. It sits on Transformers and integrates with PEFT for adapter-based training.","tags":["trl","huggingface","tooling","alignment"],"ref":"https://huggingface.co/docs/trl/index","domain":"advanced-finetuning"},{"id":"AF-017","type":"single","difficulty":"hard","stem":"Which ordering of interventions is most cost-effective when a model's answers are unhelpful in a specific style?","choices":["Go straight to RLHF","Try prompting, then supervised fine-tuning on demonstrations, and only reach for preference-based alignment if the requirement is genuinely about preference between plausible answers","Start with DPO then fall back to prompting","Pretrain from scratch"],"answer":[1],"explanation":"Each step up the ladder costs more and is harder to reverse. Prompting is instant, SFT teaches a demonstrable target behaviour, and preference methods are for the case where you cannot write the right answer but can tell which of two is better. Matching the method to the shape of the problem is the whole skill.","tags":["intervention-ordering","cost","sft","preference-methods"],"ref":"https://www.ibm.com/topics/fine-tuning","domain":"advanced-finetuning"},{"id":"AF-018","type":"single","difficulty":"medium","stem":"Why is the reference model frozen during PPO rather than updated alongside the policy?","choices":["To save memory","Because it defines the fixed anchor the KL penalty measures against; if it moved with the policy, the constraint would permit unlimited cumulative drift","Because it has different weights initially","Because it is a smaller model"],"answer":[1],"explanation":"The KL term is only meaningful relative to a fixed distribution. A reference that tracked the policy would always find it close by, and the penalty would stop constraining anything as the policy wandered arbitrarily far from where it began.","tags":["reference-model","kl-penalty","ppo","drift"],"ref":"https://huggingface.co/docs/trl/ppo_trainer","domain":"advanced-finetuning"},{"id":"PJ-001","type":"single","difficulty":"medium","stem":"Your capstone must answer questions over a set of PDFs. What is the correct order of pipeline construction?","choices":["Build the QA chain, then load documents, then embed","Load the documents, split them into chunks, embed the chunks into a vector store, build a retriever over it, then wire the QA chain","Embed the query first, then load documents","Create the Gradio interface, then the retriever, then the loader"],"answer":[1],"explanation":"Each stage consumes the previous one's output: loaders produce Documents, splitters produce chunks, embeddings populate the store, the retriever queries it, and the chain composes retriever with model. Building the chain first leaves nothing for it to retrieve from.","tags":["pipeline-order","capstone","architecture"],"ref":"https://python.langchain.com/docs/tutorials/rag/","domain":"capstone"},{"id":"PJ-002","type":"single","difficulty":"medium","stem":"Which text splitter setting most often needs tuning when answers come back truncated mid-explanation?","choices":["The embedding dimension","Chunk size and chunk overlap","The number of retrieved documents only","The model temperature"],"answer":[1],"explanation":"Truncated answers usually mean the chunk boundary fell inside the passage that held the answer. Larger chunks keep explanations intact and overlap ensures material spanning a boundary appears whole in at least one chunk. Top-k affects how many chunks you get, not whether any one is complete.","tags":["text-splitter","chunk-size","overlap","capstone"],"ref":"https://python.langchain.com/docs/concepts/text_splitters/","domain":"capstone"},{"id":"PJ-003","type":"single","difficulty":"hard","stem":"You switch the embedding model to improve retrieval quality but keep the existing vector store. Results become nonsense. Why?","choices":["The new model is faulty","Existing vectors were produced by the old model and live in a different space, so query vectors from the new model are not comparable to them — the corpus must be re-embedded","The vector store needs more memory","The chunk size is now wrong"],"answer":[1],"explanation":"An index is expressed entirely in its embedding model's geometry. Mixing models compares coordinates from two unrelated spaces, so similarity is meaningless. Changing the embedding model always means rebuilding the index, which is why that choice is expensive to revisit later.","tags":["embedding-consistency","re-embedding","vector-store","capstone"],"ref":"https://www.ibm.com/topics/retrieval-augmented-generation","domain":"capstone"},{"id":"PJ-004","type":"single","difficulty":"medium","stem":"Why does a retriever typically expose a top-k parameter?","choices":["To limit the number of documents loaded from disk","To control how many passages are returned and therefore how much context enters the prompt, trading recall against noise and token cost","To set the embedding dimension","To limit the number of users"],"answer":[1],"explanation":"top-k balances two failure modes: too few and the answer may not be present, too many and the relevant passage is diluted among noise while prompt cost rises. Tuning it is one of the cheapest levers on RAG quality.","tags":["top-k","recall-precision","context-budget","retriever"],"ref":"https://python.langchain.com/docs/concepts/retrievers/","domain":"capstone"},{"id":"PJ-005","type":"multi","difficulty":"medium","stem":"Which TWO pieces of metadata are worth attaching to chunks during ingestion?","choices":["The source document and page or section, so answers can cite where they came from","A stable identifier, so a chunk can be updated or removed when the source changes","The current system time of ingestion only","The user who will eventually query it"],"answer":[0,1],"explanation":"Provenance makes citation and verification possible, and a stable id makes the index maintainable — you can delete or replace exactly what changed instead of rebuilding. Ingestion time alone supports neither, and the querying user is unknown at ingestion.","tags":["metadata","provenance","citations","maintenance"],"ref":"https://python.langchain.com/docs/concepts/document_loaders/","domain":"capstone"},{"id":"PJ-006","type":"single","difficulty":"medium","stem":"What does Gradio provide in the capstone project?","choices":["The vector database","A quick web interface layer so the QA chain can be exercised through a browser rather than a notebook cell","The embedding model","The document loader"],"answer":[1],"explanation":"Gradio builds a simple UI from a Python function, turning the chain into something a non-developer can use and demonstrate. It is presentation only — every retrieval and generation decision sits behind it and is unaffected by the interface.","tags":["gradio","interface","capstone","deployment"],"ref":"https://www.gradio.app/","domain":"capstone"},{"id":"PJ-007","type":"single","difficulty":"hard","stem":"Your QA bot answers confidently even when the retrieved passages do not contain the answer. Which change helps most?","choices":["Increase the temperature","Instruct the model to answer only from the supplied context and to say explicitly when the context does not contain the answer","Retrieve fewer documents","Use a longer prompt template"],"answer":[1],"explanation":"Without a sanctioned way to say 'not stated', the model fills the gap with plausible invention. Restricting it to the provided context and licensing an explicit non-answer removes that pressure. It is a mitigation rather than a guarantee, so verification of citations still matters.","tags":["grounding","hallucination","prompt-instructions","capstone"],"ref":"https://www.ibm.com/topics/ai-hallucinations","domain":"capstone"},{"id":"PJ-008","type":"single","difficulty":"medium","stem":"How should the QA chain handle a question entirely unrelated to the indexed documents?","choices":["Answer from the model's general knowledge without comment","Detect that retrieval returned nothing relevant and tell the user the question is outside the document set","Return the closest chunks regardless and answer from them","Raise an exception"],"answer":[1],"explanation":"Similarity search always returns its nearest neighbours, however far away they are, so low relevance must be handled explicitly by a score threshold or a grading step. Answering from parametric knowledge inside a system the user believes is document-grounded is the more damaging failure, because it is invisible.","tags":["out-of-scope","relevance-threshold","scope-handling","capstone"],"ref":"https://www.ibm.com/topics/retrieval-augmented-generation","domain":"capstone"},{"id":"PJ-009","type":"single","difficulty":"medium","stem":"Why split documents before embedding rather than embedding whole files?","choices":["Embedding models have input length limits, and a single vector for a long document averages away the specific passages that answer a question","Whole documents cannot be stored in a vector database","Splitting improves the embedding model's accuracy on short text","It reduces the number of vectors"],"answer":[0],"explanation":"Two reasons converge: encoders truncate beyond their maximum length, and a document-level vector is a blur of every topic it covers, so nothing matches precisely. Chunking gives retrievable units whose vectors represent one idea. It increases vector count, not reduces it.","tags":["chunking","rationale","embedding-limits","granularity"],"ref":"https://python.langchain.com/docs/concepts/text_splitters/","domain":"capstone"},{"id":"PJ-010","type":"single","difficulty":"hard","stem":"Retrieval quality is good but the final answers are poor. Where should you look?","choices":["The embedding model","The generation step: the prompt that assembles retrieved context, the instructions given, and the model chosen to answer","The document loader","The chunk overlap"],"answer":[1],"explanation":"Isolating the two halves is the core RAG debugging skill. If the passages shown to the model contain the answer, retrieval has done its job and the fault lies in how they are presented or in the model's use of them — context assembly, instructions, ordering, or generator capability.","tags":["debugging","retrieval-vs-generation","attribution","capstone"],"ref":"https://www.ibm.com/topics/retrieval-augmented-generation","domain":"capstone"},{"id":"PJ-011","type":"multi","difficulty":"medium","stem":"Which TWO would you check first if the application is slow to answer?","choices":["Whether the number of retrieved documents is larger than needed, inflating prompt size","Whether embeddings are being recomputed for documents on every request instead of being precomputed and stored","The colour of the interface","The file names of the source documents"],"answer":[0,1],"explanation":"Latency in a RAG application concentrates in prompt size, which is driven by top-k, and in work repeated that should have been done once. Re-embedding the corpus per request is the classic beginner error: indexing belongs offline, and only the query is embedded at request time.","tags":["latency","top-k","precomputation","performance"],"ref":"https://www.ibm.com/topics/retrieval-augmented-generation","domain":"capstone"},{"id":"PJ-012","type":"single","difficulty":"medium","stem":"What is the practical purpose of chunk overlap?","choices":["To increase the number of vectors for better recall statistics","So that content sitting across a boundary appears complete within at least one chunk","To reduce embedding cost","To make chunks uniform in length"],"answer":[1],"explanation":"Boundaries fall arbitrarily, and a sentence or short passage split across two chunks may be fully represented in neither. A modest overlap ensures it appears intact somewhere. Too much overlap inflates index size and returns near-duplicate results.","tags":["overlap","boundaries","chunking","recall"],"ref":"https://python.langchain.com/docs/concepts/text_splitters/","domain":"capstone"},{"id":"PJ-013","type":"single","difficulty":"hard","stem":"You must demonstrate the project works. What is the most convincing evidence?","choices":["A screenshot of the interface","A set of questions with known answers run through the system, showing the retrieved sources alongside each response so correctness and grounding can both be checked","The line count of the code","The size of the vector store"],"answer":[1],"explanation":"A worked evaluation set shows the system answers correctly and that its answers rest on the right sources — the two properties a RAG system must have. Screenshots demonstrate that it runs, which is a much weaker claim, and code size and index size measure nothing about quality.","tags":["evaluation","evidence","demonstration","capstone"],"ref":"https://www.ibm.com/topics/retrieval-augmented-generation","domain":"capstone"},{"id":"PJ-014","type":"single","difficulty":"medium","stem":"A colleague suggests fine-tuning the model on the documents instead of using retrieval. What is the strongest counter-argument for this project?","choices":["Fine-tuning always produces worse text","The documents change, and answers must cite sources; retrieval supports both by updating an index, while fine-tuning bakes knowledge into weights that cannot cite and need retraining to update","Fine-tuning cannot run on a GPU","Retrieval is faster to compute than a forward pass"],"answer":[1],"explanation":"Updatability and citability are the decisive properties for a document QA system. Knowledge in weights has no provenance and no update path short of retraining, whereas an index is edited in seconds and every answer can point at its source.","tags":["rag-vs-finetuning","citations","updatability","argument"],"ref":"https://www.ibm.com/topics/retrieval-augmented-generation","domain":"capstone"},{"id":"PJ-015","type":"single","difficulty":"medium","stem":"What should happen when a source document is deleted from the corpus?","choices":["Nothing; the index will refresh itself","Its chunks must be removed from the vector store, or the system will keep answering from content that no longer exists","The whole index must be rebuilt from scratch","Only the document loader needs updating"],"answer":[1],"explanation":"A vector store does not observe the filesystem. Without explicit deletion propagation, retired content keeps being retrieved and cited — a quiet correctness and sometimes compliance failure. Stable chunk ids make targeted removal possible without a full rebuild.","tags":["deletion-propagation","index-maintenance","freshness","capstone"],"ref":"https://python.langchain.com/docs/concepts/vectorstores/","domain":"capstone"},{"id":"PJ-016","type":"single","difficulty":"hard","stem":"Two chunks from different documents contradict each other and both are retrieved. What is the appropriate system behaviour?","choices":["Silently pick the higher-scoring chunk","Surface the conflict with both sources cited, or apply a documented precedence rule such as the most recent effective date","Refuse to answer","Average the two answers"],"answer":[1],"explanation":"Similarity ranking is not authority: the higher-scoring chunk is simply the closer match, not the more correct one. Either expose the disagreement with provenance so the user can judge, or resolve it by an explicit rule such as recency. Hiding the conflict presents a contested claim as settled.","tags":["conflicting-sources","precedence","citations","design"],"ref":"https://www.ibm.com/topics/retrieval-augmented-generation","domain":"capstone"},{"id":"PJ-017","type":"single","difficulty":"medium","stem":"A source document is revised. What must happen in the index for answers to stay correct?","choices":["Nothing; embeddings update automatically","Its old chunks must be removed or replaced and the new content re-embedded, otherwise both versions remain retrievable","Only the document loader needs re-running","The whole vector store must be recreated"],"answer":[1],"explanation":"A vector store holds whatever was written into it until something changes it. Without removing the superseded chunks, the old and new text both remain retrievable and can be cited against each other. Stable chunk ids make targeted replacement possible without rebuilding everything.","tags":["index-maintenance","freshness","deletion-propagation","maintenance"],"ref":"https://python.langchain.com/docs/concepts/vectorstores/","domain":"capstone"},{"id":"PJ-018","type":"single","difficulty":"hard","stem":"Your index is rebuilt nightly from scratch over a large corpus, and the job is becoming too slow. What is the better pattern?","choices":["Rebuild weekly instead","Track a content hash per chunk and update only what changed, adding, replacing or deleting incrementally","Reduce the chunk overlap","Use a smaller embedding model"],"answer":[1],"explanation":"Full rebuilds re-embed unchanged content every night, which is almost all of it. Hashing each chunk identifies exactly what moved so only those embeddings are recomputed. Rebuilding less often merely widens the staleness window, and shrinking the model trades quality for a problem that is structural.","tags":["index-maintenance","incremental-update","freshness","performance"],"ref":"https://python.langchain.com/docs/concepts/vectorstores/","domain":"capstone"},{"id":"FT-001","type":"single","difficulty":"easy","stem":"What does a Hugging Face pipeline give you?","choices":["A training loop for custom models","A high-level wrapper that bundles tokenizer, model and post-processing for a task so a few lines produce predictions","A dataset hosting service","A GPU scheduler"],"answer":[1],"explanation":"pipeline() hides the tokenise, forward-pass and decode steps behind a single callable for common tasks such as classification, generation and question answering. It is the fastest route to a working prediction and the wrong tool once you need control over any of those steps.","tags":["huggingface","pipeline","inference","abstraction"],"ref":"https://huggingface.co/docs/transformers/main_classes/pipelines","domain":"finetuning"},{"id":"FT-002","type":"single","difficulty":"medium","stem":"Why must AutoTokenizer be loaded from the same checkpoint as AutoModel?","choices":["To keep the download size small","Because the tokenizer's vocabulary and special tokens define the id space the model's embeddings were trained on; a mismatch produces ids that mean something different","Because the API requires identical strings","Because otherwise training cannot start"],"answer":[1],"explanation":"Token ids are meaningful only relative to the vocabulary that produced them. Pairing a model with another model's tokenizer silently feeds it the wrong embeddings — the code runs and the output is nonsense, which makes it a particularly costly mistake to debug.","tags":["autotokenizer","automodel","checkpoint-pairing","vocabulary"],"ref":"https://huggingface.co/docs/transformers/autoclass_tutorial","domain":"finetuning"},{"id":"FT-003","type":"single","difficulty":"medium","stem":"What is the difference between feature extraction and full fine-tuning when adapting a pretrained model?","choices":["Feature extraction freezes the pretrained weights and trains only a new head; full fine-tuning updates all weights","Feature extraction requires more data","Full fine-tuning cannot use a GPU","They produce identical results"],"answer":[0],"explanation":"Feature extraction treats the backbone as a fixed representation generator and learns only the task head, which is fast and resistant to overfitting on small data. Full fine-tuning lets the representation itself adapt, which is more powerful and needs more data and compute to avoid degrading what was pretrained.","tags":["feature-extraction","full-finetuning","freezing","transfer-learning"],"ref":"https://huggingface.co/docs/transformers/training","domain":"finetuning"},{"id":"FT-004","type":"single","difficulty":"medium","stem":"You have 800 labelled examples for a domain classification task. Which adaptation strategy is most appropriate?","choices":["Pretrain a new model from scratch","Fine-tune a pretrained encoder, or freeze it and train a classification head, given the small dataset","Train a bag-of-words model only","Use an untrained transformer"],"answer":[1],"explanation":"Eight hundred examples is far too few to learn language from scratch but ample to adapt a model that already has it. With data this limited, freezing the backbone or fine-tuning gently with a low learning rate guards against destroying pretrained knowledge.","tags":["transfer-learning","small-data","strategy","fine-tuning"],"ref":"https://huggingface.co/docs/transformers/training","domain":"finetuning"},{"id":"FT-005","type":"single","difficulty":"medium","stem":"What does the Hugging Face Trainer class handle for you?","choices":["Only the forward pass","The training loop: batching, optimiser and scheduler steps, gradient accumulation, evaluation, checkpointing and logging","Tokenisation only","Model architecture design"],"answer":[1],"explanation":"Trainer encapsulates the boilerplate around a training run, configured through TrainingArguments. It saves writing a loop by hand while still allowing customisation through callbacks and subclassing, which is the usual reason to reach past it.","tags":["trainer","training-loop","huggingface","trainingarguments"],"ref":"https://huggingface.co/docs/transformers/main_classes/trainer","domain":"finetuning"},{"id":"FT-006","type":"multi","difficulty":"medium","stem":"Which TWO TrainingArguments settings most directly address a GPU out-of-memory error during fine-tuning?","choices":["Reduce per_device_train_batch_size","Raise gradient_accumulation_steps to keep the effective batch size while holding fewer examples in memory at once","Increase num_train_epochs","Increase learning_rate"],"answer":[0,1],"explanation":"Memory scales with the batch actually resident on the device, so shrinking it is the direct fix; gradient accumulation then restores the effective batch size by summing gradients over several small steps before updating. Epoch count and learning rate affect how long and how aggressively you train, not peak memory.","tags":["out-of-memory","batch-size","gradient-accumulation","training-arguments"],"ref":"https://huggingface.co/docs/transformers/perf_train_gpu_one","domain":"finetuning"},{"id":"FT-007","type":"single","difficulty":"hard","stem":"After fine-tuning on a narrow domain, the model's general language ability noticeably degrades. What is this and how is it usually mitigated?","choices":["Overfitting to the validation set; use early stopping only","Catastrophic forgetting; mix general data back into the fine-tuning set and use a lower learning rate or fewer epochs","Data leakage; deduplicate the training set","Vanishing gradients; add residual connections"],"answer":[1],"explanation":"Training exclusively on a narrow distribution shifts the weights away from behaviours receiving no gradient signal. Replaying general instruction data keeps those capabilities reinforced, and a smaller learning rate limits how far the model can drift. Measuring general capability before and after is what makes the loss visible at all.","tags":["catastrophic-forgetting","replay-data","learning-rate","regression"],"ref":"https://www.ibm.com/topics/fine-tuning","domain":"finetuning"},{"id":"FT-008","type":"single","difficulty":"medium","stem":"What is the core idea of low-rank adaptation (LoRA)?","choices":["Quantising the base weights to four bits","Freezing the pretrained weights and learning a small pair of low-rank matrices whose product is added to selected weight matrices","Removing layers from the model","Training only the final layer"],"answer":[1],"explanation":"LoRA assumes the update needed for adaptation has low intrinsic rank, so it learns two thin matrices instead of a full-rank update. The base model stays frozen, the trainable parameter count drops by orders of magnitude, and the adapter can be swapped or merged. Four-bit quantisation of the base is QLoRA, a complementary idea.","tags":["lora","low-rank","peft","adapters"],"ref":"https://huggingface.co/docs/peft/conceptual_guides/lora","domain":"finetuning"},{"id":"FT-009","type":"multi","difficulty":"medium","stem":"Which TWO are genuine advantages of LoRA over full fine-tuning?","choices":["Far less memory is needed because optimiser state is kept only for the small adapter parameters","Many task-specific adapters can share one frozen base model at serving time","It always achieves higher accuracy than full fine-tuning","It removes the need for a validation set"],"answer":[0,1],"explanation":"Optimiser state dominates fine-tuning memory and scales with trainable parameters, so LoRA's reduction is large. Because the base is untouched, one loaded copy can serve many adapters. Accuracy is usually close to full fine-tuning but not reliably better, and evaluation discipline is unchanged.","tags":["lora","memory","multi-adapter","serving"],"ref":"https://huggingface.co/docs/peft/conceptual_guides/lora","domain":"finetuning"},{"id":"FT-010","type":"single","difficulty":"hard","stem":"What does the rank hyperparameter r control in LoRA, and what is the trade-off?","choices":["The number of layers adapted; higher r adapts more layers","The dimension of the low-rank update; higher r gives more adaptation capacity at the cost of more trainable parameters and a greater risk of overfitting small datasets","The learning rate schedule","The quantisation precision"],"answer":[1],"explanation":"r sets the inner dimension of the two learned matrices and so the expressiveness of the update. Small r is cheap and regularising but may underfit a substantial behavioural change; large r approaches full fine-tuning in both capacity and its failure modes. Which layers are adapted is a separate configuration choice.","tags":["lora-rank","hyperparameters","capacity","overfitting"],"ref":"https://huggingface.co/docs/peft/conceptual_guides/lora","domain":"finetuning"},{"id":"FT-011","type":"single","difficulty":"medium","stem":"When fine-tuning a classification model, why is the pretrained head usually replaced?","choices":["Because the pretrained head predicts the pretraining objective's output space, which does not match your label set","Because the head is always corrupted","Because heads cannot be saved to disk","To reduce the vocabulary"],"answer":[0],"explanation":"The pretrained output layer maps to whatever the pretraining task required — vocabulary logits for MLM, for instance — which has no relation to your classes. A fresh head with the right output dimension is initialised randomly and learned, while the body supplies the representation.","tags":["classification-head","output-space","transfer-learning"],"ref":"https://huggingface.co/docs/transformers/training","domain":"finetuning"},{"id":"FT-012","type":"single","difficulty":"medium","stem":"Why is a much smaller learning rate typically used when fine-tuning than when training from scratch?","choices":["Because fine-tuning datasets are always larger","Because the weights already encode useful structure, and large updates would destroy it before the task is learned","Because the optimiser is different","Because GPUs are slower during fine-tuning"],"answer":[1],"explanation":"Fine-tuning starts near a good solution, so the goal is a gentle adjustment rather than a search. Learning rates in the 1e-5 to 5e-5 range are typical for transformers; rates suited to random initialisation would wash out the pretrained representation in the first few steps.","tags":["learning-rate","fine-tuning","pretrained-weights"],"ref":"https://huggingface.co/docs/transformers/training","domain":"finetuning"},{"id":"FT-013","type":"single","difficulty":"hard","stem":"Fine-tuning loss falls steadily but validation loss rises after epoch two. What should you do?","choices":["Train for more epochs so validation loss recovers","Stop at the point of lowest validation loss — the divergence marks the onset of overfitting — and consider more data or stronger regularisation","Increase the learning rate","Remove the validation set"],"answer":[1],"explanation":"Diverging curves are the textbook overfitting signature: the model has begun memorising the training set. Early stopping at the validation minimum retains the best generalising checkpoint; more data or regularisation raises the point at which divergence occurs.","tags":["early-stopping","overfitting","validation-curve","diagnosis"],"ref":"https://www.ibm.com/topics/overfitting","domain":"finetuning"},{"id":"FT-014","type":"single","difficulty":"medium","stem":"What is the practical effect of calling model.eval() before inference in PyTorch?","choices":["It frees GPU memory","It switches layers whose behaviour differs between training and inference — dropout off, batch-norm using running statistics — into inference mode","It compiles the model","It disables gradient computation"],"answer":[1],"explanation":"eval() sets the module's training flag so dropout stops dropping and normalisation layers use accumulated statistics. Forgetting it makes inference non-deterministic and slightly wrong. Disabling gradients is a separate step, done with torch.no_grad().","tags":["pytorch","eval-mode","dropout","inference"],"ref":"https://pytorch.org/docs/stable/generated/torch.nn.Module.html","domain":"finetuning"},{"id":"FT-015","type":"single","difficulty":"medium","stem":"A fine-tuned model performs well offline but poorly on live traffic. Which explanation should be checked first?","choices":["The GPU driver version","Distribution shift: the fine-tuning set does not represent the inputs the model actually receives","The tokenizer is too fast","The model has too few parameters"],"answer":[1],"explanation":"A model learns the distribution it was shown. If the curated training and evaluation data differ from live inputs in phrasing, length, topic or noise, offline scores overstate real performance. The remedy is to build evaluation sets from production traffic, especially its failures.","tags":["distribution-shift","offline-online-gap","evaluation","diagnosis"],"ref":"https://www.ibm.com/topics/machine-learning","domain":"finetuning"},{"id":"FT-016","type":"single","difficulty":"hard","stem":"You want one base model to serve five customers, each needing slightly different behaviour. Which approach is most efficient?","choices":["Five separate fully fine-tuned model deployments","Train five LoRA adapters and serve them against a single loaded base model, selecting per request","Merge all five behaviours into one fine-tuned model","Prompt-engineer all five from the base with no tuning"],"answer":[1],"explanation":"Adapters are a tiny fraction of the parameters, so one resident base plus five small adapters avoids multiplying GPU cost fivefold. Merging the behaviours collapses the distinctions the tuning created. Prompting alone is worth trying first, but once tuning is warranted, multi-adapter serving is the efficient shape.","tags":["multi-adapter","lora","serving-efficiency","multi-tenancy"],"ref":"https://huggingface.co/docs/peft/conceptual_guides/lora","domain":"finetuning"},{"id":"FT-017","type":"single","difficulty":"medium","stem":"What does gradient accumulation actually do?","choices":["It increases the learning rate over time","It sums gradients over several small forward/backward passes before stepping the optimiser, giving the effect of a larger batch without its memory cost","It accumulates model checkpoints","It delays weight initialisation"],"answer":[1],"explanation":"Rather than updating after every mini-batch, gradients are summed across N of them and the optimiser steps once. The effective batch size is N times the per-device batch while peak memory stays at one mini-batch. The trade is more time per update.","tags":["gradient-accumulation","batch-size","memory","training-arguments"],"ref":"https://huggingface.co/docs/transformers/perf_train_gpu_one","domain":"finetuning"},{"id":"FT-018","type":"multi","difficulty":"hard","stem":"Beyond batch size, which TWO techniques reduce memory during fine-tuning?","choices":["Mixed-precision training, which stores activations and gradients in lower precision","Gradient checkpointing, which recomputes activations during the backward pass instead of storing them all","Increasing the number of epochs","Raising the learning rate"],"answer":[0,1],"explanation":"Mixed precision roughly halves the memory held by activations and gradients, and gradient checkpointing trades compute for memory by recomputing intermediate activations rather than keeping them. Epoch count and learning rate affect training duration and stability, not peak memory.","tags":["out-of-memory","memory","mixed-precision","gradient-checkpointing"],"ref":"https://huggingface.co/docs/transformers/perf_train_gpu_one","domain":"finetuning"},{"id":"FT-019","type":"single","difficulty":"hard","stem":"You fine-tune on 500 domain examples for ten epochs and the model now answers everything in that domain's style, even unrelated questions. What happened?","choices":["The learning rate was too low","Over-specialisation from many epochs on a narrow set: the model has drifted toward the fine-tuning distribution and lost general behaviour","The tokenizer changed","The dataset was too large"],"answer":[1],"explanation":"Ten passes over 500 examples is a great deal of gradient signal from one narrow distribution, and nothing reinforces the behaviours absent from it. Fewer epochs, a lower learning rate, adapter-based tuning or mixing in general data all limit the drift.","tags":["catastrophic-forgetting","over-specialisation","epochs","replay-data"],"ref":"https://www.ibm.com/topics/fine-tuning","domain":"finetuning"},{"id":"FT-020","type":"single","difficulty":"medium","stem":"Why does mixing general instruction data into a domain fine-tuning set help?","choices":["It increases the dataset size for its own sake","It keeps supplying gradient signal for the general behaviours, so they are reinforced rather than drifting away while the domain behaviour is learned","It speeds up convergence","It removes the need for a validation set"],"answer":[1],"explanation":"Capabilities that receive no gradient signal during fine-tuning are free to degrade as the weights move. Replaying general data keeps them anchored while the new behaviour is acquired. Size alone is not the mechanism — it is what the extra data represents.","tags":["replay-data","catastrophic-forgetting","fine-tuning","mixture"],"ref":"https://www.ibm.com/topics/fine-tuning","domain":"finetuning"},{"id":"FT-021","type":"single","difficulty":"medium","stem":"Training crashes with an out-of-memory error only on some batches, not all. What is the most likely cause?","choices":["The GPU is faulty","Sequences vary in length, so batches containing the longest examples need more memory than average ones","The learning rate spikes","The optimiser state grows during training"],"answer":[1],"explanation":"With variable-length text, memory scales with the longest sequence in e
