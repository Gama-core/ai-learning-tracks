<title>NCP-AAI Exam Console</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  /* Gama Core design tokens */
  --ground:#FFFFFF; --surface:#F4F6FA; --surface-2:#EAEDF4; --raise:#FFFFFF; --sunk:#E1E6F0;
  --ink:#12172B; --ink-2:#39415C; --muted:#565F78; --faint:#8890A6;
  --line:rgba(18,23,43,0.10); --line-2:rgba(18,23,43,0.20);
  --red:#C5184B; --red-dim:#EFB8C7; --red-wash:#FBEDF1;
  --accent:#1D98D6; --accent-soft:#E2F1FA;
  --pass:#12805C; --pass-bg:#E3F3ED;
  --warn:#B9740C; --warn-bg:#FBF0DF; --ochre:#B9740C;
  --fail:#C5184B; --fail-bg:#FBEDF1;
  --glow:rgba(29,152,214,0.10);
  --shadow:0 1px 2px rgba(18,23,43,.05), 0 10px 30px -18px rgba(18,23,43,.22);
  --display:"Space Grotesk","Helvetica Neue",Arial,sans-serif;
  --sans:"Inter","Helvetica Neue",Arial,sans-serif;
  --read:"Inter","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:3px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0D1120; --surface:#151B2E; --surface-2:#1D2440; --raise:#1D2440; --sunk:#0A0E1A;
    --ink:#E9EDF8; --ink-2:#C2C9DC; --muted:#A3ABC4; --faint:#6E7895;
    --line:rgba(233,237,248,0.10); --line-2:rgba(233,237,248,0.22);
    --red:#FF2E63; --red-dim:#7C3050; --red-wash:#2A1020;
    --accent:#4FB8F0; --accent-soft:#12283C;
    --pass:#3FBF8F; --pass-bg:#0E2A22;
    --warn:#E0A33C; --warn-bg:#2C2113; --ochre:#E0A33C;
    --fail:#FF2E63; --fail-bg:#2A1020;
    --glow:rgba(79,184,240,0.12);
    --shadow:0 1px 2px rgba(0,0,0,.45), 0 12px 32px -18px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --ground:#0D1120; --surface:#151B2E; --surface-2:#1D2440; --raise:#1D2440; --sunk:#0A0E1A;
  --ink:#E9EDF8; --ink-2:#C2C9DC; --muted:#A3ABC4; --faint:#6E7895;
  --line:rgba(233,237,248,0.10); --line-2:rgba(233,237,248,0.22);
  --red:#FF2E63; --red-dim:#7C3050; --red-wash:#2A1020;
  --accent:#4FB8F0; --accent-soft:#12283C;
  --pass:#3FBF8F; --pass-bg:#0E2A22;
  --warn:#E0A33C; --warn-bg:#2C2113; --ochre:#E0A33C;
  --fail:#FF2E63; --fail-bg:#2A1020;
  --glow:rgba(79,184,240,0.12);
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 12px 32px -18px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{margin:0; font-family:var(--display); font-weight:600; letter-spacing:-.015em; text-wrap:balance}
p{margin:0}
button{font:inherit; color:inherit; cursor:pointer; border:0; background:none}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:2px}
.mono{font-family:var(--mono); font-variant-numeric:tabular-nums}
.eyebrow{
  font-family:var(--mono); font-size:10.5px; font-weight:600; letter-spacing:.16em;
  text-transform:uppercase; color:var(--red);
}

/* ---------- shell ---------- */
.topbar{
  position:sticky; top:env(safe-area-inset-top, 0px); z-index:20;
  background:var(--ground);
  background:color-mix(in srgb, var(--ground) 88%, transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.topbar-in{
  max-width:1180px; margin:0 auto; padding:12px 20px;
  display:flex; align-items:center; gap:18px; flex-wrap:wrap;
}
.brand{
  display:flex; align-items:center; gap:11px; margin-right:auto; min-width:0;
  text-decoration:none; color:inherit;
}
.brand:hover .name b{color:var(--red)}
.brand svg{width:32px; height:32px; flex:0 0 32px; display:block}
.brand .name{display:flex; flex-direction:column; line-height:1.15; min-width:0}
.brand .name b{font-family:var(--display); font-size:15px; font-weight:600; letter-spacing:-.02em; transition:color .15s}
.brand .name span{
  font-family:var(--mono); font-size:9.5px; font-weight:500; letter-spacing:.15em;
  text-transform:uppercase; color:var(--muted); white-space:nowrap;
}
.code{
  font-family:var(--mono); font-size:10.5px; font-weight:600; color:var(--red);
  border:1px solid var(--red); padding:2px 7px; border-radius:2px; letter-spacing:.06em;
}
@media (max-width:560px){ .brand .name span{display:none} }
.tabs{display:flex; gap:2px; flex-wrap:wrap}
.tab{
  font-family:var(--mono); font-size:11px; font-weight:500; letter-spacing:.09em;
  text-transform:uppercase; padding:6px 11px; border-radius:var(--r); color:var(--muted);
  transition:color .15s, background .15s;
}
.tab:hover{color:var(--ink); background:var(--surface)}
.tab[aria-current="true"]{color:var(--ink); background:var(--surface); box-shadow:inset 0 0 0 1px var(--line-2)}

.wrap{max-width:1180px; margin:0 auto; padding:22px 20px 64px}
.cols{display:grid; grid-template-columns:302px minmax(0,1fr); gap:26px; align-items:start}
@media (max-width:900px){ .cols{grid-template-columns:1fr; gap:18px} }

.panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--r)}
.panel-hd{padding:13px 16px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px}
.panel-bd{padding:16px}

/* ---------- readiness rail ---------- */
.rail{position:sticky; top:calc(env(safe-area-inset-top, 0px) + 62px)}
@media (max-width:900px){ .rail{position:static} }

.gauge{padding:16px; border-bottom:1px solid var(--line)}
.gauge-val{display:flex; align-items:baseline; gap:8px; margin:6px 0 10px}
.gauge-val b{font-family:var(--mono); font-size:38px; font-weight:600; text-transform:uppercase; letter-spacing:-.03em; line-height:1}
.gauge-val span{font-family:var(--mono); font-size:11px; color:var(--muted)}
.meter{height:9px; background:var(--sunk); border-radius:1px; position:relative; overflow:hidden}
.meter i{display:block; height:100%; background:var(--accent)}
.meter::after{
  content:""; position:absolute; inset:0; pointer-events:none;
  background:repeating-linear-gradient(90deg, transparent 0 calc(10% - 1px), var(--surface) calc(10% - 1px) 10%);
}
.meter.pass i{background:var(--pass)} .meter.warn i{background:var(--warn)} .meter.fail i{background:var(--fail)}
.gauge-note{margin-top:8px; font-size:12px; color:var(--muted); line-height:1.4}

.doms{list-style:none; margin:0; padding:6px 0}
.dom{display:block; width:100%; text-align:left; padding:8px 16px; border-radius:0}
.dom:hover{background:var(--surface-2)}
.dom-top{display:flex; align-items:baseline; gap:8px}
.dom-wt{font-family:var(--mono); font-size:11px; font-weight:700; color:var(--accent); min-width:26px}
.dom-nm{font-family:var(--display); font-size:12.5px; font-weight:500; line-height:1.3; flex:1; letter-spacing:-.01em}
.dom-sc{font-family:var(--mono); font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums}
.dom .meter{height:5px; margin-top:5px; margin-left:34px}

/* ---------- home ---------- */
.hero{padding:26px 24px 24px; position:relative; overflow:hidden}
.hero::before{
  content:""; position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(60% 52% at 50% 0%, var(--glow), transparent 72%);
}
.hero > *{position:relative}
.hero h1{
  font-family:var(--display); font-weight:600;
  font-size:clamp(27px,3.6vw,40px); line-height:1.06; letter-spacing:-.015em; max-width:21ch;
}
.hero p{margin-top:14px; font-size:16px; line-height:1.6; color:var(--muted); max-width:62ch}
.facts{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(112px,1fr));
  border-top:1px solid var(--line);
}
.fact{padding:12px 16px; border-right:1px solid var(--line)}
.fact:last-child{border-right:0}
.fact b{display:block; font-family:var(--mono); font-size:19px; font-weight:600; margin-top:4px; letter-spacing:-.02em; color:var(--ink)}
.fact small{font-family:var(--mono); font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint)}

.modes{display:grid; grid-template-columns:repeat(auto-fit,minmax(224px,1fr)); gap:12px; margin-top:18px}
.mode{
  background:var(--raise); border:1px solid var(--line); border-radius:var(--r);
  padding:16px 17px; text-align:left; display:flex; flex-direction:column; gap:6px;
  transition:border-color .18s, transform .18s, box-shadow .18s;
}
.mode:hover{border-color:var(--line-2); transform:translateY(-1px); box-shadow:var(--shadow)}
.mode.primary{background:var(--red); color:#FFFFFF; border-color:var(--red)}
.mode.primary .mode-sub, .mode.primary .mode-meta{color:rgba(255,255,255,.82)}
.mode.primary:hover{box-shadow:0 10px 26px -12px var(--red)}
.mode-nm{font-family:var(--display); font-size:16px; font-weight:600; letter-spacing:-.015em}
.mode-sub{font-size:12.5px; color:var(--muted); line-height:1.4}
.mode-meta{font-family:var(--mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; opacity:.8}
.mode:disabled{opacity:.45; cursor:not-allowed; transform:none; border-color:var(--line)}

.history{margin-top:18px}
.htable{width:100%; border-collapse:collapse; font-family:var(--mono); font-size:12px}
.htable th{
  text-align:left; font-size:10px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--muted); font-weight:700; padding:0 10px 6px; border-bottom:1px solid var(--line);
}
.htable td{padding:7px 10px; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums}
.htable tr:last-child td{border-bottom:0}
.pill{
  font-family:var(--mono); font-size:10px; font-weight:700; letter-spacing:.08em;
  text-transform:uppercase; padding:2px 6px; border-radius:2px;
}
.pill.pass{background:var(--pass-bg); color:var(--pass)}
.pill.fail{background:var(--fail-bg); color:var(--fail)}

/* ---------- quiz ---------- */
.qhead{display:flex; align-items:center; gap:14px; flex-wrap:wrap}
.qhead .eyebrow{white-space:nowrap}
.clock{
  margin-left:auto; font-family:var(--mono); font-size:15px; font-weight:700;
  font-variant-numeric:tabular-nums; letter-spacing:.02em;
}
.clock.low{color:var(--fail)}
.qprog{height:2px; background:var(--sunk)}
.qprog i{display:block; height:100%; background:var(--accent); transition:width .25s}
.stem{font-family:var(--read); font-size:17.5px; line-height:1.52; margin:4px 0 4px; max-width:66ch}
.stem-multi{margin-top:10px; font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--ochre)}
.choices{display:flex; flex-direction:column; gap:8px; margin-top:16px}
.choice{
  display:flex; gap:12px; align-items:flex-start; text-align:left;
  padding:12px 14px; border:1px solid var(--line); border-radius:var(--r);
  background:var(--raise); transition:border-color .14s, background .14s;
}
.choice:hover:not(:disabled){border-color:var(--line-2); background:var(--surface-2)}
.choice-k{
  font-family:var(--mono); font-size:12px; font-weight:700; line-height:1.55;
  width:20px; height:20px; flex:0 0 20px; display:grid; place-items:center;
  border:1px solid var(--line-2); border-radius:2px; margin-top:1px; color:var(--muted);
}
.choice-t{font-family:var(--read); font-size:15.5px; line-height:1.45}
.choice[aria-pressed="true"]{border-color:var(--accent); background:var(--accent-soft)}
.choice[aria-pressed="true"] .choice-k{background:var(--accent); border-color:var(--accent); color:var(--surface)}
.choice.right{border-color:var(--pass); background:var(--pass-bg)}
.choice.right .choice-k{background:var(--pass); border-color:var(--pass); color:var(--surface)}
.choice.wrong{border-color:var(--fail); background:var(--fail-bg)}
.choice.wrong .choice-k{background:var(--fail); border-color:var(--fail); color:var(--surface)}
.choice:disabled{cursor:default}

.verdict{margin-top:18px; border-top:1px solid var(--line); padding-top:14px}
.verdict-hd{display:flex; align-items:center; gap:10px; font-weight:800; font-size:14px}
.verdict-hd.ok{color:var(--pass)} .verdict-hd.no{color:var(--fail)}
.expl{font-family:var(--read); font-size:15.5px; line-height:1.55; margin-top:9px; color:var(--ink-2); max-width:68ch}
.qmeta{margin-top:12px; display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.tagchip{font-family:var(--mono); font-size:10px; color:var(--muted); border:1px solid var(--line); padding:1px 5px; border-radius:2px}
.reflink{font-family:var(--mono); font-size:11px; color:var(--accent); text-decoration:none; border-bottom:1px solid var(--accent-soft)}
.reflink:hover{border-bottom-color:var(--accent)}

.qbar{display:flex; gap:8px; align-items:center; padding:13px 16px; border-top:1px solid var(--line); flex-wrap:wrap}
.btn{
  font-family:var(--sans); font-size:13px; font-weight:600; letter-spacing:0;
  text-transform:none; padding:9px 16px; border-radius:var(--r);
  border:1px solid var(--line-2); background:var(--raise); color:var(--ink);
  transition:all .18s ease;
}
.btn:hover:not(:disabled){border-color:var(--ink); background:var(--surface-2)}
.btn:disabled{opacity:.4; cursor:not-allowed}
.btn.go{background:var(--red); color:#FFFFFF; border-color:var(--red)}
.btn.go:hover:not(:disabled){background:var(--red); border-color:var(--red); box-shadow:0 8px 20px -10px var(--red)}
.btn.flag[aria-pressed="true"]{background:var(--warn-bg); border-color:var(--warn); color:var(--warn)}
.spacer{margin-left:auto}

/* navigator */
.navgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(31px,1fr)); gap:4px; padding:14px 16px}
.navcell{
  font-family:var(--mono); font-size:11px; font-weight:500; aspect-ratio:1;
  border:1px solid var(--line); border-radius:2px; background:var(--surface-2);
  display:grid; place-items:center; position:relative; color:var(--muted);
}
.navcell.done{background:var(--accent-soft); border-color:var(--accent); color:var(--ink)}
.navcell.flag::after{
  content:""; position:absolute; top:-1px; right:-1px; width:6px; height:6px;
  background:var(--warn); border-radius:0 2px 0 100%;
}
.navcell.here{outline:2px solid var(--ink); outline-offset:1px; color:var(--ink); font-weight:700}
.navkey{display:flex; gap:12px; flex-wrap:wrap; padding:0 16px 14px; font-family:var(--mono); font-size:10px; color:var(--muted)}
.navkey i{display:inline-block; width:9px; height:9px; border:1px solid var(--line); margin-right:4px; vertical-align:-1px}
.navkey i.d{background:var(--accent-soft); border-color:var(--accent)}
.navkey i.f{background:var(--warn)}

/* ---------- report ---------- */
.score{display:flex; align-items:flex-end; gap:20px; flex-wrap:wrap; padding:20px 22px}
.score-n{font-family:var(--mono); font-size:56px; font-weight:600; line-height:.9; letter-spacing:-.04em}
.score-side{display:flex; flex-direction:column; gap:3px; padding-bottom:4px}
.dtable{width:100%; border-collapse:collapse}
.dtable th{
  text-align:left; font-family:var(--mono); font-size:10px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--muted); font-weight:700;
  padding:0 12px 7px; border-bottom:1px solid var(--line);
}
.dtable td{padding:9px 12px; border-bottom:1px solid var(--line); vertical-align:middle}
.dtable tr:last-child td{border-bottom:0}
.dtable .nm{font-family:var(--display); font-size:13.5px; font-weight:500; letter-spacing:-.01em}
.dtable .num{font-family:var(--mono); font-size:12px; font-variant-numeric:tabular-nums; white-space:nowrap}
.dtable td.mt{width:38%; min-width:120px}
.missed{list-style:none; margin:0; padding:0; display:flex; flex-direction:column}
.missed li{border-bottom:1px solid var(--line)}
.missed li:last-child{border-bottom:0}
.missed button{display:flex; gap:12px; width:100%; text-align:left; padding:11px 16px; align-items:baseline}
.missed button:hover{background:var(--surface-2)}
.missed .id{font-family:var(--mono); font-size:11px; font-weight:700; color:var(--fail); flex:0 0 58px}
.missed .tx{font-family:var(--read); font-size:14px; line-height:1.4; color:var(--ink-2)}
.next{padding:4px 0}
.next-item{padding:12px 16px; border-bottom:1px solid var(--line)}
.next-item:last-child{border-bottom:0}
.next-hd{display:flex; align-items:baseline; gap:9px}
.next-hd b{font-size:13.5px; font-weight:700}
.next-hd .mono{font-size:11px; color:var(--muted)}
.next-sc{font-family:var(--read); font-size:13.5px; color:var(--ink-2); margin-top:4px; line-height:1.45}

/* ---------- cram ---------- */
.cram-dom{border-bottom:1px solid var(--line)}
.cram-dom:last-child{border-bottom:0}
.cram-hd{display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:13px 16px}
.cram-hd:hover{background:var(--surface-2)}
.cram-hd b{font-size:14px; font-weight:700; flex:1}
.cram-body{padding:0 16px 16px; display:flex; flex-direction:column; gap:18px}
.cram-q{border-left:2px solid var(--line); padding-left:14px}
.cram-q .id{font-family:var(--mono); font-size:10.5px; font-weight:700; color:var(--muted); letter-spacing:.06em}
.cram-q .qs{font-family:var(--read); font-size:15px; line-height:1.45; margin-top:4px}
.cram-q .ans{font-family:var(--read); font-size:14.5px; line-height:1.45; margin-top:8px; color:var(--pass); font-weight:600}
.cram-q .ex{font-family:var(--read); font-size:14px; line-height:1.5; margin-top:6px; color:var(--muted)}

/* concepts */
.cx{list-style:none; margin:0; padding:0}
.cx li{border-bottom:1px solid var(--line); padding:12px 16px}
.cx li:last-child{border-bottom:0}
.cx .hd{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
.cx .nm{font-family:var(--display); font-size:14px; font-weight:600; letter-spacing:-.01em}
.cx .sc{font-family:var(--mono); font-size:11px; font-variant-numeric:tabular-nums; color:var(--muted)}
.cx .sm{font-family:var(--read); font-size:13.5px; color:var(--ink-2); line-height:1.45; margin-top:4px; max-width:74ch}
.cx .acts{display:flex; gap:7px; margin-top:9px; flex-wrap:wrap}
.cx .meter{margin-top:8px; max-width:200px}
.btn.sm{font-size:10.5px; padding:5px 9px}
/* case scenario + flashcards */
.scenario{
  border-left:2px solid var(--accent); background:var(--accent-soft);
  padding:13px 16px; margin-bottom:16px; border-radius:0 var(--r) var(--r) 0;
}
.scenario .tag{
  font-family:var(--mono); font-size:9.5px; font-weight:600; letter-spacing:.14em;
  text-transform:uppercase; color:var(--accent); display:block; margin-bottom:6px;
}
.scenario p{font-family:var(--read); font-size:14.5px; line-height:1.5; color:var(--ink)}
.caselist{list-style:none; margin:0; padding:0}
.caselist li{border-bottom:1px solid var(--line)}
.caselist li:last-child{border-bottom:0}
.caselist button{display:block; width:100%; text-align:left; padding:13px 16px}
.caselist button:hover{background:var(--surface-2)}
.caselist .t{display:flex; align-items:baseline; gap:10px}
.caselist .t b{font-family:var(--display); font-size:14.5px; font-weight:600; letter-spacing:-.01em}
.caselist .sc{font-family:var(--read); font-size:13.5px; color:var(--muted); line-height:1.45; margin-top:4px; max-width:78ch}
.card{padding:30px 22px; text-align:center; min-height:190px; display:flex; flex-direction:column; justify-content:center; gap:14px}
.card .col{font-family:var(--mono); font-size:10px; letter-spacing:.11em; text-transform:uppercase; color:var(--muted)}
.card .pr{font-family:var(--display); font-weight:500; font-size:22px; line-height:1.3; max-width:44ch; margin:0 auto; text-wrap:balance; letter-spacing:-.01em}
.card .an{font-family:var(--read); font-size:17px; line-height:1.45; color:var(--pass); max-width:52ch; margin:0 auto; border-top:1px solid var(--line); padding-top:14px}
.due-pill{font-family:var(--mono); font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; padding:2px 6px; border-radius:2px; background:var(--accent-soft); color:var(--accent)}
/* cheat sheets */
.cheat-sec{scroll-margin-top:84px}
.cheat-hd{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap}
.cheat-hd h2{font-family:var(--display); font-weight:600; font-size:20px; letter-spacing:-.02em}

<script>
/* eslint-disable */
const DATA = /*__DATA__*/;

const PASS = 0.75;

/* Other people's practice exams. Linked, never copied — every question in this
   simulator is original. Sites advertising "actual exam questions" are excluded
   on purpose; see the note rendered above the list. */
const ELSEWHERE = [
  { name: "CertificationPractice", url: "https://certificationpractice.com/practice-exams/nvidia-certified-professional-agentic-ai",
    tag: "free", sub: "Six practice exams, around 420 questions. The most substantial free set found." },
  { name: "Preporato", url: "https://preporato.com/free/agentic-ai-professional/questions",
    tag: "free tier", sub: "29 questions with explanations, no signup; the full set is paid." },
  { name: "OpenExamPrep", url: "https://open-exam-prep.com/practice/ncp-aai",
    tag: "free", sub: "Covers ReAct, multi-agent, NIM, NeMo Retriever, Guardrails, evals and observability." },
  { name: "ExamHeist", url: "https://www.examheist.com/practice/nvidia/ncp-aai/",
    tag: "free", sub: "182 questions with written explanations." },
];
const KEYS = ["A","B","C","D"];
const LS = "ncp-aai-progress-v1";

const DOM_BY_ID = Object.fromEntries(DATA.domains.map(d => [d.id, d]));
const Q_BY_ID = Object.fromEntries(DATA.questions.map(q => [q.id, q]));
const MIN_ATTEMPTS = 4;   // Below this, a concept's accuracy is noise.
const TAG_TO_CONCEPTS = {};
for (const c of (DATA.concepts || [])) {
  for (const t of c.tags) (TAG_TO_CONCEPTS[t] = TAG_TO_CONCEPTS[t] || []).push(c.id);
}
const CONCEPT_BY_ID = Object.fromEntries((DATA.concepts || []).map(c => [c.id, c]));
const conceptsOf = (q) => [...new Set(q.tags.flatMap(t => TAG_TO_CONCEPTS[t] || []))];

function conceptStats() {
  const out = {};
  for (const c of (DATA.concepts || [])) out[c.id] = { bank: 0, attempts: 0, correct: 0 };
  for (const q of DATA.questions) {
    const rec = progress.q[q.id];
    for (const cid of conceptsOf(q)) {
      const st = out[cid];
      st.bank += 1;
      if (rec?.seen) { st.attempts += rec.seen; st.correct += rec.correct; }
    }
  }
  for (const st of Object.values(out)) st.acc = st.attempts ? st.correct / st.attempts : null;
  return out;
}

/* Rank weak concepts by what they cost on the exam: gap x domain weight. */
function weakConcepts(limit = 6) {
  const st = conceptStats();
  const w = Object.fromEntries(DATA.domains.map(d => [d.id, d.weight]));
  return (DATA.concepts || [])
    .filter(c => st[c.id].attempts >= MIN_ATTEMPTS && st[c.id].acc < PASS)
    .map(c => ({ c, st: st[c.id], impact: (1 - st[c.id].acc) * (w[c.domain] || 5) }))
    .sort((a, b) => b.impact - a.impact)
    .slice(0, limit);
}

const WEIGHT_TOTAL = DATA.domains.reduce((s, d) => s + d.weight, 0);

/* ---------------------------------------------------------------- storage */

let progress = { v: 1, updatedAt: null, q: {}, exams: [] };
let remote = null;          // db document reference, when available
let syncLabel = "this device";
let saveTimer = null;

function readLocal() {
  try {
    const raw = localStorage.getItem(LS);
    if (raw) return JSON.parse(raw);
  } catch (e) { /* private window or blocked storage */ }
  return null;
}

function writeLocal() {
  try { localStorage.setItem(LS, JSON.stringify(progress)); } catch (e) {}
}

function save() {
  progress.updatedAt = new Date().toISOString();
  writeLocal();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    if (remote) remote.set(JSON.parse(JSON.stringify(progress))).catch(() => {});
  }, 1200);
}

const MAX_INTERVAL = 21;
const today = () => new Date().toISOString().slice(0, 10);
const addDays = (n) => new Date(Date.now() + n * 86400000).toISOString().slice(0, 10);

/* SM-2, adapted: binary grade, capped interval, shorter second step. */
function schedule(rec, correct) {
  const grade = correct ? 5 : 2;
  let ease = rec.ease ?? 2.5;
  ease += 0.1 - (5 - grade) * (0.08 + (5 - grade) * 0.02);
  rec.ease = Math.round(Math.max(1.3, Math.min(2.8, ease)) * 1000) / 1000;
  if (!correct) {
    rec.reps = 0;
    rec.interval = 0;
  } else {
    rec.reps = (rec.reps ?? 0) + 1;
    rec.interval = rec.reps === 1 ? 1
      : rec.reps === 2 ? 3
      : Math.min(MAX_INTERVAL, Math.max(1, Math.round((rec.interval ?? 1) * rec.ease)));
  }
  rec.due = addDays(rec.interval);
}

/* Give pre-scheduling records a due date so older progress still counts. */
function migrate() {
  for (const rec of Object.values(progress.q)) {
    if (rec.due) continue;
    rec.ease = rec.ease ?? 2.5;
    rec.reps = rec.reps ?? (rec.streak ?? 0);
    rec.interval = (rec.seen > rec.correct && (rec.streak ?? 0) < 2) ? 0 : 2;
    rec.due = addDays(rec.interval);
  }
}

function duePool() {
  const t = today();
  return DATA.questions
    .filter(q => { const r = progress.q[q.id]; return r && (r.due ?? "9999") <= t; })
    .sort((a, b) => (progress.q[a.id].due || "").localeCompare(progress.q[b.id].due || ""));
}

function dueCounts() {
  const t = today(), wk = addDays(7);
  let due = 0, week = 0, fresh = 0;
  for (const q of DATA.questions) {
    const r = progress.q[q.id];
    if (!r || !r.seen) fresh++;
    else if ((r.due ?? "9999") <= t) due++;
    else if ((r.due ?? "9999") <= wk) week++;
  }
  const cards = DATA.cards.filter(c => (progress.q[c.id]?.due ?? "0") <= t).length;
  return { due, week, fresh, cards };
}

function mergeRecord(qid, correct) {
  const r = progress.q[qid] || { seen: 0, correct: 0, streak: 0 };
  r.seen += 1;
  if (correct) { r.correct += 1; r.streak = (r.streak || 0) + 1; } else { r.streak = 0; }
  r.last = new Date().toISOString();
  schedule(r, correct);
  progress.q[qid] = r;
}

async function connect() {
  let db = null, user = null;
  try { db = await window.claude?.use?.("db"); } catch (e) {}
  try { user = await window.claude?.use?.("user"); } catch (e) {}
  if (!db || !user) return;
  let uid = null;
  try { uid = await user.id(); } catch (e) {}
  if (!uid) return;
  let ref;
  try { ref = db.doc("data/users/" + uid + "/progress"); } catch (e) { return; }
  try {
    const snap = await ref.get();
    const far = snap.exists ? snap.data() : null;
    const mine = progress.updatedAt ? Date.parse(progress.updatedAt) : 0;
    const theirs = far && far.updatedAt ? Date.parse(far.updatedAt) : 0;
    if (far && theirs >= mine) {
      progress = { v: 1, updatedAt: far.updatedAt || null, q: far.q || {}, exams: far.exams || [] };
      migrate();
      writeLocal();
    } else if (progress.updatedAt) {
      await ref.set(JSON.parse(JSON.stringify(progress)));
    }
    remote = ref;
    syncLabel = "synced to your account";
    render();
  } catch (e) { /* read-only viewer, or store unavailable: stay local */ }
}

/* ------------------------------------------------------------------ stats */

function domainStats() {
  const out = {};
  for (const d of DATA.domains) out[d.id] = { bank: 0, seen: 0, attempts: 0, correct: 0 };
  for (const q of DATA.questions) {
    const s = out[q.domain];
    s.bank += 1;
    const r = progress.q[q.id];
    if (r && r.seen) { s.seen += 1; s.attempts += r.seen; s.correct += r.correct; }
  }
  for (const id in out) {
    const s = out[id];
    s.acc = s.attempts ? s.correct / s.attempts : null;
  }
  return out;
}

function readiness(stats) {
  let num = 0, den = 0;
  for (const d of DATA.domains) {
    const s = stats[d.id];
    if (s.acc !== null) { num += s.acc * d.weight; den += d.weight; }
  }
  return { value: den ? num / den : null, coverage: den / WEIGHT_TOTAL };
}

function drillPool() {
  return DATA.questions.filter(q => {
    const r = progress.q[q.id];
    return r && r.seen > r.correct && (r.streak || 0) < 2;
  });
}

function band(frac) { return frac >= PASS ? "pass" : frac >= 0.6 ? "warn" : "fail"; }

/* --------------------------------------------------------------- sampling */

function shuffled(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/** Apportion n questions across domains by blueprint weight (largest remainder). */
function weightedSample(n) {
  const pool = {};
  for (const q of DATA.questions) (pool[q.domain] = pool[q.domain] || []).push(q);
  const exact = {}, counts = {};
  for (const d of DATA.domains) {
    if (!pool[d.id]) continue;
    exact[d.id] = n * d.weight / WEIGHT_TOTAL;
    counts[d.id] = Math.floor(exact[d.id]);
  }
  let short = n - Object.values(counts).reduce((a, b) => a + b, 0);
  const byFrac = Object.keys(exact).sort((a, b) => (exact[b] % 1) - (exact[a] % 1));
  for (const id of byFrac) { if (short <= 0) break; counts[id]++; short--; }

  const picked = [];
  for (const id in counts) {
    // Prefer unseen questions, then ones previously missed.
    const ranked = shuffled(pool[id]).sort((a, b) => score(a) - score(b));
    picked.push(...ranked.slice(0, Math.min(counts[id], ranked.length)));
  }
  const chosen = new Set(picked.map(q => q.id));
  if (picked.length < n) {
    for (const q of shuffled(DATA.questions)) {
      if (picked.length >= n) break;
      if (!chosen.has(q.id)) { picked.push(q); chosen.add(q.id); }
    }
  }
  return shuffled(picked).slice(0, n);

  function score(q) {
    const r = progress.q[q.id];
    if (!r) return -100;
    return r.seen - (r.seen - r.correct) * 2;
  }
}

/** Permute a question's choices so answer position is never memorized. */
function present(q) {
  const order = shuffled(q.choices.map((_, i) => i));
  return {
    ref: q,
    stem: q.stem,
    type: q.type,
    choices: order.map(i => q.choices[i]),
    answer: q.answer.map(a => order.indexOf(a)).sort((x, y) => x - y),
  };
}

/* ------------------------------------------------------------------ views */

let view = "home";
let S = null;   // active session

function startSession(kind) {
  let items, timed = false, feedback = true, title = "Practice";
  if (kind.mode === "exam") {
    const n = Math.min(kind.count || 65, DATA.questions.length);
    items = weightedSample(n);
    timed = true; feedback = false; title = "Mock exam";
  } else if (kind.mode === "domain") {
    items = shuffled(DATA.questions.filter(q => q.domain === kind.domain));
    title = DOM_BY_ID[kind.domain].name;
  } else if (kind.mode === "review") {
    const w = {}; DATA.domains.forEach(d => w[d.id] = d.weight);
    items = duePool().sort((a, b) => {
      const da = (progress.q[a.id].due || ""), db = (progress.q[b.id].due || "");
      return da === db ? (w[b.domain] - w[a.domain]) : da.localeCompare(db);
    });
    title = "Review";
  } else if (kind.mode === "concept") {
    items = shuffled(DATA.questions.filter(q => conceptsOf(q).includes(kind.conceptId)));
    title = "Concept — " + CONCEPT_BY_ID[kind.conceptId].name;
  } else if (kind.mode === "case") {
    const c = DATA.cases.find(x => x.id === kind.caseId);
    items = c.questions.map(id => Q_BY_ID[id]).filter(Boolean);
    title = c.title;
  } else if (kind.mode === "drill") {
    const w = {}; DATA.domains.forEach(d => w[d.id] = d.weight);
    items = drillPool().sort((a, b) => {
      const dw = w[b.domain] - w[a.domain];
      if (dw) return dw;
      const ra = progress.q[a.id], rb = progress.q[b.id];
      return (rb.seen - rb.correct) - (ra.seen - ra.correct);
    });
    title = "Drill";
  } else {
    items = weightedSample(Math.min(15, DATA.questions.length));
  }
  if (!items.length) return;
  S = {
    kind: kind.mode, title, timed, feedback,
    items: items.map(present),
    picks: items.map(() => null),
    flags: new Set(),
    revealed: new Set(),
    i: 0,
    started: Date.now(),
    deadline: timed ? Date.now() + DATA.exam.duration_minutes * 60000 : null,
    report: null,
  };
  view = "quiz";
  render();
  if (timed) tick();
}

let ticker = null;
function tick() {
  clearInterval(ticker);
  ticker = setInterval(() => {
    if (!S || !S.deadline || view !== "quiz") { clearInterval(ticker); return; }
    const left = S.deadline - Date.now();
    const el = document.getElementById("clock");
    if (el) {
      el.textContent = fmtClock(Math.max(0, left));
      el.classList.toggle("low", left < 300000);
    }
    if (left <= 0) { clearInterval(ticker); finish(true); }
  }, 1000);
}

function fmtClock(ms) {
  const t = Math.round(ms / 1000);
  return String(Math.floor(t / 60)).padStart(2, "0") + ":" + String(t % 60).padStart(2, "0");
}

function choose(ci) {
  const it = S.items[S.i];
  if (S.revealed.has(S.i)) return;
  const want = it.answer.length;
  let cur = S.picks[S.i] ? S.picks[S.i].slice() : [];
  if (want === 1) {
    cur = [ci];
  } else if (cur.includes(ci)) {
    cur = cur.filter(x => x !== ci);
  } else {
    cur.push(ci);
    if (cur.length > want) cur.shift();
  }
  S.picks[S.i] = cur.sort((a, b) => a - b);
  if (S.feedback && cur.length === want) reveal();
  else render();
}

function reveal() {
  const it = S.items[S.i];
  const picks = S.picks[S.i] || [];
  S.revealed.add(S.i);
  mergeRecord(it.ref.id, same(picks, it.answer));
  save();
  render();
}

function same(a, b) { return a.length === b.length && a.every((x, i) => x === b[i]); }

function go(delta) {
  const next = S.i + delta;
  if (next < 0 || next >= S.items.length) return;
  S.i = next;
  render();
  window.scrollTo({ top: 0, behavior: "instant" });
}

function finish(expired) {
  clearInterval(ticker);
  if (S.report) { view = "report"; render(); window.scrollTo({ top: 0, behavior: "instant" }); return; }
  const rows = [];
  S.items.forEach((it, idx) => {
    const picks = S.picks[idx];
    if (!S.feedback && picks) mergeRecord(it.ref.id, same(picks, it.answer));
    rows.push({ it, picks: picks || [], ok: picks ? same(picks, it.answer) : false, answered: !!picks });
  });
  const answered = rows.filter(r => r.answered).length;
  const got = rows.filter(r => r.ok).length;
  const frac = rows.length ? got / rows.length : 0;
  if (S.kind === "exam") {
    progress.exams.unshift({
      at: new Date().toISOString(), score: +frac.toFixed(4),
      n: rows.length, answered, seconds: Math.round((Date.now() - S.started) / 1000),
    });
    progress.exams = progress.exams.slice(0, 40);
  }
  save();
  S.report = { rows, got, frac, answered, expired: !!expired, seconds: Math.round((Date.now() - S.started) / 1000) };
  view = "report";
  render();
  window.scrollTo({ top: 0, behavior: "instant" });
}

function meter(frac, cls) {
  const pct = frac === null ? 0 : Math.round(frac * 100);
  return `<div class="meter ${cls || (frac === null ? "" : band(frac))}"><i style="width:${pct}%"></i></div>`;
}

  const rec = progress.q[card.id] || { seen: 0, correct: 0, streak: 0 };
  rec.seen += 1;
  if (ok) { rec.correct += 1; rec.streak = (rec.streak || 0) + 1; FC.right += 1; }
  else { rec.streak = 0; }
  rec.last = new Date().toISOString();
  schedule(rec, ok);
  progress.q[card.id] = rec;
  save();
  FC.i += 1; FC.shown = false;
  render();
}

function cardsHTML() {
  if (FC.i >= FC.pool.length) {
    return `<div class="panel">
      <div class="panel-hd"><span class="eyebrow">Flashcards · done</span></div>
      <div class="score">
        <div class="score-n" style="color:var(--${FC.right / FC.pool.length >= PASS ? "pass" : "warn"})">${FC.right}<span style="font-size:.45em">/${FC.pool.length}</span></div>
        <div class="score-side">
          <span class="eyebrow">recalled</span>
          <span class="mono" style="font-size:12px;color:var(--muted)">Missed cards return tomorrow. Recalled ones move out 1, 3, then 8+ days.</span>
        </div>
      </div>
      <div class="qbar">
        <button class="btn" data-cards="1">Another set</button>
        <span class="spacer"></span>
        <button class="btn go" data-tab="home">Back to console</button>
      </div>
    </div>`;
  }
  const c = FC.pool[FC.i];
  return `<div class="panel">
    <div class="panel-hd qhead">
      <span class="eyebrow">Flashcards</span>
      <span class="mono" style="font-size:12px">${FC.i + 1}<span style="color:var(--muted)">/${FC.pool.length}</span></span>
      <span class="mono" style="font-size:11px;color:var(--muted)">${esc(c.deckName)}</span>
    </div>
    <div class="qprog"><i style="width:${(FC.i + 1) / FC.pool.length * 100}%"></i></div>
    <div class="card">
      <span class="col">${esc(c.column)}</span>
      <p class="pr">${esc(c.prompt)}</p>
      ${FC.shown ? `<p class="an">${esc(c.answer)}</p>` : ""}
    </div>
    <div class="qbar">
      ${FC.shown
        ? `<button class="btn" data-grade="0">Missed it</button>
           <span class="spacer"></span>
           <button class="btn go" data-grade="1">Got it</button>`
        : `<button class="btn go" data-reveal-card="1" style="margin:0 auto">Reveal</button>`}
    </div>
  </div>
  <div class="foot" style="margin-top:14px">Space or Enter to reveal · Y / N to grade</div>`;
}

function cheatHTML() {
  return `<div class="panel">
    <div class="panel-hd"><span class="eyebrow">Cheat sheets</span>
      <span class="mono" style="font-size:11px;color:var(--muted)">condensed reference, not questions</span>
      <button class="btn printbtn" data-print="1">Print</button></div>
    <div class="panel-bd" style="padding-top:14px">
      ${DATA.cheats.sections.map(sec => `<section class="cheat-sec" id="cs-${esc(sec.id)}">

function cramHTML() {
  return `<div class="panel">
    <div class="panel-hd"><span class="eyebrow">Cram sheet</span>
      <span class="mono" style="margin-left:auto;font-size:11px;color:var(--muted)">${DATA.questions.length} items · answer and reasoning, no quiz</span></div>
    ${DATA.domains.map(d => {
      const qs = DATA.questions.filter(q => q.domain === d.id);
      const open = cramOpen.has(d.id);
      return `<div class="cram-dom">
        <button class="cram-hd" data-cram="${d.id}" aria-expanded="${open}">
          <span class="mono" style="font-size:11px;font-weight:700;color:var(--accent);min-width:28px">${d.weight}%</span>
          <b>${esc(d.name)}</b>
          <span class="mono" style="font-size:11px;color:var(--muted)">${qs.length} · ${open ? "hide" : "show"}</span>

const cramOpen = new Set();

function renderFoot() {
  document.getElementById("foot").innerHTML =
    `${esc(DATA.exam.name)} · ${esc(DATA.exam.delivery)}<br>
     Topic weights are NVIDIA's published figures, which sum to ${WEIGHT_TOTAL}%; sets are apportioned on the normalized shares.
     Target of ${PASS * 100}% is this tool's own margin — NVIDIA does not publish a cut score.<br>
     Progress saved ${esc(syncLabel)} · <a href="${esc(DATA.exam.source)}" target="_blank" rel="noopener">official exam page ↗</a>`;

/* ------------------------------------------------------------------- input */

function bind() {
  document.querySelectorAll("[data-tab]").forEach(el => el.onclick = () => {
    view = el.dataset.tab; render();
    window.scrollTo({ top: 0, behavior: "instant" });
  });
  document.querySelectorAll("[data-start]").forEach(el => el.onclick = () => startSession({ mode: el.dataset.start }));
  document.querySelectorAll("[data-domain]").forEach(el => el.onclick = () => startSession({ mode: "domain", domain: el.dataset.domain }));
  document.querySelectorAll("[data-choose]").forEach(el => el.onclick = () => choose(+el.dataset.choose));
  document.querySelectorAll("[data-nav]").forEach(el => el.onclick = () => go(+el.dataset.nav));
  document.querySelectorAll("[data-jump]").forEach(el => el.onclick = () => { S.i = +el.dataset.jump; render(); });
  document.querySelectorAll("[data-reveal]").forEach(el => el.onclick = reveal);
  document.querySelectorAll("[data-print]").forEach(el => el.onclick = () => window.print());
  document.querySelectorAll("[data-case]").forEach(el => el.onclick = () =>
    startSession({ mode: "case", caseId: el.dataset.case }));
  document.querySelectorAll("[data-cards]").forEach(el => el.onclick = () => startCards(null));
  document.querySelectorAll("[data-concept]").forEach(el => el.onclick = () =>
    startSession({ mode: "concept", conceptId: el.dataset.concept }));
  document.querySelectorAll("[data-cheatjump]").forEach(el => el.onclick = () => {
    view = "cheat"; render();
    document.getElementById("cs-" + el.dataset.cheatjump)?.scrollIntoView({ behavior: "smooth" });
  });
  document.querySelectorAll("[data-deck]").forEach(el => el.onclick = (ev) => {
    ev.preventDefault(); startCards(el.dataset.deck);
  });
  document.querySelectorAll("[data-reveal-card]").forEach(el => el.onclick = () => {
    FC.shown = true; render();
  });
  document.querySelectorAll("[data-grade]").forEach(el => el.onclick = () =>
    gradeCard(el.dataset.grade === "1"));
  document.querySelectorAll("[data-back-report]").forEach(el => el.onclick = () => {
    view = "report"; render(); window.scrollTo({ top: 0, behavior: "instant" });
  });
  document.querySelectorAll("[data-finish]").forEach(el => el.onclick = () => {
    const blank = S.picks.filter(p => !p).length;
    if (S.kind === "exam" && blank && !confirm(`${blank} question${blank > 1 ? "s" : ""} still blank. Submit anyway?`)) return;
    finish(false);
  });
  document.querySelectorAll("[data-flag]").forEach(el => el.onclick = () => {
    S.flags.has(S.i) ? S.flags.delete(S.i) : S.flags.add(S.i);
    render();
  });
  document.querySelectorAll("[data-cram]").forEach(el => el.onclick = () => {
    const id = el.dataset.cram;
    cramOpen.has(id) ? cramOpen.delete(id) : cramOpen.add(id);
    render();
  });
  document.querySelectorAll("[data-review]").forEach(el => el.onclick = () => {
    S.feedback = true;
    S.items.forEach((_, i) => S.revealed.add(i));
    S.i = +el.dataset.review;
    view = "quiz"; render();
    window.scrollTo({ top: 0, behavior: "instant" });
  });
}

document.addEventListener("keydown", ev => {
  if (view === "cards" && FC && !ev.metaKey && !ev.ctrlKey && !ev.altKey) {
    if (FC.i >= FC.pool.length) return;
    const k = ev.key.toUpperCase();
    if (!FC.shown && (ev.key === " " || ev.key === "Enter")) {
      ev.preventDefault(); FC.shown = true; render();
    } else if (FC.shown && (k === "Y" || ev.key === "Enter")) {
      ev.preventDefault(); gradeCard(true);
    } else if (FC.shown && k === "N") {
      ev.preventDefault(); gradeCard(false);
    }
    return;
  }
  if (view !== "quiz" || !S || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  const k = ev.key.toUpperCase();
  if (KEYS.includes(k)) { ev.preventDefault(); choose(KEYS.indexOf(k)); }
  else if (ev.key === "ArrowRight") { ev.preventDefault(); go(1); }
  else if (ev.key === "ArrowLeft") { ev.preventDefault(); go(-1); }
  else if (k === "F") { ev.preventDefault(); S.flags.has(S.i) ? S.flags.delete(S.i) : S.flags.add(S.i); render(); }
  else if (ev.key === "Enter") {
    ev.preventDefault();
    if (S.feedback && !S.revealed.has(S.i) && (S.picks[S.i] || []).length) reveal();
    else if (S.i < S.items.length - 1) go(1);
    else if (!S.report) finish(false);
    else { view = "report"; render(); }
  }
});

/* -------------------------------------------------------------------- boot */

const loaded = readLocal();
if (loaded && loaded.q) progress = { v: 1, updatedAt: loaded.updatedAt || null, q: loaded.q || {}, exams: loaded.exams || [] };
migrate();
render();
connect();
</script>
